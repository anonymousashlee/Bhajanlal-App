services:
  api:
    build: .
    image: bhajanlal-api:local
    container_name: bhajanlal-api
    ports:
      - "8790:8790"
    environment:            # overrides baked into the image, kept explicit here
      BHAJANLAL_BACKEND_HOST: 0.0.0.0
      BHAJANLAL_BACKEND_PORT: "8790"
      BHAJANLAL_ALLOW_LOCALHOST: "true"
    volumes:                # persist agent sandbox state outside the container
      - ./data:/app/data
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8790/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
