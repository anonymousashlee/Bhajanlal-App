<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vice City - Top Down</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0d0221; font-family: 'Courier New', monospace; overflow: hidden; }
  #wrap { position: relative; width: 100vw; height: 100vh; }
  #game { display: block; width: 100%; height: 100%; } /* scope to game canvas only */
  #hud {
    position: absolute; top: 12px; left: 12px; color: #ff2d95;
    text-shadow: 0 0 8px #ff2d95; font-size: 14px; pointer-events: none;
    line-height: 1.6;
  }
  #money { color: #2dff8f; text-shadow: 0 0 8px #2dff8f; font-size: 22px; font-weight: bold; }
  #mission {
    position: absolute; top: 12px; right: 12px; color: #ffe23d;
    text-shadow: 0 0 8px #ffe23d; font-size: 14px; text-align: right;
    pointer-events: none; max-width: 340px;
  }
  #speed {
    position: absolute; bottom: 14px; right: 16px; color: #4dd8ff;
    text-shadow: 0 0 8px #4dd8ff; font-size: 16px; pointer-events: none;
  }
  #minimap {
    position: absolute; bottom: 14px; left: 14px; width: 160px; height: 160px;
    border: 2px solid #ff2d95;
    box-shadow: 0 0 12px #ff2d95; background: rgba(13,2,33,.7);
  }
  #help {
    position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
    color: #9aa0c0; font-size: 12px; pointer-events: none; text-align: center;
  }
  #overlay {
    position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: center; flex-direction: column; background: rgba(13,2,33,.85);
    color: #fff; text-align: center; cursor: pointer; z-index: 10;
  }
  #overlay h1 { color: #ff2d95; font-size: 54px; text-shadow: 0 0 18px #ff2d95; letter-spacing: 6px; }
  #overlay h1 span { color: #2dff8f; text-shadow: 0 0 18px #2dff8f; }
  #overlay p { color: #9aa0c0; margin-top: 14px; line-height: 1.8; }
  #overlay .go { color: #ffe23d; margin-top: 26px; font-size: 20px; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .3; } }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div id="hud">
    <div id="money">$0</div>
    <div id="stars">&#9733; &#9734; &#9734; &#9734; &#9734;</div>
    <div id="hp">HP 100</div>
  </div>
  <div id="mission"></div>
  <div id="speed">0 km/h</div>
  <canvas id="minimap" width="160" height="160"></canvas>
  <div id="help">WASD / Arrows drive &nbsp;|&nbsp; SPACE handbrake &nbsp;|&nbsp; E enter/exit car &nbsp;|&nbsp; SHIFT boost</div>
  <div id="overlay">
    <h1>VICE <span>CITY</span></h1>
    <p>Top-down open world. Steal cars, run missions, dodge the cops.<br>
       WASD to drive &middot; E to enter/exit vehicles &middot; Collect the yellow markers.</p>
    <div class="go">CLICK TO START</div>
  </div>
</div>
<script>
"use strict";
// ===== Setup =====
const cv = document.getElementById('game');
const cx = cv.getContext('2d');
const mm = document.getElementById('minimap');
const mx = mm.getContext('2d');
let W = 0, H = 0;
function resize() { W = cv.width = innerWidth; H = cv.height = innerHeight; }
addEventListener('resize', resize); resize();

// ===== World: city grid of blocks =====
const TILE = 160, ROAD = 56;
const COLS = 14, ROWS = 14;
const WORLD = COLS * TILE;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const angDiff = (a, b) => { let d = (b - a) % (Math.PI * 2); if (d > Math.PI) d -= Math.PI * 2; if (d < -Math.PI) d += Math.PI * 2; return d; };

// Buildings inside each block
const BUILDINGS = [];
const PARKING = [];
for (let gy = 0; gy < ROWS; gy++) for (let gx = 0; gx < COLS; gx++) {
  const bx = gx * TILE + ROAD / 2, by = gy * TILE + ROAD / 2;
  const inner = TILE - ROAD;
  if ((gx + gy) % 5 === 0) { PARKING.push({ x: bx, y: by, w: inner, h: inner }); continue; } // park lot
  const n = 1 + ((Math.random() * 3) | 0);
  for (let i = 0; i < n; i++) {
    const w = rand(38, inner - 20), h = rand(38, inner - 20);
    BUILDINGS.push({
      x: bx + rand(6, inner - w - 6), y: by + rand(6, inner - h - 6), w, h,
      c: pick(['#2b1a4d', '#3a2260', '#241442', '#452a72', '#1d1038']),
      roof: pick(['#5b3aa0', '#7a4fd0', '#40256e'])
    });
  }
}
// Road centerlines (for AI + spawn)
const hRoads = [], vRoads = [];
for (let i = 0; i <= COLS; i++) {
  hRoads.push(i * TILE - ROAD / 2 + ROAD / 2); // horizontal center y
  vRoads.push(i * TILE - ROAD / 2 + ROAD / 2);
}
// Correct: road centers sit between blocks
const roadY = i => i * TILE;
const roadX = i => i * TILE;

// ===== Input =====
const keys = {};
addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if ([' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(e.key.toLowerCase())) e.preventDefault();
  if (e.key.toLowerCase() === 'e') tryEnterExit();
});
addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

// ===== Entities =====
const CAR_COLORS = ['#ff2d95', '#2dff8f', '#4dd8ff', '#ffe23d', '#ff6b3d', '#c77dff', '#ffffff', '#ff0044'];
const player = { x: roadX(2) + 20, y: roadY(2), a: 0, onFoot: true, hp: 100, car: null, walk: 0 };
const cars = [];   // traffic + parked
const cops = [];
const peds = [];
const bullets = [];
const particles = [];
const pickups = [];
const stars = { level: 0, heat: 0 };

// Mission markers
let money = 0;
const mission = { stage: 0, x: 0, y: 0, label: 'Reach the yellow marker', active: true };
function setMissionMarker() {
  const pts = [
    { x: roadX(9), y: roadY(4), label: 'Reach the yellow marker' },
    { x: roadX(4), y: roadY(10), label: 'Steal a car and get to the pink house' },
    { x: roadX(11), y: roadY(11), label: 'Lose the cops!' },
    { x: roadX(1), y: roadY(12), label: 'Deliver the package - $2000' }
  ];
  const m = pts[mission.stage % pts.length];
  mission.x = m.x; mission.y = m.y; mission.label = m.label;
}
setMissionMarker();

// ===== Car factory =====
function makeCar(x, y, a, opts = {}) {
  return {
    x, y, a, vx: 0, vy: 0, speed: 0,
    w: opts.w || 26, h: opts.h || 46,
    color: opts.color || pick(CAR_COLORS),
    driver: opts.driver || 'ai',      // 'ai' | 'player' | 'cop' | 'none'
    hp: 100, maxSpeed: opts.maxSpeed || rand(140, 210),
    turn: opts.turn || 2.4, lane: opts.lane || 0,
    dir: opts.dir || 1, // 1 or -1 along its axis
    axis: opts.axis || 'h',           // 'h' or 'v' for traffic
    busted: false, siren: 0
  };
}
function spawnTraffic() {
  for (let i = 0; i < 26; i++) {
    const axis = Math.random() < .5 ? 'h' : 'v';
    const line = (Math.random() * COLS) | 0;
    const t = rand(0, WORLD);
    if (axis === 'h') {
      const dir = Math.random() < .5 ? 1 : -1;
      cars.push(makeCar(t, roadY(line) + dir * 14, dir > 0 ? Math.PI / 2 : -Math.PI / 2,
        { axis, dir, lane: roadY(line) + dir * 14, driver: 'ai' }));
    } else {
      const dir = Math.random() < .5 ? 1 : -1;
      cars.push(makeCar(roadX(line) - dir * 14, t, dir > 0 ? 0 : Math.PI,
        { axis, dir, lane: roadX(line) - dir * 14, driver: 'ai' }));
    }
  }
  // parked cars (stealable)
  for (let i = 0; i < 18; i++) {
    const p = pick(PARKING);
    cars.push(makeCar(p.x + rand(20, p.w - 20), p.y + rand(20, p.h - 20), rand(0, 6.28), { driver: 'none', maxSpeed: rand(180, 250) }));
  }
}
function spawnPeds() {
  for (let i = 0; i < 24; i++) {
    const p = pick(PARKING);
    peds.push({ x: p.x + rand(10, p.w - 10), y: p.y + rand(10, p.h - 10), a: rand(0, 6.28), t: rand(1, 4), hp: 30, panic: 0 });
  }
}
spawnTraffic(); spawnPeds();

// ===== Helpers =====
function solidAt(x, y) {
  if (x < 8 || y < 8 || x > WORLD - 8 || y > WORLD - 8) return true;
  for (const b of BUILDINGS) if (x > b.x && x < b.x + b.w && y > b.y && y < b.y + b.h) return true;
  return false;
}
function moveWithCollision(e, dx, dy, r) {
  let hit = false;
  if (!solidAt(e.x + dx + Math.sign(dx) * r, e.y)) e.x += dx; else hit = true;
  if (!solidAt(e.x, e.y + dy + Math.sign(dy) * r)) e.y += dy; else hit = true;
  return hit;
}
function addParticle(x, y, c, n = 8, sp = 120) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, 6.28), s = rand(sp * .3, sp);
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(.3, .9), max: .9, c, r: rand(2, 5) });
  }
}
function addMoney(n) { money += n; document.getElementById('money').textContent = '$' + money.toLocaleString(); }

// ===== Enter / exit =====
function tryEnterExit() {
  if (player.onFoot) {
    let best = null, bd = 55;
    for (const c of cars) {
      if (c.driver === 'player') continue;
      const d = dist(player, c);
      if (d < bd) { bd = d; best = c; }
    }
    if (best) {
      best.driver = 'player'; player.car = best; player.onFoot = false;
      if (best.hp < 100) {} // no-op
      if (stars.level === 0 && best.color) { /* joyride */ }
      // Grand theft auto raises heat if the car was occupied
      if (best.wasTraffic) { stars.heat += 30; }
    }
  } else {
    const c = player.car;
    c.driver = 'none';
    player.onFoot = true; player.car = null;
    player.x = c.x + Math.cos(c.a + Math.PI / 2) * 34;
    player.y = c.y + Math.sin(c.a + Math.PI / 2) * 34;
  }
}

// ===== Update =====
let last = performance.now(), started = false, shake = 0, hitStop = 0;
function update(dt) {
  if (hitStop > 0) { hitStop -= dt; dt *= 0.15; }

  // --- Player ---
  if (!player.onFoot) {
    const c = player.car;
    const up = keys['w'] || keys['arrowup'];
    const dn = keys['s'] || keys['arrowdown'];
    const lf = keys['a'] || keys['arrowleft'];
    const rt = keys['d'] || keys['arrowright'];
    const hb = keys[' '];
    const boost = keys['shift'];
    let thr = (up ? 1 : 0) - (dn ? 1 : 0);
    const maxS = c.maxSpeed * (boost ? 1.35 : 1);
    // engine
    c.speed += thr * 340 * dt;
    if (hb) c.speed *= Math.pow(0.02, dt);      // handbrake
    c.speed *= Math.pow(0.55, dt);              // drag
    c.speed = clamp(c.speed, -maxS * .45, maxS);
    const steer = (rt ? 1 : 0) - (lf ? 1 : 0);
    // steering scales with speed but flips in reverse
    const grip = clamp(Math.abs(c.speed) / 90, 0, 1);
    c.a += steer * c.turn * grip * dt * Math.sign(c.speed || 1);
    const nx = Math.cos(c.a) * c.speed * dt, ny = Math.sin(c.a) * c.speed * dt;
    const hit = moveWithCollision(c, nx, ny, 16);
    if (hit) {
      if (Math.abs(c.speed) > 140) { addParticle(c.x, c.y, '#ffb703', 10); shake = Math.min(shake + .3, 1); c.hp -= 8; }
      c.speed *= -0.3;
    }
    c.x = clamp(c.x, 20, WORLD - 20); c.y = clamp(c.y, 20, WORLD - 20);
    player.x = c.x; player.y = c.y; player.a = c.a;
    if (c.hp <= 0) explode(c);
    // run over peds
    for (const p of peds) {
      if (Math.abs(c.speed) > 60 && dist(c, p) < 26) {
        p.hp -= 100; addParticle(p.x, p.y, '#ff0044', 12); stars.heat += 25;
      }
    }
  } else {
    const sp = 130;
    let dx = 0, dy = 0;
    if (keys['w'] || keys['arrowup']) dy -= 1;
    if (keys['s'] || keys['arrowdown']) dy += 1;
    if (keys['a'] || keys['arrowleft']) dx -= 1;
    if (keys['d'] || keys['arrowright']) dx += 1;
    if (dx || dy) {
      const l = Math.hypot(dx, dy); dx /= l; dy /= l;
      player.a = Math.atan2(dy, dx); player.walk += dt * 10;
      moveWithCollision(player, dx * sp * dt, dy * sp * dt, 10);
    }
    // pick up money drops
    for (let i = pickups.length - 1; i >= 0; i--) {
      if (dist(player, pickups[i]) < 26) { addMoney(pickups[i].v); addParticle(pickups[i].x, pickups[i].y, '#2dff8f', 8); pickups.splice(i, 1); }
    }
    // mission marker
    if (mission.active && dist(player, mission) < 40) {
      money += 500; document.getElementById('money').textContent = '$' + money.toLocaleString();
      addParticle(mission.x, mission.y, '#ffe23d', 20, 200);
      mission.stage++; setMissionMarker();
      if (mission.stage === 2) { stars.heat = 60; spawnCops(3); }
      if (mission.stage > 3) { mission.stage = 0; setMissionMarker(); }
    }
  }

  // --- Traffic AI ---
  for (const c of cars) {
    if (c.driver === 'player') continue;
    if (c.driver === 'none') continue; // parked
    if (c.driver === 'cop') continue;  // cops handled separately
    // drive along lane, brake for obstacles ahead
    const fx = Math.cos(c.a), fy = Math.sin(c.a);
    let blocked = false;
    for (const o of cars) {
      if (o === c) continue;
      const d = dist(c, o);
      if (d < 70) {
        const ang = Math.atan2(o.y - c.y, o.x - c.x);
        if (Math.abs(angDiff(c.a, ang)) < 0.6) { blocked = true; break; }
      }
    }
    if (dist(c, player) < 70 && !player.onFoot === false) {}
    const target = blocked ? 0 : 150;
    c.speed = lerp(c.speed, target, dt * 1.6);
    // steer back to lane center
    const laneErr = c.axis === 'h' ? (c.lane - c.y) : (c.lane - c.x);
    c.a += clamp(laneErr * 0.02, -1, 1) * dt * 1.5 * (c.axis === 'h' ? (c.dir > 0 ? 1 : -1) : (c.dir > 0 ? -1 : 1)) * 0;
    c.a = c.axis === 'h' ? (c.dir > 0 ? Math.PI / 2 : -Math.PI / 2) : (c.dir > 0 ? 0 : Math.PI);
    c.x += Math.cos(c.a) * c.speed * dt;
    c.y += Math.sin(c.a) * c.speed * dt;
    // wrap around world
    if (c.x < -40) c.x = WORLD + 30; if (c.x > WORLD + 40) c.x = -30;
    if (c.y < -40) c.y = WORLD + 30; if (c.y > WORLD + 40) c.y = -30;
    // bump player on foot
    if (player.onFoot && dist(c, player) < 24 && c.speed > 40) {
      player.hp -= 20; shake = .5; addParticle(player.x, player.y, '#ff0044', 8);
    }
  }

  // --- Cops ---
  for (const k of cops) {
    if (k.hp <= 0) continue;
    const tgt = player.car || player;
    const want = Math.atan2(tgt.y - k.y, tgt.x - k.x);
    k.a += clamp(angDiff(k.a, want), -2.6 * dt, 2.6 * dt);
    const chase = stars.level > 0 ? 260 : 150;
    k.speed = lerp(k.speed, chase, dt * 1.4);
    const hit = moveWithCollision(k, Math.cos(k.a) * k.speed * dt, Math.sin(k.a) * k.speed * dt, 16);
    if (hit) k.speed *= .4;
    k.siren += dt * 12;
    // ram player
    if (dist(k, tgt) < 40) {
      const dmg = (player.onFoot ? 30 : 12) * dt * 3;
      if (player.onFoot) { player.hp -= dmg * 3; }
      else { player.car.hp -= dmg; shake = Math.min(shake + dt, 1); }
      if (Math.random() < dt * 4) addParticle(k.x, k.y, '#4dd8ff', 3, 60);
    }
    if (stars.level === 0 && dist(k, tgt) > 700) k.hp = 0;
  }
  while (cops.filter(c => c.hp > 0).length < Math.min(stars.level, 6) && stars.level > 0) spawnCops(1);

  // --- Ped AI ---
  for (const p of peds) {
    if (p.hp <= 0) continue;
    p.t -= dt;
    if (p.t <= 0) { p.t = rand(1.5, 4); p.a = rand(0, 6.28); }
    // panic from nearby speeding car
    const danger = (!player.onFoot && dist(p, player.car) < 90 && Math.abs(player.car.speed) > 100);
    if (danger) { p.panic = 1; p.a = Math.atan2(p.y - player.y, p.x - player.x); }
    p.panic = Math.max(0, p.panic - dt * .5);
    const s = 40 + p.panic * 110;
    moveWithCollision(p, Math.cos(p.a) * s * dt, Math.sin(p.a) * s * dt, 8);
  }

  // --- Cop shootouts on foot wanted ---
  for (const k of cops) {
    if (k.hp <= 0 || !player.onFoot) continue;
    if (stars.level >= 2 && dist(k, player) < 260 && Math.random() < dt * 1.6) {
      const a = Math.atan2(player.y - k.y, player.x - k.x) + rand(-.12, .12);
      bullets.push({ x: k.x, y: k.y, vx: Math.cos(a) * 520, vy: Math.sin(a) * 520, life: 1.2, cop: true });
    }
  }

  // --- Bullets ---
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    let dead = b.life <= 0 || solidAt(b.x, b.y);
    if (!dead && b.cop && player.onFoot && dist(b, player) < 12) { player.hp -= 12; dead = true; shake = .3; }
    if (dead) bullets.splice(i, 1);
  }

  // --- Wanted decay ---
  stars.heat -= dt * 4;
  if (stars.heat <= 0 && stars.level > 0) { stars.heat = 45; stars.level--; }
  stars.level = clamp(Math.floor(stars.heat / 30), 0, 5);
  document.getElementById('stars').innerHTML =
    '&#9733;'.repeat(stars.level) + ' &#9734;'.repeat(5 - stars.level);

  // --- HP / death ---
  if (!player.onFoot) player.hp = Math.min(100, player.hp + dt * 2);
  if (player.hp <= 0) respawn();

  // --- Particles ---
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= .94; p.vy *= .94; p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
  shake = Math.max(0, shake - dt * 2);
}

function spawnCops(n) {
  const tgt = player.car || player;
  for (let i = 0; i < n; i++) {
    const a = rand(0, 6.28), d = rand(420, 620);
    const x = clamp(tgt.x + Math.cos(a) * d, 40, WORLD - 40);
    const y = clamp(tgt.y + Math.sin(a) * d, 40, WORLD - 40);
    if (solidAt(x, y)) continue;
    cops.push(makeCar(x, y, Math.atan2(tgt.y - y, tgt.x - x), { color: '#ffffff', driver: 'cop', maxSpeed: 280, turn: 3 }));
  }
}
function explode(c) {
  addParticle(c.x, c.y, '#ff6b3d', 30, 260);
  addParticle(c.x, c.y, '#ffe23d', 20, 180);
  shake = 1; hitStop = .12;
  c.hp = 100; c.driver = 'none'; c.color = '#333';
  if (player.car === c) { player.onFoot = true; player.car = null; player.hp -= 30; player.x = c.x + 30; }
}
function respawn() {
  player.hp = 100; stars.heat = 0; stars.level = 0;
  cops.length = 0;
  player.onFoot = true; player.car = null;
  player.x = roadX(2) + 20; player.y = roadY(2);
  addMoney(-Math.min(money, 200));
  document.getElementById('hp').textContent = 'HP 100';
}

// ===== Render =====
function draw() {
  const camX = clamp(player.x - W / 2, 0, WORLD - W);
  const camY = clamp(player.y - H / 2, 0, WORLD - H);
  const sx = shake > 0 ? rand(-shake * 14, shake * 14) : 0;
  const sy = shake > 0 ? rand(-shake * 14, shake * 14) : 0;

  cx.fillStyle = '#141026'; cx.fillRect(0, 0, W, H);
  cx.save();
  cx.translate(-camX + sx, -camY + sy);

  // grass / lots
  cx.fillStyle = '#1b1435';
  cx.fillRect(0, 0, WORLD, WORLD);

  // roads
  cx.fillStyle = '#2e2a44';
  for (let i = 0; i <= COLS; i++) {
    cx.fillRect(0, roadY(i) - ROAD / 2, WORLD, ROAD); // horizontal
    cx.fillRect(roadX(i) - ROAD / 2, 0, ROAD, WORLD); // vertical
  }
  // lane dashes
  cx.strokeStyle = '#ffe23d66'; cx.lineWidth = 2; cx.setLineDash([14, 18]);
  cx.beginPath();
  for (let i = 0; i <= COLS; i++) { cx.moveTo(0, roadY(i)); cx.lineTo(WORLD, roadY(i)); cx.moveTo(roadX(i), 0); cx.lineTo(roadX(i), WORLD); }
  cx.stroke(); cx.setLineDash([]);

  // parking lots (palm green)
  for (const p of PARKING) {
    cx.fillStyle = '#1f3d2b'; cx.fillRect(p.x, p.y, p.w, p.h);
    cx.strokeStyle = '#2dff8f22'; cx.strokeRect(p.x + 4, p.y + 4, p.w - 8, p.h - 8);
  }

  // buildings with fake 3D offset
  for (const b of BUILDINGS) {
    cx.fillStyle = '#00000055';
    cx.fillRect(b.x + 7, b.y + 7, b.w, b.h);
    cx.fillStyle = b.c; cx.fillRect(b.x, b.y, b.w, b.h);
    cx.fillStyle = b.roof; cx.fillRect(b.x + 5, b.y + 5, b.w - 10, b.h - 10);
    // windows
    cx.fillStyle = '#ffe23d55';
    for (let wy = b.y + 9; wy < b.y + b.h - 8; wy += 12)
      for (let wx = b.x + 9; wx < b.x + b.w - 8; wx += 12)
        if (((wx + wy) | 0) % 3 === 0) cx.fillRect(wx, wy, 5, 5);
  }

  // mission marker
  if (mission.active) {
    const pulse = 1 + Math.sin(performance.now() / 220) * .18;
    cx.save();
    cx.translate(mission.x, mission.y);
    cx.scale(pulse, pulse);
    cx.fillStyle = '#ffe23d33'; cx.beginPath(); cx.arc(0, 0, 34, 0, 6.28); cx.fill();
    cx.strokeStyle = '#ffe23d'; cx.lineWidth = 3; cx.beginPath(); cx.arc(0, 0, 34, 0, 6.28); cx.stroke();
    cx.fillStyle = '#ffe23d'; cx.beginPath(); cx.moveTo(0, -10); cx.lineTo(9, 8); cx.lineTo(-9, 8); cx.closePath(); cx.fill();
    cx.restore();
  }

  // pickups
  for (const p of pickups) {
    cx.fillStyle = '#2dff8f'; cx.fillRect(p.x - 8, p.y - 8, 16, 16);
    cx.fillStyle = '#0d0221'; cx.font = 'bold 12px monospace'; cx.fillText('$', p.x - 4, p.y + 4);
  }

  // peds
  for (const p of peds) {
    if (p.hp <= 0) { cx.fillStyle = '#7a1030'; cx.beginPath(); cx.ellipse(p.x, p.y, 12, 6, p.a, 0, 6.28); cx.fill(); continue; }
    cx.save(); cx.translate(p.x, p.y); cx.rotate(p.a);
    cx.fillStyle = p.panic ? '#ff6b3d' : '#c77dff';
    cx.beginPath(); cx.arc(0, 0, 7, 0, 6.28); cx.fill();
    cx.fillStyle = '#ffd9a0'; cx.beginPath(); cx.arc(3, 0, 4, 0, 6.28); cx.fill();
    cx.restore();
  }

  // cars
  for (const c of [...cars, ...cops]) if (c.hp > 0) drawCar(c);

  // player on foot
  if (player.onFoot) {
    cx.save(); cx.translate(player.x, player.y); cx.rotate(player.a);
    cx.fillStyle = '#ff2d95'; cx.beginPath(); cx.arc(0, 0, 9, 0, 6.28); cx.fill();
    cx.fillStyle = '#ffd9a0'; cx.beginPath(); cx.arc(4, 0, 5, 0, 6.28); cx.fill();
    cx.restore();
  }

  // bullets
  cx.fillStyle = '#ffe23d';
  for (const b of bullets) { cx.beginPath(); cx.arc(b.x, b.y, 3, 0, 6.28); cx.fill(); }

  // particles
  for (const p of particles) {
    cx.globalAlpha = clamp(p.life / p.max, 0, 1);
    cx.fillStyle = p.c; cx.beginPath(); cx.arc(p.x, p.y, p.r, 0, 6.28); cx.fill();
  }
  cx.globalAlpha = 1;

  // neon vignette grid glow on roads
  cx.restore();

  // HUD updates
  document.getElementById('hp').textContent = 'HP ' + Math.max(0, Math.round(player.hp));
  document.getElementById('mission').innerHTML =
    '<b>MISSION</b><br>' + mission.label + '<br><span style="color:#9aa0c0">Money: $' + money.toLocaleString() + '</span>';
  const spd = player.onFoot ? 0 : Math.abs(player.car.speed);
  document.getElementById('speed').textContent = Math.round(spd * 0.6) + ' km/h';

  drawMinimap(camX, camY);
}

function drawCar(c) {
  cx.save(); cx.translate(c.x, c.y); cx.rotate(c.a);
  const w = c.w, h = c.h;
  // shadow
  cx.fillStyle = '#00000066'; cx.fillRect(-w / 2 + 4, -h / 2 + 5, w, h);
  // body
  cx.fillStyle = c.color; cx.fillRect(-w / 2, -h / 2, w, h);
  // roof
  cx.fillStyle = '#00000055'; cx.fillRect(-w / 2 + 4, -h / 2 + 10, w - 8, h - 22);
  // windshield
  cx.fillStyle = '#4dd8ffaa'; cx.fillRect(-w / 2 + 3, -h / 2 + 6, w - 6, 7);
  // lights
  cx.fillStyle = '#ffe23d'; cx.fillRect(-w / 2 + 2, -h / 2, 5, 3); cx.fillRect(w / 2 - 7, -h / 2, 5, 3);
  cx.fillStyle = '#ff0044'; cx.fillRect(-w / 2 + 2, h / 2 - 3, 5, 3); cx.fillRect(w / 2 - 7, h / 2 - 3, 5, 3);
  if (c.driver === 'cop') {
    const on = Math.sin(c.siren) > 0;
    cx.fillStyle = on ? '#ff0044' : '#4dd8ff';
    cx.fillRect(-w / 2 - 2, -4, 6, 8);
    cx.fillStyle = on ? '#4dd8ff' : '#ff0044';
    cx.fillRect(w / 2 - 4, -4, 6, 8);
  }
  cx.restore();
}

function drawMinimap(camX, camY) {
  const s = mm.width / WORLD;
  mx.clearRect(0, 0, mm.width, mm.height);
  mx.fillStyle = '#0d0221'; mx.fillRect(0, 0, mm.width, mm.height);
  mx.fillStyle = '#2e2a44';
  for (let i = 0; i <= COLS; i++) {
    mx.fillRect(0, (roadY(i) - ROAD / 2) * s, mm.width, ROAD * s);
    mx.fillRect((roadX(i) - ROAD / 2) * s, 0, ROAD * s, mm.height);
  }
  // mission
  mx.fillStyle = '#ffe23d'; mx.beginPath(); mx.arc(mission.x * s, mission.y * s, 4, 0, 6.28); mx.fill();
  // cops
  mx.fillStyle = '#4dd8ff';
  for (const k of cops) if (k.hp > 0) mx.fillRect(k.x * s - 2, k.y * s - 2, 4, 4);
  // player
  mx.fillStyle = '#ff2d95'; mx.beginPath(); mx.arc(player.x * s, player.y * s, 4, 0, 6.28); mx.fill();
  // camera view
  mx.strokeStyle = '#ffffff55'; mx.strokeRect(camX * s, camY * s, W * s, H * s);
}

// ===== Loop =====
function loop(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  if (started) { update(dt); draw(); }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

document.getElementById('overlay').addEventListener('click', () => {
  document.getElementById('overlay').style.display = 'none';
  started = true;
});
</script>
</body>
</html>
