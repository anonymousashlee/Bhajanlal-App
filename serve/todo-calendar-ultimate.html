<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lumina — Todo & Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #faf7f2;
    --bg-2: #f3eee5;
    --surface: #ffffff;
    --surface-2: #f6f2ea;
    --surface-3: #ece6da;
    --border: #e6dfd2;
    --border-2: #d4ccbc;
    --text: #1a1612;
    --text-2: #5c5449;
    --text-3: #9a9184;
    --accent: #e85d3a;
    --accent-2: #ff7a59;
    --accent-soft: #fce5dd;
    --accent-contrast: #ffffff;
    --green: #2f8f5b;
    --green-soft: #e3f1e9;
    --amber: #b8791f;
    --amber-soft: #f5ecd8;
    --red: #c0392b;
    --red-soft: #f6e0dd;
    --blue: #2b6cb0;
    --blue-soft: #e1ecf7;
    --shadow: 0 1px 2px rgba(26,22,18,.05), 0 10px 30px rgba(26,22,18,.07);
    --shadow-lg: 0 24px 60px rgba(26,22,18,.22);
    --radius: 20px;
    --radius-sm: 14px;
    --radius-xs: 10px;
  }
  [data-theme="dark"] {
    --bg: #15120f;
    --bg-2: #1c1814;
    --surface: #211d18;
    --surface-2: #2a2520;
    --surface-3: #342e27;
    --border: #3a342c;
    --border-2: #4a4339;
    --text: #f2ece2;
    --text-2: #b8ae9e;
    --text-3: #7a7164;
    --accent: #ff7a59;
    --accent-2: #ff9b82;
    --accent-soft: #3a231c;
    --accent-contrast: #15120f;
    --green: #5ec98a;
    --green-soft: #1e3326;
    --amber: #e8b04a;
    --amber-soft: #362c18;
    --red: #f07a6e;
    --red-soft: #3a201c;
    --blue: #7aa8e0;
    --blue-soft: #1e2a3a;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.4);
    --shadow-lg: 0 24px 60px rgba(0,0,0,.6);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    transition: background .3s ease, color .3s ease;
  }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  input, select, textarea { font-family: inherit; }
  ::selection { background: var(--accent-soft); color: var(--accent); }
  h1, h2, h3 { font-family: "Fraunces", Georgia, serif; letter-spacing: -.02em; }

  /* ---------- Shell ---------- */
  .shell { display: grid; grid-template-rows: 64px 1fr; height: 100vh; }
  .topbar {
    display: flex; align-items: center; gap: 16px;
    padding: 0 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    z-index: 30;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-mark {
    width: 34px; height: 34px; border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), #f0a04b);
    display: grid; place-items: center; color: #fff;
    font-family: "Fraunces", serif; font-weight: 900; font-size: 18px;
    box-shadow: 0 6px 16px rgba(232,93,58,.35);
  }
  .brand-name { font-family: "Fraunces", serif; font-size: 20px; font-weight: 700; }
  .brand-sub { font-size: 10.5px; color: var(--text-3); font-weight: 500; text-transform: uppercase; letter-spacing: .1em; }

  .view-tabs { display: flex; gap: 4px; background: var(--surface-2); padding: 4px; border-radius: 12px; }
  .view-tab {
    padding: 7px 14px; border-radius: 9px; font-size: 13px; font-weight: 600; color: var(--text-2);
    transition: background .15s, color .15s;
  }
  .view-tab:hover { color: var(--text); }
  .view-tab.active { background: var(--surface); color: var(--accent); box-shadow: 0 1px 3px rgba(0,0,0,.08); }

  .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .search-box {
    position: relative; width: 260px;
  }
  .search-box input {
    width: 100%; padding: 9px 12px 9px 36px;
    border: 1px solid var(--border); border-radius: 12px;
    background: var(--surface-2); color: var(--text); font-size: 13px;
    transition: border-color .15s, box-shadow .15s, width .2s;
  }
  .search-box input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); width: 320px; }
  .search-box .ico { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-3); font-size: 14px; pointer-events: none; }
  .kbd {
    font-family: "JetBrains Mono", monospace; font-size: 10px;
    background: var(--surface-3); color: var(--text-3);
    padding: 2px 6px; border-radius: 6px; border: 1px solid var(--border);
  }
  .icon-btn {
    width: 38px; height: 38px; border-radius: 11px;
    background: var(--surface-2); color: var(--text-2);
    display: grid; place-items: center; font-size: 16px;
    transition: background .15s, color .15s, transform .15s;
  }
  .icon-btn:hover { background: var(--accent-soft); color: var(--accent); transform: translateY(-1px); }
  .add-btn {
    height: 38px; padding: 0 16px; border-radius: 11px;
    background: var(--accent); color: var(--accent-contrast);
    font-size: 13px; font-weight: 600;
    display: flex; align-items: center; gap: 6px;
    box-shadow: 0 4px 14px rgba(232,93,58,.35);
    transition: transform .15s, box-shadow .15s;
  }
  .add-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(232,93,58,.45); }

  /* ---------- Main content ---------- */
  .content { overflow: hidden; padding: 16px 20px 20px; display: grid; grid-template-columns: 1fr 360px; gap: 16px; min-height: 0; }
  .content.single { grid-template-columns: 1fr; }
  .main-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow);
    display: flex; flex-direction: column; min-height: 0; overflow: hidden;
  }
  .card-head {
    padding: 16px 20px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .card-title { font-size: 20px; font-weight: 700; }
  .card-sub { font-size: 12px; color: var(--text-3); margin-top: 2px; }
  .card-nav { display: flex; gap: 6px; align-items: center; }
  .nav-btn {
    width: 34px; height: 34px; border-radius: 10px;
    background: var(--surface-2); color: var(--text-2);
    display: grid; place-items: center; font-size: 15px;
    transition: background .15s, color .15s;
  }
  .nav-btn:hover { background: var(--accent-soft); color: var(--accent); }
  .today-pill {
    padding: 0 14px; height: 34px; border-radius: 10px;
    background: var(--accent-soft); color: var(--accent);
    font-size: 12.5px; font-weight: 700;
    transition: background .15s, color .15s;
  }
  .today-pill:hover { background: var(--accent); color: var(--accent-contrast); }

  /* ---------- Month grid ---------- */
  .month-grid { display: grid; grid-template-columns: repeat(7, 1fr); grid-auto-rows: 1fr; gap: 6px; padding: 12px 14px 16px; flex: 1; min-height: 0; }
  .weekday-row { display: grid; grid-template-columns: repeat(7, 1fr); padding: 10px 14px 4px; border-bottom: 1px solid var(--border); }
  .weekday { text-align: center; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--text-3); }
  .day-cell {
    background: var(--surface-2); border: 1px solid transparent; border-radius: 14px;
    padding: 8px 9px; display: flex; flex-direction: column; gap: 4px;
    cursor: pointer; min-height: 92px; position: relative;
    transition: background .15s, border-color .15s, transform .15s, box-shadow .15s;
  }
  .day-cell:hover { background: var(--surface-3); transform: translateY(-1px); }
  .day-cell.other-month { opacity: .32; }
  .day-cell.today { background: var(--accent-soft); border-color: var(--accent); }
  .day-cell.selected { background: var(--accent); color: var(--accent-contrast); box-shadow: 0 8px 22px rgba(232,93,58,.35); }
  .day-cell.selected .day-num, .day-cell.selected .day-count { color: var(--accent-contrast); }
  .day-cell.selected .preview { color: rgba(255,255,255,.85); }
  .day-cell.selected .dot { background: rgba(255,255,255,.8) !important; }
  .day-cell.drag-over { outline: 2px dashed var(--accent); outline-offset: -2px; background: var(--accent-soft); }
  .day-top { display: flex; align-items: center; justify-content: space-between; }
  .day-num { font-size: 13px; font-weight: 700; }
  .day-count {
    font-size: 10px; font-weight: 700;
    background: rgba(0,0,0,.06); padding: 1px 6px; border-radius: 99px; color: var(--text-2);
  }
  .day-cell.selected .day-count { background: rgba(255,255,255,.25); }
  .dots { display: flex; gap: 3px; flex-wrap: wrap; }
  .dot { width: 6px; height: 6px; border-radius: 50%; }
  .preview { font-size: 10.5px; color: var(--text-3); line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .more { font-size: 10px; color: var(--text-3); font-weight: 600; }

  /* ---------- Week grid ---------- */
  .week-grid { display: grid; grid-template-columns: 56px repeat(7, 1fr); flex: 1; min-height: 0; overflow: auto; }
  .week-header { display: contents; }
  .week-corner { border-bottom: 1px solid var(--border); }
  .week-day-head {
    padding: 10px 6px; text-align: center; border-bottom: 1px solid var(--border);
    border-left: 1px solid var(--border);
  }
  .week-day-name { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--text-3); }
  .week-day-num { font-size: 18px; font-weight: 700; margin-top: 2px; }
  .week-day-head.today .week-day-num { color: var(--accent); }
  .week-row { display: contents; }
  .week-time { font-size: 10.5px; color: var(--text-3); text-align: right; padding: 4px 8px 0 0; border-right: 1px solid var(--border); height: 48px; }
  .week-cell {
    border-left: 1px solid var(--border); border-bottom: 1px solid var(--border);
    height: 48px; position: relative; padding: 2px;
  }
  .week-cell:hover { background: var(--surface-2); }
  .week-event {
    position: absolute; left: 2px; right: 2px; top: 2px;
    background: var(--accent-soft); color: var(--accent);
    border-left: 3px solid var(--accent);
    border-radius: 6px; padding: 3px 6px; font-size: 11px; font-weight: 600;
    overflow: hidden; cursor: pointer; z-index: 2;
    box-shadow: 0 1px 3px rgba(0,0,0,.08);
  }
  .week-event.done { opacity: .5; text-decoration: line-through; }
  .week-event .ev-time { font-size: 9.5px; color: var(--text-3); font-weight: 500; }

  /* ---------- Day timeline ---------- */
  .day-timeline { flex: 1; overflow: auto; padding: 12px 20px 20px; }
  .timeline-row { display: grid; grid-template-columns: 60px 1fr; gap: 12px; min-height: 60px; }
  .timeline-time { font-size: 12px; color: var(--text-3); font-weight: 600; padding-top: 4px; text-align: right; }
  .timeline-slot {
    border-top: 1px solid var(--border); padding: 6px 0;
    display: flex; flex-direction: column; gap: 6px; min-height: 60px;
  }
  .timeline-event {
    background: var(--surface-2); border: 1px solid var(--border);
    border-left: 4px solid var(--accent); border-radius: 12px;
    padding: 10px 12px; cursor: pointer;
    transition: transform .15s, box-shadow .15s;
  }
  .timeline-event:hover { transform: translateX(2px); box-shadow: var(--shadow); }
  .timeline-event.done { opacity: .5; }
  .timeline-event .te-title { font-size: 13.5px; font-weight: 600; }
  .timeline-event .te-meta { font-size: 11.5px; color: var(--text-3); margin-top: 3px; }

  /* ---------- Agenda ---------- */
  .agenda { flex: 1; overflow: auto; padding: 12px 20px 20px; display: flex; flex-direction: column; gap: 18px; }
  .agenda-group-title { font-size: 13px; font-weight: 700; color: var(--text-3); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 8px; }
  .agenda-item {
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 14px;
    padding: 12px 14px; display: flex; gap: 12px; align-items: flex-start;
    transition: transform .15s, box-shadow .15s;
  }
  .agenda-item:hover { transform: translateX(2px); box-shadow: var(--shadow); }
  .agenda-date {
    min-width: 46px; text-align: center; padding: 6px 0;
    background: var(--surface); border-radius: 10px; border: 1px solid var(--border);
  }
  .agenda-date .ad-day { font-size: 18px; font-weight: 800; line-height: 1; }
  .agenda-date .ad-mon { font-size: 9.5px; font-weight: 700; text-transform: uppercase; color: var(--text-3); margin-top: 2px; }
  .agenda-body { flex: 1; min-width: 0; }
  .agenda-title { font-size: 13.5px; font-weight: 600; }
  .agenda-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }

  /* ---------- Side panel ---------- */
  .side-panel {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow);
    display: flex; flex-direction: column; min-height: 0; overflow: hidden;
  }
  .side-head { padding: 16px 18px; border-bottom: 1px solid var(--border); }
  .side-title { font-size: 16px; font-weight: 700; }
  .side-sub { font-size: 11.5px; color: var(--text-3); margin-top: 2px; }
  .progress-wrap { padding: 14px 18px; border-bottom: 1px solid var(--border); }
  .progress-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .progress-label { font-size: 12px; color: var(--text-2); font-weight: 500; }
  .progress-pct { font-size: 12px; font-weight: 700; color: var(--accent); }
  .progress-bar { height: 7px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); border-radius: 99px; transition: width .35s ease; }
  .task-list { flex: 1; overflow-y: auto; padding: 10px 12px 14px; display: flex; flex-direction: column; gap: 8px; }
  .task-item {
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px;
    padding: 11px 12px; display: flex; gap: 10px; align-items: flex-start;
    transition: background .15s, transform .15s, box-shadow .15s;
    animation: slideIn .22s ease;
  }
  .task-item:hover { background: var(--surface-3); transform: translateX(2px); }
  .task-item.done { opacity: .5; }
  .task-item.done .task-title { text-decoration: line-through; color: var(--text-3); }
  .checkbox {
    width: 20px; height: 20px; border-radius: 6px; border: 2px solid var(--border-2);
    background: var(--surface); display: grid; place-items: center; flex-shrink: 0; margin-top: 1px;
    cursor: pointer; transition: all .15s;
  }
  .checkbox:hover { border-color: var(--accent); }
  .checkbox.checked { background: var(--accent); border-color: var(--accent); }
  .checkbox.checked::after { content: "✓"; color: #fff; font-size: 12px; font-weight: 800; }
  .task-body { flex: 1; min-width: 0; }
  .task-title { font-size: 13.5px; font-weight: 600; line-height: 1.35; }
  .task-notes { font-size: 11.5px; color: var(--text-3); margin-top: 3px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .task-meta { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; align-items: center; }
  .badge { font-size: 10.5px; font-weight: 600; padding: 2px 7px; border-radius: 99px; }
  .badge-time { background: var(--surface-3); color: var(--text-2); }
  .badge-priority-high { background: var(--red-soft); color: var(--red); }
  .badge-priority-med { background: var(--amber-soft); color: var(--amber); }
  .badge-priority-low { background: var(--green-soft); color: var(--green); }
  .badge-project { background: var(--accent-soft); color: var(--accent); }
  .badge-tag { background: var(--blue-soft); color: var(--blue); }
  .subtask { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--text-2); margin-top: 4px; }
  .subtask .cb { width: 13px; height: 13px; border-radius: 4px; border: 1.5px solid var(--border-2); display: grid; place-items: center; cursor: pointer; flex-shrink: 0; }
  .subtask .cb.checked { background: var(--green); border-color: var(--green); }
  .subtask .cb.checked::after { content: "✓"; color: #fff; font-size: 9px; font-weight: 800; }
  .subtask.done span { text-decoration: line-through; color: var(--text-3); }
  .task-actions { display: flex; gap: 2px; opacity: 0; transition: opacity .15s; }
  .task-item:hover .task-actions { opacity: 1; }
  .task-action { width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; font-size: 12px; color: var(--text-3); transition: background .15s, color .15s; }
  .task-action:hover { background: var(--surface); color: var(--text); }
  .task-action.danger:hover { color: var(--red); }
  .empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: var(--text-3); text-align: center; padding: 24px; }
  .empty-ico { font-size: 46px; opacity: .7; }
  .empty-title { font-size: 14px; font-weight: 600; color: var(--text-2); }
  .empty-sub { font-size: 12px; max-width: 240px; line-height: 1.45; }

  /* ---------- Insights ---------- */
  .insights { flex: 1; overflow: auto; padding: 16px 20px 20px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  .stat-card { background: var(--surface-2); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; }
  .stat-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--text-3); }
  .stat-value { font-family: "Fraunces", serif; font-size: 30px; font-weight: 700; margin-top: 4px; }
  .stat-sub { font-size: 11.5px; color: var(--text-3); margin-top: 2px; }
  .heatmap { grid-column: 1 / -1; }
  .heatmap-grid { display: grid; grid-template-columns: repeat(53, 1fr); gap: 3px; margin-top: 10px; }
  .heat-cell { aspect-ratio: 1; border-radius: 3px; background: var(--surface-3); }
  .heat-1 { background: #fde0d5; } .heat-2 { background: #f8b8a3; } .heat-3 { background: #f08a6e; } .heat-4 { background: var(--accent); }
  [data-theme="dark"] .heat-1 { background: #3a231c; } [data-theme="dark"] .heat-2 { background: #5a2e22; } [data-theme="dark"] .heat-3 { background: #8a3a28; } [data-theme="dark"] .heat-4 { background: var(--accent); }
  .bar-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .bar-label { font-size: 12px; color: var(--text-2); min-width: 70px; }
  .bar-track { flex: 1; height: 8px; background: var(--surface-3); border-radius: 99px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--accent); border-radius: 99px; transition: width .4s ease; }
  .bar-val { font-size: 11px; font-weight: 700; color: var(--text-3); min-width: 24px; text-align: right; }

  /* ---------- Modal ---------- */
  .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.45); backdrop-filter: blur(6px); display: none; align-items: center; justify-content: center; z-index: 50; padding: 20px; }
  .modal-backdrop.open { display: flex; animation: fadeIn .15s ease; }
  .modal { background: var(--surface); border-radius: 22px; width: 100%; max-width: 520px; box-shadow: var(--shadow-lg); animation: popIn .22s ease; overflow: hidden; max-height: 90vh; display: flex; flex-direction: column; }
  .modal-head { padding: 20px 22px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .modal-title { font-size: 18px; font-weight: 700; }
  .modal-body { padding: 18px 22px; display: flex; flex-direction: column; gap: 14px; overflow-y: auto; }
  .field label { display: block; font-size: 12px; font-weight: 600; color: var(--text-2); margin-bottom: 6px; }
  .field input, .field textarea, .field select {
    width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius-xs);
    background: var(--surface-2); color: var(--text); font-size: 13.5px; transition: border-color .15s, box-shadow .15s;
  }
  .field input:focus, .field textarea:focus, .field select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .field textarea { resize: vertical; min-height: 64px; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .field-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    padding: 5px 11px; border-radius: 99px; font-size: 12px; font-weight: 600;
    background: var(--surface-2); color: var(--text-2); border: 1px solid var(--border);
    cursor: pointer; transition: all .15s;
  }
  .chip.active { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
  .subtasks-editor { display: flex; flex-direction: column; gap: 6px; }
  .subtask-row { display: flex; gap: 6px; }
  .subtask-row input { flex: 1; }
  .subtask-row button { width: 32px; border-radius: 8px; background: var(--surface-3); color: var(--text-2); font-size: 14px; }
  .modal-foot { padding: 14px 22px 18px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; gap: 8px; }
  .btn-ghost { padding: 9px 14px; border-radius: var(--radius-xs); color: var(--text-2); font-size: 13px; font-weight: 600; transition: background .15s; }
  .btn-ghost:hover { background: var(--surface-2); }
  .btn-primary { padding: 9px 18px; border-radius: var(--radius-xs); background: var(--accent); color: var(--accent-contrast); font-size: 13px; font-weight: 600; box-shadow: 0 4px 12px rgba(232,93,58,.3); transition: transform .15s; }
  .btn-primary:hover { transform: translateY(-1px); }
  .btn-danger { padding: 9px 14px; border-radius: var(--radius-xs); color: var(--red); font-size: 13px; font-weight: 600; transition: background .15s; }
  .btn-danger:hover { background: var(--red-soft); }

  /* ---------- Command palette ---------- */
  .cmd-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.5); backdrop-filter: blur(8px); display: none; align-items: flex-start; justify-content: center; z-index: 60; padding-top: 12vh; }
  .cmd-backdrop.open { display: flex; animation: fadeIn .12s ease; }
  .cmd { background: var(--surface); border-radius: 18px; width: 100%; max-width: 560px; box-shadow: var(--shadow-lg); overflow: hidden; animation: popIn .18s ease; }
  .cmd input { width: 100%; padding: 16px 20px; border: none; border-bottom: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 15px; outline: none; }
  .cmd-list { max-height: 360px; overflow-y: auto; padding: 6px; }
  .cmd-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; cursor: pointer; transition: background .12s; }
  .cmd-item:hover, .cmd-item.active { background: var(--surface-2); }
  .cmd-item .ci-ico { width: 28px; height: 28px; border-radius: 8px; background: var(--surface-3); display: grid; place-items: center; font-size: 13px; }
  .cmd-item .ci-title { font-size: 13.5px; font-weight: 600; }
  .cmd-item .ci-sub { font-size: 11.5px; color: var(--text-3); }
  .cmd-group { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--text-3); padding: 10px 12px 4px; }

  /* ---------- Toast ---------- */
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--text); color: var(--bg); padding: 11px 18px; border-radius: 12px; font-size: 13px; font-weight: 600; box-shadow: var(--shadow-lg); opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 70; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ---------- Shortcuts overlay ---------- */
  .shortcuts-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.5); backdrop-filter: blur(6px); display: none; align-items: center; justify-content: center; z-index: 65; }
  .shortcuts-backdrop.open { display: flex; }
  .shortcuts { background: var(--surface); border-radius: 20px; padding: 22px 24px; max-width: 460px; width: 100%; box-shadow: var(--shadow-lg); }
  .shortcuts h2 { margin-bottom: 14px; }
  .sc-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .sc-row:last-child { border-bottom: none; }
  .sc-key { font-family: "JetBrains Mono", monospace; font-size: 11px; background: var(--surface-2); padding: 3px 8px; border-radius: 6px; border: 1px solid var(--border); }

  /* ---------- Animations ---------- */
  @keyframes slideIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes popIn { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: scale(1); } }

  /* ---------- Responsive ---------- */
  @media (max-width: 980px) {
    .content { grid-template-columns: 1fr; }
    .side-panel { position: fixed; right: 0; top: 64px; bottom: 0; width: 340px; z-index: 40; transform: translateX(100%); transition: transform .25s; border-radius: 0; border-left: 1px solid var(--border); }
    .side-panel.open { transform: translateX(0); }
  }
  @media (max-width: 640px) {
    body { overflow: auto; }
    .shell { height: auto; min-height: 100vh; }
    .topbar { flex-wrap: wrap; height: auto; padding: 10px 12px; gap: 8px; }
    .view-tabs { order: 3; width: 100%; overflow-x: auto; }
    .search-box { width: 100%; }
    .search-box input:focus { width: 100%; }
    .content { padding: 10px 12px 16px; }
    .month-grid { gap: 3px; padding: 8px; }
    .day-cell { min-height: 62px; padding: 5px; border-radius: 10px; }
    .insights { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">L</div>
      <div>
        <div class="brand-name">Lumina</div>
        <div class="brand-sub">Todo & Calendar</div>
      </div>
    </div>
    <nav class="view-tabs">
      <button class="view-tab active" data-view="month">Month</button>
      <button class="view-tab" data-view="week">Week</button>
      <button class="view-tab" data-view="day">Day</button>
      <button class="view-tab" data-view="agenda">Agenda</button>
      <button class="view-tab" data-view="insights">Insights</button>
    </nav>
    <div class="topbar-right">
      <div class="search-box">
        <span class="ico">⌕</span>
        <input id="search" placeholder="Search tasks…" />
      </div>
      <button class="icon-btn" id="themeToggle" title="Toggle theme (T)">◐</button>
      <button class="icon-btn" id="shortcutsBtn" title="Shortcuts (?)">?</button>
      <button class="add-btn" id="addTaskBtn">+ Task <span class="kbd">N</span></button>
    </div>
  </header>

  <div class="content" id="content">
    <div class="main-card" id="mainCard">
      <div class="card-head">
        <div>
          <div class="card-title" id="cardTitle">—</div>
          <div class="card-sub" id="cardSub">—</div>
        </div>
        <div class="card-nav">
          <button class="nav-btn" id="prevBtn">‹</button>
          <button class="today-pill" id="todayBtn">Today</button>
          <button class="nav-btn" id="nextBtn">›</button>
        </div>
      </div>
      <div id="mainView" style="flex:1;min-height:0;display:flex;flex-direction:column;"></div>
    </div>
    <aside class="side-panel" id="sidePanel">
      <div class="side-head">
        <div class="side-title" id="sideTitle">Today</div>
        <div class="side-sub" id="sideSub">—</div>
      </div>
      <div class="progress-wrap">
        <div class="progress-row">
          <span class="progress-label">Progress</span>
          <span class="progress-pct" id="progressPct">0%</span>
        </div>
        <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
      </div>
      <div class="task-list" id="taskList"></div>
    </aside>
  </div>
</div>

<!-- Modal -->
<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title" id="modalTitle">New task</div>
      <button class="icon-btn" id="modalClose" style="width:32px;height:32px">✕</button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label>Title</label>
        <input id="mTitle" placeholder="What needs doing?" />
      </div>
      <div class="field">
        <label>Notes</label>
        <textarea id="mNotes" placeholder="Optional details…"></textarea>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Date</label>
          <input type="date" id="mDate" />
        </div>
        <div class="field">
          <label>Time</label>
          <input type="time" id="mTime" />
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Priority</label>
          <select id="mPriority">
            <option value="low">Low</option>
            <option value="med" selected>Medium</option>
            <option value="high">High</option>
          </select>
        </div>
        <div class="field">
          <label>Repeats</label>
          <select id="mRepeat">
            <option value="">Does not repeat</option>
            <option value="daily">Daily</option>
            <option value="weekly">Weekly</option>
            <option value="monthly">Monthly</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label>Project</label>
        <select id="mProject"></select>
      </div>
      <div class="field">
        <label>Tags (comma separated)</label>
        <input id="mTags" placeholder="design, urgent" />
      </div>
      <div class="field">
        <label>Subtasks</label>
        <div class="subtasks-editor" id="subtasksEditor"></div>
        <button class="btn-ghost" id="addSubtaskBtn" style="margin-top:6px;font-size:12px">+ Add subtask</button>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn-danger" id="modalDelete" style="display:none">Delete</button>
      <div style="margin-left:auto;display:flex;gap:8px">
        <button class="btn-ghost" id="modalCancel">Cancel</button>
        <button class="btn-primary" id="modalSave">Save task</button>
      </div>
    </div>
  </div>
</div>

<!-- Command palette -->
<div class="cmd-backdrop" id="cmdBackdrop">
  <div class="cmd">
    <input id="cmdInput" placeholder="Type a command or search…" />
    <div class="cmd-list" id="cmdList"></div>
  </div>
</div>

<!-- Shortcuts -->
<div class="shortcuts-backdrop" id="scBackdrop">
  <div class="shortcuts">
    <h2>Keyboard shortcuts</h2>
    <div class="sc-row"><span>New task</span><span class="sc-key">N</span></div>
    <div class="sc-row"><span>Command palette</span><span class="sc-key">⌘K</span></div>
    <div class="sc-row"><span>Toggle theme</span><span class="sc-key">T</span></div>
    <div class="sc-row"><span>Today</span><span class="sc-key">G then T</span></div>
    <div class="sc-row"><span>Undo</span><span class="sc-key">⌘Z</span></div>
    <div class="sc-row"><span>Close modal</span><span class="sc-key">Esc</span></div>
    <div class="sc-row"><span>This help</span><span class="sc-key">?</span></div>
    <div style="margin-top:14px;text-align:right"><button class="btn-ghost" id="scClose">Close</button></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ---------- State ----------
const STORAGE_KEY = 'lumina.v1';
const state = loadState();
let view = 'month';
let viewDate = new Date(); // anchor date for month/week/day
let selectedDate = isoDate(new Date());
let editingId = null;
let searchQuery = '';
let theme = state.theme || 'light';
let history = []; // undo stack
let cmdQuery = '';
let cmdActive = 0;
let subtasksDraft = [];

function defaultState() {
  return {
    theme: 'light',
    accent: 'coral',
    projects: [
      { id: 'p1', name: 'Personal', color: '#e85d3a' },
      { id: 'p2', name: 'Work', color: '#2f8f5b' },
      { id: 'p3', name: 'Health', color: '#2b6cb0' },
    ],
    tasks: [],
    tags: ['urgent','design','deep-work'],
  };
}
function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return defaultState();
}
function saveState() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e){} }

// ---------- Helpers ----------
function isoDate(d) {
  const y = d.getFullYear(); const m = String(d.getMonth()+1).padStart(2,'0'); const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function parseDate(s) { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function fmtDate(s) { const d = parseDate(s); return d.toLocaleDateString(undefined, { weekday:'long', month:'long', day:'numeric', year:'numeric' }); }
function fmtShort(s) { const d = parseDate(s); return d.toLocaleDateString(undefined, { month:'short', day:'numeric' }); }
function uid() { return 't' + Math.random().toString(36).slice(2,9) + Date.now().toString(36); }
function pid() { return 'p' + Math.random().toString(36).slice(2,7); }
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg) {
  const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove('show'), 1900);
}
function pushHistory() { history.push(JSON.stringify(state.tasks)); if (history.length > 40) history.shift(); }
function undo() {
  if (!history.length) { toast('Nothing to undo'); return; }
  state.tasks = JSON.parse(history.pop());
  saveState(); renderAll(); toast('Undone');
}
function addDays(d, n) { const r = new Date(d); r.setDate(r.getDate()+n); return r; }
function startOfWeek(d) { const r = new Date(d); const day = r.getDay(); r.setDate(r.getDate() - day); r.setHours(0,0,0,0); return r; }
function sameDay(a,b) { return isoDate(a) === isoDate(b); }

// ---------- Theme ----------
function applyTheme() {
  document.documentElement.setAttribute('data-theme', state.theme);
}
document.getElementById('themeToggle').addEventListener('click', () => {
  state.theme = state.theme === 'light' ? 'dark' : 'light';
  applyTheme(); saveState(); toast(state.theme === 'dark' ? 'Dark mode' : 'Light mode');
});

// ---------- Projects ----------
function renderProjects() {} // projects used in select only
function projectById(id) { return state.projects.find(p=>p.id===id); }
function populateProjectSelect() {
  const sel = document.getElementById('mProject');
  sel.innerHTML = state.projects.map(p => `<option value="${p.id}">${escapeHtml(p.name)}</option>`).join('') + `<option value="">None</option>`;
}

// ---------- Filtering / views ----------
function filteredTasks() {
  let list = [...state.tasks];
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    list = list.filter(t => (t.title+' '+(t.notes||'')+' '+(t.tags||[]).join(' ')).toLowerCase().includes(q));
  }
  return list;
}
function tasksForDate(iso) { return state.tasks.filter(t => t.date === iso); }
function tasksForView() {
  if (view === 'month') return filteredTasks();
  if (view === 'week') return filteredTasks();
  if (view === 'day') return tasksForDate(isoDate(viewDate)).filter(t => searchQuery ? (t.title+' '+(t.notes||'')).toLowerCase().includes(searchQuery.toLowerCase()) : true);
  if (view === 'agenda') {
    let list = filteredTasks().filter(t => !t.done).sort((a,b) => a.date < b.date ? -1 : a.date > b.date ? 1 : (a.time||'').localeCompare(b.time||''));
    return list;
  }
  return filteredTasks();
}

// ---------- Calendar month ----------
function renderMonth() {
  const y = viewDate.getFullYear(); const m = viewDate.getMonth();
  document.getElementById('cardTitle').textContent = viewDate.toLocaleDateString(undefined, { month:'long', year:'numeric' });
  document.getElementById('cardSub').textContent = 'Click a day to see its tasks';
  const grid = document.createElement('div'); grid.className = 'month-grid';
  const first = new Date(y, m, 1);
  const startWd = first.getDay();
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const prevDays = new Date(y, m, 0).getDate();
  const cells = [];
  for (let i = startWd - 1; i >= 0; i--) cells.push({ date: new Date(y, m-1, prevDays - i), other: true });
  for (let d = 1; d <= daysInMonth; d++) cells.push({ date: new Date(y, m, d), other: false });
  while (cells.length < 42) { const last = cells[cells.length-1].date; const nd = new Date(last); nd.setDate(last.getDate()+1); cells.push({ date: nd, other: true }); }
  const today = isoDate(new Date());
  cells.forEach(c => {
    const iso = isoDate(c.date);
    const tasks = tasksForDate(iso);
    const done = tasks.filter(t=>t.done).length;
    const cell = document.createElement('div');
    cell.className = 'day-cell' + (c.other?' other-month':'') + (iso===today?' today':'') + (iso===selectedDate?' selected':'');
    cell.dataset.date = iso;
    cell.draggable = false;
    let dots = '';
    tasks.slice(0,6).forEach(t => {
      const col = t.project ? (projectById(t.project)?.color || '#999') : 'var(--text-3)';
      dots += `<span class="dot" style="background:${col}"></span>`;
    });
    const preview = tasks.filter(t=>!t.done).slice(0,2).map(t=>escapeHtml(t.title)).join(' · ');
    cell.innerHTML = `
      <div class="day-top">
        <span class="day-num">${c.date.getDate()}</span>
        ${tasks.length ? `<span class="day-count">${done}/${tasks.length}</span>` : ''}
      </div>
      <div class="dots">${dots}</div>
      ${preview ? `<div class="preview">${preview}</div>` : ''}
      ${tasks.length > 2 ? `<div class="more">+${tasks.length-2} more</div>` : ''}
    `;
    cell.addEventListener('click', () => { selectedDate = iso; renderSide(iso); renderMonth(); });
    // drag and drop target
    cell.addEventListener('dragover', e => { e.preventDefault(); cell.classList.add('drag-over'); });
    cell.addEventListener('dragleave', () => cell.classList.remove('drag-over'));
    cell.addEventListener('drop', e => {
      e.preventDefault(); cell.classList.remove('drag-over');
      const id = e.dataTransfer.getData('text/plain');
      const t = state.tasks.find(x=>x.id===id);
      if (t) { pushHistory(); t.date = iso; saveState(); renderAll(); toast('Moved to ' + fmtShort(iso)); }
    });
    grid.appendChild(cell);
  });
  const container = document.getElementById('mainView');
  // weekday header
  const wrap = document.createElement('div'); wrap.style.display='flex'; wrap.style.flexDirection='column'; wrap.style.flex='1'; wrap.style.minHeight='0';
  const wd = document.createElement('div'); wd.className = 'weekday-row';
  ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(d => { const e = document.createElement('div'); e.className='weekday'; e.textContent=d; wd.appendChild(e); });
  wrap.appendChild(wd);
  const gwrap = document.createElement('div'); gwrap.style.flex='1'; gwrap.style.minHeight='0'; gwrap.style.display='flex'; gwrap.style.flexDirection='column';
  gwrap.appendChild(grid);
  wrap.appendChild(gwrap);
  container.innerHTML = '';
  container.appendChild(wrap);
}

// ---------- Week view ----------
function renderWeek() {
  const start = startOfWeek(viewDate);
  const days = Array.from({length:7}, (_,i) => addDays(start, i));
  document.getElementById('cardTitle').textContent = `${fmtShort(isoDate(days[0]))} – ${fmtShort(isoDate(days[6]))}`;
  document.getElementById('cardSub').textContent = 'Week view · drag tasks to reschedule';
  const container = document.getElementById('mainView');
  container.innerHTML = '';
  const grid = document.createElement('div'); grid.className = 'week-grid';
  // header row
  const corner = document.createElement('div'); corner.className = 'week-corner'; grid.appendChild(corner);
  days.forEach(d => {
    const h = document.createElement('div'); h.className = 'week-day-head' + (sameDay(d,new Date())?' today':'');
    h.innerHTML = `<div class="week-day-name">${d.toLocaleDateString(undefined,{weekday:'short'})}</div><div class="week-day-num">${d.getDate()}</div>`;
    grid.appendChild(h);
  });
  // hours 0-23 but show 6-22
  for (let h = 6; h <= 22; h++) {
    const t = document.createElement('div'); t.className = 'week-time'; t.textContent = `${String(h).padStart(2,'0')}:00`; grid.appendChild(t);
    days.forEach(d => {
      const iso = isoDate(d);
      const cell = document.createElement('div'); cell.className = 'week-cell'; cell.dataset.date = iso; cell.dataset.hour = h;
      // place events whose time hour matches
      const dayTasks = tasksForDate(iso).filter(t => t.time && parseInt(t.time.split(':')[0]) === h);
      dayTasks.forEach(t => {
        const ev = document.createElement('div');
        ev.className = 'week-event' + (t.done?' done':'');
        ev.draggable = true;
        ev.dataset.id = t.id;
        ev.innerHTML = `<div>${escapeHtml(t.title)}</div><div class="ev-time">${t.time}${t.timeEnd?'–'+t.timeEnd:''}</div>`;
        ev.addEventListener('dragstart', e => { e.dataTransfer.setData('text/plain', t.id); ev.style.opacity = '0.5'; });
        ev.addEventListener('dragend', () => ev.style.opacity = '1');
        ev.addEventListener('click', () => openModal(t.id));
        cell.appendChild(ev);
      });
      cell.addEventListener('dragover', e => e.preventDefault());
      cell.addEventListener('drop', e => {
        e.preventDefault();
        const id = e.dataTransfer.getData('text/plain');
        const tk = state.tasks.find(x=>x.id===id);
        if (tk) { pushHistory(); tk.date = iso; tk.time = `${String(h).padStart(2,'0')}:00`; saveState(); renderAll(); toast('Rescheduled'); }
      });
      grid.appendChild(cell);
    });
  }
  container.appendChild(grid);
}

// ---------- Day view ----------
function renderDay() {
  const iso = isoDate(viewDate);
  document.getElementById('cardTitle').textContent = viewDate.toLocaleDateString(undefined, { weekday:'long', month:'long', day:'numeric' });
  document.getElementById('cardSub').textContent = 'Day timeline';
  const container = document.getElementById('mainView');
  container.innerHTML = '';
  const tl = document.createElement('div'); tl.className = 'day-timeline';
  const dayTasks = tasksForDate(iso).sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'));
  // all-day / no-time first
  const noTime = dayTasks.filter(t=>!t.time);
  if (noTime.length) {
    const g = document.createElement('div'); g.style.marginBottom='12px';
    g.innerHTML = `<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text-3);margin-bottom:6px">All day</div>`;
    noTime.forEach(t => g.appendChild(makeTimelineEvent(t)));
    tl.appendChild(g);
  }
  for (let h = 6; h <= 22; h++) {
    const row = document.createElement('div'); row.className = 'timeline-row';
    const time = document.createElement('div'); time.className = 'timeline-time'; time.textContent = `${String(h).padStart(2,'0')}:00`;
    const slot = document.createElement('div'); slot.className = 'timeline-slot';
    const hourTasks = dayTasks.filter(t => t.time && parseInt(t.time.split(':')[0]) === h);
    hourTasks.forEach(t => slot.appendChild(makeTimelineEvent(t)));
    row.appendChild(time); row.appendChild(slot);
    tl.appendChild(row);
  }
  container.appendChild(tl);
}
function makeTimelineEvent(t) {
  const el = document.createElement('div');
  el.className = 'timeline-event' + (t.done?' done':'');
  el.style.borderLeftColor = t.project ? (projectById(t.project)?.color || 'var(--accent)') : 'var(--text-3)';
  el.innerHTML = `<div class="te-title">${escapeHtml(t.title)}</div><div class="te-meta">${t.time||'All day'}${t.notes?' · '+escapeHtml(t.notes):''}</div>`;
  el.addEventListener('click', () => openModal(t.id));
  return el;
}

// ---------- Agenda view ----------
function renderAgenda() {
  document.getElementById('cardTitle').textContent = 'Agenda';
  document.getElementById('cardSub').textContent = 'Upcoming tasks';
  const container = document.getElementById('mainView');
  container.innerHTML = '';
  const ag = document.createElement('div'); ag.className = 'agenda';
  const list = tasksForView();
  // group by date
  const groups = {};
  list.forEach(t => { (groups[t.date] = groups[t.date] || []).push(t); });
  const dates = Object.keys(groups).sort();
  if (!dates.length) {
    ag.innerHTML = `<div class="empty-state"><div class="empty-ico">✦</div><div class="empty-title">No upcoming tasks</div><div class="empty-sub">You're all caught up.</div></div>`;
    container.appendChild(ag); return;
  }
  dates.forEach(d => {
    const g = document.createElement('div');
    const dd = parseDate(d);
    g.innerHTML = `<div class="agenda-group-title">${dd.toLocaleDateString(undefined,{weekday:'long', month:'long', day:'numeric'})}</div>`;
    const inner = document.createElement('div'); inner.style.display='flex'; inner.style.flexDirection='column'; inner.style.gap='8px';
    groups[d].forEach(t => {
      const item = document.createElement('div'); item.className = 'agenda-item';
      item.innerHTML = `
        <div class="agenda-date"><div class="ad-day">${dd.getDate()}</div><div class="ad-mon">${dd.toLocaleDateString(undefined,{month:'short'})}</div></div>
        <div class="agenda-body">
          <div class="agenda-title">${escapeHtml(t.title)}</div>
          <div class="agenda-meta">
            ${t.time?`<span class="badge badge-time">⏰ ${t.time}</span>`:''}
            <span class="badge badge-priority-${t.priority||'med'}">${t.priority||'med'}</span>
            ${t.project?`<span class="badge badge-project">${escapeHtml(projectById(t.project)?.name||'')}</span>`:''}
            ${(t.tags||[]).map(tag=>`<span class="badge badge-tag">#${escapeHtml(tag)}</span>`).join('')}
          </div>
        </div>
      `;
      item.addEventListener('click', () => openModal(t.id));
      inner.appendChild(item);
    });
    g.appendChild(inner);
    ag.appendChild(g);
  });
  container.appendChild(ag);
}

// ---------- Insights view ----------
function renderInsights() {
  document.getElementById('cardTitle').textContent = 'Insights';
  document.getElementById('cardSub').textContent = 'Your productivity at a glance';
  const container = document.getElementById('mainView');
  container.innerHTML = '';
  const ins = document.createElement('div'); ins.className = 'insights';
  const total = state.tasks.length;
  const done = state.tasks.filter(t=>t.done).length;
  const today = isoDate(new Date());
  const todayTasks = state.tasks.filter(t=>t.date===today);
  const todayDone = todayTasks.filter(t=>t.done).length;
  const overdue = state.tasks.filter(t=>!t.done && t.date < today).length;
  const streak = computeStreak();
  ins.innerHTML = `
    <div class="stat-card"><div class="stat-label">Total tasks</div><div class="stat-value">${total}</div><div class="stat-sub">${done} completed</div></div>
    <div class="stat-card"><div class="stat-label">Completion rate</div><div class="stat-value">${total?Math.round(done/total*100):0}%</div><div class="stat-sub">All time</div></div>
    <div class="stat-card"><div class="stat-label">Today</div><div class="stat-value">${todayDone}/${todayTasks.length}</div><div class="stat-sub">${overdue} overdue</div></div>
    <div class="stat-card"><div class="stat-label">Streak</div><div class="stat-value">${streak}</div><div class="stat-sub">days in a row</div></div>
    <div class="stat-card heatmap">
      <div class="stat-label">Activity (last 12 weeks)</div>
      <div class="heatmap-grid" id="heatmap"></div>
    </div>
    <div class="stat-card">
      <div class="stat-label">By project</div>
      <div id="projBars"></div>
    </div>
  `;
  // heatmap
  const hm = ins.querySelector('#heatmap');
  const counts = {};
  state.tasks.forEach(t => { if (t.done) counts[t.date] = (counts[t.date]||0)+1; });
  const end = new Date(); end.setHours(0,0,0,0);
  const start = addDays(end, -53*7+1);
  // align to sunday
  while (start.getDay() !== 0) start.setDate(start.getDate()-1);
  let cur = new Date(start);
  while (cur <= end) {
    const iso = isoDate(cur);
    const c = counts[iso] || 0;
    const cell = document.createElement('div');
    let cls = '';
    if (c >= 1 && c <= 1) cls = 'heat-1';
    else if (c === 2) cls = 'heat-2';
    else if (c === 3) cls = 'heat-3';
    else if (c >= 4) cls = 'heat-4';
    cell.className = 'heat-cell ' + cls;
    cell.title = `${iso}: ${c} done`;
    hm.appendChild(cell);
    cur.setDate(cur.getDate()+1);
  }
  // project bars
  const pb = ins.querySelector('#projBars');
  state.projects.forEach(p => {
    const n = state.tasks.filter(t=>t.project===p.id).length;
    const dn = state.tasks.filter(t=>t.project===p.id && t.done).length;
    const pct = n ? Math.round(dn/n*100) : 0;
    const row = document.createElement('div'); row.className = 'bar-row';
    row.innerHTML = `<span class="bar-label">${escapeHtml(p.name)}</span><div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${p.color}"></div></div><span class="bar-val">${dn}/${n}</span>`;
    pb.appendChild(row);
  });
  container.appendChild(ins);
}
function computeStreak() {
  let streak = 0;
  const d = new Date(); d.setHours(0,0,0,0);
  // count consecutive days (going back) with at least one completed task
  while (true) {
    const iso = isoDate(d);
    const has = state.tasks.some(t => t.date === iso && t.done);
    if (!has) break;
    streak++;
    d.setDate(d.getDate()-1);
    if (streak > 365) break;
  }
  return streak;
}

// ---------- Side panel ----------
function renderSide(iso) {
  iso = iso || selectedDate;
  const tasks = tasksForDate(iso).sort((a,b) => (a.time||'99:99').localeCompare(b.time||'99:99'));
  document.getElementById('sideTitle').textContent = parseDate(iso).toLocaleDateString(undefined, { weekday:'long', month:'short', day:'numeric' });
  document.getElementById('sideSub').textContent = `${tasks.length} task${tasks.length===1?'':'s'}`;
  const total = tasks.length; const done = tasks.filter(t=>t.done).length;
  const pct = total ? Math.round(done/total*100) : 0;
  document.getElementById('progressPct').textContent = pct + '%';
  document.getElementById('progressFill').style.width = pct + '%';
  const wrap = document.getElementById('taskList');
  if (tasks.length === 0) {
    wrap.innerHTML = `<div class="empty-state"><div class="empty-ico">✦</div><div class="empty-title">No tasks</div><div class="empty-sub">Add one with <b>N</b> or drag from another day.</div></div>`;
    return;
  }
  wrap.innerHTML = '';
  tasks.forEach(t => {
    const item = document.createElement('div');
    item.className = 'task-item' + (t.done?' done':'');
    item.draggable = true;
    item.dataset.id = t.id;
    const proj = t.project ? projectById(t.project) : null;
    const subHtml = (t.subtasks||[]).map((s,i) => `
      <div class="subtask ${s.done?'done':''}">
        <div class="cb ${s.done?'checked':''}" data-sub="${t.id}" data-idx="${i}"></div>
        <span>${escapeHtml(s.title)}</span>
      </div>`).join('');
    item.innerHTML = `
      <div class="checkbox ${t.done?'checked':''}" data-id="${t.id}"></div>
      <div class="task-body">
        <div class="task-title">${escapeHtml(t.title)}</div>
        ${t.notes ? `<div class="task-notes">${escapeHtml(t.notes)}</div>` : ''}
        <div class="task-meta">
          ${t.time ? `<span class="badge badge-time">⏰ ${t.time}</span>` : ''}
          <span class="badge badge-priority-${t.priority||'med'}">${t.priority||'med'}</span>
          ${proj ? `<span class="badge badge-project">${escapeHtml(proj.name)}</span>` : ''}
          ${(t.tags||[]).map(tag=>`<span class="badge badge-tag">#${escapeHtml(tag)}</span>`).join('')}
          ${t.repeat ? `<span class="badge badge-time">↻ ${t.repeat}</span>` : ''}
        </div>
        ${subHtml ? `<div style="margin-top:6px">${subHtml}</div>` : ''}
      </div>
      <div class="task-actions">
        <button class="task-action" data-edit="${t.id}" title="Edit">✎</button>
        <button class="task-action danger" data-del="${t.id}" title="Delete">✕</button>
      </div>
    `;
    item.addEventListener('dragstart', e => { e.dataTransfer.setData('text/plain', t.id); item.style.opacity = '0.5'; });
    item.addEventListener('dragend', () => item.style.opacity = '1');
    wrap.appendChild(item);
  });
  // bind
  wrap.querySelectorAll('.checkbox').forEach(cb => {
    cb.addEventListener('click', () => {
      const t = state.tasks.find(x=>x.id===cb.dataset.id);
      if (!t) return; pushHistory(); t.done = !t.done; saveState(); renderAll(); toast(t.done?'Done':'Reopened');
    });
  });
  wrap.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', () => openModal(b.dataset.edit)));
  wrap.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => {
    pushHistory(); state.tasks = state.tasks.filter(x=>x.id!==b.dataset.del); saveState(); renderAll(); toast('Deleted');
  }));
  wrap.querySelectorAll('[data-sub]').forEach(cb => {
    cb.addEventListener('click', () => {
      const tid = cb.dataset.sub; const idx = parseInt(cb.dataset.idx);
      const t = state.tasks.find(x=>x.id===tid); if (!t || !t.subtasks) return;
      pushHistory(); t.subtasks[idx].done = !t.subtasks[idx].done; saveState(); renderSide(iso);
    });
  });
}

// ---------- Modal ----------
function openModal(id) {
  editingId = id || null;
  const t = id ? state.tasks.find(x=>x.id===id) : null;
  document.getElementById('modalTitle').textContent = id ? 'Edit task' : 'New task';
  document.getElementById('mTitle').value = t ? t.title : '';
  document.getElementById('mNotes').value = t ? (t.notes||'') : '';
  document.getElementById('mDate').value = t ? t.date : selectedDate;
  document.getElementById('mTime').value = t ? (t.time||'') : '';
  document.getElementById('mPriority').value = t ? (t.priority||'med') : 'med';
  document.getElementById('mRepeat').value = t ? (t.repeat||'') : '';
  populateProjectSelect();
  document.getElementById('mProject').value = t ? (t.project||'') : '';
  document.getElementById('mTags').value = t ? (t.tags||[]).join(', ') : '';
  subtasksDraft = t ? JSON.parse(JSON.stringify(t.subtasks||[])) : [];
  renderSubtasksEditor();
  document.getElementById('modalDelete').style.display = id ? 'inline-block' : 'none';
  document.getElementById('modalBackdrop').classList.add('open');
  setTimeout(()=>document.getElementById('mTitle').focus(), 50);
}
function closeModal() {
  document.getElementById('modalBackdrop').classList.remove('open');
  editingId = null;
}
function renderSubtasksEditor() {
  const wrap = document.getElementById('subtasksEditor');
  wrap.innerHTML = '';
  subtasksDraft.forEach((s, i) => {
    const row = document.createElement('div'); row.className = 'subtask-row';
    row.innerHTML = `<input value="${escapeHtml(s.title)}" placeholder="Subtask" data-i="${i}" /><button data-rm="${i}">✕</button>`;
    row.querySelector('input').addEventListener('input', e => { subtasksDraft[i].title = e.target.value; });
    row.querySelector('button').addEventListener('click', () => { subtasksDraft.splice(i,1); renderSubtasksEditor(); });
    wrap.appendChild(row);
  });
}
document.getElementById('addSubtaskBtn').addEventListener('click', () => { subtasksDraft.push({ title: '', done: false }); renderSubtasksEditor(); });
document.getElementById('addTaskBtn').addEventListener('click', () => openModal(null));
document.getElementById('modalClose').addEventListener('click', closeModal);
document.getElementById('modalCancel').addEventListener('click', closeModal);
document.getElementById('modalBackdrop').addEventListener('click', e => { if (e.target.id === 'modalBackdrop') closeModal(); });
document.getElementById('modalDelete').addEventListener('click', () => {
  if (!editingId) return;
  pushHistory(); state.tasks = state.tasks.filter(x=>x.id!==editingId); saveState(); closeModal(); renderAll(); toast('Deleted');
});
document.getElementById('modalSave').addEventListener('click', () => {
  const title = document.getElementById('mTitle').value.trim();
  if (!title) { toast('Title required'); return; }
  const tags = document.getElementById('mTags').value.split(',').map(s=>s.trim()).filter(Boolean);
  const payload = {
    title,
    notes: document.getElementById('mNotes').value.trim(),
    date: document.getElementById('mDate').value || isoDate(new Date()),
    time: document.getElementById('mTime').value,
    priority: document.getElementById('mPriority').value,
    repeat: document.getElementById('mRepeat').value || null,
    project: document.getElementById('mProject').value || null,
    tags,
    subtasks: subtasksDraft.filter(s=>s.title.trim()).map(s=>({title:s.title.trim(), done: !!s.done})),
  };
  pushHistory();
  if (editingId) {
    const t = state.tasks.find(x=>x.id===editingId);
    Object.assign(t, payload);
    toast('Task updated');
  } else {
    state.tasks.push({ id: uid(), done: false, createdAt: Date.now(), ...payload });
    toast('Task added');
  }
  saveState();
  selectedDate = payload.date;
  closeModal();
  renderAll();
});

// ---------- Navigation ----------
function shiftView(delta) {
  if (view === 'month') { viewDate.setMonth(viewDate.getMonth()+delta); }
  else if (view === 'week') { viewDate.setDate(viewDate.getDate() + delta*7); }
  else if (view === 'day') { viewDate.setDate(viewDate.getDate() + delta); }
  renderMain();
}
document.getElementById('prevBtn').addEventListener('click', () => shiftView(-1));
document.getElementById('nextBtn').addEventListener('click', () => shiftView(1));
document.getElementById('todayBtn').addEventListener('click', () => {
  viewDate = new Date(); selectedDate = isoDate(new Date());
  if (view === 'month' || view === 'week' || view === 'day') renderAll(); else { view = 'month'; setView('month'); }
});

// view tabs
function setView(v) {
  view = v;
  document.querySelectorAll('.view-tab').forEach(x => x.classList.toggle('active', x.dataset.view === v));
  // content layout
  const content = document.getElementById('content');
  if (v === 'insights') content.classList.add('single'); else content.classList.remove('single');
  renderAll();
}
document.querySelectorAll('.view-tab').forEach(b => b.addEventListener('click', () => setView(b.dataset.view)));

function renderMain() {
  const mv = document.getElementById('mainView');
  mv.innerHTML = '';
  if (view === 'month') renderMonth();
  else if (view === 'week') renderWeek();
  else if (view === 'day') renderDay();
  else if (view === 'agenda') renderAgenda();
  else if (view === 'insights') renderInsights();
}

function renderAll() {
  applyTheme();
  renderMain();
  renderSide(selectedDate);
  // update counts in side? already
}

// ---------- Search ----------
document.getElementById('search').addEventListener('input', e => {
  searchQuery = e.target.value; renderAll();
});

// ---------- Command palette ----------
function openCmd() {
  document.getElementById('cmdBackdrop').classList.add('open');
  const inp = document.getElementById('cmdInput'); inp.value = ''; cmdQuery = ''; renderCmdList();
  setTimeout(()=>inp.focus(), 50);
}
function closeCmd() { document.getElementById('cmdBackdrop').classList.remove('open'); }
function renderCmdList() {
  const list = document.getElementById('cmdList');
  const q = cmdQuery.toLowerCase();
  const items = [];
  // actions
  const actions = [
    { ico: '＋', title: 'New task', sub: 'Create a task', run: () => { closeCmd(); openModal(null); } },
    { ico: '◐', title: 'Toggle theme', sub: 'Switch light/dark', run: () => { closeCmd(); document.getElementById('themeToggle').click(); } },
    { ico: 'Cal', title: 'Month view', sub: 'Switch view', run: () => { closeCmd(); setView('month'); } },
    { ico: 'Wk', title: 'Week view', sub: 'Switch view', run: () => { closeCmd(); setView('week'); } },
    { ico: 'Dy', title: 'Day view', sub: 'Switch view', run: () => { closeCmd(); setView('day'); } },
    { ico: 'Ag', title: 'Agenda view', sub: 'Switch view', run: () => { closeCmd(); setView('agenda'); } },
    { ico: '📊', title: 'Insights', sub: 'Switch view', run: () => { closeCmd(); setView('insights'); } },
    { ico: '↪', title: 'Undo', sub: 'Undo last action', run: () => { closeCmd(); undo(); } },
    { ico: '⬇', title: 'Export data', sub: 'Download JSON', run: () => { closeCmd(); exportData(); } },
    { ico: '⬆', title: 'Import data', sub: 'Load JSON', run: () => { closeCmd(); document.getElementById('importFile').click(); } },
  ];
  actions.forEach(a => { if (!q || a.title.toLowerCase().includes(q)) items.push({ type:'action', ...a }); });
  // tasks
  state.tasks.forEach(t => {
    if (!q || t.title.toLowerCase().includes(q) || (t.notes||'').toLowerCase().includes(q)) {
      items.push({ type:'task', ico: t.done?'✓':'○', title: t.title, sub: `${t.date}${t.time?' · '+t.time:''}`, run: () => { closeCmd(); selectedDate = t.date; openModal(t.id); } });
    }
  });
  // group
  let html = '';
  const actionItems = items.filter(i=>i.type==='action');
  const taskItems = items.filter(i=>i.type==='task');
  if (actionItems.length) {
    html += `<div class="cmd-group">Actions</div>`;
    actionItems.forEach((it, idx) => {
      html += `<div class="cmd-item" data-idx="${idx}"><div class="ci-ico">${it.ico}</div><div><div class="ci-title">${escapeHtml(it.title)}</div><div class="ci-sub">${escapeHtml(it.sub)}</div></div></div>`;
    });
  }
  if (taskItems.length) {
    html += `<div class="cmd-group">Tasks</div>`;
    taskItems.slice(0,20).forEach((it, idx) => {
      const i = actionItems.length + idx;
      html += `<div class="cmd-item" data-idx="${i}"><div class="ci-ico">${it.ico}</div><div><div class="ci-title">${escapeHtml(it.title)}</div><div class="ci-sub">${escapeHtml(it.sub)}</div></div></div>`;
    });
  }
  if (!items.length) html = `<div style="padding:20px;text-align:center;color:var(--text-3);font-size:13px">No results</div>`;
  list.innerHTML = html;
  list.querySelectorAll('.cmd-item').forEach((el, i) => {
    el.addEventListener('click', () => items[i].run());
    el.addEventListener('mouseenter', () => { cmdActive = i; highlightCmd(); });
  });
  cmdActive = 0; highlightCmd();
  // store items for keyboard
  list._items = items;
}
function highlightCmd() {
  document.querySelectorAll('#cmdList .cmd-item').forEach((el, i) => el.classList.toggle('active', i === cmdActive));
}
document.getElementById('cmdInput').addEventListener('input', e => { cmdQuery = e.target.value; renderCmdList(); });
document.getElementById('cmdBackdrop').addEventListener('click', e => { if (e.target.id === 'cmdBackdrop') closeCmd(); });
document.getElementById('cmdInput').addEventListener('keydown', e => {
  const items = document.getElementById('cmdList')._items || [];
  if (e.key === 'ArrowDown') { e.preventDefault(); cmdActive = Math.min(items.length-1, cmdActive+1); highlightCmd(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); cmdActive = Math.max(0, cmdActive-1); highlightCmd(); }
  else if (e.key === 'Enter') { e.preventDefault(); if (items[cmdActive]) items[cmdActive].run(); }
  else if (e.key === 'Escape') closeCmd();
});

// ---------- Export / import ----------
function exportData() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = 'lumina-backup.json'; a.click();
  URL.revokeObjectURL(url);
  toast('Exported');
}
const importInput = document.createElement('input'); importInput.type = 'file'; importInput.id = 'importFile'; importInput.accept = 'application/json'; importInput.style.display = 'none';
document.body.appendChild(importInput);
importInput.addEventListener('change', e => {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      pushHistory();
      state.projects = data.projects || state.projects;
      state.tasks = data.tasks || state.tasks;
      state.theme = data.theme || state.theme;
      saveState(); renderAll(); toast('Imported');
    } catch (err) { toast('Invalid file'); }
  };
  reader.readAsText(file);
  importInput.value = '';
});

// ---------- Shortcuts overlay ----------
document.getElementById('shortcutsBtn').addEventListener('click', () => document.getElementById('scBackdrop').classList.add('open'));
document.getElementById('scClose').addEventListener('click', () => document.getElementById('scBackdrop').classList.remove('open'));
document.getElementById('scBackdrop').addEventListener('click', e => { if (e.target.id === 'scBackdrop') document.getElementById('scBackdrop').classList.remove('open'); });

// ---------- Keyboard ----------
let gPressed = false;
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') {
    if (e.key === 'Escape') { if (document.getElementById('modalBackdrop').classList.contains('open')) closeModal(); if (document.getElementById('cmdBackdrop').classList.contains('open')) closeCmd(); }
    return;
  }
  if (e.key === 'Escape') { closeModal(); closeCmd(); document.getElementById('scBackdrop').classList.remove('open'); return; }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openCmd(); return; }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); return; }
  if (e.key === 'n' || e.key === 'N') { e.preventDefault(); openModal(null); return; }
  if (e.key === 't' || e.key === 'T') { state.theme = state.theme === 'light' ? 'dark' : 'light'; applyTheme(); saveState(); toast(state.theme==='dark'?'Dark mode':'Light mode'); return; }
  if (e.key === '?') { document.getElementById('scBackdrop').classList.add('open'); return; }
  if (e.key === 'g') { gPressed = true; setTimeout(()=>gPressed=false, 1200); return; }
  if (gPressed && (e.key === 't' || e.key === 'T')) { gPressed = false; viewDate = new Date(); selectedDate = isoDate(new Date()); if (view !== 'month') setView('month'); else renderAll(); toast('Today'); return; }
  if (e.key === 'ArrowLeft') { shiftView(-1); return; }
  if (e.key === 'ArrowRight') { shiftView(1); return; }
});

// ---------- Mobile side panel toggle (tap main card title area) ----------
// (side panel fixed on small screens; provide a toggle via clicking card title)
document.getElementById('cardTitle').addEventListener('click', () => {
  if (window.innerWidth <= 980) document.getElementById('sidePanel').classList.toggle('open');
});

    { id: uid(), title: 'Team standup', notes: 'Share progress and blockers.', date: today, time: '10:30', priority: 'med', project: 'p2', tags: [], subtasks: [], done: false, createdAt: Date.now() },

    { id: uid(), title: 'Review pull requests', notes: '', date: tomorrow, time: '11:00', priority: 'med', project: 'p2', tags: [], subtasks: [], done: false, createdAt: Date.now() },
  ];
  saveState();
}
viewDate = new Date();
selectedDate = isoDate(new Date());
renderAll();
