<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mini Mario</title>
<style>
  html,body{margin:0;height:100%;background:#1b1b1f;display:flex;align-items:center;justify-content:center;font-family:monospace}
  #wrap{position:relative}
  canvas{background:#5c94fc;display:block;border:4px solid #000;image-rendering:pixelated}
  #hud{position:absolute;top:8px;left:12px;color:#fff;font-size:16px;text-shadow:2px 2px 0 #000;pointer-events:none}
  #msg{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;
       color:#fff;font-size:26px;text-shadow:3px 3px 0 #000;background:rgba(0,0,0,.55)}
  #msg button{margin-top:14px;font-size:16px;padding:8px 18px;cursor:pointer;font-family:monospace}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="800" height="480"></canvas>
  <div id="hud">SCORE 0 &nbsp; LIVES 3</div>
  <div id="msg"><span id="msgText"></span><button id="again">PLAY AGAIN</button></div>
</div>

<script>
const cv = document.getElementById('game'), ctx = cv.getContext('2d');
const hud = document.getElementById('hud'), msg = document.getElementById('msg'),
      msgText = document.getElementById('msgText'), again = document.getElementById('again');
const W = 800, H = 480, TILE = 32, GRAV = 0.55;

const keys = {};
addEventListener('keydown', e => { keys[e.code] = true; if(['Space','ArrowUp','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault(); });
addEventListener('keyup',   e => keys[e.code] = false);

let level, player, coins, enemies, particles, camera, score, lives, state, tick;

// ---- Level: '#' ground, 'B' brick, '?' question block, 'o' coin, 'E' enemy, 'F' flag, 'P' pipe
const MAP = [
"                                                                                                                                 ",
"                                                                                                                                 ",
"                                                                                                          F                 ",
"                                                                                                         ###                ",
"        o o o                                                                                       ###                  ",
"       #####                                   o o                        o o o                          E                  ",
"                                              ####            ?          #####     E          E     ####      o o       ",
"             ?                                         ####   ###                                  ####   ####    ####    ",
"    o                          E E                                       o o o                                  ####    ",
"   ####        ####          #######         ####          ####        ########       E    E                     ####    ",
"                                   ####    ####    #### ####    ####  ###########  ############  E E E          #########  ",
"                                                                                                                   ",
"################################################################################################################################",
"################################################################################################################################"
];

function buildLevel() {
  level = []; coins = []; enemies = []; particles = []; tick = 0;
  const rows = MAP;
  for (let y = 0; y < rows.length; y++) {
    level[y] = [];
    for (let x = 0; x < rows[y].length; x++) {
      const c = rows[y][x];
      level[y][x] = '#B?F'.includes(c) ? c : ' ';
      if (c === 'o') coins.push({ x: x*TILE + 8, y: y*TILE + 8, w: 16, h: 16, got: false, ph: Math.random()*6 });
      if (c === 'E') enemies.push({ x: x*TILE, y: y*TILE, w: 26, h: 26, vx: -1.2, vy: 0, dead: 0 });
    }
  }
  player = { x: 60, y: 200, w: 22, h: 28, vx: 0, vy: 0, onGround: false, face: 1, jumpHeld: false, inv: 0 };
  camera = { x: 0 }; score = 0; lives = 3; state = 'play';
}

function solid(x, y) {
  const tx = Math.floor(x/TILE), ty = Math.floor(y/TILE);
  if (ty < 0 || ty >= level.length || tx < 0 || tx >= level[0].length) return false;
  return level[ty][tx] !== ' ';
}

function rectHits(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }

function moveAxis(obj, dx, dy) {
  // horizontal
  obj.x += dx;
  if (dx > 0) {
    for (let y = obj.y; y < obj.y + obj.h; y += TILE/2)
      if (solid(obj.x + obj.w, y)) { obj.x = Math.floor((obj.x + obj.w)/TILE)*TILE - obj.w - 0.01; obj.vx = 0; break; }
  } else if (dx < 0) {
    for (let y = obj.y; y < obj.y + obj.h; y += TILE/2)
      if (solid(obj.x, y)) { obj.x = Math.floor(obj.x/TILE)*TILE + TILE; obj.vx = 0; break; }
  }
  // vertical
  obj.y += dy;
  obj.onGround = false;
  if (dy > 0) {
    for (let x = obj.x; x < obj.x + obj.w; x += TILE/2)
      if (solid(x, obj.y + obj.h)) { obj.y = Math.floor((obj.y + obj.h)/TILE)*TILE - obj.h - 0.01; obj.vy = 0; obj.onGround = true; break; }
  } else if (dy < 0) {
    for (let x = obj.x; x < obj.x + obj.w; x += TILE/2)
      if (solid(x, obj.y)) {
        obj.y = Math.floor(obj.y/TILE)*TILE + TILE; obj.vy = 0;
        // bump block above (question/brick)
        const tx = Math.floor((x)/TILE), ty = Math.floor(obj.y/TILE) - 1;
        if (ty >= 0 && tx >= 0 && tx < level[0].length && (level[ty][tx] === '?' || level[ty][tx] === 'B')) {
          if (level[ty][tx] === '?') {
            level[ty][tx] = 'B'; score += 100;
            for (let i=0;i<6;i++) particles.push({x:tx*TILE+16,y:ty*TILE,vx:(Math.random()-.5)*4,vy:-Math.random()*5-1,life:40,c:'#ffd700'});
          } else {
            level[ty][tx] = ' ';
            for (let i=0;i<8;i++) particles.push({x:tx*TILE+16,y:ty*TILE+16,vx:(Math.random()-.5)*5,vy:-Math.random()*5-1,life:40,c:'#a0522d'});
          }
        }
        break;
      }
  }
}

function update() {
  tick++;
  if (state !== 'play') return;

  // --- player input
  const p = player, spd = 0.7, max = 4.2;
  if (keys.ArrowLeft || keys.KeyA) { p.vx -= spd; p.face = -1; }
  if (keys.ArrowRight || keys.KeyD) { p.vx += spd; p.face = 1; }
  if (!(keys.ArrowLeft || keys.KeyA || keys.ArrowRight || keys.KeyD)) p.vx *= 0.82;
  p.vx = Math.max(-max, Math.min(max, p.vx));
  if ((keys.Space || keys.ArrowUp || keys.KeyW)) {
    if (p.onGround && !p.jumpHeld) { p.vy = -11.5; p.jumpHeld = true; }
    if (p.vy < -3) p.vy -= 0.28;      // variable jump height
  } else p.jumpHeld = false;

  p.vy = Math.min(p.vy + GRAV, 14);
  moveAxis(p, p.vx, 0);
  moveAxis(p, 0, p.vy);
  if (p.inv > 0) p.inv--;

  // fell off
  if (p.y > H + 100) loseLife();

  // --- coins
  for (const c of coins) {
    if (!c.got && rectHits(p, c)) {
      c.got = true; score += 200;
      for (let i=0;i<8;i++) particles.push({x:c.x+8,y:c.y+8,vx:(Math.random()-.5)*3,vy:(Math.random()-.5)*3,life:25,c:'#ffe44d'});
    }
  }

  // --- enemies
  for (const e of enemies) {
    if (e.dead) { e.dead++; continue; }
    e.vy = Math.min(e.vy + GRAV, 14);
    // turn at walls / ledge
    const aheadX = e.vx > 0 ? e.x + e.w + 1 : e.x - 1;
    if (solid(aheadX, e.y + e.h - 4)) e.vx *= -1;
    if (!solid(aheadX, e.y + e.h + 4) && e.vy === 0) e.vx *= -1;
    moveAxis(e, e.vx, 0);
    moveAxis(e, 0, e.vy);
    if (e.y > H + 200) { e.dead = 1; continue; }

    if (rectHits(p, e)) {
      if (p.vy > 0 && p.y + p.h - p.vy <= e.y + 8) {  // stomp
        e.dead = 1; p.vy = -9; score += 300;
        for (let i=0;i<8;i++) particles.push({x:e.x+13,y:e.y+13,vx:(Math.random()-.5)*4,vy:-Math.random()*4,life:30,c:'#8b4513'});
      } else if (p.inv === 0) {
        loseLife();
      }
    }
  }

  // --- particles
  for (const pt of particles) { pt.x += pt.vx; pt.y += pt.vy; pt.vy += 0.25; pt.life--; }
  particles = particles.filter(pt => pt.life > 0);

  // --- flag / win
  const flagX = 97 * TILE;
  if (p.x + p.w > flagX) { state = 'win'; score += 1000; show('YOU WIN!  SCORE ' + score); }

  // --- camera
  camera.x = Math.max(0, Math.min(p.x - W/2 + 100, level[0].length*TILE - W));

  hud.textContent = `SCORE ${score}   LIVES ${lives}`;
}

function loseLife() {
  lives--;
  if (lives <= 0) { state = 'over'; show('GAME OVER  SCORE ' + score); return; }
  player.x = 60; player.y = 200; player.vx = player.vy = 0; player.inv = 90;
  camera.x = 0;
}

function show(t) { msgText.textContent = t; msg.style.display = 'flex'; }
again.onclick = () => { msg.style.display = 'none'; buildLevel(); };

// ---- drawing
function draw() {
  ctx.save();
  ctx.translate(-Math.floor(camera.x), 0);

  // tiles
  for (let y = 0; y < level.length; y++) for (let x = 0; x < level[0].length; x++) {
    const c = level[y][x]; if (c === ' ') continue;
    const px = x*TILE, py = y*TILE;
    if (c === '#') {
      ctx.fillStyle = (y > 0 && level[y-1][x] === ' ') ? '#4a8c2a' : '#8b5a2b';
      ctx.fillRect(px, py, TILE, TILE);
      if (y > 0 && level[y-1][x] !== ' ') { ctx.fillStyle = '#6b4423'; ctx.fillRect(px, py, TILE, 3); }
      ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.strokeRect(px+.5, py+.5, TILE-1, TILE-1);
    } else if (c === 'B') {
      ctx.fillStyle = '#c1663d'; ctx.fillRect(px, py, TILE, TILE);
      ctx.strokeStyle = '#7a3b22'; ctx.strokeRect(px+.5, py+.5, TILE-1, TILE-1);
      ctx.beginPath(); ctx.moveTo(px, py+16); ctx.lineTo(px+32, py+16); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(px+16, py); ctx.lineTo(px+16, py+16); ctx.stroke();
    } else if (c === '?') {
      const glow = 0.6 + 0.4*Math.sin(tick/8);
      ctx.fillStyle = `rgba(255,${160+60*glow|0},0,1)`; ctx.fillRect(px, py, TILE, TILE);
      ctx.strokeStyle = '#7a4b00'; ctx.strokeRect(px+.5, py+.5, TILE-1, TILE-1);
      ctx.fillStyle = '#fff'; ctx.font = 'bold 20px monospace'; ctx.textAlign = 'center';
      ctx.fillText('?', px+16, py+23);
    } else if (c === 'F') {
      ctx.fillStyle = '#ddd'; ctx.fillRect(px+14, py, 4, TILE*14);
      ctx.fillStyle = '#e33'; ctx.beginPath();
      ctx.moveTo(px+18, py+4); ctx.lineTo(px+46, py+14); ctx.lineTo(px+18, py+24); ctx.fill();
    }
  }

  // coins
  for (const c of coins) {
    if (c.got) continue;
    const sq = Math.abs(Math.sin(tick/10 + c.ph));
    ctx.fillStyle = '#ffd700';
    ctx.beginPath(); ctx.ellipse(c.x+8, c.y+8, 8*sq+1, 8, 0, 0, 7); ctx.fill();
    ctx.strokeStyle = '#b8860b'; ctx.stroke();
  }

  // enemies
  for (const e of enemies) {
    if (e.dead > 30) continue;
    ctx.save();
    if (e.dead) { ctx.translate(e.x+13, e.y+26); ctx.scale(1, -0.4); ctx.translate(-e.x-13, -e.y-26); }
    ctx.fillStyle = '#a0522d';
    ctx.beginPath(); ctx.roundRect(e.x, e.y+4, e.w, e.h-4, 8); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.fillRect(e.x+4, e.y+9, 7, 7); ctx.fillRect(e.x+15, e.y+9, 7, 7);
    ctx.fillStyle = '#000';
    ctx.fillRect(e.x+7, e.y+12, 4, 4); ctx.fillRect(e.x+18, e.y+12, 4, 4);
    ctx.fillStyle = '#5c3317'; ctx.fillRect(e.x+2, e.y+e.h-3, 9, 4); ctx.fillRect(e.x+e.w-11, e.y+e.h-3, 9, 4);
    ctx.restore();
  }

  // player (blinking when invulnerable)
  if (!(player.inv > 0 && Math.floor(tick/4) % 2)) {
    const p = player;
    ctx.save();
    ctx.translate(p.x + p.w/2, p.y);
    ctx.scale(p.face, 1);
    // body
    ctx.fillStyle = '#e23b3b'; ctx.fillRect(-9, 6, 18, 14);
    // overalls
    ctx.fillStyle = '#2b5bd7'; ctx.fillRect(-8, 14, 16, 12);
    ctx.fillRect(-8, 10, 4, 6); ctx.fillRect(4, 10, 4, 6);
    // head
    ctx.fillStyle = '#ffcc99'; ctx.fillRect(-8, 0, 16, 9);
    // hat
    ctx.fillStyle = '#e23b3b'; ctx.fillRect(-10, -4, 20, 6); ctx.fillRect(-4, -7, 12, 4);
    // eye
    ctx.fillStyle = '#000'; ctx.fillRect(3, 3, 3, 3);
    // mustache
    ctx.fillRect(2, 7, 7, 2);
    // boots
    ctx.fillStyle = '#3b2314';
    const step = p.onGround && Math.abs(p.vx) > 0.6 ? Math.sin(tick/3)*3 : 0;
    ctx.fillRect(-9 + step, 24, 8, 4); ctx.fillRect(1 - step, 24, 8, 4);
    ctx.restore();
  }

  // particles
  for (const pt of particles) {
    ctx.globalAlpha = Math.max(0, pt.life/30);
    ctx.fillStyle = pt.c; ctx.fillRect(pt.x-3, pt.y-3, 6, 6);
  }
  ctx.globalAlpha = 1;

  ctx.restore();

  // vignette
  ctx.fillStyle = 'rgba(0,0,0,.15)'; ctx.fillRect(0, 0, W, 4);
}

function loop() { update(); draw(); requestAnimationFrame(loop); }
buildLevel(); loop();
</script>
</body>
</html>
