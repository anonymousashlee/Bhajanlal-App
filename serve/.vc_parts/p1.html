<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vice City — Open World</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#05060c; font-family:"Arial Black", Arial, sans-serif; }
  canvas { display:block; width:100%; height:100%; cursor:crosshair; }
  #title {
    position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:radial-gradient(circle at 50% 30%, #2a0f4d 0%, #0b0716 70%);
    z-index:10; text-align:center; transition:opacity .6s;
  }
  #title h1 {
    font-size:min(11vw,96px); font-style:italic; letter-spacing:2px; color:#ff3fa4;
    text-shadow:0 0 24px #ff3fa4, 0 0 60px #7a1fa2, 4px 4px 0 #22d3ee;
  }
  #title h2 { font-size:min(4vw,26px); color:#22d3ee; margin-top:6px; letter-spacing:8px; text-shadow:0 0 14px #22d3ee; }
  #title .keys { margin-top:34px; color:#ffd166; font-size:15px; line-height:1.9; font-family:Arial, sans-serif; font-weight:bold; }
  #title .keys b { color:#fff; background:#ff3fa4; padding:2px 7px; border-radius:4px; }
  #startBtn {
    margin-top:30px; padding:14px 46px; font-size:22px; font-family:"Arial Black",Arial,sans-serif;
    color:#0b0716; background:linear-gradient(90deg,#22d3ee,#ff3fa4); border:none; border-radius:40px;
    cursor:pointer; box-shadow:0 0 30px #ff3fa488; letter-spacing:2px;
  }
  #startBtn:hover { transform:scale(1.05); }
  #msg { position:fixed; top:12%; left:50%; transform:translateX(-50%); color:#fff; font-size:26px;
    text-shadow:0 0 12px #000, 2px 2px 0 #000; z-index:5; text-align:center; pointer-events:none; opacity:0; transition:opacity .3s; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="msg"></div>
<div id="title">
  <h1>VICE CITY</h1>
  <h2>1986 &nbsp;·&nbsp; OPEN WORLD</h2>
  <div class="keys">
    <b>W A S D</b> Move / Drive &nbsp; <b>SHIFT</b> Sprint &nbsp; <b>SPACE</b> Shoot / Brake<br>
    <b>E</b> Enter / Exit vehicle &nbsp; <b>Q</b> Next weapon &nbsp; <b>M</b> Big map &nbsp; <b>R</b> Radio<br>
    Steal cars, run from the cops, complete missions. Welcome to the 80s.
  </div>
  <button id="startBtn">▶ START GAME</button>
</div>
<script>
"use strict";
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W = 0, H = 0;
function resize(){ W = cv.width = innerWidth; H = cv.height = innerHeight; }
addEventListener('resize', resize); resize();

// ---------- utils ----------
const rnd = (a,b)=> a + Math.random()*(b-a);
const rndi = (a,b)=> Math.floor(rnd(a,b+1));
const clamp = (v,a,b)=> v<a?a:(v>b?b:v);
const dist = (ax,ay,bx,by)=> Math.hypot(ax-bx, ay-by);
const lerp = (a,b,t)=> a+(b-a)*t;
const TAU = Math.PI*2;
function angLerp(a,b,t){ let d = ((b-a+Math.PI*3)%TAU)-Math.PI; return a + d*t; }
function fmt(n){ return "$" + Math.floor(n).toLocaleString('en-US'); }
function msg(t, ms=2600){ const m=document.getElementById('msg'); m.textContent=t; m.style.opacity=1;
  clearTimeout(msg._t); msg._t=setTimeout(()=>m.style.opacity=0, ms); }

// ---------- input ----------
const keys = {};
const mouse = { x:0, y:0, down:false };
addEventListener('keydown', e=>{
  keys[e.code]=true;
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
  if(e.code==='KeyQ') nextWeapon();
  if(e.code==='KeyR') toggleRadio();
  if(e.code==='KeyM') bigMap = !bigMap;
  if(e.code==='KeyE') tryEnterExit();
});
addEventListener('keyup', e=> keys[e.code]=false);
addEventListener('mousemove', e=>{ mouse.x=e.clientX; mouse.y=e.clientY; });
addEventListener('mousedown', ()=> mouse.down=true);
addEventListener('mouseup', ()=> mouse.down=false);
addEventListener('contextmenu', e=> e.preventDefault());

// ---------- audio: radio stations ----------
let AC=null, radioOn=true, stationIdx=0, musicTimer=null, noiseNode=null;
const STATIONS = [
  { name:"FLASH FM",       scale:[0,4,7,11,14], tempo:0.24, wave:'square',   bass:'sawtooth', col:'#ff3fa4' },
  { name:"V-ROCK",         scale:[0,3,5,7,10],  tempo:0.18, wave:'sawtooth', bass:'sawtooth', col:'#ff5f1f' },
  { name:"WAVE 103",       scale:[0,2,5,7,9],   tempo:0.30, wave:'triangle', bass:'square',   col:'#22d3ee' },
  { name:"ESPANTOSO",      scale:[0,3,5,6,7,10],tempo:0.28, wave:'triangle', bass:'triangle', col:'#ffd166' },
  { name:"EMOTION 98.3",   scale:[0,4,7,9,11],  tempo:0.42, wave:'sine',     bass:'sine',     col:'#a78bfa' },
];
function initAudio(){
  if(AC) return;
  try{
    const Ctor = window.AudioContext || window.webkitAudioContext;
    if(!Ctor) return;
    AC = new Ctor();
  }catch(e){ AC = null; return; }
  try{
  const master = AC.createGain(); master.gain.value = 0.16; master.connect(AC.destination);
  AC._master = master;
  // engine / sfx bus
  const sfxBus = AC.createGain(); sfxBus.gain.value = 0.5; sfxBus.connect(AC.destination); AC._sfx = sfxBus;
  let step = 0;
  musicTimer = setInterval(()=>{
    if(!AC || !radioOn) return;
    const st = STATIONS[stationIdx];
    const root = 110 * Math.pow(2, (stationIdx*2)/12);
    const t = AC.currentTime;
    // bass
    const b = AC.createOscillator(), bg = AC.createGain();
    b.type = st.bass; b.frequency.value = root/2 * Math.pow(2, st.scale[step % st.scale.length]/12);
    bg.gain.setValueAtTime(0.0001,t); bg.gain.exponentialRampToValueAtTime(0.35,t+0.02);
    bg.gain.exponentialRampToValueAtTime(0.0001, t+st.tempo*0.95);
    b.connect(bg); bg.connect(master); b.start(t); b.stop(t+st.tempo);
    // lead arp
    if(step % 2 === 0){
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = st.wave;
      o.frequency.value = root*2 * Math.pow(2, st.scale[(step*3) % st.scale.length]/12);
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.14,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t+st.tempo*1.6);
      o.connect(g); g.connect(master); o.start(t); o.stop(t+st.tempo*1.7);
    }
    step++;
  }, 240);
  }catch(e){ AC = null; }
}
function toggleRadio(){
  radioOn = !radioOn;
  if(radioOn && !AC) initAudio();
  msg(radioOn ? "📻 " + STATIONS[stationIdx].name : "📻 Radio off", 1400);
}
function nextRadio(){ stationIdx = (stationIdx+1) % STATIONS.length; if(!AC) initAudio(); radioOn=true;
  msg("📻 " + STATIONS[stationIdx].name, 1400); }
function sfx(type){
  if(!AC) return;
  const t = AC.currentTime, bus = AC._sfx;
  const g = AC.createGain(); g.connect(bus);
  if(type==='shot'){
    const o = AC.createOscillator(); o.type='square';
    o.frequency.setValueAtTime(900,t); o.frequency.exponentialRampToValueAtTime(120,t+0.12);
    g.gain.setValueAtTime(0.5,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.14);
    o.connect(g); o.start(t); o.stop(t+0.15);
  } else if(type==='boom'){
    const len = AC.sampleRate*0.7, buf = AC.createBuffer(1,len,AC.sampleRate), d = buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i] = (Math.random()*2-1) * Math.pow(1-i/len,2);
    const s = AC.createBufferSource(); s.buffer=buf;
    const f = AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=420;
    g.gain.setValueAtTime(0.9,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.7);
    s.connect(f); f.connect(g); s.start(t);
  } else if(type==='pickup'){
    const o=AC.createOscillator(); o.type='sine';
    o.frequency.setValueAtTime(520,t); o.frequency.setValueAtTime(780,t+0.08);
    g.gain.setValueAtTime(0.3,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.22);
    o.connect(g); o.start(t); o.stop(t+0.24);
  } else if(type==='hurt'){
    const o=AC.createOscillator(); o.type='sawtooth';
    o.frequency.setValueAtTime(220,t); o.frequency.exponentialRampToValueAtTime(70,t+0.2);
    g.gain.setValueAtTime(0.35,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.22);
    o.connect(g); o.start(t); o.stop(t+0.24);
  } else if(type==='enter'){
    const o=AC.createOscillator(); o.type='triangle';
    o.frequency.setValueAtTime(180,t); o.frequency.exponentialRampToValueAtTime(420,t+0.15);
    g.gain.setValueAtTime(0.3,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.2);
    o.connect(g); o.start(t); o.stop(t+0.22);
  }
}
/*__NEXT__*/
</script>
</body>
</html>
