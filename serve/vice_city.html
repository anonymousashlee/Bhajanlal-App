<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VICE CITY NIGHTS — 1986</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0a0612;font-family:"Courier New",monospace;user-select:none}
canvas#game{display:block}
#hud,#stars,#radio,#obj,#msg,#help,#hp,#mini,#wasted{position:fixed}
#hud{left:14px;top:10px;color:#ff2fb9;font-size:20px;letter-spacing:3px;text-shadow:0 0 8px #ff2fb9}
#stars{left:14px;top:38px;color:#ffd23f;font-size:24px;letter-spacing:4px;text-shadow:0 0 8px #ffd23f}
#radio{left:14px;top:68px;color:#00e5ff;font-size:14px;text-shadow:0 0 6px #00e5ff}
#obj{left:14px;top:92px;color:#b26bff;font-size:14px;max-width:46vw;line-height:1.5}
#hp{position:fixed;left:14px;bottom:16px;width:230px;height:16px;border:2px solid #00e5ff;background:#100c1a}
#hp i{display:block;height:100%;background:linear-gradient(90deg,#ff2fb9,#ffd23f);width:100%}
#msg{left:50%;top:16%;transform:translateX(-50%);color:#ffd23f;font-size:30px;text-align:center;text-shadow:0 0 12px #ff2fb9;max-width:80%;display:none;line-height:1.4}
#help{right:206px;bottom:14px;color:#7fd4ff;font-size:13px;text-align:right;line-height:1.6;opacity:.85}
#mini{right:14px;top:14px;border:2px solid #00e5ff;background:#05030a}
#wasted{position:fixed;inset:0;display:none;align-items:center;justify-content:center;color:#ff2fb9;font-size:70px;letter-spacing:12px;text-shadow:0 0 24px #ff2fb9;background:rgba(10,6,18,.7)}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">$1,500</div>
<div id="stars"></div>
<div id="radio">WAVE 103</div>
<div id="obj"></div>
<div id="hp"><i id="hpbar"></i></div>
<div id="msg"></div>
<div id="help">WASD / ARROWS — move &amp; drive<br>E — steal or exit car · SPACE — shoot · R — radio</div>
<canvas id="mini" width="180" height="180"></canvas>
<div id="wasted">WASTED</div>
<script>
const $=id=>document.getElementById(id);
const cv=$('game'),cx=cv.getContext('2d'),mn=$('mini'),mx=mn.getContext('2d');
let W=0,H=0;
const rs=()=>{W=cv.width=window.innerWidth;H=cv.height=window.innerHeight;};
window.addEventListener('resize',rs);rs();

const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[(Math.random()*a.length)|0];
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const dist=(a,b,c,d)=>Math.hypot(a-c,b-d);

// ---- city grid: N x N blocks separated by roads
const N=7,BLOCK=168,ROAD=74,CELL=BLOCK+ROAD,SZ=N*CELL;
const roadC=i=>i*CELL+ROAD/2;
const NEON=['#ff2fb9','#00e5ff','#ffd23f','#7cff5a','#b26bff','#ff6b35'];
const blds=[];
for(let i=0;i<N;i++)for(let j=0;j<N;j++){
  const x=i*CELL+ROAD+9,y=j*CELL+ROAD+9,w=BLOCK-18,h=BLOCK-18,t=Math.random();
  const parts=t<0.35?[{x,y,w,h:h*0.46},{x,y:y+h*0.54,w,h:h*0.46}]
             :t<0.70?[{x,y,w:w*0.46,h},{x:x+w*0.54,y,w:w*0.46,h}]
             :[{x,y,w,h}];
  for(const p of parts){
    const win=[];
    for(let wx=p.x+9;wx<p.x+p.w-14;wx+=20)for(let wy=p.y+9;wy<p.y+p.h-14;wy+=20)
      if(((wx*7+wy*13)|0)%4!==0)win.push([wx,wy]);
    blds.push({x:p.x,y:p.y,w:p.w,h:p.h,c:pick(NEON),win});
  }
}
const blocked=(x,y,r)=>{for(let i=0;i<blds.length;i++){const b=blds[i];
  if(x+r>b.x&&x-r<b.x+b.w&&y+r>b.y&&y-r<b.y+b.h)return true;}return false;};

// ---- state
const P={x:roadC(1),y:roadC(2),a:-Math.PI/2,hp:100,car:null,cool:0};
let money=1500,wanted=0,crime=11,mi=0,dead=0,shake=0,toastT=0,toastTxt='',st=0,dtG=0.016;
const keys={};
const STATIONS=['WAVE 103 · synth only','FLASH FM · pop hits','V-ROCK · guitar anthems',
  'EMOTION 98.3 · slow jams','FEVER 105 · funk & soul','K-CHAT · late night talk'];
const MISSIONS=[
 {t:'THE AMBUSH',d:'Reach the docks — the deal got hit.',x:roadC(0),y:roadC(6),pay:500},
 {t:'KEN ROSENBERG',d:'The lawyer is panicking. Get to his office.',x:roadC(4),y:roadC(1),pay:750},
 {t:'PRINT WORKS',d:'Secure the Print Works. Fake bills, real empire.',x:roadC(6),y:roadC(4),pay:1000},
 {t:'MALL BRAWL',d:'Lance got jumped at the mall — move!',x:roadC(2),y:roadC(3),pay:1200},
 {t:'SPAND EXPRESS',d:'Grab the van and deliver the package.',x:roadC(5),y:roadC(6),pay:1500},
 {t:'VICE CITY EMPIRE',d:'Take out the last crew. The city is yours.',x:roadC(3),y:roadC(0),pay:3000}
];
const cars=[],cops=[],peds=[],bullets=[],parts=[];

function makeCar(cop){
  const vert=Math.random()<0.5,lane=(Math.random()*N)|0,dir=Math.random()<0.5?1:-1,t=rnd(40,SZ-40);
  const c={x:0,y:0,a:0,spd:cop?110:rnd(45,105),hp:cop?60:100,cop:!!cop,hit:0,
    col:cop?'#12306b':pick(NEON.concat(['#e8e8e8','#1c1c22','#c9c9d6']))};
  if(vert){c.x=roadC(lane)+(dir>0?18:-18);c.y=t;c.a=dir>0?Math.PI/2:-Math.PI/2;}
  else{c.y=roadC(lane)+(dir>0?-18:18);c.x=t;c.a=dir>0?0:Math.PI;}
  return c;
}
for(let i=0;i<15;i++)cars.push(makeCar(false));

function newPed(){
  let x=0,y=0,tries=0;
  do{x=rnd(20,SZ-20);y=rnd(20,SZ-20);tries++;}while(blocked(x,y,9)&&tries<50);
  return{x,y,a:rnd(0,6.28),spd:rnd(14,30),t:rnd(0,3),alive:true,
    col:pick(['#ffd23f','#7cff5a','#ff6b35','#e8e8e8','#b26bff'])};
}
for(let i=0;i<32;i++)peds.push(newPed());

// ---- fx helpers
let AC=null;
function beep(f){try{if(!AC){const A=window.AudioContext||window.webkitAudioContext;if(!A)return;AC=new A();}
  const o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.value=f;
  g.gain.value=0.04;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+0.15);}catch(e){}}
function toast(t,sec){toastTxt=t;toastT=sec||2.6;}
function boom(x,y,n,col){for(let i=0;i<n;i++){const a=rnd(0,6.28),s=rnd(30,220);
  parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:rnd(.3,.9),c:col,r:rnd(2,5)});}}
function addWanted(n){wanted=clamp(wanted+n,0,5);crime=0;}
function killPed(p){if(!p.alive)return;p.alive=false;boom(p.x,p.y,12,p.col);money+=15;addWanted(1);}

// ---- input
window.addEventListener('keydown',e=>{
  const k=(e.key||'').toLowerCase();
  keys[k]=1;
  if(k===' '||k.indexOf('arrow')===0)e.preventDefault();
  if(e.repeat)return;
  if(k==='e')enterExit();
  else if(k===' ')shoot();
  else if(k==='r'){st=(st+1)%STATIONS.length;toast(STATIONS[st],1.6);beep(660);}
});
window.addEventListener('keyup',e=>{keys[(e.key||'').toLowerCase()]=0;});

function enterExit(){
  if(dead)return;
  if(P.car){                                   // hop out beside the car
    const c=P.car;P.car=null;
    let nx=c.x-Math.sin(c.a)*30,ny=c.y+Math.cos(c.a)*30;
    if(blocked(nx,ny,9)||nx<10||ny<10||nx>SZ-10||ny>SZ-10){nx=c.x+Math.sin(c.a)*30;ny=c.y-Math.cos(c.a)*30;}
    if(blocked(nx,ny,9)){nx=c.x;ny=c.y;}
    P.x=nx;P.y=ny;P.a=c.a;c.spd*=0.2;cars.push(c);
    toast('ON FOOT',1.2);
  }else{                                       // steal nearest ride
    let best=null,bd=58,src=null;
    for(const c of cars){const d=dist(c.x,c.y,P.x,P.y);if(d<bd){bd=d;best=c;src=cars;}}
    for(const c of cops){const d=dist(c.x,c.y,P.x,P.y);if(d<bd){bd=d;best=c;src=cops;}}
    if(best){src.splice(src.indexOf(best),1);P.car=best;P.a=best.a;beep(520);
      if(best.cop){addWanted(1);toast('CRUISER STOLEN — WANTED');}else toast('ENGINE STARTED',1.4);}
    else toast('NO VEHICLE NEARBY',1.3);
  }
}
function shoot(){
  if(dead||P.cool>0)return;
  P.cool=P.car?0.18:0.28;
  const a=P.car?P.car.a:P.a,ox=P.car?P.car.x:P.x,oy=P.car?P.car.y:P.y,n=P.car?2:1;
  for(let i=0;i<n;i++){const sp=a+(P.car?rnd(-0.06,0.06):0);
    bullets.push({x:ox+Math.cos(sp)*20,y:oy+Math.sin(sp)*20,vx:Math.cos(sp)*640,vy:Math.sin(sp)*640,l:0.9});}
  boom(ox+Math.cos(a)*24,oy+Math.sin(a)*24,3,'#ffd23f');
}

// ---- simulation
function drive(c,dt,th,steer){
  c.spd+=th*300*dt;
  c.spd-=c.spd*(th?0.6:1.8)*dt;
  c.spd=clamp(c.spd,-150,340);
  if(Math.abs(c.spd)>5)c.a+=steer*2.3*dt*(c.spd>0?1:-1)*clamp(Math.abs(c.spd)/100,0.25,1);
  const ox=c.x,oy=c.y;
  c.x+=Math.cos(c.a)*c.spd*dt;c.y+=Math.sin(c.a)*c.spd*dt;
  c.x=clamp(c.x,12,SZ-12);c.y=clamp(c.y,12,SZ-12);
  if(blocked(c.x,c.y,15)){c.x=ox;c.y=oy;
    if(Math.abs(c.spd)>120){boom(c.x,c.y,6,'#ffd23f');shake=Math.max(shake,6);}
    c.spd*=-0.3;}
}
function world(dt){
  for(const c of cars){                          // traffic drives straight, wraps at edges
    c.x+=Math.cos(c.a)*c.spd*dt;c.y+=Math.sin(c.a)*c.spd*dt;
    if(c.x<-60)c.x=SZ+50;if(c.x>SZ+60)c.x=-50;
    if(c.y<-60)c.y=SZ+50;if(c.y>SZ+60)c.y=-50;
  }
  for(let i=peds.length-1;i>=0;i--){             // wandering pedestrians
    const p=peds[i];
    if(!p.alive){peds.splice(i,1);continue;}
    p.t-=dt;if(p.t<=0){p.a=rnd(0,6.28);p.t=rnd(1,4);}
    const nx=p.x+Math.cos(p.a)*p.spd*dt,ny=p.y+Math.sin(p.a)*p.spd*dt;
    if(blocked(nx,ny,9)||nx<10||ny<10||nx>SZ-10||ny>SZ-10)p.a+=Math.PI*rnd(0.5,1);
    else{p.x=nx;p.y=ny;}
  }
  while(peds.length<30)peds.push(newPed());
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.l-=dt;
    let gone=b.l<=0||b.x<0||b.y<0||b.x>SZ||b.y>SZ||blocked(b.x,b.y,3);
    if(!gone)for(const p of peds){if(p.alive&&dist(b.x,b.y,p.x,p.y)<12){killPed(p);gone=true;break;}}
    if(!gone)for(const c of cops){if(dist(b.x,b.y,c.x,c.y)<20){c.hp-=34;boom(b.x,b.y,5,'#ffd23f');gone=true;break;}}
    if(gone)bullets.splice(i,1);
  }
  for(let i=parts.length-1;i>=0;i--){const q=parts[i];
    q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=0.94;q.vy*=0.94;q.l-=dt;
    if(q.l<=0)parts.splice(i,1);}
}
function copLogic(dt){
  while(cops.length<wanted)cops.push(makeCar(true));
  const tx=P.car?P.car.x:P.x,ty=P.car?P.car.y:P.y;
  for(let i=cops.length-1;i>=0;i--){
    const c=cops[i];
    c.hit-=dt;
    const want=Math.atan2(ty-c.y,tx-c.x);
    let d=((want-c.a+Math.PI*3)%(Math.PI*2))-Math.PI;
    c.a+=clamp(d,-2.4*dt,2.4*dt);
    c.spd=clamp(c.spd+180*dt,0,240);
    const ox=c.x,oy=c.y;
    c.x+=Math.cos(c.a)*c.spd*dt;c.y+=Math.sin(c.a)*c.spd*dt;
    if(blocked(c.x,c.y,15)){c.x=ox;c.y=oy;c.a+=rnd(-1,1);c.spd*=0.5;}
    const dd=dist(c.x,c.y,tx,ty);
    if(dd<32&&c.hit<=0){                        // ram the player
      c.hit=0.7;shake=Math.max(shake,8);
      P.hp-=(P.car?7:16);boom((c.x+tx)/2,(c.y+ty)/2,6,'#ffd23f');
      if(P.car)P.car.spd*=0.4;
      else{P.x+=Math.cos(c.a)*20;P.y+=Math.sin(c.a)*20;}
      beep(140);
    }
    if(P.car){                                  // player rams back
      const imp=Math.abs(P.car.spd);
      if(dd<32&&imp>60&&c.hit<=0){c.hp-=imp*0.35;c.hit=0.5;shake=Math.max(shake,7);
        P.car.spd*=0.55;boom(c.x,c.y,6,'#ffd23f');}
    }
    if(c.hp<=0){boom(c.x,c.y,26,'#ff6b35');money+=100;addWanted(1);cops.splice(i,1);beep(220);}
  }
}
function playerCtrl(dt){
  const up=keys.w||keys.arrowup,dn=keys.s||keys.arrowdown,
        lf=keys.a||keys.arrowleft,rt=keys.d||keys.arrowright;
  if(P.car){drive(P.car,dt,(up?1:0)-(dn?1:0),(rt?1:0)-(lf?1:0));P.a=P.car.a;}
  else{
    let dx=(rt?1:0)-(lf?1:0),dy=(dn?1:0)-(up?1:0);
    if(dx||dy){
      const l=Math.hypot(dx,dy);dx/=l;dy/=l;P.a=Math.atan2(dy,dx);
      const sp=keys.shift?215:150,nx=P.x+dx*sp*dt,ny=P.y+dy*sp*dt;
      if(!blocked(nx,P.y,9))P.x=nx;
      if(!blocked(P.x,ny,9))P.y=ny;
      P.x=clamp(P.x,8,SZ-8);P.y=clamp(P.y,8,SZ-8);
    }
    for(const c of cars)if(dist(P.x,P.y,c.x,c.y)<20&&Math.abs(c.spd)>30){ // traffic knocks you down
      P.hp-=14;shake=7;P.x+=Math.cos(c.a)*18;P.y+=Math.sin(c.a)*18;break;}
  }
  if(P.car&&Math.abs(P.car.spd)>45)for(const p of peds)
    if(p.alive&&dist(P.car.x,P.car.y,p.x,p.y)<18)killPed(p);   // hit and run
}
function update(dt){
  dtG=dt;
  if(dead>0){dead-=dt;world(dt);
    if(dead<=0){dead=0;$('wasted').style.display='none';P.hp=100;money=Math.max(0,money-500);
      wanted=0;cops.length=0;P.car=null;P.x=roadC(0);P.y=roadC(0);P.a=0;toast('BACK ON THE STREET',2);}
    hud();return;}
  P.cool-=dt;
  playerCtrl(dt);
  world(dt);
  copLogic(dt);
  crime+=dt;
  if(crime>10&&wanted>0){wanted--;crime=0;}     // heat cools off
  const m=MISSIONS[mi];
  if(m&&dist(P.car?P.car.x:P.x,P.car?P.car.y:P.y,m.x,m.y)<40){
    money+=m.pay;mi++;beep(880);setTimeout(()=>beep(1320),140);
    toast('MISSION PASSED! +$'+m.pay,3);
  }
  if(P.hp<=0){P.hp=0;dead=2.6;$('wasted').style.display='flex';beep(110);shake=14;}
  hud();
}
function hud(){
  $('hud').textContent='$'+money.toLocaleString()+' · 1986';
  $('stars').textContent=wanted>0?'★'.repeat(wanted):'';
  $('radio').textContent=STATIONS[st];
  const m=MISSIONS[mi];
  $('obj').textContent=m?('GOAL: '+m.t+' — '+m.d):'FREE ROAM — the city is yours. Build the empire.';
  $('hpbar').style.width=Math.max(0,P.hp)+'%';
  if(toastT>0){toastT-=dtG;const el=$('msg');
    if(toastT>0){el.style.display='block';el.textContent=toastTxt;}else el.style.display='none';}
}

// ---- rendering
function drawCar(c){
  cx.save();cx.translate(c.x,c.y);cx.rotate(c.a);
  cx.fillStyle='rgba(0,0,0,.4)';cx.fillRect(-20,-10,44,23);
  cx.fillStyle=c.cop?'#12306b':c.col;cx.fillRect(-22,-12,44,24);
  cx.fillStyle='rgba(255,255,255,.22)';cx.fillRect(-7,-9,15,18);
  cx.fillStyle='#0b0b12';cx.fillRect(-16,-15,11,4);cx.fillRect(-16,11,11,4);
  cx.fillRect(7,-15,11,4);cx.fillRect(7,11,11,4);
  cx.fillStyle='#fff7c0';cx.fillRect(17,-10,4,6);cx.fillRect(17,4,4,6);
  if(c.cop){const on=(performance.now()/160|0)%2;
    cx.fillStyle=on?'#ff3b30':'#2f6bff';cx.fillRect(-5,-9,9,5);
    cx.fillStyle=on?'#2f6bff':'#ff3b30';cx.fillRect(-5,4,9,5);}
  cx.restore();
}
function drawPed(x,y,a,col,gun){
  cx.save();cx.translate(x,y);cx.rotate(a);
  cx.fillStyle='rgba(0,0,0,.35)';cx.beginPath();cx.ellipse(0,4,9,6,0,0,6.29);cx.fill();
  cx.fillStyle=col;cx.fillRect(-7,-6,14,12);
  cx.fillStyle='#f2c49a';cx.beginPath();cx.arc(2,0,5.5,0,6.29);cx.fill();
  if(gun){cx.fillStyle='#111';cx.fillRect(6,-2,11,4);}
  cx.restore();
}
function draw(dt){
  const camx=clamp(P.x-W/2,0,Math.max(0,SZ-W)),camy=clamp(P.y-H/2,0,Math.max(0,SZ-H));
  const shx=shake>0?rnd(-shake,shake):0,shy=shake>0?rnd(-shake,shake):0;
  shake=Math.max(0,shake-30*dt);
  cx.setTransform(1,0,0,1,0,0);
  cx.fillStyle='#0a0612';cx.fillRect(0,0,W,H);
  cx.save();cx.translate(-camx+shx,-camy+shy);
  cx.fillStyle='#241c30';cx.fillRect(0,0,SZ,SZ);
  cx.fillStyle='#2b2440';                                  // sidewalks / blocks
  for(let i=0;i<N;i++)for(let j=0;j<N;j++)cx.fillRect(i*CELL+ROAD,j*CELL+ROAD,BLOCK,BLOCK);
  cx.fillStyle='#15121d';                                  // asphalt
  for(let i=0;i<N;i++){cx.fillRect(i*CELL,0,ROAD,SZ);cx.fillRect(0,i*CELL,SZ,ROAD);}
  cx.strokeStyle='#ffd23f';cx.lineWidth=2;cx.setLineDash([16,18]);cx.beginPath();
  for(let i=0;i<N;i++){const c=roadC(i);cx.moveTo(c,0);cx.lineTo(c,SZ);cx.moveTo(0,c);cx.lineTo(SZ,c);}
  cx.stroke();cx.setLineDash([]);
  for(const b of blds){                                    // neon-lit buildings
    cx.fillStyle='#0d0a14';cx.fillRect(b.x,b.y,b.w,b.h);
    cx.fillStyle='rgba(255,210,63,.7)';
    for(const w of b.win)cx.fillRect(w[0],w[1],8,9);
    cx.strokeStyle=b.c;cx.lineWidth=3;cx.shadowColor=b.c;cx.shadowBlur=12;
    cx.strokeRect(b.x+1.5,b.y+1.5,b.w-3,b.h-3);cx.shadowBlur=0;
  }
  const m=MISSIONS[mi];                                    // objective marker
  if(m){const t=performance.now()/1000;
    cx.fillStyle='rgba(255,210,63,.14)';cx.fillRect(m.x-40,m.y-40,80,80);
    cx.strokeStyle='#ffd23f';cx.lineWidth=4;cx.globalAlpha=0.55+0.45*Math.sin(t*5);
    cx.beginPath();cx.arc(m.x,m.y,34,0,6.29);cx.stroke();cx.globalAlpha=1;
    cx.fillStyle='#ffd23f';cx.font='bold 26px "Courier New"';cx.textAlign='center';
    cx.fillText('★',m.x,m.y+9);}
  for(const p of peds)if(p.alive)drawPed(p.x,p.y,p.a,p.col,false);
  for(const c of cars)if(c!==P.car)drawCar(c);
  for(const c of cops)drawCar(c);
  if(P.car)drawCar(P.car);else drawPed(P.x,P.y,P.a,'#ff2fb9',true);
  for(const b of bullets){cx.fillStyle='#fff2a8';
    cx.fillRect(b.x-3,b.y-2,6,4);}
  for(const q of parts){cx.globalAlpha=Math.max(0,Math.min(1,q.l*2));cx.fillStyle=q.c;
    cx.fillRect(q.x,q.y,q.r,q.r);}
  cx.globalAlpha=1;
  cx.restore();
  if(P.hp<45&&P.hp>0){                                     // damage vignette
    cx.fillStyle='rgba(255,20,80,'+(0.3*(1-P.hp/45)).toFixed(3)+')';cx.fillRect(0,0,W,H);}
  minimap();
}
function minimap(){
  const S=180,s=S/SZ;
  mx.clearRect(0,0,S,S);mx.fillStyle='#05030a';mx.fillRect(0,0,S,S);
  mx.fillStyle='#32294a';
  for(let i=0;i<N;i++)for(let j=0;j<N;j++)mx.fillRect((i*CELL+ROAD)*s,(j*CELL+ROAD)*s,BLOCK*s,BLOCK*s);
  const m=MISSIONS[mi];
  if(m){mx.fillStyle='#ffd23f';mx.fillRect(m.x*s-3,m.y*s-3,6,6);}
  mx.fillStyle='#00e5ff';
  for(const c of cops)mx.fillRect(c.x*s-2,c.y*s-2,4,4);
  mx.fillStyle='#ff2fb9';mx.fillRect((P.car?P.car.x:P.x)*s-3,(P.car?P.car.y:P.y)*s-3,6,6);
}

let last=0;
function loop(t){
  const dt=Math.min(0.05,(t-last)/1000||0.016);last=t;
  update(dt);draw(dt);
  window.requestAnimationFrame(loop);
}
window.requestAnimationFrame(loop);
</script>
