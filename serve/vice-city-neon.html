<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neon Vice — 1986</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0a0614;
    font-family:ui-monospace,Menlo,Consolas,monospace;color:#ffd6f2}
  canvas{display:block;cursor:crosshair}
  #hud{position:fixed;left:12px;top:10px;pointer-events:none;text-shadow:0 0 6px #ff2d95}
  .lbl{font-size:10px;letter-spacing:3px;color:#ff8bd0}
  #money{font-size:22px;color:#39ff88}
  #stars{font-size:18px;letter-spacing:2px}
  #healthwrap{width:140px;height:8px;background:#221033;border:1px solid #ff2d95;margin-top:4px}
  #health{height:100%;width:100%;background:linear-gradient(90deg,#ff2d95,#ffe600)}
  #hint{position:fixed;left:12px;bottom:10px;font-size:11px;color:#8fe9ff;opacity:.85;pointer-events:none}
  #toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);font-size:14px;
    letter-spacing:4px;color:#ffe600;opacity:0;transition:opacity .4s;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div class="lbl">CASH</div><div id="money">$0</div>
  <div class="lbl" style="margin-top:6px">WANTED</div><div id="stars"></div>
  <div class="lbl" style="margin-top:6px">HEALTH</div>
  <div id="healthwrap"><div id="health"></div></div>
</div>
<div id="toast"></div>
<div id="hint">WASD move · SHIFT sprint · E steal/exit car · CLICK shoot · M minimap</div>
<script>
'use strict';
/* ================= core setup ================= */
const cvs=document.getElementById('c'),ctx=cvs.getContext('2d');
let W=0,H=0;
const resize=()=>{W=cvs.width=innerWidth;H=cvs.height=innerHeight;};
addEventListener('resize',resize);resize();

const rnd=(a=1,b=0)=>b+Math.random()*(a-b);       // random in [b,a)
const pick=a=>a[(Math.random()*a.length)|0];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const d2=(ax,ay,bx,by)=>{const x=ax-bx,y=ay-by;return x*x+y*y;};
const norm=a=>{while(a>Math.PI)a-=Math.PI*2;while(a<-Math.PI)a+=Math.PI*2;return a;};
const lerp=(a,b,t)=>a+(b-a)*t;

const keys={};
addEventListener('keydown',e=>{keys[e.code]=true;
  if(e.code==='KeyE')toggleCar();
  if(e.code==='KeyM')showMap=!showMap;
  if(['Space','ArrowUp','ArrowDown'].includes(e.code))e.preventDefault();});
addEventListener('keyup',e=>keys[e.code]=false);
const mouse={x:0,y:0,down:false};
addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY;});
addEventListener('mousedown',()=>mouse.down=true);
addEventListener('mouseup',()=>mouse.down=false);

/* ================= world ================= */
const TILE=64, MAP=60;                 // 60x60 tiles of 64px = 3840px city
const map=[];                          // 0 road, 1 building, 2 sidewalk, 3 grass
const buildSeed=[];
for(let y=0;y<MAP;y++){map[y]=[];buildSeed[y]=[];for(let x=0;x<MAP;x++)buildSeed[y][x]=Math.random();}
function genMap(){
  for(let y=0;y<MAP;y++)for(let x=0;x<MAP;x++){
    const road=(x%8===0)||(y%8===0);          // grid roads every 8 tiles
    map[y][x]=road?0:((x%8===1||y%8===1)?2:1); // sidewalks hugging roads
  }
}
genMap();
const solid=(tx,ty)=>tx<0||ty<0||tx>=MAP||ty>=MAP?true:map[ty][tx]===1;
function tileAt(px,py){const tx=Math.floor(px/TILE),ty=Math.floor(py/TILE);
  if(tx<0||ty<0||tx>=MAP||ty>=MAP)return 1;return map[ty][tx];}
const isRoadPx=(px,py)=>tileAt(px,py)===0;

/* ================= entities ================= */
const player={x:TILE*4,y:TILE*10,a:0,hp:100,money:0,wanted:0,car:null,
  fireCd:0,wantedTimer:0,inv:0};
const cars=[],peds=[],bullets=[],parts=[],pickups=[];

const CAR_COLORS=['#ff2d95','#00f0ff','#ffe600','#39ff14','#b967ff','#ff6a00','#e8e8ff','#1b1b3a'];
function makeCar(x,y,a,ai){
  return{x,y,a,v:0,ai:ai||'parked',col:pick(CAR_COLORS),
    hp:100,driver:null,turn:rnd(1,-1),cool:0,w:44,h:22};
}
// traffic cars driving the grid
for(let i=0;i<26;i++){
  let x,y,a;
  if(Math.random()<.5){y=Math.floor(rnd(MAP))*TILE+TILE/2;x=rnd(MAP*TILE);a=Math.random()<.5?0:Math.PI;}
  else{x=Math.floor(rnd(MAP))*TILE+TILE/2;y=rnd(MAP*TILE);a=Math.random()<.5?Math.PI/2:-Math.PI/2;}
  const c=makeCar(x,y,a,'traffic');c.v=rnd(2.4,1.2);cars.push(c);
}
for(let i=0;i<10;i++)cars.push(makeCar(rnd(MAP*TILE),rnd(MAP*TILE),rnd(6.28),'parked'));
// pedestrians
const PED_COLS=['#ffd6f2','#8fe9ff','#ffe600','#c0a0ff','#ffb37b'];
for(let i=0;i<40;i++){
  peds.push({x:rnd(MAP*TILE),y:rnd(MAP*TILE),a:rnd(6.28),sp:0,
    state:'wander',t:0,cool:0,col:pick(PED_COLS),hp:100,panic:0});
}
function spawnPickup(x,y,kind){pickups.push({x,y,kind,t:0});}

/* ================= audio (tiny synth) ================= */
let AC=null;
function beep(freq,dur,type,vol){
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(),g=AC.createGain();
    o.type=type||'square';o.frequency.value=freq;
    g.gain.value=vol||0.04;g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+dur);
    o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+dur);
  }catch(e){}
}

/* ================= screen shake (game-feel: trauma) ================= */
let trauma=0;
const shake=()=>{const s=trauma*trauma;return{x:rnd(s*14,-s*14),y:rnd(s*14,-s*14)};};

/* ================= helpers ================= */
function raycast(x,y,a,len){
  const steps=len/8,ca=Math.cos(a),sa=Math.sin(a);
  for(let i=0;i<steps;i++){const px=x+ca*i*8,py=y+sa*i*8;
    if(tileAt(px,py)===1)return i*8;}
  return len;
}
function damagePlayer(n){
  if(player.inv>0)return;
  player.hp-=n;player.inv=20;trauma=Math.min(1,trauma+.4);beep(90,.15,'sawtooth',.05);
  if(player.hp<=0){player.hp=100;player.money=Math.max(0,player.money-200);
    player.x=TILE*4;player.y=TILE*10;player.wanted=0;
    if(player.car){player.car.driver=null;player.car.ai='parked';player.car=null;}
    toast('WASTED — respawned, -$200');}
}
function addWanted(n){
  player.wanted=clamp(player.wanted+n,0,5);
  player.wantedTimer=60*20; // stars decay after 20s of no crime
}
function toast(msg){const t=document.getElementById('toast');
  t.textContent=msg;t.style.opacity=1;clearTimeout(t._h);
  t._h=setTimeout(()=>t.style.opacity=0,1800);}
function burst(x,y,n,col){for(let i=0;i<n;i++){const a=rnd(6.28);
  parts.push({x,y,vx:Math.cos(a)*rnd(4),vy:Math.sin(a)*rnd(4),
    life:rnd(30,12),col:col||'#ffe600'});}}

/* ================= carjacking ================= */
function toggleCar(){
  if(player.car){                       // exit
    const c=player.car;player.car=null;c.driver=null;
    player.x=c.x-Math.sin(c.a)*30;player.y=c.y+Math.cos(c.a)*30;
    if(c.ai==='stolen')c.ai='parked';
    return;
  }
  let best=null,bd=60*60;
  for(const c of cars){const d=d2(player.x,player.y,c.x,c.y);
    if(d<bd){bd=d;best=c;}}
  if(!best)return;
  player.car=best;best.driver=player;
  if(best.ai!=='cop'){                   // grand theft auto!
    if(best.ai==='traffic')best.ai='stolen';
    addWanted(1);toast('GRAND THEFT AUTO');beep(220,.1,'square',.05);
  }
}

/* ================= update ================= */
function update(){
  // ---- player on foot ----
  if(!player.car){
    let dx=(keys.KeyD?1:0)-(keys.KeyA?1:0);
    let dy=(keys.KeyS?1:0)-(keys.KeyW?1:0);
    if(dx||dy){const l=Math.hypot(dx,dy);
      const sp=keys.ShiftLeft||keys.ShiftRight?3.4:2.0;
      const nx=player.x+dx/l*sp,ny=player.y+dy/l*sp;
      if(tileAt(nx,player.y)!==1)player.x=nx;      // axis-separated collision
      if(tileAt(player.x,ny)!==1)player.y=ny;
      player.a=Math.atan2(dy,dx);}
    if(mouse.down&&player.fireCd<=0)shoot();
  }else{                                // ---- driving ----
    const c=player.car;
    const acc=(keys.KeyW?1:0)-(keys.KeyS?1:0);
    const steer=((keys.KeyD?1:0)-(keys.KeyA?1:0))*(c.v>0?1:-1);
    c.v+=acc*0.12;c.v=clamp(c.v,-4,7.5);            // reverse + top speed
    c.v*=0.985;                                      // rolling friction
    c.a+=steer*0.045*clamp(Math.abs(c.v)/3,0,1);     // speed-scaled steering
    const nx=c.x+Math.cos(c.a)*c.v,ny=c.y+Math.sin(c.a)*c.v;
    if(tileAt(nx,c.y)===1||tileAt(nx,c.y)===2&&Math.abs(c.v)>5){
      if(Math.abs(c.v)>4){trauma=Math.min(1,trauma+.3);c.v*=-0.3;damagePlayer(4);}
      else c.v*=0.4;
    }else c.x=nx;
    if(tileAt(c.x,ny)===1){
      if(Math.abs(c.v)>4){trauma=Math.min(1,trauma+.3);c.v*=-0.3;damagePlayer(4);}
      else c.v*=0.4;
    }else c.y=ny;
    player.x=c.x;player.y=c.y;player.a=c.a;
    if(mouse.down&&player.fireCd<=0)shoot(true);
    // run over pedestrians
    for(const p of peds){if(p.hp<=0)continue;
      if(Math.abs(p.x-c.x)<26&&Math.abs(p.y-c.y)<18&&Math.abs(c.v)>2){
        p.hp-=100;burst(p.x,p.y,14,'#ff2d95');addWanted(1);trauma=Math.min(1,trauma+.35);
        beep(70,.2,'sawtooth',.05);}}
  }
  if(player.fireCd>0)player.fireCd--;
  if(player.inv>0)player.inv--;
  if(player.wantedTimer>0){player.wantedTimer--;
    if(player.wantedTimer===0&&player.wanted>0){player.wanted--;player.wantedTimer=60*20;}}
  player.money+=0; // passive none — cash comes from pickups/crime

  // ---- traffic FSM: cruise, stop at blockages, panic ----
  for(const c of cars){
    if(c.driver===player)continue;
    if(c.ai==='traffic'){
      const probe=34;
      // brake if player's car or a ped is in front
      let blocked=false;
      if(player.car!==c&&d2(c.x+Math.cos(c.a)*probe,c.y+Math.sin(c.a)*probe,player.x,player.y)<30*30)blocked=true;
      for(const p of peds)if(d2(c.x+Math.cos(c.a)*probe,c.y+Math.sin(c.a)*probe,p.x,p.y)<24*24){blocked=true;break;}
      c.v=lerp(c.v,blocked?0:2.2,0.08);
      const nx=c.x+Math.cos(c.a)*c.v,ny=c.y+Math.sin(c.a)*c.v;
      if(tileAt(nx,ny)===1){c.a+=c.turn*1.57;} // cornered: turn
      else{c.x=nx;c.y=ny;}
      if(c.v>0.1&&Math.random()<0.004)c.a+=pick([-1.57,1.57]); // random turns at intersections
    }else if(c.ai==='cop'){
      const ta=Math.atan2(player.y-c.y,player.x-c.x);
      c.a+=clamp(norm(ta-c.a),-0.05,0.05);
      c.v=lerp(c.v,player.wanted>0?5.2:0,0.05);
      const nx=c.x+Math.cos(c.a)*c.v,ny=c.y+Math.sin(c.a)*c.v;
      if(tileAt(nx,ny)===1){c.a+=1.57;c.v*=0.5;}else{c.x=nx;c.y=ny;}
      c.cool--;
      const dd=d2(c.x,c.y,player.x,player.y);
      if(player.wanted>0&&dd<320*320&&c.cool<=0){ // cop shoots
        c.cool=70;const a=Math.atan2(player.y-c.y,player.x-c.x)+rnd(.12,-.12);
        bullets.push({x:c.x,y:c.y,vx:Math.cos(a)*9,vy:Math.sin(a)*9,life:90,from:'cop'});
        beep(300,.05,'square',.03);}
      if(dd<44*44)damagePlayer(6);
    }else if(c.ai==='stolen'){c.v*=0.96;} // driverless: slows to park
  }
  // despawn parked cars far away, keep density
  // ---- cop spawn / despawn by wanted level ----
  const cops=cars.filter(c=>c.ai==='cop');
  if(player.wanted>0&&cops.length<player.wanted&&Math.random()<0.02){
    const a=rnd(6.28),R=700;
    const cop=makeCar(clamp(player.x+Math.cos(a)*R,64,MAP*TILE-64),
      clamp(player.y+Math.sin(a)*R,64,MAP*TILE-64),
      Math.atan2(player.y,player.x),'cop');
    cop.cool=60;cars.push(cop);toast('POLICE RESPONDING');beep(660,.08,'sine',.04);
  }
  if(player.wanted===0)for(let i=cars.length-1;i>=0;i--)
    if(cars[i].ai==='cop')cars.splice(i,1);

  // ---- pedestrians FSM: wander / flee / panic ----
  for(const p of peds){
    if(p.hp<=0)continue;
    p.t--;
    const threat=player.wanted>0||p.panic>0;
    if(p.t<=0){p.t=rnd(120,40);
      if(threat){p.state='flee';p.a=Math.atan2(p.y-player.y,p.x-player.x)+rnd(.5,-.5);}
      else{p.state='wander';p.a=rnd(6.28);}}
    if(p.panic>0)p.panic--;
    p.sp=p.state==='flee'?1.9:0.6;
    const nx=p.x+Math.cos(p.a)*p.sp,ny=p.y+Math.sin(p.a)*p.sp;
    if(tileAt(nx,ny)===1)p.a+=1.57;else{p.x=nx;p.y=ny;}
    // panic when player shoots nearby
    if(player.fireCd===9&&d2(p.x,p.y,player.x,player.y)<300*300)p.panic=180;
  }
  // ---- bullets ----
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    b.x+=b.vx;b.y+=b.vy;b.life--;
    if(b.life<=0||tileAt(b.x,b.y)===1){burst(b.x,b.y,3,'#ffe600');bullets.splice(i,1);continue;}
    if(b.from==='player'){
      let hit=false;
      for(const p of peds)if(p.hp>0&&d2(p.x,p.y,b.x,b.y)<14*14){
        p.hp-=50;p.panic=200;burst(p.x,p.y,10,'#ff2d95');
        if(p.hp<=0){addWanted(1);spawnPickup(p.x,p.y,'cash');toast('+$50');beep(120,.12,'sawtooth',.05);}
        hit=true;break;}
      if(!hit)for(const c of cars)if(c!==player.car&&d2(c.x,c.y,b.x,b.y)<26*26){
        c.hp-=25;burst(b.x,b.y,6,'#ff6a00');hit=true;
        if(c.hp<=0){burst(c.x,c.y,26,'#ff6a00');trauma=Math.min(1,trauma+.6);beep(60,.3,'sawtooth',.06);
          if(c.ai==='cop')addWanted(1);}
        break;}
      if(hit)bullets.splice(i,1);
    }else if(b.from==='cop'){
      if(!player.car&&d2(player.x,player.y,b.x,b.y)<14*14){damagePlayer(8);burst(b.x,b.y,6,'#ff2d95');bullets.splice(i,1);}
      else if(player.car&&d2(player.car.x,player.car.y,b.x,b.y)<26*26){damagePlayer(3);burst(b.x,b.y,6,'#ffe600');bullets.splice(i,1);}
    }
  }
  // remove wrecked cars (capture position BEFORE splice)
  for(let i=cars.length-1;i>=0;i--)if(cars[i].hp<=0&&cars[i].ai!=='cop'){
    const wx=cars[i].x,wy=cars[i].y;cars.splice(i,1);
    if(Math.random()<.7)spawnPickup(wx,wy,'cash');}
  // ---- pickups ----
  for(let i=pickups.length-1;i>=0;i--){
    const pk=pickups[i];pk.t++;
    if(d2(pk.x,pk.y,player.x,player.y)<30*30){
      if(pk.kind==='cash'){player.money+=50;beep(880,.08,'sine',.05);toast('+$50');}
      else{player.hp=clamp(player.hp+30,0,100);beep(520,.15,'sine',.05);toast('+30 HP');}
      pickups.splice(i,1);
    }else if(pk.t>600)pickups.splice(i,1);
  }
  // health regen pickups drop chance handled above; slow regen out of combat
  if(player.wanted===0&&player.hp<100)player.hp+=0.02;
  // ---- particles ----
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];
    p.x+=p.vx;p.y+=p.vy;p.vx*=0.94;p.vy*=0.94;p.life--;
    if(p.life<=0)parts.splice(i,1);}
  // ---- health pickups drop from nothing: spawn periodically ----
  if(Math.random()<0.002&&pickups.length<8)
    spawnPickup(rnd(MAP*TILE),rnd(MAP*TILE),Math.random()<.6?'cash':'health');
  trauma=Math.max(0,trauma-0.02);
}

/* ================= shooting ================= */
function shoot(fromCar){
  player.fireCd=9;trauma=Math.min(1,trauma+.15);
  const base=mouse.x!==undefined?Math.atan2(mouse.y-(player.y-cam.y),mouse.x-(player.x-cam.x)):player.a;
  const a=fromCar?base:base;
  bullets.push({x:player.x+Math.cos(a)*20,y:player.y+Math.sin(a)*20,
    vx:Math.cos(a)*11,vy:Math.sin(a)*11,life:70,from:'player'});
  burst(player.x+Math.cos(a)*22,player.y+Math.sin(a)*22,3,'#ffe600');
  beep(420,.05,'square',.04);
}

/* ================= camera ================= */
const cam={x:0,y:0};
function updateCamera(){
  const tx=player.x-W/2,ty=player.y-H/2;
  cam.x=lerp(cam.x,clamp(tx,0,MAP*TILE-W),0.1);
  cam.y=lerp(cam.y,clamp(ty,0,MAP*TILE-H),0.1);
}

/* ================= render ================= */
function drawWorld(){
  const x0=Math.floor(cam.x/TILE),y0=Math.floor(cam.y/TILE);
  const x1=Math.ceil((cam.x+W)/TILE),y1=Math.ceil((cam.y+H)/TILE);
  for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++){
    if(tx<0||ty<0||tx>=MAP||ty>=MAP)continue;
    const t=map[ty][tx],px=tx*TILE,py=ty*TILE;
    if(t===0){ctx.fillStyle='#171725';ctx.fillRect(px,py,TILE,TILE);
      if(ty%8===0&&ty+1<MAP&&map[ty+1][tx]!==undefined){} // road body
      if(tx%8===0){ // lane dashes on vertical roads
        ctx.fillStyle='#2c2c44';
        for(let d=0;d<TILE;d+=16)ctx.fillRect(px+TILE/2-1,py+d,2,8);}
      if(ty%8===0){ctx.fillStyle='#2c2c44';
        for(let d=0;d<TILE;d+=16)ctx.fillRect(px+d,py+TILE/2-1,8,2);}
    }else if(t===2){ctx.fillStyle='#24243a';ctx.fillRect(px,py,TILE,TILE);
      ctx.strokeStyle='#1a1a2c';ctx.strokeRect(px+.5,py+.5,TILE-1,TILE-1);}
    else{ // building — neon-lit blocks with window grids
      const s=buildSeed[ty][tx];
      ctx.fillStyle=s<.33?'#2a1240':s<.66?'#10233d':'#3a1030';
      ctx.fillRect(px,py,TILE,TILE);
      ctx.strokeStyle=s<.5?'#ff2d95':'#00f0ff';ctx.lineWidth=2;
      ctx.strokeRect(px+3,py+3,TILE-6,TILE-6);
      ctx.fillStyle='rgba(255,230,0,.55)';
      for(let wy=0;wy<3;wy++)for(let wx=0;wx<3;wx++)
        if(((tx*7+ty*13+wx*3+wy)%5)===0)ctx.fillRect(px+10+wx*16,py+10+wy*16,8,8);
      ctx.lineWidth=1;
    }
  }
}
function drawCar(c){
  ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.a);
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(-c.w/2+3,-c.h/2+4,c.w,c.h);
  ctx.fillStyle=c.col;ctx.fillRect(-c.w/2,-c.h/2,c.w,c.h);
  ctx.fillStyle='rgba(10,10,25,.75)';ctx.fillRect(-6,-c.h/2+3,14,c.h-6); // windshield
  ctx.fillStyle=c.ai==='cop'?(Math.floor(Date.now()/200)%2?'#ff2d95':'#00f0ff'):'#000';
  if(c.ai==='cop')ctx.fillRect(-2,-c.h/2-3,8,6);                        // siren
  ctx.fillStyle='#ffe600';ctx.fillRect(c.w/2-3,-c.h/2+3,3,5);           // headlight
  ctx.fillRect(c.w/2-3,c.h/2-8,3,5);
  ctx.restore();
}
function drawPed(p){
  ctx.save();ctx.translate(p.x,p.y);
  ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(2,4,7,4,0,0,6.28);ctx.fill();
  ctx.fillStyle=p.hp<=0?'#552233':p.col;
  ctx.beginPath();ctx.arc(0,0,7,0,6.28);ctx.fill();
  ctx.fillStyle='#ffd6a0';ctx.beginPath();ctx.arc(0,0,3.5,0,6.28);ctx.fill(); // head
  if(p.hp<=0){ctx.strokeStyle='#ff2d95';ctx.beginPath();ctx.moveTo(-6,-6);ctx.lineTo(6,6);
    ctx.moveTo(6,-6);ctx.lineTo(-6,6);ctx.stroke();}
  ctx.restore();
}
function drawPlayer(){
  ctx.save();ctx.translate(player.x,player.y);
  const s=player.inv>0&&Math.floor(Date.now()/60)%2?0.5:1;
  ctx.scale(s,s);
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(2,5,9,5,0,0,6.28);ctx.fill();
  ctx.rotate(player.a);
  ctx.fillStyle='#ff2d95';ctx.fillRect(-7,-7,14,14);                      // pink jacket
  ctx.fillStyle='#ffd6a0';ctx.beginPath();ctx.arc(3,0,4,0,6.28);ctx.fill(); // face
  ctx.fillStyle='#111';ctx.fillRect(7,-2,12,4);                           // gun
  ctx.restore();
}
function drawMinimap(){
  const S=170,sc=S/(MAP*TILE);
  const mx=W-S-14,my=H-S-14;
  ctx.save();ctx.globalAlpha=.85;
  ctx.fillStyle='#0a0614';ctx.fillRect(mx,my,S,S);
  ctx.strokeStyle='#ff2d95';ctx.strokeRect(mx+.5,my+.5,S-1,S-1);
  // roads
  ctx.fillStyle='#39ff88';
  for(let t=0;t<MAP;t+=8){
    ctx.fillRect(mx+t*TILE*sc,my,Math.max(2,TILE*sc),S);
    ctx.fillRect(mx,my+t*TILE*sc,S,Math.max(2,TILE*sc));}
  // pickups
  ctx.fillStyle='#ffe600';
  for(const p of pickups){ctx.fillRect(mx+p.x*sc-1,my+p.y*sc-1,3,3);}
  // cops
  ctx.fillStyle='#00f0ff';
  for(const c of cars)if(c.ai==='cop'){ctx.fillRect(mx+c.x*sc-2,my+c.y*sc-2,4,4);}
  // player
  ctx.fillStyle='#ff2d95';ctx.fillRect(mx+player.x*sc-2.5,my+player.y*sc-2.5,5,5);
  ctx.restore();
}
let showMap=true;
function render(){
  const sh=shake();
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle='#0a0614';ctx.fillRect(0,0,W,H);
  ctx.save();
  ctx.translate(-cam.x+sh.x,-cam.y+sh.y);
  drawWorld();
  for(const pk of pickups){ctx.fillStyle=pk.kind==='cash'?'#39ff88':'#ffe600';
    ctx.beginPath();ctx.arc(pk.x,pk.y,6+Math.sin(Date.now()/200)*2,0,6.28);ctx.fill();}
  for(const p of peds)drawPed(p);
  for(const c of cars)if(c!==player.car)drawCar(c);
  if(player.car)drawCar(player.car);
  if(!player.car)drawPlayer();
  else{ // driver peek + muzzle from car
    ctx.save();ctx.translate(player.car.x,player.car.y);ctx.rotate(player.car.a);
    ctx.fillStyle='#ffd6a0';ctx.beginPath();ctx.arc(0,0,5,0,6.28);ctx.fill();ctx.restore();}
  for(const b of bullets){ctx.fillStyle=b.from==='player'?'#ffe600':'#ff2d95';
    ctx.beginPath();ctx.arc(b.x,b.y,3,0,6.28);ctx.fill();}
  for(const p of parts){ctx.globalAlpha=clamp(p.life/30,0,1);
    ctx.fillStyle=p.col;ctx.fillRect(p.x-2,p.y-2,4,4);ctx.globalAlpha=1;}
  ctx.restore();
  // vignette
  const g=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)/2.5,W/2,H/2,Math.max(W,H)/1.6);
  g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,10,.55)');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  if(showMap)drawMinimap();
  // HUD sync
  document.getElementById('money').textContent='$'+player.money;
  document.getElementById('stars').innerHTML=
    '<span style="color:#ffe600">'+'★'.repeat(player.wanted)+
    '</span><span style="color:#333">'+'★'.repeat(5-player.wanted)+'</span>';
  document.getElementById('health').style.width=clamp(player.hp,0,100)+'%';
}

/* ================= main loop ================= */
let last=performance.now();
function loop(now){
  const dt=Math.min((now-last)/16.67,3);last=now;
  for(let i=0;i<dt;i++)update();
  updateCamera();
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
toast('WELCOME TO NEON VICE — 1986');
</script>
</body>
