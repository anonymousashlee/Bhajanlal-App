<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Vice City — Web Edition</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#000; font-family:'Segoe UI',Arial,sans-serif; color:#fff; }
  #game { position:fixed; inset:0; }
  #hud { position:fixed; inset:0; pointer-events:none; z-index:10; text-shadow:2px 2px 4px #000; }
  .hud-block { position:absolute; }
  #healthbox { top:20px; left:20px; }
  .bar { width:200px; height:14px; background:rgba(0,0,0,0.6); border:2px solid #fff; border-radius:4px; overflow:hidden; margin-top:4px; }
  .bar-fill { height:100%; transition:width .1s; }
  #healthfill { background:linear-gradient(90deg,#e74c3c,#c0392b); }
  #armorfill { background:linear-gradient(90deg,#3498db,#2980b9); }
  #money { top:20px; right:20px; font-size:28px; font-weight:bold; color:#2ecc71; }
  #wanted { top:60px; right:20px; }
  .star { font-size:22px; color:#555; margin-left:2px; }
  .star.on { color:#f1c40f; text-shadow:0 0 8px #f1c40f; }
  #weapon { bottom:20px; right:20px; font-size:18px; text-align:right; }
  #ammo { font-size:24px; font-weight:bold; }
  #mission { top:20px; left:50%; transform:translateX(-50%); text-align:center; max-width:60%; }
  #mission h2 { color:#f1c40f; font-size:22px; }
  #mission p { font-size:14px; margin-top:4px; }
  #minimap { bottom:20px; left:20px; width:180px; height:180px; border:3px solid #fff; border-radius:50%; background:rgba(0,0,0,0.7); overflow:hidden; }
  #minimap canvas { width:100%; height:100%; }
  #crosshair { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:20px; height:20px; pointer-events:none; }
  #crosshair::before, #crosshair::after { content:''; position:absolute; background:#fff; }
  #crosshair::before { left:9px; top:0; width:2px; height:20px; }
  #crosshair::after { top:9px; left:0; width:20px; height:2px; }
  #prompt { bottom:120px; left:50%; transform:translateX(-50%); font-size:16px; background:rgba(0,0,0,0.7); padding:8px 16px; border-radius:6px; display:none; }
  #menu { position:fixed; inset:0; background:radial-gradient(circle at 50% 40%, #2d1b4e 0%, #0a0614 75%); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:100; }
  #menu h1 { font-size:72px; color:#ff6b9d; text-shadow:0 0 30px #ff6b9d, 0 0 60px #7c4dff, 4px 4px 0 #000; letter-spacing:6px; font-style:italic; }
  #menu h2 { color:#f1c40f; margin:10px 0 40px; }
  #menu button { background:#ff6b9d; color:#fff; border:none; padding:14px 40px; font-size:20px; border-radius:8px; cursor:pointer; margin:8px; font-weight:bold; box-shadow:0 4px 0 #c0392b; }
  #menu button:hover { transform:translateY(-2px); }
  #menu .controls { margin-top:30px; font-size:13px; color:#ccc; max-width:600px; text-align:center; line-height:1.8; }
  #loading { position:fixed; inset:0; background:#000; display:flex; align-items:center; justify-content:center; z-index:50; color:#fff; font-size:24px; pointer-events:none; }
  #damage { position:fixed; inset:0; pointer-events:none; z-index:5; background:radial-gradient(circle,transparent 40%,rgba(255,0,0,0.4) 100%); opacity:0; transition:opacity .2s; }
  #speedo { bottom:20px; left:200px; font-size:14px; }
  #pause { position:fixed; inset:0; background:rgba(0,0,0,0.7); display:none; align-items:center; justify-content:center; z-index:90; font-size:48px; color:#f1c40f; }
</style>
</head>
<body>
<div id="loading">Loading Vice City...</div>
<div id="menu">
  <h1>VICE CITY</h1>
  <h2>Web Edition</h2>
  <button id="startBtn">START GAME</button>
  <div class="controls">
    WASD move/drive · Mouse look · Shift run · Space jump (on foot) / handbrake · E enter/exit vehicle<br>
    F / Click fire · R reload · 1-3 weapons · C camera · Tab minimap · Esc pause
  </div>
</div>
<div id="game"></div>
<div id="hud">
  <div class="hud-block" id="healthbox">
    <div>Health</div>
    <div class="bar"><div class="bar-fill" id="healthfill" style="width:100%"></div></div>
    <div>Armor</div>
    <div class="bar"><div class="bar-fill" id="armorfill" style="width:0%"></div></div>
  </div>
  <div class="hud-block" id="money">$0</div>
  <div class="hud-block" id="wanted"></div>
  <div class="hud-block" id="mission"><h2></h2><p></p></div>
  <div class="hud-block" id="weapon"><div id="wname">Fist</div><div id="ammo">∞</div></div>
  <div class="hud-block" id="minimap"><canvas id="mmcanvas" width="180" height="180"></canvas></div>
  <div class="hud-block" id="prompt"></div>
  <div class="hud-block" id="crosshair"></div>
  <div class="hud-block" id="speedo"></div>
</div>
<div id="damage"></div>
<div id="pause">PAUSED</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script>
// ============================================================
// VICE CITY — Web Edition (single-file, Three.js r128)
// ============================================================
const CFG = {
  cityExtent: 260,
  roadWidth: 10,
  blockSize: 40,
  gravity: -22,
  playerSpeed: 6.5,
  runMult: 1.7,
  jumpVel: 8,
  camDist: 9,
  camHeight: 4.5,
};

// ---------- STATE ----------
const STATE = {
  started:false, paused:false, inVehicle:false, currentVehicle:null,
  health:100, armor:0, money:0, wanted:0,
  weapon:0, ammo:{0:Infinity,1:60,2:120,3:30},
  cameraMode:0, showMinimap:true,
  player:{x:0,y:0,z:0, vx:0,vy:0,vz:0, yaw:0, pitch:0, onGround:true},
  keys:{}, mouseLocked:false,
  lastShot:0, reloadUntil:0,
  missionIdx:0, missionProgress:0,
  time:0, dayPhase:0.25,
};

const WEAPONS = [
  {name:'Fist', ammo:Infinity, dmg:12, rate:0.35, range:2.2, melee:true},
  {name:'Pistol', ammo:60, dmg:25, rate:0.22, range:80, spread:0.02},
  {name:'SMG', ammo:120, dmg:14, rate:0.09, range:60, spread:0.06},
  {name:'Shotgun', ammo:30, dmg:18, rate:0.7, range:35, pellets:6, spread:0.12},
];

// ---------- THREE SETUP ----------
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xff8c6b, 80, 320);
const camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.1, 600);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.getElementById('game').appendChild(renderer.domElement);

// bloom post-processing
let composer = null, bloomPass = null;
try {
  composer = new THREE.EffectComposer(renderer);
  composer.addPass(new THREE.RenderPass(scene, camera));
  bloomPass = new THREE.UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.9, 0.4, 0.15);
  composer.addPass(bloomPass);
} catch(e){ composer = null; }

const ambient = new THREE.AmbientLight(0xffd4b0, 0.45);
scene.add(ambient);
const sun = new THREE.DirectionalLight(0xfff2d6, 0.85);
sun.position.set(60,80,40);
sun.castShadow = true;
sun.shadow.mapSize.set(1024,1024);
sun.shadow.camera.near=1; sun.shadow.camera.far=260;
sun.shadow.camera.left=-140; sun.shadow.camera.right=140;
sun.shadow.camera.top=140; sun.shadow.camera.bottom=-140;
scene.add(sun);
const hemi = new THREE.HemisphereLight(0xffb088, 0x404060, 0.35);
scene.add(hemi);

// sky
const skyGeo = new THREE.SphereGeometry(500,32,16);
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide,
  uniforms: { topColor:{value:new THREE.Color(0xff6b9d)}, bottomColor:{value:new THREE.Color(0xffb347)}, offset:{value:20}, exponent:{value:0.6} },
  vertexShader:`varying vec3 vWorldPosition; void main(){ vec4 wp=modelMatrix*vec4(position,1.0); vWorldPosition=wp.xyz; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader:`uniform vec3 topColor; uniform vec3 bottomColor; uniform float offset; uniform float exponent; varying vec3 vWorldPosition; void main(){ float h=normalize(vWorldPosition+offset).y; gl_FragColor=vec4(mix(bottomColor,topColor,max(pow(max(h,0.0),exponent),0.0)),1.0); }`
});
scene.add(new THREE.Mesh(skyGeo, skyMat));

// water
const water = new THREE.Mesh(new THREE.PlaneGeometry(2000,2000), new THREE.MeshStandardMaterial({color:0x1a4a7a, roughness:0.25, metalness:0.3, transparent:true, opacity:0.9}));
water.rotation.x = -Math.PI/2;
water.position.y = -1.2;
scene.add(water);

// ground
const ground = new THREE.Mesh(new THREE.PlaneGeometry(CFG.cityExtent*2, CFG.cityExtent*2), new THREE.MeshStandardMaterial({color:0x2a2a2a, roughness:0.95}));
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

// ---------- HELPERS ----------
function rnd(a,b){ return a + Math.random()*(b-a); }
function rndInt(a,b){ return Math.floor(rnd(a,b+1)); }
const COLLIDERS = []; // AABB {minX,maxX,minZ,maxZ}
function addCollider(x,z,w,d){ COLLIDERS.push({minX:x-w/2,maxX:x+w/2,minZ:z-d/2,maxZ:z+d/2}); }

// ---------- WORLD BUILDING ----------
const roadMat = new THREE.MeshStandardMaterial({color:0x1f1f1f, roughness:0.95});
const sidewalkMat = new THREE.MeshStandardMaterial({color:0x777777, roughness:0.9});
const grassMat = new THREE.MeshStandardMaterial({color:0x2d5a2d, roughness:0.9});
const laneMat = new THREE.MeshStandardMaterial({color:0xffffff, roughness:0.9});

// roads grid
const EXT = CFG.cityExtent;
for(let i=-EXT; i<=EXT; i+=CFG.blockSize){
  // horizontal road
  const r1 = new THREE.Mesh(new THREE.PlaneGeometry(EXT*2, CFG.roadWidth), roadMat);
  r1.rotation.x = -Math.PI/2; r1.position.set(0,0.01,i); r1.receiveShadow=true; scene.add(r1);
  // vertical road
  const r2 = new THREE.Mesh(new THREE.PlaneGeometry(CFG.roadWidth, EXT*2), roadMat);
  r2.rotation.x = -Math.PI/2; r2.position.set(i,0.01,0); r2.receiveShadow=true; scene.add(r2);
  // lane lines
  const ln = new THREE.Mesh(new THREE.PlaneGeometry(EXT*2, 0.25), laneMat);
  ln.rotation.x = -Math.PI/2; ln.position.set(0,0.02,i); scene.add(ln);
  const ln2 = new THREE.Mesh(new THREE.PlaneGeometry(0.25, EXT*2), laneMat);
  ln2.rotation.x = -Math.PI/2; ln2.position.set(i,0.02,0); scene.add(ln2);
}
// center divider yellow
for(let i=-EXT; i<=EXT; i+=CFG.blockSize){
  const yl = new THREE.Mesh(new THREE.PlaneGeometry(EXT*2,0.4), new THREE.MeshStandardMaterial({color:0xf1c40f}));
  yl.rotation.x=-Math.PI/2; yl.position.set(0,0.02,i+CFG.roadWidth/2-0.2); scene.add(yl);
}

const bldgColors = [0xe8c8a0,0xd4a574,0xc9b8a0,0xb0a090,0x9aa0a8,0x7a8a9a,0xff9a7a,0x7ab8ff,0xb0d0a0];
const windowMat = new THREE.MeshStandardMaterial({color:0xffffcc, emissive:0xffffaa, emissiveIntensity:0.25});
function createBuilding(x,z,w,d,h,colorIdx){
  const color = bldgColors[colorIdx % bldgColors.length];
  const mat = new THREE.MeshStandardMaterial({color, roughness:0.65, metalness:0.08});
  const b = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
  b.position.set(x, h/2, z);
  b.castShadow = true; b.receiveShadow = true;
  scene.add(b);
  // windows
  const winCount = Math.floor(h/3);
  for(let wy=2; wy<h-1; wy+=3){
    for(let wx=-w/2+1; wx<w/2-0.5; wx+=2){
      const win = new THREE.Mesh(new THREE.PlaneGeometry(0.9,1.6), windowMat);
      win.position.set(x+wx, wy, z+d/2+0.01);
      scene.add(win);
      const win2 = new THREE.Mesh(new THREE.PlaneGeometry(0.9,1.6), windowMat);
      win2.position.set(x+wx, wy, z-d/2-0.01);
      win2.rotation.y = Math.PI;
      scene.add(win2);
    }
  }
  // rooftop detail
  if(h>12){
    const roof = new THREE.Mesh(new THREE.BoxGeometry(w*0.6, 1.2, d*0.6), new THREE.MeshStandardMaterial({color:0x555555}));
    roof.position.set(x, h+0.6, z);
    scene.add(roof);
  }
  addCollider(x,z,w+1,d+1);
  // neon light for some buildings
  if(Math.random() < 0.25){
    const neonCol = [0xff6b9d,0x00e5ff,0xf1c40f,0x7c4dff][Math.floor(Math.random()*4)];
    const pl = new THREE.PointLight(neonCol, 1.2, 60);
    pl.position.set(x, h*0.6, z);
    scene.add(pl);
  }
}
// place buildings in blocks
for(let bx=-EXT+CFG.blockSize; bx<EXT; bx+=CFG.blockSize){
  for(let bz=-EXT+CFG.blockSize; bz<EXT; bz+=CFG.blockSize){
    // skip if too close to origin road? fine
    const cx = bx + rnd(-6,6);
    const cz = bz + rnd(-6,6);
    const w = rnd(10,22);
    const d = rnd(10,22);
    const h = rnd(6, 38);
    // don't overlap roads: ensure block center away from road lines
    // roads at multiples of blockSize; buildings between
    createBuilding(cx,cz,w,d,h, rndInt(0,bldgColors.length-1));
    // sometimes second smaller building
    if(Math.random()<0.35){
      createBuilding(cx+rnd(-8,8), cz+rnd(-8,8), rnd(6,12), rnd(6,12), rnd(4,14), rndInt(0,bldgColors.length-1));
    }
  }
}

// palm trees
function createPalm(x,z){
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.25,0.4,6,8), new THREE.MeshStandardMaterial({color:0x8b5a2b, roughness:0.9}));
  trunk.position.set(x,3,z); trunk.castShadow=true; scene.add(trunk);
  const frondMat = new THREE.MeshStandardMaterial({color:0x2d8a2d, roughness:0.8, side:THREE.DoubleSide});
  for(let i=0;i<6;i++){
    const a = i/6*Math.PI*2;
    const frond = new THREE.Mesh(new THREE.PlaneGeometry(4,1.2), frondMat);
    frond.position.set(x+Math.cos(a)*1.5, 6.6, z+Math.sin(a)*1.5);
    frond.rotation.y = -a;
    frond.rotation.x = -0.6;
    scene.add(frond);
  }
  const top = new THREE.Mesh(new THREE.SphereGeometry(0.6,8,6), new THREE.MeshStandardMaterial({color:0x2d8a2d}));
  top.position.set(x,6.8,z); scene.add(top);
}
for(let i=0;i<120;i++){
  createPalm(rnd(-EXT+20,EXT-20), rnd(-EXT+20,EXT-20));
}

// ---------- VEHICLES ----------
const VEHICLES = [];
const vehicleColors = [0xe74c3c,0x3498db,0x2ecc71,0xf1c40f,0x9b59b6,0xffffff,0x111111,0xff8c00];
function createVehicle(x,z,type='sedan'){
  const g = new THREE.Group();
  let w=2.0,d=4.2,h=1.2;
  if(type==='sports'){ w=1.9;d=4.0;h=0.9; }
  if(type==='police'){ w=2.1;d=4.4;h=1.3; }
  const bodyMat = new THREE.MeshStandardMaterial({color: vehicleColors[rndInt(0,vehicleColors.length-1)], roughness:0.3, metalness:0.6});
  const body = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), bodyMat);
  body.position.y = h/2+0.3; body.castShadow=true; g.add(body);
  // cabin
  const cabin = new THREE.Mesh(new THREE.BoxGeometry(w*0.85, h*0.7, d*0.55), new THREE.MeshStandardMaterial({color:0x88ccff, roughness:0.1, metalness:0.4, transparent:true, opacity:0.7}));
  cabin.position.set(0, h+0.2, -0.2); g.add(cabin);
  // wheels
  const wheelMat = new THREE.MeshStandardMaterial({color:0x111111});
  for(let wx of [-w/2+0.15, w/2-0.15]){
    for(let wz of [d/2-0.7, -d/2+0.7]){
      const wh = new THREE.Mesh(new THREE.CylinderGeometry(0.35,0.35,0.3,12), wheelMat);
      wh.rotation.z = Math.PI/2;
      wh.position.set(wx,0.35,wz); g.add(wh);
    }
  }
  // police light bar
  if(type==='police'){
    const bar = new THREE.Mesh(new THREE.BoxGeometry(w*0.6,0.25,0.6), new THREE.MeshStandardMaterial({color:0xff0000, emissive:0xff0000, emissiveIntensity:1}));
    bar.position.set(0,h+0.6,0); g.add(bar);
  }
  g.position.set(x,0,z);
  scene.add(g);
  const v = {mesh:g, x,y:0,z, vx:0,vz:0, yaw:0, type, health:100, driver:null};
  VEHICLES.push(v);
  return v;
}
// scatter vehicles
const vtypes = ['sedan','sedan','sports','police'];
for(let i=0;i<45;i++){
  createVehicle(rnd(-EXT+30,EXT-30), rnd(-EXT+30,EXT-30), vtypes[rndInt(0,vtypes.length-1)]);
}

// ---------- PLAYER MESH ----------
const playerGroup = new THREE.Group();
const bodyMat = new THREE.MeshStandardMaterial({color:0x3498db, roughness:0.6});
const playerBody = new THREE.Mesh(new THREE.CylinderGeometry(0.45,0.45,1.4,12), bodyMat);
playerBody.position.y = 0.95; playerBody.castShadow=true;
playerGroup.add(playerBody);
// head
const head = new THREE.Mesh(new THREE.SphereGeometry(0.35,12,10), new THREE.MeshStandardMaterial({color:0xf5cba7}));
head.position.y = 1.75; playerGroup.add(head);
scene.add(playerGroup);

// ---------- NPCS ----------
const NPCS = [];
function createNPC(x,z,isPolice=false){
  const g = new THREE.Group();
  const col = isPolice ? 0x1a3a7a : [0xe74c3c,0x2ecc71,0x9b59b6,0xf39c12,0x1abc9c][rndInt(0,4)];
  const b = new THREE.Mesh(new THREE.CylinderGeometry(0.4,0.4,1.2,12), new THREE.MeshStandardMaterial({color:col, roughness:0.7}));
  b.position.y=0.85; b.castShadow=true; g.add(b);
  const h = new THREE.Mesh(new THREE.SphereGeometry(0.3,10,8), new THREE.MeshStandardMaterial({color:0xf5cba7}));
  h.position.y=1.6; g.add(h);
  g.position.set(x,0,z);
  scene.add(g);
  const n = {mesh:g, x,z, vx:0,vz:0, yaw:rnd(0,Math.PI*2), state:'walk', timer:rnd(2,6), isPolice, health:40, alive:true, speed:isPolice?5:2.5};
  NPCS.push(n);
  return n;
}
for(let i=0;i<60;i++) createNPC(rnd(-EXT+20,EXT-20), rnd(-EXT+20,EXT-20), false);
for(let i=0;i<8;i++) createNPC(rnd(-EXT+20,EXT-20), rnd(-EXT+20,EXT-20), true);

// ---------- PICKUPS ----------
const PICKUPS = [];
const pickupColors = {health:0xe74c3c, armor:0x3498db, money:0x2ecc71, ammo:0xf1c40f};
function createPickup(x,z,type){
  const col = pickupColors[type];
  const m = new THREE.Mesh(new THREE.BoxGeometry(0.8,0.8,0.8), new THREE.MeshStandardMaterial({color:col, emissive:col, emissiveIntensity:0.4}));
  m.position.set(x,1.0,z);
  scene.add(m);
  PICKUPS.push({mesh:m, x,z,type, bob:rnd(0,Math.PI*2)});
}
for(let i=0;i<40;i++){
  const types=['health','armor','money','ammo','money','money'];
  createPickup(rnd(-EXT+20,EXT-20), rnd(-EXT+20,EXT-20), types[rndInt(0,types.length-1)]);
}

// ---------- MISSIONS ----------
const MISSIONS = [
  {title:'Welcome to Vice City', desc:'Drive to the marker on the minimap.', target:new THREE.Vector3(80,0,60), reward:500},
  {title:'Package Run', desc:'Collect the package at the beach.', target:new THREE.Vector3(-100,0,-80), reward:1000},
  {title:'Eliminate Target', desc:'Find and eliminate the red target.', target:new THREE.Vector3(120,0,-120), reward:2000, targetNPC:true},
  {title:'Getaway', desc:'Reach the safehouse.', target:new THREE.Vector3(-180,0,180), reward:1500},
];
let missionMarker = null;
function spawnMissionMarker(){
  if(missionMarker){ scene.remove(missionMarker); }
  const m = MISSIONS[STATE.missionIdx % MISSIONS.length];
  missionMarker = new THREE.Mesh(new THREE.CylinderGeometry(0.6,0.6,0.2,16), new THREE.MeshStandardMaterial({color:0xf1c40f, emissive:0xf1c40f, emissiveIntensity:0.8, transparent:true, opacity:0.7}));
  missionMarker.position.copy(m.target); missionMarker.position.y=0.1;
  scene.add(missionMarker);
  // vertical beam
  const beam = new THREE.Mesh(new THREE.CylinderGeometry(0.15,0.15,40,8), new THREE.MeshStandardMaterial({color:0xf1c40f, emissive:0xf1c40f, emissiveIntensity:0.6, transparent:true, opacity:0.35}));
  beam.position.copy(m.target); beam.position.y=20;
  scene.add(beam);
  missionMarker.beam = beam;
  document.querySelector('#mission h2').textContent = m.title;
  document.querySelector('#mission p').textContent = m.desc;
}
// mission target npc
let missionTargetNPC = null;

// ---------- BULLETS ----------
const BULLETS = [];
function spawnBullet(origin, dir, dmg, fromPlayer){
  const m = new THREE.Mesh(new THREE.SphereGeometry(0.12,6,6), new THREE.MeshStandardMaterial({color: fromPlayer?0xffff00:0xff3333, emissive:fromPlayer?0xffff00:0xff3333, emissiveIntensity:1}));
  m.position.copy(origin);
  scene.add(m);
  BULLETS.push({mesh:m, pos:origin.clone(), vel:dir.clone().multiplyScalar(90), life:1.2, dmg, fromPlayer});
}

// ---------- PARTICLES ----------
const PARTICLES = [];
function spawnParticle(pos, col, count=8, speed=6){
  for(let i=0;i<count;i++){
    const m = new THREE.Mesh(new THREE.SphereGeometry(0.12,6,6), new THREE.MeshStandardMaterial({color:col, emissive:col, emissiveIntensity:0.6}));
    m.position.copy(pos);
    scene.add(m);
    const dir = new THREE.Vector3(rnd(-1,1), rnd(0,1), rnd(-1,1)).normalize();
    PARTICLES.push({mesh:m, pos:pos.clone(), vel:dir.multiplyScalar(rnd(2,speed)), life:rnd(0.3,0.7), gravity:-12});
  }
}

// ---------- INPUT ----------
window.addEventListener('keydown', e=>{
  STATE.keys[e.code]=true;
  if(e.code==='Escape'){ if(STATE.started){ STATE.paused=!STATE.paused; document.getElementById('pause').style.display=STATE.paused?'flex':'none'; } }
  if(e.code==='KeyE' && STATE.started && !STATE.paused){
    if(STATE.inVehicle){ exitVehicle(); }
    else { const v=nearestVehicle(); if(v) enterVehicle(v); }
  }
  if(e.code==='KeyF' && STATE.started && !STATE.paused){ tryFire(); }
  if(e.code==='KeyR' && STATE.started && !STATE.paused){
    const w=WEAPONS[STATE.weapon];
    if(w.ammo!==Infinity){ STATE.ammo[STATE.weapon]=w.ammo; updateHUD(); }
  }
  if(e.code==='KeyC' && STATE.started){ STATE.cameraMode=(STATE.cameraMode+1)%3; }
  if(e.code==='Tab' && STATE.started){ e.preventDefault(); STATE.showMinimap=!STATE.showMinimap; document.getElementById('minimap').style.display=STATE.showMinimap?'block':'none'; }
  if(e.code==='Digit1') setWeapon(0);
  if(e.code==='Digit2') setWeapon(1);
  if(e.code==='Digit3') setWeapon(2);
  if(e.code==='Digit4') setWeapon(3);
});
window.addEventListener('keyup', e=>{ STATE.keys[e.code]=false; });
window.addEventListener('mousemove', e=>{
  if(!STATE.mouseLocked || STATE.paused) return;
  STATE.player.yaw -= e.movementX*0.0025;
  STATE.player.pitch -= e.movementY*0.0025;
  STATE.player.pitch = Math.max(-1.2, Math.min(1.2, STATE.player.pitch));
});
window.addEventListener('mousedown', e=>{
  if(!STATE.started) return;
  if(!STATE.mouseLocked){
    try { const p = renderer.domElement.requestPointerLock(); if(p && p.catch) p.catch(()=>{}); } catch(e){}
    return;
  }
  if(e.button===0) tryFire();
});
document.addEventListener('pointerlockchange', ()=>{ STATE.mouseLocked = (document.pointerLockElement===renderer.domElement); });

function setWeapon(i){
  if(i>=WEAPONS.length) return;
  STATE.weapon=i;
  updateHUD();
}

// ---------- GAME LOGIC HELPERS ----------
function nearestVehicle(){
  let best=null, bestD=3.5;
  for(const v of VEHICLES){
    const dx = v.x - STATE.player.x, dz = v.z - STATE.player.z;
    const d = Math.hypot(dx,dz);
    if(d<bestD){ bestD=d; best=v; }
  }
  return best;
}
function enterVehicle(v){
  STATE.inVehicle=true; STATE.currentVehicle=v;
  STATE.player.x=v.x; STATE.player.z=v.z;
  playerGroup.visible=false;
}
function exitVehicle(){
  const v=STATE.currentVehicle;
  if(!v) return;
  STATE.inVehicle=false;
  STATE.player.x = v.x + Math.sin(v.yaw)*3;
  STATE.player.z = v.z + Math.cos(v.yaw)*3;
  STATE.player.vx=0; STATE.player.vz=0;
  STATE.currentVehicle=null;
  playerGroup.visible=true;
}

function tryFire(){
  if(STATE.paused || !STATE.started) return;
  const now = performance.now()/1000;
  const w = WEAPONS[STATE.weapon];
  if(now - STATE.lastShot < w.rate) return;
  if(STATE.weapon>0 && STATE.ammo[STATE.weapon]<=0){
    // out of ammo
    return;
  }
  STATE.lastShot = now;
  if(STATE.weapon>0) STATE.ammo[STATE.weapon]--;
  updateHUD();

  if(STATE.inVehicle){
    // horn? no
  }

  const origin = new THREE.Vector3();
  const dir = new THREE.Vector3();
  if(STATE.inVehicle){
    const v=STATE.currentVehicle;
    origin.set(v.x, 1.2, v.z);
    dir.set(Math.sin(v.yaw), 0, Math.cos(v.yaw));
  } else {
    origin.copy(playerGroup.position); origin.y += 1.5;
    // forward from yaw+pitch
    dir.set(Math.sin(STATE.player.yaw)*Math.cos(STATE.player.pitch), Math.sin(STATE.player.pitch), Math.cos(STATE.player.yaw)*Math.cos(STATE.player.pitch));
  }

  if(w.melee){
    // melee hit nearby npcs
    for(const n of NPCS){
      if(!n.alive) continue;
      const dx=n.x-STATE.player.x, dz=n.z-STATE.player.z;
      const d=Math.hypot(dx,dz);
      if(d<2.5){
        const ang = Math.atan2(dx,dz);
        // check facing
        const diff = Math.abs(((ang-STATE.player.yaw+Math.PI)%(Math.PI*2))-Math.PI);
        if(diff<1.2){ n.health -= w.dmg; spawnParticle(new THREE.Vector3(n.x,1,n.z),0xff5555,6,4); if(n.health<=0){ n.alive=false; scene.remove(n.mesh); STATE.money+=50; updateHUD(); } }
      }
    }
    // vehicles
    for(const v of VEHICLES){
      const dx=v.x-STATE.player.x, dz=v.z-STATE.player.z;
      if(Math.hypot(dx,dz)<3){ v.health-=w.dmg; spawnParticle(new THREE.Vector3(v.x,1,v.z),0x888888,6,4); }
    }
    return;
  }

  const pellets = w.pellets||1;
  for(let p=0;p<pellets;p++){
    const sd = dir.clone();
    sd.x += (Math.random()-0.5)*w.spread;
    sd.y += (Math.random()-0.5)*w.spread*0.5;
    sd.z += (Math.random()-0.5)*w.spread;
    sd.normalize();
    spawnBullet(origin.clone(), sd, w.dmg, true);
  }
  spawnParticle(origin, 0xffdd88, 4, 8);
}

// ---------- COLLISION ----------
function resolveCollisions(pos, radius=0.5){
  for(const c of COLLIDERS){
    if(pos.x+radius > c.minX && pos.x-radius < c.maxX && pos.z+radius > c.minZ && pos.z-radius < c.maxZ){
      // push out
      const overlapX = Math.min(pos.x+radius - c.minX, c.maxX - (pos.x-radius));
      const overlapZ = Math.min(pos.z+radius - c.minZ, c.maxZ - (pos.z-radius));
      if(overlapX < overlapZ){
        if(pos.x < (c.minX+c.maxX)/2) pos.x = c.minX - radius;
        else pos.x = c.maxX + radius;
      } else {
        if(pos.z < (c.minZ+c.maxZ)/2) pos.z = c.minZ - radius;
        else pos.z = c.maxZ + radius;
      }
    }
  }
  // world bounds
  const B = EXT-5;
  pos.x = Math.max(-B, Math.min(B, pos.x));
  pos.z = Math.max(-B, Math.min(B, pos.z));
}

// ---------- AUDIO ----------
let AC=null, engineOsc=null, engineGain=null, sirenOsc=null;
function initAudio(){
  if(AC) return;
  try {
    const Ctor = window.AudioContext || window.webkitAudioContext;
    if(!Ctor) return;
    AC = new Ctor();
    engineOsc = AC.createOscillator(); engineOsc.type='sawtooth';
    engineGain = AC.createGain(); engineGain.gain.value=0.0001;
    const filt = AC.createBiquadFilter(); filt.type='lowpass'; filt.frequency.value=900;
    engineOsc.connect(filt); filt.connect(engineGain); engineGain.connect(AC.destination);
    engineOsc.start();
    // siren
    sirenOsc = AC.createOscillator(); sirenOsc.type='square';
    const sg = AC.createGain(); sg.gain.value=0.0001;
    sirenOsc.connect(sg); sg.connect(AC.destination); sirenOsc.start();
    AC._sg = sg;
  } catch(e){ AC=null; }
}
function updateAudio(){
  if(!AC) return;
  let speed = 0;
  if(STATE.inVehicle && STATE.currentVehicle){
    speed = Math.hypot(STATE.currentVehicle.vx||0, STATE.currentVehicle.vz||0);
  } else {
    speed = Math.hypot(STATE.player.vx||0, STATE.player.vz||0);
  }
  const freq = 55 + speed*4;
  engineOsc.frequency.setTargetAtTime(freq, AC.currentTime, 0.1);
  const vol = STATE.started && !STATE.paused ? Math.min(0.18, 0.04 + speed*0.004) : 0.0001;
  engineGain.gain.setTargetAtTime(vol, AC.currentTime, 0.1);
  // siren
  if(STATE.inVehicle && STATE.currentVehicle && STATE.currentVehicle.type==='police' && STATE.wanted>0.5){
    sirenOsc.frequency.setTargetAtTime(700 + Math.sin(STATE.time*8)*200, AC.currentTime, 0.05);
    AC._sg.gain.setTargetAtTime(0.06, AC.currentTime, 0.05);
  } else {
    AC._sg.gain.setTargetAtTime(0.0001, AC.currentTime, 0.1);
  }
}
function sfxBeep(freq=440, dur=0.1, vol=0.2){
  if(!AC) return;
  const o = AC.createOscillator(); o.type='square'; o.frequency.value=freq;
  const g = AC.createGain(); g.gain.value=vol;
  o.connect(g); g.connect(AC.destination);
  g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime+dur);
  o.start(); o.stop(AC.currentTime+dur+0.02);
}

// ---------- UPDATE ----------
function update(dt){
  if(!STATE.started || STATE.paused) return;
  STATE.time += dt;

  // day/night
  STATE.dayPhase = (STATE.dayPhase + dt*0.005) % 1;
  const sunH = Math.sin(STATE.dayPhase*Math.PI*2);
  sun.position.y = 30 + sunH*60;
  sun.intensity = 0.4 + Math.max(0,sunH)*0.6;
  ambient.intensity = 0.25 + Math.max(0,sunH)*0.35;
  const skyTop = new THREE.Color().lerpColors(new THREE.Color(0x0a0a2e), new THREE.Color(0xff6b9d), Math.max(0,sunH));
  skyMat.uniforms.topColor.value.copy(skyTop);
  water.material.color.setHex(sunH>0.2?0x1a4a7a:0x0a1a3a);

  // wanted decay
  if(STATE.wanted>0){
    STATE.wanted -= dt*0.02;
    if(STATE.wanted<0) STATE.wanted=0;
  }

  if(STATE.inVehicle){
    const v = STATE.currentVehicle;
    // driving input
    let accel=0, steer=0;
    if(STATE.keys['KeyW']||STATE.keys['ArrowUp']) accel=1;
    if(STATE.keys['KeyS']||STATE.keys['ArrowDown']) accel=-1;
    if(STATE.keys['KeyA']||STATE.keys['ArrowLeft']) steer=1;
    if(STATE.keys['KeyD']||STATE.keys['ArrowRight']) steer=-1;
    const handbrake = STATE.keys['Space'];
    const speed = Math.hypot(v.vx, v.vz);
    // apply
    const fwd = new THREE.Vector3(Math.sin(v.yaw),0,Math.cos(v.yaw));
    v.vx += fwd.x * accel * 18 * dt;
    v.vz += fwd.z * accel * 18 * dt;
    v.vx *= (handbrake?0.9:0.985);
    v.vz *= (handbrake?0.9:0.985);
    // steer affects yaw based on speed
    v.yaw += steer * (speed*0.4+1) * (accel>=0?1:-1) * dt * 1.2;
    // cap speed
    const sp = Math.hypot(v.vx,v.vz);
    const maxSp = 32;
    if(sp>maxSp){ v.vx=v.vx/sp*maxSp; v.vz=v.vz/sp*maxSp; }
    v.x += v.vx*dt;
    v.z += v.vz*dt;
    resolveCollisions({x:v.x,z:v.z}, 2.2);
    // write back (resolveCollisions mutates object passed; need sync)
    // resolveCollisions mutated a temp; re-apply via returned? We passed object with x,z; it mutated. But v.x not auto. Let's instead mutate v directly:
    // (redo properly)
    v.mesh.position.set(v.x,0,v.z);
    v.mesh.rotation.y = v.yaw;
    // sync player to vehicle
    STATE.player.x = v.x; STATE.player.z = v.z;
    STATE.player.yaw = v.yaw;
  } else {
    // on foot
    const p = STATE.player;
    // movement direction in world space based on yaw
    let mx=0, mz=0;
    if(STATE.keys['KeyW']||STATE.keys['ArrowUp']){ mx += Math.sin(p.yaw); mz += Math.cos(p.yaw); }
    if(STATE.keys['KeyS']||STATE.keys['ArrowDown']){ mx -= Math.sin(p.yaw); mz -= Math.cos(p.yaw); }
    if(STATE.keys['KeyA']||STATE.keys['ArrowLeft']){ mx -= Math.cos(p.yaw); mz += Math.sin(p.yaw); }
    if(STATE.keys['KeyD']||STATE.keys['ArrowRight']){ mx += Math.cos(p.yaw); mz -= Math.sin(p.yaw); }
    const len = Math.hypot(mx,mz);
    if(len>0){ mx/=len; mz/=len; }
    const run = STATE.keys['Shift'] ? CFG.runMult : 1;
    const targetVx = mx * CFG.playerSpeed * run;
    const targetVz = mz * CFG.playerSpeed * run;
    p.vx += (targetVx - p.vx)*12*dt;
    p.vz += (targetVz - p.vz)*12*dt;
    // gravity
    p.vy += CFG.gravity*dt;
    // jump
    if((STATE.keys['Space']) && p.onGround){ p.vy = CFG.jumpVel; p.onGround=false; }
    p.x += p.vx*dt;
    p.y += p.vy*dt;
    p.z += p.vz*dt;
    // ground
    if(p.y<=0){ p.y=0; p.vy=0; p.onGround=true; }
    // collision
    const before = {x:p.x,z:p.z};
    resolveCollisions(p, 0.5);
    // if collided, zero velocity
    if(p.x!==before.x) p.vx=0;
    if(p.z!==before.z) p.vz=0;
    // turn player to movement
    if(len>0){
      const targetYaw = Math.atan2(mx,mz);
      // smooth
      let diff = targetYaw - p.yaw;
      while(diff>Math.PI) diff-=Math.PI*2;
      while(diff<-Math.PI) diff+=Math.PI*2;
      p.yaw += diff*10*dt;
    }
    playerGroup.position.set(p.x, p.y, p.z);
    playerGroup.rotation.y = p.yaw;
    // camera pitch via mouse already
  }

  // fix vehicle collision sync: redo resolve properly for vehicle
  if(STATE.inVehicle){
    const v=STATE.currentVehicle;
    const before={x:v.x,z:v.z};
    // mutate v via resolveCollisions by passing v (has x,z)
    resolveCollisions(v, 2.2);
    // resolveCollisions mutated v.x,z? We passed v object which has x,z props. Yes it mutates passed object.
    v.mesh.position.set(v.x,0,v.z);
  }

  // NPCs
  for(const n of NPCS){
    if(!n.alive) continue;
    // police chase
    if(n.isPolice && STATE.wanted>0.5){
      const dx = STATE.player.x - n.x;
      const dz = STATE.player.z - n.z;
      const d = Math.hypot(dx,dz);
      if(d<80){
        n.state='chase';
      } else { n.state='walk'; }
    } else if(n.isPolice){
      n.state='walk';
    }
    if(n.state==='chase'){
      const dx = STATE.player.x - n.x;
      const dz = STATE.player.z - n.z;
      const d = Math.hypot(dx,dz);
      if(d>1.5){
        n.vx = dx/d * n.speed;
        n.vz = dz/d * n.speed;
        n.yaw = Math.atan2(dx,dz);
      } else {
        n.vx=0; n.vz=0;
        // attack
        if(Math.random()<0.02){
          STATE.health -= 4;
          spawnParticle(new THREE.Vector3(STATE.player.x,1,STATE.player.z),0xff3333,4,3);
          flashDamage();
          if(STATE.health<=0){ STATE.health=0; gameOver(); }
        }
      }
    } else {
      n.timer -= dt;
      if(n.timer<=0){
        n.yaw = rnd(0,Math.PI*2);
        n.timer = rnd(2,6);
      }
      n.vx = Math.sin(n.yaw)*n.speed*0.6;
      n.vz = Math.cos(n.yaw)*n.speed*0.6;
    }
    n.x += n.vx*dt;
    n.z += n.vz*dt;
    resolveCollisions(n, 0.4);
    n.mesh.position.set(n.x,0,n.z);
    n.mesh.rotation.y = n.yaw;
  }

  // mission target npc spawn
  const m = MISSIONS[STATE.missionIdx % MISSIONS.length];
  if(m.targetNPC && !missionTargetNPC){
    missionTargetNPC = createNPC(m.target.x, m.target.z, false);
    missionTargetNPC.isMissionTarget = true;
  }
  if(missionTargetNPC && !missionTargetNPC.alive){
    STATE.money += m.reward;
    STATE.missionIdx++;
    missionTargetNPC = null;
    spawnMissionMarker();
    updateHUD();
  }

  // mission marker check
  if(missionMarker){
    const mm = missionMarker.position;
    const dx = mm.x - (STATE.inVehicle?STATE.currentVehicle.x:STATE.player.x);
    const dz = mm.z - (STATE.inVehicle?STATE.currentVehicle.z:STATE.player.z);
    if(Math.hypot(dx,dz)<4 && !m.targetNPC){
      STATE.money += m.reward;
      STATE.missionIdx++;
      spawnMissionMarker();
      updateHUD();
    }
  }

  // pickups
  for(let i=PICKUPS.length-1;i>=0;i--){
    const pk = PICKUPS[i];
    pk.bob += dt*3;
    pk.mesh.position.y = 1.0 + Math.sin(pk.bob)*0.25;
    pk.mesh.rotation.y += dt*2;
    const px = STATE.inVehicle?STATE.currentVehicle.x:STATE.player.x;
    const pz = STATE.inVehicle?STATE.currentVehicle.z:STATE.player.z;
    if(Math.hypot(pk.x-px, pk.z-pz)<2){
      if(pk.type==='health'){ STATE.health=Math.min(100,STATE.health+25); }
      else if(pk.type==='armor'){ STATE.armor=Math.min(100,STATE.armor+25); }
      else if(pk.type==='money'){ STATE.money+=100; }
      else if(pk.type==='ammo'){ STATE.ammo[1]+=15; STATE.ammo[2]+=30; STATE.ammo[3]+=5; }
      scene.remove(pk.mesh);
      PICKUPS.splice(i,1);
      spawnParticle(new THREE.Vector3(pk.x,1,pk.z), pickupColors[pk.type], 10, 5);
      updateHUD();
      // respawn later
      setTimeout(()=>{ createPickup(rnd(-EXT+20,EXT-20), rnd(-EXT+20,EXT-20), pk.type); }, 15000);
    }
  }

  // bullets
  for(let i=BULLETS.length-1;i>=0;i--){
    const b = BULLETS[i];
    b.life -= dt;
    if(b.life<=0){ scene.remove(b.mesh); BULLETS.splice(i,1); continue; }
    b.pos.add(b.vel.clone().multiplyScalar(dt));
    b.mesh.position.copy(b.pos);
    // hit npcs
    if(b.fromPlayer){
      for(const n of NPCS){
        if(!n.alive) continue;
        if(Math.hypot(n.x-b.pos.x, n.z-b.pos.z)<1.2 && Math.abs(n.x-b.pos.x)<1.2){
          n.health -= b.dmg;
          spawnParticle(b.pos, 0xff5555, 5, 4);
          scene.remove(b.mesh); BULLETS.splice(i,1);
          if(n.health<=0){
            n.alive=false; scene.remove(n.mesh);
            if(n.isMissionTarget){ /* handled */ }
            else { STATE.money += n.isPolice?0:25; }
            if(n.isPolice){ STATE.wanted = Math.min(5, STATE.wanted+0.5); }
          }
          updateHUD();
          break;
        }
      }
      // hit vehicles
      for(const v of VEHICLES){
        if(Math.hypot(v.x-b.pos.x, v.z-b.pos.z)<2.0){
          v.health -= b.dmg;
          spawnParticle(b.pos,0x888888,5,4);
          scene.remove(b.mesh); BULLETS.splice(i,1);
          if(v.health<=0){
            // explode
            spawnParticle(new THREE.Vector3(v.x,1,v.z),0xff6600,30,12);
            scene.remove(v.mesh);
            VEHICLES.splice(VEHICLES.indexOf(v),1);
            if(STATE.currentVehicle===v){ exitVehicle(); }
          }
          break;
        }
      }
    } else {
      // enemy bullet hits player
      const px = STATE.inVehicle?(STATE.currentVehicle?STATE.currentVehicle.x:0):STATE.player.x;
      const pz = STATE.inVehicle?(STATE.currentVehicle?STATE.currentVehicle.z:0):STATE.player.z;
      if(Math.hypot(px-b.pos.x, pz-b.pos.z)<1.5){
        if(STATE.armor>0){ STATE.armor=Math.max(0,STATE.armor-b.dmg*0.5); STATE.health=Math.max(0,STATE.health-b.dmg*0.3); }
        else { STATE.health=Math.max(0,STATE.health-b.dmg); }
        flashDamage();
        spawnParticle(b.pos,0xff3333,6,4);
        scene.remove(b.mesh); BULLETS.splice(i,1);
        if(STATE.health<=0){ STATE.health=0; gameOver(); }
        updateHUD();
      }
    }
  }

  // police shooting
  for(const n of NPCS){
    if(!n.alive || !n.isPolice) continue;
    if(STATE.wanted>0.5){
      const dx = (STATE.inVehicle?STATE.currentVehicle.x:STATE.player.x) - n.x;
      const dz = (STATE.inVehicle?STATE.currentVehicle.z:STATE.player.z) - n.z;
      const d = Math.hypot(dx,dz);
      if(d<25 && Math.random()<0.012){
        const dir = new THREE.Vector3(dx/d, 0, dz/d);
        const origin = new THREE.Vector3(n.x,1.5,n.z);
        spawnBullet(origin, dir, 8, false);
      }
    }
  }

  // particles
  for(let i=PARTICLES.length-1;i>=0;i--){
    const pt = PARTICLES[i];
    pt.life -= dt;
    if(pt.life<=0){ scene.remove(pt.mesh); PARTICLES.splice(i,1); continue; }
    pt.vel.y += (pt.gravity||-12)*dt;
    pt.pos.add(pt.vel.clone().multiplyScalar(dt));
    pt.mesh.position.copy(pt.pos);
    pt.mesh.scale.setScalar(Math.max(0.01, pt.life*1.5));
  }

  // mission marker animate
  if(missionMarker){
    missionMarker.rotation.y += dt*2;
    missionMarker.position.y = 0.1 + Math.sin(STATE.time*3)*0.3;
    if(missionMarker.beam) missionMarker.beam.rotation.y += dt;
  }

  updateAudio();
  // camera
  updateCamera();

  // HUD
  updateHUD();
  updateMinimap();
}

function flashDamage(){
  const d = document.getElementById('damage');
  d.style.opacity=1;
  setTimeout(()=>{ d.style.opacity=0; }, 200);
}

function gameOver(){
  STATE.started=false;
  STATE.paused=true;
  document.exitPointerLock();
  const menu = document.getElementById('menu');
  menu.style.display='flex';
  menu.querySelector('h1').textContent='WASTED';
  menu.querySelector('h2').textContent='You died. Money lost: $'+STATE.money;
  const btn = document.getElementById('startBtn');
  btn.textContent='RETRY';
  btn.onclick = ()=>{ location.reload(); };
}

function updateCamera(){
  const p = STATE.player;
  let targetX, targetY, targetZ, targetYaw;
  if(STATE.inVehicle && STATE.currentVehicle){
    targetX = STATE.currentVehicle.x;
    targetY = 0;
    targetZ = STATE.currentVehicle.z;
    targetYaw = STATE.currentVehicle.yaw;
  } else {
    targetX = p.x; targetY = p.y; targetZ = p.z; targetYaw = p.yaw;
  }
  const yaw = STATE.inVehicle ? targetYaw : p.yaw;
  // camera position behind target
  const dist = CFG.camDist;
  const height = CFG.camHeight;
  let camX, camY, camZ;
  if(STATE.cameraMode===0){
    camX = targetX - Math.sin(yaw)*dist;
    camZ = targetZ - Math.cos(yaw)*dist;
    camY = targetY + height + (STATE.inVehicle?1:0);
  } else if(STATE.cameraMode===1){
    // side
    camX = targetX + Math.cos(yaw)*dist;
    camZ = targetZ - Math.sin(yaw)*dist;
    camY = targetY + height;
  } else {
    // top-down-ish
    camX = targetX;
    camZ = targetZ;
    camY = targetY + 30;
  }
  camera.position.lerp(new THREE.Vector3(camX,camY,camZ), 0.15);
  const lookY = targetY + (STATE.inVehicle?1.5:1.6);
  camera.lookAt(targetX, lookY, targetZ);
  // mouse pitch influence on camera height
  if(!STATE.inVehicle && STATE.cameraMode===0){
    camera.position.y += STATE.player.pitch*2;
  }
}

function updateHUD(){
  document.getElementById('healthfill').style.width = STATE.health+'%';
  document.getElementById('armorfill').style.width = STATE.armor+'%';
  document.getElementById('money').textContent = '$'+STATE.money;
  // wanted stars
  const wEl = document.getElementById('wanted');
  wEl.innerHTML='';
  for(let i=0;i<5;i++){
    const s = document.createElement('span');
    s.className='star' + (i < Math.ceil(STATE.wanted) ? ' on' : '');
    s.textContent='★';
    wEl.appendChild(s);
  }
  const w = WEAPONS[STATE.weapon];
  document.getElementById('wname').textContent = w.name;
  document.getElementById('ammo').textContent = (w.ammo===Infinity?'∞':STATE.ammo[STATE.weapon]);
  // speedo
  let sp=0;
  if(STATE.inVehicle && STATE.currentVehicle){
    sp = Math.hypot(STATE.currentVehicle.vx, STATE.currentVehicle.vz);
  } else {
    sp = Math.hypot(STATE.player.vx, STATE.player.vz);
  }
  document.getElementById('speedo').textContent = 'Speed: '+Math.round(sp*3.6)+' km/h';
  // prompt
  const prompt = document.getElementById('prompt');
  if(STATE.inVehicle){
    prompt.textContent='Press E to exit vehicle'; prompt.style.display='block';
  } else {
    const v = nearestVehicle();
    if(v){ prompt.textContent='Press E to enter vehicle'; prompt.style.display='block'; }
    else { prompt.style.display='none'; }
  }
}

function updateMinimap(){
  if(!STATE.showMinimap) return;
  const c = document.getElementById('mmcanvas');
  const ctx = c.getContext('2d');
  const W=180, H=180, scale=0.35;
  ctx.fillStyle='rgba(0,0,0,0.85)';
  ctx.fillRect(0,0,W,H);
  const cx = W/2, cy=H/2;
  const px = STATE.inVehicle?STATE.currentVehicle.x:STATE.player.x;
  const pz = STATE.inVehicle?STATE.currentVehicle.z:STATE.player.z;
  const yaw = STATE.inVehicle?STATE.currentVehicle.yaw:STATE.player.yaw;
  // rotate view: player always up
  function toScreen(x,z){
    const dx = x-px, dz = z-pz;
    // rotate by -yaw so player faces up
    const rx = dx*Math.cos(-yaw) - dz*Math.sin(-yaw);
    const rz = dx*Math.sin(-yaw) + dz*Math.cos(-yaw);
    return {x: cx + rx*scale, y: cy + rz*scale};
  }
  // roads (grid) optional skip
  // buildings as gray dots
  ctx.fillStyle='rgba(120,120,120,0.6)';
  // skip heavy; draw vehicles
  for(const v of VEHICLES){
    const s = toScreen(v.x, v.z);
    if(s.x<0||s.x>W||s.y<0||s.y>H) continue;
    ctx.fillStyle = (v===STATE.currentVehicle)?'#f1c40f':'#3498db';
    ctx.fillRect(s.x-2,s.y-2,4,4);
  }
  // npcs
  ctx.fillStyle='#e74c3c';
  for(const n of NPCS){
    if(!n.alive) continue;
    const s=toScreen(n.x,n.z);
    if(s.x<0||s.x>W||s.y<0||s.y>H) continue;
    ctx.fillRect(s.x-1,s.y-1,2,2);
  }
  // pickups
  for(const pk of PICKUPS){
    const s=toScreen(pk.x,pk.z);
    if(s.x<0||s.x>W||s.y<0||s.y>H) continue;
    ctx.fillStyle = pk.type==='health'?'#e74c3c':pk.type==='armor'?'#3498db':pk.type==='money'?'#2ecc71':'#f1c40f';
    ctx.beginPath(); ctx.arc(s.x,s.y,2,0,Math.PI*2); ctx.fill();
  }
  // mission marker
  if(missionMarker){
    const s=toScreen(missionMarker.position.x, missionMarker.position.z);
    ctx.fillStyle='#f1c40f';
    ctx.beginPath(); ctx.arc(s.x,s.y,5,0,Math.PI*2); ctx.stroke();
    ctx.lineWidth=2; ctx.strokeStyle='#f1c40f'; ctx.stroke();
  }
  // player
  ctx.fillStyle='#ffffff';
  ctx.beginPath(); ctx.arc(cx,cy,4,0,Math.PI*2); ctx.fill();
  // direction triangle
  ctx.fillStyle='#ff6b9d';
  ctx.beginPath();
  ctx.moveTo(cx, cy-8); ctx.lineTo(cx-4, cy+2); ctx.lineTo(cx+4, cy+2); ctx.closePath(); ctx.fill();
  // border
  ctx.strokeStyle='#fff'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(cx,cy,88,0,Math.PI*2); ctx.stroke();
}

// ---------- MAIN LOOP ----------
let lastTime = performance.now();
function loop(){
  requestAnimationFrame(loop);
  const now = performance.now();
  let dt = (now-lastTime)/1000;
  lastTime = now;
  if(dt>0.1) dt=0.1;
  update(dt);
  if(composer){ composer.render(); } else { renderer.render(scene, camera); }
}
// ensure resolveCollisions mutates passed object (it does, since pos is object ref)

// ---------- START ----------
document.getElementById('startBtn').addEventListener('click', ()=>{
  document.getElementById('menu').style.display='none';
  document.getElementById('loading').style.display='none';
  STATE.started=true;
  initAudio();
  // init mission
  spawnMissionMarker();
  updateHUD();
  // lock pointer (may fail in headless; ignore)
  try { const p = renderer.domElement.requestPointerLock(); if(p && p.catch) p.catch(()=>{}); } catch(e){}
  lastTime = performance.now();
});
// hide loading initially (menu visible)
document.getElementById('loading').style.display='none';

window.addEventListener('resize', ()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  if(composer){ composer.setSize(window.innerWidth, window.innerHeight); }
  if(bloomPass){ bloomPass.resolution.set(window.innerWidth, window.innerHeight); }
});

loop();
</script>
