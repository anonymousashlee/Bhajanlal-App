<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>VICE CITY · NEON EMPIRE</title>
<style>
:root{--pink:#ff2fa0;--cyan:#2ff3ff;--gold:#ffd166;--lime:#39ff88;--ink:#0a0518}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--ink);color:#fff;
  font-family:"Arial Narrow","Segoe UI",Arial,sans-serif;user-select:none}
canvas#game{position:fixed;inset:0;display:block}
#scan{position:fixed;inset:0;z-index:5;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.15) 0 1px,transparent 1px 3px),
  radial-gradient(ellipse at center,transparent 52%,rgba(0,0,0,.6) 100%)}
.hud{position:fixed;z-index:10}
.panel{background:linear-gradient(160deg,rgba(24,9,52,.86),rgba(8,4,26,.76));
  border:1px solid rgba(47,243,255,.35);border-radius:14px;backdrop-filter:blur(9px);
  box-shadow:0 0 22px rgba(255,47,160,.28),inset 0 0 26px rgba(47,243,255,.06)}
.hidden{display:none!important}
#topLeft{top:16px;left:16px;padding:12px 18px;min-width:300px}
#cash{font-size:32px;font-weight:900;font-style:italic;letter-spacing:1px;color:var(--lime);
  text-shadow:0 0 16px rgba(57,255,136,.85)}
.lbl{font-size:10px;letter-spacing:4px;color:var(--cyan);opacity:.85}
#missionText{display:block;font-size:14px;margin-top:5px;line-height:1.35;
  text-shadow:0 0 10px rgba(255,47,160,.65)}
#income{font-size:11px;letter-spacing:2px;color:var(--gold);margin-top:7px;opacity:.9}
#topRight{top:16px;right:16px;padding:10px 16px;text-align:right}
#stars{font-size:27px;letter-spacing:3px;line-height:1}
#stars span{color:#332c52;transition:.2s;display:inline-block}
#stars span.on{color:var(--pink);text-shadow:0 0 16px var(--pink);animation:pulse .9s infinite}
@keyframes pulse{50%{transform:scale(1.18)}}
#clock{font-size:11px;letter-spacing:3px;color:var(--gold);margin-top:6px}
#mapBox{bottom:16px;left:16px;padding:8px}
#mini{display:block;border-radius:8px;background:#0a0518}
#district{position:fixed;bottom:236px;left:20px;z-index:11;pointer-events:none;
  font-size:34px;font-weight:900;font-style:italic;letter-spacing:2px;opacity:0;
  text-shadow:0 0 20px var(--pink),0 0 44px var(--cyan);transition:opacity .6s}
#district.show{opacity:1}
#radio{bottom:16px;left:50%;transform:translate(-50%,140px);opacity:0;transition:.4s;
  padding:8px 26px;text-align:center}
#radio.show{transform:translate(-50%,0);opacity:1}
#radioName{color:var(--pink);font-weight:900;letter-spacing:4px;font-size:14px}
#radioText{font-size:11px;letter-spacing:2px;color:var(--cyan);margin-top:3px}
#stats{bottom:16px;right:16px;padding:12px 16px;width:230px}
.bar{height:10px;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden}
.bar>i{display:block;height:100%;width:100%;
  background:linear-gradient(90deg,var(--pink),var(--gold));box-shadow:0 0 12px var(--pink);
  transition:width .2s}
.bar>i.low{background:linear-gradient(90,#ff3b3b,#ff2fa0);animation:pulse .7s infinite}
#weapon{font-size:11px;letter-spacing:3px;color:var(--cyan);margin-top:8px}
#toasts{position:fixed;top:104px;right:16px;z-index:30;display:flex;flex-direction:column;
  gap:8px;align-items:flex-end;pointer-events:none}
.toast{padding:10px 16px;border-radius:10px;background:rgba(10,5,24,.92);
  border-left:4px solid var(--cyan);box-shadow:0 0 22px rgba(47,243,255,.4);
  animation:slide .35s ease;max-width:330px}
.toast b{display:block;font-size:10px;letter-spacing:4px;color:var(--gold);margin-bottom:3px}
.toast span{font-size:13px;line-height:1.35}
@keyframes slide{from{opacity:0;transform:translateX(46px)}}
.overlay{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;
  background:radial-gradient(ellipse at center,rgba(20,6,46,.9),rgba(6,2,18,.97));
  backdrop-filter:blur(6px)}
#menu{background:linear-gradient(180deg,#120632 0%,#2a0a4a 52%,#5c1060 100%);overflow:hidden}
.gridbg{position:absolute;left:-30%;right:-30%;bottom:-10%;height:70%;
  background-image:linear-gradient(rgba(47,243,255,.35) 2px,transparent 2px),
    linear-gradient(90deg,rgba(47,243,255,.35) 2px,transparent 2px);
  background-size:64px 64px;transform:perspective(260px) rotateX(62deg);
  animation:scroll 3.2s linear infinite;
  -webkit-mask-image:linear-gradient(transparent,#000 70%);mask-image:linear-gradient(transparent,#000 70%)}
@keyframes scroll{to{background-position:0 64px}}
.sun{position:absolute;top:14%;width:330px;height:330px;border-radius:50%;opacity:.9;
  background:linear-gradient(180deg,var(--gold),var(--pink));
  -webkit-mask-image:repeating-linear-gradient(#000 0 16px,transparent 16px 26px);
  mask-image:repeating-linear-gradient(#000 0 16px,transparent 16px 26px)}
.logo{position:relative;z-index:2;font-size:clamp(52px,13vw,150px);font-weight:900;
  font-style:italic;letter-spacing:-3px;line-height:.9;
  background:linear-gradient(180deg,#fff 8%,var(--cyan) 46%,var(--pink));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 26px rgba(255,47,160,.95)) drop-shadow(0 4px 0 rgba(0,0,0,.35))}
.sub{position:relative;z-index:2;margin-top:14px;font-size:14px;letter-spacing:12px;
  color:var(--gold);text-shadow:0 0 14px rgba(255,209,102,.8)}
.btn{position:relative;z-index:2;margin-top:30px;padding:15px 48px;font-size:15px;
  font-weight:900;letter-spacing:5px;color:#0a0518;border:none;border-radius:40px;cursor:pointer;
  background:linear-gradient(90deg,var(--cyan),var(--pink));
  box-shadow:0 0 34px rgba(255,47,160,.7);transition:.18s}
.btn:hover{transform:scale(1.07);box-shadow:0 0 56px rgba(47,243,255,.95)}
.ctrl{position:relative;z-index:2;margin-top:30px;font-size:12px;letter-spacing:2px;
  color:var(--gold);line-height:2.1;opacity:.92}
.ctrl kbd{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.34);
  padding:2px 9px;border-radius:6px;font-family:inherit}
.big{font-size:clamp(44px,9vw,104px);font-weight:900;font-style:italic;letter-spacing:-2px}
.big.waste{color:#ff2b2b;text-shadow:0 0 34px rgba(255,43,43,.9)}
.big.bust{color:var(--cyan);text-shadow:0 0 34px rgba(47,243,255,.9)}
.big.win{background:linear-gradient(180deg,#fff,var(--gold),var(--pink));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 30px rgba(255,209,102,.9))}
.msg{margin-top:16px;font-size:15px;letter-spacing:3px;color:#ffd9f0}
h2.pause{font-size:56px;font-weight:900;font-style:italic;letter-spacing:6px;
  color:var(--cyan);text-shadow:0 0 26px rgba(47,243,255,.9)}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="scan"></div>

<div id="hud" class="hidden">
  <div id="topLeft" class="hud panel">
    <div id="cash">$0</div>
    <div class="lbl">CURRENT OBJECTIVE</div>
    <div id="missionText">—</div>
    <div id="income">PROPERTIES 0 · +$0 / 30s</div>
  </div>
  <div id="topRight" class="hud panel">
    <div id="stars"><span>★</span><span>★</span><span>★</span><span>★</span><span>★</span></div>
    <div id="clock">1986 · 21:00</div>
  </div>
  <div id="district">VICE CITY</div>
  <div id="mapBox" class="hud panel"><canvas id="mini" width="200" height="200"></canvas></div>
  <div id="radio" class="hud panel"><div id="radioName">WAVE 103</div><div id="radioText">—</div></div>
  <div id="stats" class="hud panel">
    <div class="lbl">HEALTH</div>
    <div class="bar" style="margin-top:6px"><i id="hp"></i></div>
    <div id="weapon">PISTOL · <span id="ammo">∞</span></div>
  </div>
  <div id="toasts"></div>
</div>

<div id="menu" class="overlay">
  <div class="sun"></div><div class="gridbg"></div>
  <div class="logo">VICE<br/>CITY</div>
  <div class="sub">NEON EMPIRE · 1986</div>
  <button class="btn" id="startBtn">▶ START STORY</button>
  <div class="ctrl">
    <kbd>W A S D</kbd> move / drive &nbsp;·&nbsp; <kbd>SHIFT</kbd> sprint &nbsp;·&nbsp; <kbd>E</kbd> enter / exit car<br/>
    <kbd>SPACE</kbd> fire &nbsp;·&nbsp; <kbd>F</kbd> buy property &nbsp;·&nbsp; <kbd>M</kbd> mute &nbsp;·&nbsp; <kbd>ESC</kbd> pause
  </div>
</div>

<div id="pause" class="overlay hidden">
  <h2 class="pause">PAUSED</h2>
  <button class="btn" id="resumeBtn">RESUME</button>
  <button class="btn" id="restartBtn" style="background:linear-gradient(90deg,#ffd166,#ff2fa0)">RESTART STORY</button>
</div>

<div id="end" class="overlay hidden">
  <div class="big" id="endTitle">WASTED</div>
  <div class="msg" id="endMsg"></div>
  <button class="btn" id="endBtn">CONTINUE</button>
</div>

<script>
"use strict";
/* ============ helpers ============ */
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a,b)=>a+Math.random()*(b-a);
const TAU=Math.PI*2;
function hash(x,y){const n=Math.sin(x*127.1+y*311.7)*43758.5453;return n-Math.floor(n);}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
const cvs=$('game'),ctx=cvs.getContext('2d'),mctx=$('mini').getContext('2d');
let VW=0,VH=0,DPR=1;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);VW=window.innerWidth;VH=window.innerHeight;
  cvs.width=VW*DPR;cvs.height=VH*DPR;cvs.style.width=VW+'px';cvs.style.height=VH+'px';}
window.addEventListener('resize',resize);resize();

/* ============ world ============ */
const TS=40,WS=64,WORLD=WS*TS;
const ROAD=0,BUILD=1,WATER=2,SAND=3,GRASS=4,SIDE=5;
const map=[];
function genWorld(){
  for(let y=0;y<WS;y++){map[y]=[];for(let x=0;x<WS;x++){
    let t;
    if(x>=WS-6)t=WATER; else if(x===WS-7)t=SAND;
    else if(x%8<2||y%8<2)t=ROAD;
    else t=hash(x>>3,y>>3)<0.13?GRASS:BUILD;
    map[y][x]=t;}}
  for(let y=0;y<WS;y++)for(let x=0;x<WS;x++){
    if(map[y][x]!==ROAD)continue;
    if((map[y-1]&&map[y-1][x]===BUILD)||(map[y+1]&&map[y+1][x]===BUILD)||
       (map[y][x-1]===BUILD)||(map[y][x+1]===BUILD))map[y][x]=SIDE;}
}
genWorld();
const tile=(x,y)=>(x<0||y<0||x>=WS||y>=WS)?BUILD:map[y][x];
const solid=t=>t===BUILD||t===WATER;
function blocked(x,y,r){
  const x0=Math.floor((x-r)/TS),x1=Math.floor((x+r)/TS),
        y0=Math.floor((y-r)/TS),y1=Math.floor((y+r)/TS);
  for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++)if(solid(tile(tx,ty)))return true;
  return false;}
function move(e,dx,dy,r){
  if(!blocked(e.x+dx,e.y,r))e.x+=dx;
  if(!blocked(e.x,e.y+dy,r))e.y+=dy;}
function roadIn(x0,x1,y0,y1){
  for(let i=0;i<600;i++){
    const tx=x0+Math.floor(Math.random()*(x1-x0)),ty=y0+Math.floor(Math.random()*(y1-y0));
    const t=tile(tx,ty);
    if(t===ROAD||t===SIDE)return{x:tx*TS+TS/2,y:ty*TS+TS/2};}
  return{x:(x0+x1)/2*TS,y:(y0+y1)/2*TS};}

/* minimap base (rendered once) */
const miniBase=document.createElement('canvas');miniBase.width=WS*3;miniBase.height=WS*3;
(function(){
  const c=miniBase.getContext('2d');
  const col={[ROAD]:'#39325c',[SIDE]:'#4c4580',[BUILD]:'#7b3fa8',[WATER]:'#0a3f70',
    [SAND]:'#c9a86a',[GRASS]:'#15604a'};
  for(let y=0;y<WS;y++)for(let x=0;x<WS;x++){c.fillStyle=col[map[y][x]];c.fillRect(x*3,y*3,3,3);}
})();

/* ============ palette ============ */
const WALLS=[['#4a2b6b','#2c1844'],['#6b2b55','#411a34'],['#2b5a6b','#193744'],
  ['#6b5a2b','#41361a'],['#5a2b4a','#361a2c']];
const NEONS=['#ff2fa0','#2ff3ff','#ffd166','#a56bff','#39ff88'];
const CARCOLORS=['#ff2fa0','#2ff3ff','#ffd166','#e8e8f2','#a56bff','#ff6b3c','#39ff88','#1dd1ff'];

/* ============ audio ============ */
let AC=null,master=null,musicGain=null,engineOsc=null,engineGain=null,noiseBuf=null;
let nextNote=0,step=0,muted=false;
const CHORDS=[[57,60,64],[53,57,60],[48,52,55],[55,59,62]]; /* Am F C G */
const STEP=60/108/4;
const mtof=m=>440*Math.pow(2,(m-69)/12);
function tone(f,t,dur,type,vol,dest){
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.value=f;o.connect(g);g.connect(dest||master);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+0.012);
  g.gain.exponentialRampToValueAtTime(0.0008,t+dur);
  o.start(t);o.stop(t+dur+0.05);}
function noiseHit(t,dur,type,freq,vol){
  const s=AC.createBufferSource();s.buffer=noiseBuf;
  const f=AC.createBiquadFilter();f.type=type;f.frequency.value=freq;
  const g=AC.createGain();g.gain.setValueAtTime(vol,t);
  g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+dur);}
function scheduler(){
  if(!AC)return;
  while(nextNote<AC.currentTime+0.16){
    const ch=CHORDS[Math.floor(step/4)%4];
    if(step%4===0){tone(mtof(ch[0]-12),nextNote,0.24,'square',0.42,musicGain);}
    const seq=[0,1,2,1][step%4]+(step%8>=4?12:0);
    tone(mtof(ch[seq]),nextNote,0.17,'sawtooth',0.16,musicGain);
    if(step%2===1)noiseHit(nextNote,0.05,'highpass',7000,0.12);
    nextNote+=STEP;step++;}}
function initAudio(){
  if(AC)return;
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain();master.gain.value=0.55;master.connect(AC.destination);
    musicGain=AC.createGain();musicGain.gain.value=0.15;musicGain.connect(master);
    const len=Math.floor(AC.sampleRate*1.2);
    noiseBuf=AC.createBuffer(1,len,AC.sampleRate);
    const d=noiseBuf.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
    engineOsc=AC.createOscillator();engineOsc.type='sawtooth';engineOsc.frequency.value=55;
    const ef=AC.createBiquadFilter();ef.type='lowpass';ef.frequency.value=420;
    engineGain=AC.createGain();engineGain.gain.value=0;
    engineOsc.connect(ef);ef.connect(engineGain);engineGain.connect(master);engineOsc.start();
    nextNote=AC.currentTime+0.12;setInterval(scheduler,25);
  }catch(e){AC=null;}}
function sfx(k){
  if(!AC||muted)return;const t=AC.currentTime;
  if(k==='shot')tone(760,t,0.08,'square',0.2,master),tone(320,t+0.02,0.07,'square',0.14,master);
  else if(k==='hit')noiseHit(t,0.12,'lowpass',700,0.32);
  else if(k==='boom'){noiseHit(t,0.55,'lowpass',240,0.6);tone(70,t,0.4,'sawtooth',0.3,master);}
  else if(k==='cash'){tone(920,t,0.08,'sine',0.26,master);tone(1380,t+0.09,0.16,'sine',0.26,master);}
  else if(k==='buy'){[660,880,1174,1320].forEach((f,i)=>tone(f,t+i*0.08,0.16,'triangle',0.24,master));}
  else if(k==='door')noiseHit(t,0.09,'bandpass',500,0.3);}
