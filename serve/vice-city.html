<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VICE CITY — Neon Empire</title>
<style>
html,body{margin:0;height:100%;background:#07070d;overflow:hidden;font-family:"Arial Black",Impact,sans-serif}
canvas{display:block;width:100vw;height:100vh;cursor:crosshair}
#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;background:radial-gradient(ellipse at 50% 25%,rgba(255,45,149,.4),rgba(0,0,0,.93) 70%);z-index:5}
#ov h1{margin:0;font-size:clamp(44px,9vw,104px);font-style:italic;letter-spacing:3px;color:#ff2d95;text-shadow:0 0 26px #ff2d95,5px 5px 0 #00e5ff;transform:skew(-7deg)}
#ov .tag{color:#00e5ff;letter-spacing:7px;font-size:13px}
#ov .msg{max-width:640px;background:rgba(0,0,0,.6);border:2px solid #ff2d95;padding:14px 24px;border-radius:10px;font-family:monospace;font-size:13px;line-height:1.75;color:#ffd9ec}
#ov button{font:inherit;font-size:20px;letter-spacing:2px;padding:12px 36px;color:#04121a;background:linear-gradient(#8ff5ff,#00e5ff);border:0;border-radius:6px;cursor:pointer;box-shadow:0 0 26px #00e5ff;transform:skew(-7deg)}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="ov"><h1 id="ovT">VICE CITY</h1><div class="tag" id="ovS">NEON EMPIRE &middot; 1986</div><div class="msg" id="ovM"></div><button id="ovB">START</button></div>
<script>
'use strict';
/* ---------- helpers ---------- */
var TAU=Math.PI*2;
function rnd(a,b){b=b||0;return b+Math.random()*(a-b);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function dist(a,b,c,d){return Math.hypot(a-c,b-d);}
function norm(a){a=(a+Math.PI)%TAU;if(a<0)a+=TAU;return a-Math.PI;}
function hash(x,y){var n=(Math.imul(x|0,374761393)+Math.imul(y|0,668265263))|0;n=Math.imul(n^(n>>>13),1274126177)|0;return (n^(n>>>16))>>>0;}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();}
function txt(s,x,y,font,col,al){ctx.font=font;ctx.textAlign=al||'left';ctx.lineWidth=4;ctx.strokeStyle='#000';ctx.strokeText(s,x,y);ctx.fillStyle=col;ctx.fillText(s,x,y);}

/* ---------- world ---------- */
var TILE=64,MAPW=64,MAPH=64,WW=MAPW*TILE,WH=MAPH*TILE;
var WATER=0,SAND=1,ROAD=2,GRASS=3,BUILD=4;
function tileType(tx,ty){
  if(tx<0||ty<0||tx>=MAPW||ty>=MAPH)return WATER;
  if(tx<5)return WATER;
  if(tx<7)return SAND;
  if(tx%7===0||ty%7===0)return ROAD;
  if(hash((tx/7)|0,(ty/7)|0)%9===0)return GRASS;
  return BUILD;
}
function solidAt(x,y){var t=tileType(Math.floor(x/TILE),Math.floor(y/TILE));return t===WATER||t===BUILD;}
function blocked(x,y,r){return solidAt(x,y)||solidAt(x+r,y)||solidAt(x-r,y)||solidAt(x,y+r)||solidAt(x,y-r);}
var PAL=['#e0567a','#57b6c9','#f0b27a','#a67fd4','#d9d0b8','#e8846b','#7fc98a','#f2d16b','#c86b9a','#6b8fd4'];
var blocks=[];
function genBlocks(){
  for(var ty=0;ty<MAPH;ty++)for(var tx=7;tx<MAPW;tx++){
    if(tileType(tx,ty)!==BUILD)continue;
    if(tileType(tx-1,ty)===BUILD&&tileType(tx,ty-1)===BUILD)continue;
    var w=1;while(tileType(tx+w,ty)===BUILD)w++;
    var h=1,ok=true;
    while(ok){for(var i=0;i<w;i++){if(tileType(tx+i,ty+h)!==BUILD){ok=false;break;}}if(ok)h++;}
    var k=hash(tx*3,ty*7);
    blocks.push({x:tx*TILE,y:ty*TILE,w:w*TILE,h:h*TILE,c:PAL[k%PAL.length],k:k,neon:k%3===0});
  }
}
genBlocks();
function blockAt(x,y){for(var i=0;i<blocks.length;i++){var b=blocks[i];if(x>=b.x&&x<b.x+b.w&&y>=b.y&&y<b.y+b.h)return b;}return null;}

/* ---------- canvas ---------- */
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
var VW=0,VH=0,DPR=Math.min(2,window.devicePixelRatio||1);
function resize(){VW=window.innerWidth;VH=window.innerHeight;cv.width=VW*DPR;cv.height=VH*DPR;cv.style.width=VW+'px';cv.style.height=VH+'px';ctx.setTransform(DPR,0,0,DPR,0,0);}
window.addEventListener('resize',resize);resize();

/* ---------- minimap ---------- */
var MM=(function(){
  var c=document.createElement('canvas');c.width=MAPW*4;c.height=MAPH*4;
  var g=c.getContext('2d');
  for(var ty=0;ty<MAPH;ty++)for(var tx=0;tx<MAPW;tx++){
    var t=tileType(tx,ty);
    g.fillStyle=t===WATER?'#0e4d7a':t===SAND?'#e6d39a':t===ROAD?'#33353d':t===GRASS?'#3f8049':'#24262f';
    g.fillRect(tx*4,ty*4,4,4);
  }
  for(var i=0;i<blocks.length;i++){var b=blocks[i];g.fillStyle=b.c;g.fillRect(b.x/16,b.y/16,b.w/16,b.h/16);}
  return c;
})();

/* ---------- audio ---------- */
var AC=null,master,sfxG,musG,noiseBuf,engO,engG,sirenO,sirenG;
var stIdx=0,mStep=0,nextT=0,mInt=null,radioT=0;
var STATIONS=[
 {n:'FLASH FM',root:261.63,bpm:116,w:'square'},
 {n:'WAVE 103',root:220.00,bpm:124,w:'sawtooth'},
 {n:'V-ROCK',root:146.83,bpm:132,w:'sawtooth'},
 {n:'EMOTION 98.3',root:293.66,bpm:100,w:'sine'},
 {n:'FEVER 105',root:329.63,bpm:110,w:'triangle'},
 {n:'RADIO ESPANTOSO',root:196.00,bpm:96,w:'triangle'}
];
var CH=[0,8,3,10];
function initAudio(){
  if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
  master=AC.createGain();master.gain.value=0.45;master.connect(AC.destination);
  sfxG=AC.createGain();sfxG.gain.value=0.85;sfxG.connect(master);
  musG=AC.createGain();musG.gain.value=0.3;musG.connect(master);
  var len=AC.sampleRate;noiseBuf=AC.createBuffer(1,len,AC.sampleRate);
  var d=noiseBuf.getChannelData(0);for(var i=0;i<len;i++)d[i]=Math.random()*2-1;
  engO=AC.createOscillator();engO.type='sawtooth';engO.frequency.value=55;
  var ef=AC.createBiquadFilter();ef.type='lowpass';ef.frequency.value=500;
  engG=AC.createGain();engG.gain.value=0;
  engO.connect(ef);ef.connect(engG);engG.connect(master);engO.start();
  sirenO=AC.createOscillator();sirenO.type='square';sirenO.frequency.value=700;
  sirenG=AC.createGain();sirenG.gain.value=0;
  sirenO.connect(sirenG);sirenG.connect(master);sirenO.start();
  nextT=AC.currentTime+0.05;mInt=setInterval(sched,25);
}
function note(f,t,d,type,g,dest){
  var o=AC.createOscillator(),a=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);
  a.gain.setValueAtTime(0.0001,t);
  a.gain.exponentialRampToValueAtTime(g,t+0.015);
  a.gain.exponentialRampToValueAtTime(0.001,t+d);
  o.connect(a);a.connect(dest||musG);o.start(t);o.stop(t+d+0.03);
}
function hit(t,dur,type,f0,f1,g,dest){
  var s=AC.createBufferSource();s.buffer=noiseBuf;
  var bf=AC.createBiquadFilter();bf.type=type;bf.frequency.setValueAtTime(f0,t);
  if(f1)bf.frequency.exponentialRampToValueAtTime(f1,t+dur);
  var a=AC.createGain();a.gain.setValueAtTime(g,t);a.gain.exponentialRampToValueAtTime(0.001,t+dur);
  s.connect(bf);bf.connect(a);a.connect(dest||sfxG);s.start(t);s.stop(t+dur+0.03);
}
function sched(){
  if(!AC)return;
  var S=STATIONS[stIdx],sd=60/S.bpm/4;
  while(nextT<AC.currentTime+0.18){
    var s=mStep,bar=s>>4,inb=s&15,root=S.root*Math.pow(2,CH[bar]/12);
    if(inb%4===0){
      note(root/2,nextT,0.22,'sine',0.5);
      var o=AC.createOscillator(),a=AC.createGain();
      o.type='sine';o.frequency.setValueAtTime(150,nextT);o.frequency.exponentialRampToValueAtTime(45,nextT+0.1);
      a.gain.setValueAtTime(0.85,nextT);a.gain.exponentialRampToValueAtTime(0.001,nextT+0.22);
      o.connect(a);a.connect(musG);o.start(nextT);o.stop(nextT+0.25);
    }
    if(inb===4||inb===12)hit(nextT,0.16,'bandpass',1900,900,0.4);
    if(inb%2===1)hit(nextT,0.05,'highpass',7000,0,0.1);
    if(inb%2===0){
      var tri=[0,3,7],semi=tri[(s>>1)%3],oct=inb>=8?2:1;
      note(root*Math.pow(2,(semi+12*(oct-1))/12),nextT,sd*1.6,S.w,0.13);
    }
    nextT+=sd;mStep=(mStep+1)%64;
  }
}
function sfxShot(){if(!AC)return;hit(AC.currentTime,0.14,'lowpass',5000,300,0.5);}
function sfxBoom(){if(!AC)return;var t=AC.currentTime;hit(t,0.7,'lowpass',2200,90,0.9);
  var o=AC.createOscillator(),a=AC.createGain();o.type='sine';
  o.frequency.setValueAtTime(90,t);o.frequency.exponentialRampToValueAtTime(28,t+0.6);
  a.gain.setValueAtTime(0.8,t);a.gain.exponentialRampToValueAtTime(0.001,t+0.8);
  o.connect(a);a.connect(sfxG);o.start(t);o.stop(t+0.9);}
function sfxBlip(f,d){if(!AC)return;note(f,AC.currentTime,d||0.08,'square',0.2,sfxG);}
function sfxPickup(){sfxBlip(660,0.07);setTimeout(function(){sfxBlip(990,0.1);},70);}
function sfxCrash(){if(!AC)return;hit(AC.currentTime,0.25,'lowpass',2500,200,0.55);}
function cycleStation(){stIdx=(stIdx+1)%STATIONS.length;radioT=3;sfxBlip(520,0.05);}

/* ---------- state ---------- */
var state='menu';
var P={x:480,y:1312,ang:0,aim:0,hp:100,armor:0,money:0,wep:1,ammo:[0,60,0,0],car:null,cool:0,walk:0,hurt:0,kills:0};
var cars=[],peds=[],bullets=[],parts=[],picks=[],toasts=[];
var wanted=0,crimeT=0,spawnT=0,pedT=0,incomeT=45;
var cam={x:0,y:0};
var ctrl={t:0,b:0,l:0,r:0};
var mouse={x:0,y:0,down:false};
var keys={};
var WEAPONS=[
 {n:'FISTS',rate:0.42,dmg:24},
 {n:'PISTOL',rate:0.26,dmg:26,sp:0.045},
 {n:'SMG',rate:0.08,dmg:14,sp:0.1,auto:1}
];
var MIS=[
 {t:'AN OLD FRIEND',o:'Meet Ken Rosenberg at the office',s:[7,20],g:[14,28],type:'goto',r:500},
 {t:'THE PARTY',o:'Steal a car and drive it to the Malibu Club',s:[14,28],g:[42,42],type:'car',r:1500},
 {t:'SYNTH & BULLETS',o:'Wipe out 6 dealers at the docks',s:[42,42],g:[35,7],type:'kill',n:6,time:80,r:2500},
 {t:'THE CHASE',o:'Deliver the package before the timer runs out',s:[35,7],g:[56,35],type:'car',time:55,r:4000},
 {t:'MR. VERCETTI',o:'Assassinate the traitor at the mall',s:[56,35],g:[28,49],type:'kill',n:5,time:120,r:15000}
];
var mis={i:0,phase:'to',timer:0,kills:0};
function toast(s,c){toasts.push({s:s,c:c||'#ffd166',t:3});}
function commitCrime(n){
  wanted=Math.min(5,wanted+n);crimeT=22;
  if(AC)sfxBlip(180,0.3);
}
function mPos(which){var m=MIS[mis.i];var p=which==='s'?m.s:m.g;return {x:p[0]*TILE+32,y:p[1]*TILE+32};}
function missionPoint(){
  if(mis.i>=MIS.length)return null;
  var m=MIS[mis.i];
  if(mis.phase==='to')return mPos('s');
  if(m.type==='goto'||m.type==='car')return mPos('g');
  return null;
}

/* ---------- input ---------- */
window.addEventListener('keydown',function(e){
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].indexOf(e.code)>=0)e.preventDefault();
  keys[e.code]=true;
  if(e.repeat)return;
  if(state!=='play')return;
  if(e.code==='KeyE')toggleCar();
  if(e.code==='KeyR')cycleStation();
  if(e.code==='Digit1')equip(1);
  if(e.code==='Digit2')equip(2);
  if(e.code==='Escape'||e.code==='KeyP')pause();
});
window.addEventListener('keyup',function(e){keys[e.code]=false;});
cv.addEventListener('mousemove',function(e){mouse.x=e.clientX;mouse.y=e.clientY;});
cv.addEventListener('mousedown',function(e){if(e.button===0){mouse.down=true;initAudio();}});
window.addEventListener('mouseup',function(){mouse.down=false;});
cv.addEventListener('contextmenu',function(e){e.preventDefault();});

/* ---------- overlay ---------- */
var ov=document.getElementById('ov'),ovT=document.getElementById('ovT'),ovS=document.getElementById('ovS'),ovM=document.getElementById('ovM'),ovB=document.getElementById('ovB');
function showOv(t,s,m,b,cb){
  ovT.textContent=t;ovS.textContent=s;ovM.innerHTML=m;ovB.textContent=b;
  ovB.onclick=function(){ov.style.display='none';if(cb)cb();};
  ov.style.display='flex';
}
function pause(){state='pause';showOv('PAUSED','VICE CITY','<b>W A S D</b> move / drive &middot; <b>MOUSE</b> aim &middot; <b>CLICK</b> fire<br><b>E</b> enter-exit car &middot; <b>1 / 2</b> weapons &middot; <b>R</b> radio &middot; <b>SHIFT</b> sprint<br><b>P / ESC</b> pause','RESUME',function(){state='play';});}
function die(){
  state='dead';
  showOv('WASTED','THE HOSPITAL TAKES $100','You got plastered in Vice City.<br>Respawn at the hospital and lose $100.','RESPAWN',respawn);
}
function respawn(){
  P.x=7*TILE+32;P.y=40*TILE+32;P.hp=100;P.armor=0;P.car=null;P.money=Math.max(0,P.money-100);
  wanted=0;crimeT=0;
  for(var i=cars.length-1;i>=0;i--)if(cars[i].cop)cars.splice(i,1);
  state='play';
}

/* ---------- vehicles ---------- */
function makeCar(x,y,col,cop){
  return {x:x,y:y,ang:0,spd:0,hp:100,col:col,cop:!!cop,ai:true,axis:0,dir:1,road:0,lane:0,last:-1,
    cruise:rnd(180,90),len:46,wid:24,dead:0,smoke:0,flash:rnd(99),occupied:!cop};
}
var CARCOL=['#ff5f7e','#4fd1e0','#ffd166','#c792ea','#7bd88f','#ff9f4a','#e8e8ef','#5b8cff','#ff6ec7','#8af7ff'];
function spawnTraffic(){
  for(var t=0;t<40;t++){
    for(var k=0;k<40;k++){
      var a=rnd(TAU),d=rnd(2200,1200);
      var x=P.x+Math.cos(a)*d,y=P.y+Math.sin(a)*d;
      var tx=Math.floor(x/TILE),ty=Math.floor(y/TILE);
      if(tileType(tx,ty)!==ROAD)continue;
      var c=makeCar(tx*TILE+32,ty*TILE+32,CARCOL[(Math.random()*CARCOL.length)|0]);
      if(tx%7===0){c.axis=0;c.road=tx;c.dir=Math.random()<0.5?1:-1;c.lane=c.dir>0?-14:14;c.x=tx*TILE+32+c.lane;c.ang=c.dir>0?Math.PI/2:-Math.PI/2;}
      else{c.axis=1;c.road=ty;c.dir=Math.random()<0.5?1:-1;c.lane=c.dir>0?14:-14;c.y=ty*TILE+32+c.lane;c.ang=c.dir>0?0:Math.PI;}
      c.last=-1;cars.push(c);break;
    }
  }
}
function nearestCar(m){
  var best=null,bd=m;
  for(var i=0;i<cars.length;i++){var c=cars[i];if(c.dead)continue;var d=dist(P.x,P.y,c.x,c.y);if(d<bd){bd=d;best=c;}}
  return best;
}
function toggleCar(){
  if(P.car){
    var c=P.car;P.car=null;c.occupied=false;
    var a=c.ang+Math.PI/2,nx=c.x+Math.cos(a)*46,ny=c.y+Math.sin(a)*46;
    if(blocked(nx,ny,11)){nx=c.x-Math.cos(a)*46;ny=c.y-Math.sin(a)*46;}
    P.x=blocked(nx,ny,11)?c.x:nx;P.y=blocked(nx,ny,11)?c.y:ny;
    toast('ON FOOT','#8ff5ff');
  }else{
    var k=nearestCar(78);
    if(!k){toast('NO VEHICLE NEARBY','#ff8fa3');return;}
    if(k.occupied){commitCrime(1);toast('GRAND THEFT AUTO!','#ff5f7e');}
    P.car=k;k.ai=false;k.occupied=true;toast('IN '+k.col.toUpperCase()+' RIDE','#8ff5ff');
  }
}
function carBlocked(c,x,y){
  var co=Math.cos(c.ang),si=Math.sin(c.ang),pts=[[24,0],[-18,0],[0,13],[0,-13]];
  for(var i=0;i<4;i++){var fx=pts[i][0],fy=pts[i][1];
    if(blocked(x+co*fx-si*fy,y+si*fx+co*fy,3))return true;}
  return false;
}
function updateAICar(c,dt){
  if(c.axis===0){
    var py=c.y;c.y+=c.dir*c.cruise*dt;c.x=c.road*TILE+32+c.lane;
    var a=Math.floor(py/TILE),b=Math.floor(c.y/TILE);
    if(a!==b){
      var lo,hi;
      if(b>a){lo=a+1;hi=b;}else{lo=b;hi=a-1;}
      var r0=Math.ceil(lo/7)*7;
      if(lo<=hi&&r0>=0&&r0<MAPH&&r0<=hi&&c.last!==r0){
        c.last=r0;
        if(Math.random()<0.45){
          c.axis=1;c.road=r0;c.dir=Math.random()<0.5?1:-1;c.lane=c.dir>0?14:-14;
          c.y=r0*TILE+32+c.lane;return;
        }
      }
    }
    if(c.y<32||c.y>WH-32){c.dir*=-1;c.lane=c.dir>0?-14:14;c.y=clamp(c.y,32,WH-32);c.last=-1;}
    c.ang=c.dir>0?Math.PI/2:-Math.PI/2;
  }else{
    var px=c.x;c.x+=c.dir*c.cruise*dt;c.y=c.road*TILE+32+c.lane;
    var a2=Math.floor(px/TILE),b2=Math.floor(c.x/TILE);
    if(a2!==b2){
      var lo2,hi2;
      if(b2>a2){lo2=a2+1;hi2=b2;}else{lo2=b2;hi2=a2-1;}
      var r1=Math.ceil(lo2/7)*7;
      if(lo2<=hi2&&r1>=0&&r1<MAPW&&r1<=hi2&&c.last!==r1){
        c.last=r1;
        if(Math.random()<0.45){
          c.axis=0;c.road=r1;c.dir=Math.random()<0.5?1:-1;c.lane=c.dir>0?-14:14;
          c.x=r1*TILE+32+c.lane;return;
        }
      }
    }
    if(c.x<480||c.x>WW-32){c.dir*=-1;c.lane=c.dir>0?14:-14;c.x=clamp(c.x,480,WW-32);c.last=-1;}
    c.ang=c.dir>0?0:Math.PI;
  }
}
function drivePlayer(c,dt){
  var max=360;
  if(ctrl.t)c.spd+=360*dt;
  if(ctrl.b)c.spd-=(c.spd>0?560:200)*dt;
  if(!ctrl.t&&!ctrl.b)c.spd*=Math.pow(0.4,dt);
  c.spd=clamp(c.spd,-150,max);
  var grip=clamp(Math.abs(c.spd)/110,0,1);
  c.ang+=(ctrl.r-ctrl.l)*2.5*dt*grip*(c.spd<0?-1:1);
  var nx=c.x+Math.cos(c.ang)*c.spd*dt,ny=c.y+Math.sin(c.ang)*c.spd*dt;
  if(carBlocked(c,nx,ny)){
    if(Math.abs(c.spd)>130){damageCar(c,Math.abs(c.spd)*0.07,true);sfxCrash();}
    c.spd*=-0.35;
  }else{c.x=nx;c.y=ny;}
  var tt=tileType(Math.floor(c.x/TILE),Math.floor(c.y/TILE));
  if(tt!==ROAD&&tt!==SAND)c.spd*=Math.pow(0.55,dt);
  // run over pedestrians
  if(Math.abs(c.spd)>60){
    for(var i=0;i<peds.length;i++){var p=peds[i];
      if(p.dead||p.mission)continue;
      if(dist(c.x,c.y,p.x,p.y)<26){killPed(p,true);commitCrime(1);}}
  }
}
function updateCopCar(c,dt){
  var tg=P.car||P,ang=Math.atan2(tg.y-c.y,tg.x-c.x);
  var d=norm(ang-c.ang);
  c.ang+=clamp(d,-2.4*dt,2.4*dt);
  c.spd+=(230-c.spd)*dt*1.2;
  var nx=c.x+Math.cos(c.ang)*c.spd*dt,ny=c.y+Math.sin(c.ang)*c.spd*dt;
  if(carBlocked(c,nx,ny)){c.spd*=-0.4;if(Math.abs(c.spd)>120)sfxCrash();}else{c.x=nx;c.y=ny;}
  if(P.car&&dist(c.x,c.y,P.car.x,P.car.y)<44){
    var push=Math.atan2(P.car.y-c.y,P.car.x-c.x);
    P.car.x+=Math.cos(push)*3;P.car.y+=Math.sin(push)*3;
    P.car.spd*=0.94;damageCar(P.car,18,false);damageCar(c,12,false);
  }
}
function damageCar(c,d,byP){
  if(c.dead)return;
  c.hp-=d;c.smoke=1;
  if(c.hp<=0){
    c.dead=1;c.deadT=0;sfxBoom();boom(c.x,c.y);
    if(dist(c.x,c.y,P.x,P.y)<130)hurtPlayer(45);
    if(c===P.car){P.car=null;hurtPlayer(40);}
    if(byP)commitCrime(c.cop?2:1);
  }
}
function boom(x,y){
  for(var i=0;i<30;i++)parts.push({x:x,y:y,vx:rnd(300,-300),vy:rnd(300,-300),t:rnd(1,0.4),m:1,c:i%3?'#ff9f4a':'#ffd166',r:rnd(9,3)});
}

/* ---------- peds ---------- */
var SHIRT=['#ff5f7e','#4fd1e0','#ffd166','#c792ea','#7bd88f','#e8e8ef','#ff9f4a'];
function makePed(x,y,opts){
  opts=opts||{};
  return {x:x,y:y,ang:rnd(TAU),hp:opts.hp||40,spd:rnd(55,35),dirT:rnd(3,0.5),fear:0,
    cop:!!opts.cop,gang:!!opts.gang,mission:!!opts.mission,boss:!!opts.boss,
    col:opts.col||SHIRT[(Math.random()*SHIRT.length)|0],walk:rnd(9),cool:rnd(2,0),
    dead:false,dt:0};
}
function spawnPedNear(minD,maxD,opts){
  for(var k=0;k<30;k++){
    var a=rnd(TAU),d=rnd(maxD,minD);
    var x=P.x+Math.cos(a)*d,y=P.y+Math.sin(a)*d;
    if(blocked(x,y,10))continue;
    var p=makePed(x,y,opts);peds.push(p);return p;
  }
  return null;
}
function killPed(p,byP){
  if(p.dead)return;
  p.dead=true;p.dt=0;blood(p.x,p.y,18);
  if(AC)hit(AC.currentTime,0.1,'bandpass',900,300,0.35);
  if(p.mission){
    if(mis.phase==='go'){mis.kills++;if(mis.kills>=MIS[mis.i].n)completeMis();}
  }else if(byP){
    P.kills++;
    commitCrime(p.cop?2:1);
  }
}
function blood(x,y,n){
  for(var i=0;i<n;i++)parts.push({x:x,y:y,vx:rnd(160,-160),vy:rnd(160,-160),t:rnd(0.7,0.2),m:0,c:'#c11a3a',r:rnd(5,2)});
}
function updatePed(p,dt){
  if(p.dead){p.dt+=dt;return;}
  var tgt=(p.cop||p.gang)?(P.car||P):null;
  var d=tgt?dist(p.x,p.y,tgt.x,tgt.y):9999;
  if(tgt&&d<520&&state==='play'){
    var ang=Math.atan2(tgt.y-p.y,tgt.x-p.x);
    p.ang=ang;
    if(d>150){var nx=p.x+Math.cos(ang)*p.spd*1.6*dt,ny=p.y+Math.sin(ang)*p.spd*1.6*dt;
      if(!blocked(nx,p.y,9))p.x=nx;if(!blocked(p.x,ny,9))p.y=ny;}
    p.cool-=dt;
    if(d<430&&p.cool<=0){
      p.cool=p.cop?1.1:1.5;
      var a2=ang+rnd(0.09,-0.09);
      bullets.push({x:p.x+Math.cos(a2)*16,y:p.y+Math.sin(a2)*16,vx:Math.cos(a2)*820,vy:Math.sin(a2)*820,life:0.7,own:'e',dmg:p.boss?16:9});
      if(AC)sfxBlip(300,0.05);
    }
    p.walk+=dt*11;
    return;
  }
  p.fear=Math.max(0,p.fear-dt);
  p.dirT-=dt;
  if(p.dirT<=0){p.dirT=rnd(3.5,1);p.ang+=rnd(2.4,-2.4);}
  var sp=p.fear>0?p.spd*2.1:p.spd;
  var nx2=p.x+Math.cos(p.ang)*sp*dt,ny2=p.y+Math.sin(p.ang)*sp*dt;
  if(blocked(nx2,ny2,9)){p.ang+=Math.PI*0.6;p.dirT=0.6;}
  else{p.x=nx2;p.y=ny2;}
  p.walk+=dt*(sp/30);
  if(p.x<60||p.x>WW-60||p.y<60||p.y>WH-60)p.ang+=Math.PI;
}

/* ---------- bullets / particles ---------- */
function updateBullets(dt){
  for(var i=bullets.length-1;i>=0;i--){
    var b=bullets[i];
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
    if(b.life<=0||solidAt(b.x,b.y)){bullets.splice(i,1);continue;}
    var hitSomething=false;
    if(b.own==='p'){
      for(var j=0;j<peds.length;j++){var p=peds[j];
        if(p.dead)continue;
        if(dist(b.x,b.y,p.x,p.y)<15){p.hp-=b.dmg;p.fear=6;blood(p.x,p.y,5);
          if(p.hp<=0)killPed(p,true);hitSomething=true;break;}}
      if(!hitSomething)for(var k=0;k<cars.length;k++){var c=cars[k];
        if(c.dead||c===P.car)continue;
        if(dist(b.x,b.y,c.x,c.y)<25){damageCar(c,b.dmg,true);hitSomething=true;break;}}
    }else{
      if(P.car){
        if(dist(b.x,b.y,P.car.x,P.car.y)<25){damageCar(P.car,b.dmg,false);hitSomething=true;}
      }else if(dist(b.x,b.y,P.x,P.y)<14){hurtPlayer(b.dmg);hitSomething=true;}
    }
    if(hitSomething)bullets.splice(i,1);
  }
}
function updateParts(dt){
  for(var i=parts.length-1;i>=0;i--){
    var q=parts[i];q.t-=dt;
    if(q.t<=0){parts.splice(i,1);continue;}
    q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=0.92;q.vy*=0.92;
  }
}
function updateToasts(dt){
  for(var i=toasts.length-1;i>=0;i--){toasts[i].t-=dt;if(toasts[i].t<=0)toasts.splice(i,1);}
  radioT=Math.max(0,radioT-dt);
}
function hurtPlayer(d){
  if(state!=='play')return;
  if(P.armor>0){var a=Math.min(P.armor,d*0.6);P.armor-=a;d-=a;}
  P.hp-=d;P.hurt=0.35;
  if(P.hp<=0){P.hp=0;die();}
}

/* ---------- pickups ---------- */
function spawnPicks(){
  var kinds=['health','armor','smg','money','money','health','smg','money'];
  for(var i=0;i<46;i++){
    for(var k=0;k<30;k++){
      var tx=7+((Math.random()*(MAPW-8))|0),ty=((Math.random()*MAPH)|0);
      var t=tileType(tx,ty);
      if(t!==ROAD&&t!==GRASS&&t!==SAND)continue;
      picks.push({x:tx*TILE+32,y:ty*TILE+32,k:kinds[i%kinds.length],t:0});
      break;
    }
  }
}
function updatePicks(dt){
  var px=P.x,py=P.y;
  for(var i=picks.length-1;i>=0;i--){
    var q=picks[i];
    if(q.t>0){q.t-=dt;if(q.t<=0)q.t=0;else continue;}
    if(dist(px,py,q.x,q.y)<30){
      if(q.k==='health'){if(P.hp>=100)continue;P.hp=Math.min(100,P.hp+40);toast('HEALTH +40','#7bd88f');}
      else if(q.k==='armor'){P.armor=Math.min(100,P.armor+50);toast('ARMOR +50','#8ff5ff');}
      else if(q.k==='smg'){P.wep=2;P.ammo[2]=120;P.ammo[1]=Math.max(P.ammo[1],30);toast('MICRO SMG','#ffd166');}
      else{P.money+=150;toast('+$150','#7bd88f');}
      sfxPickup();picks.splice(i,1);
    }
  }
}

/* ---------- missions ---------- */
function startMis(){
  var m=MIS[mis.i];
  mis.phase='go';mis.kills=0;mis.timer=m.time||0;
  if(m.type==='kill'){
    var g=mPos('g');
    for(var i=0;i<m.n;i++){
      var a=i/m.n*TAU;
      var p=spawnPedNear(0,0,{});
      p.x=g.x+Math.cos(a)*rnd(150,70);p.y=g.y+Math.sin(a)*rnd(150,70);
      if(blocked(p.x,p.y,10)){p.x=g.x;p.y=g.y;}
      p.gang=true;p.mission=true;p.hp=i===0?120:55;p.boss=i===0&&mis.i===4;
      p.col=i===0?'#ff2d2d':'#c11a3a';p.spd=70;
    }
    toast('MISSION START: '+m.t,'#ff2d95');
  }else{
    toast('MISSION START: '+m.t,'#ff2d95');
    if(mis.timer)toast('HURRY! '+m.time+' SECONDS','#ffd166');
  }
}
function failMis(){
  toast('MISSION FAILED','#ff5f7e');
  for(var i=peds.length-1;i>=0;i--)if(peds[i].mission)peds.splice(i,1);
  mis.phase='to';mis.timer=0;
}
function completeMis(){
  var m=MIS[mis.i];
  P.money+=m.r;
  toast('MISSION PASSED! +$'+m.r,'#7bd88f');
  if(AC){sfxPickup();setTimeout(sfxPickup,140);}
  mis.i++;mis.phase='to';mis.timer=0;
  if(mis.i>=MIS.length){
    state='win';
    showOv('EMPIRE ESTABLISHED','VICE CITY IS YOURS','You took over the city — the Print Works, the club, the docks.<br>Property income now doubles. Keep causing trouble.',
      'KEEP PLAYING',function(){state='play';});
  }
}
function updateMis(dt){
  if(mis.i>=MIS.length){incomeT-=dt;if(incomeT<=0){incomeT=45;P.money+=500;toast('PROPERTY INCOME +$500','#7bd88f');}return;}
  var m=MIS[mis.i];
  if(mis.phase==='to'){
    var s=mPos('s');
    if(dist(P.x,P.y,s.x,s.y)<48)startMis();
  }else{
    if(m.timer>0){mis.timer-=dt;if(mis.timer<=0){failMis();return;}}
    if(m.type==='goto'||m.type==='car'){
      var g=mPos('g');
      if(dist(P.x,P.y,g.x,g.y)<52){
        if(m.type==='car'&&!P.car){toast('YOU NEED A VEHICLE!','#ff8fa3');}
        else completeMis();
      }
    }
  }
}

/* ---------- pools / wanted ---------- */
function maintain(dt){
  var i,c;
  // traffic
  var live=0;
  for(i=0;i<cars.length;i++)if(!cars[i].dead&&cars[i].ai&&!cars[i].cop)live++;
  spawnT-=dt;
  if(live<14&&spawnT<=0){spawnT=1.2;spawnTrafficOne();}
  // cleanup far non-player cars
  for(i=cars.length-1;i>=0;i--){c=cars[i];
    if(c===P.car)continue;
    var d=dist(c.x,c.y,P.x,P.y);
    if(d>3400&&!(c.cop&&wanted>0))cars.splice(i,1);
    else if(c.dead){c.deadT+=dt;if(c.deadT>30)cars.splice(i,1);}}
  // peds
  var pn=0;
  for(i=0;i<peds.length;i++)if(!peds[i].dead)pn++;
  pedT-=dt;
  if(pn<20&&pedT<=0){pedT=0.35;spawnPedNear(600,1600,{});}
  for(i=peds.length-1;i>=0;i--){var p=peds[i];
    if(p.mission)continue;
    if(p.dead){if(p.dt>4)peds.splice(i,1);continue;}
    if(dist(p.x,p.y,P.x,P.y)>2600)peds.splice(i,1);}
  // cops
  if(wanted>0){
    var cc=0;
    for(i=0;i<cars.length;i++)if(cars[i].cop&&!cars[i].dead)cc++;
    if(cc<wanted&&spawnT<=0){spawnT=1.6;spawnCop();}
    if(wanted>=2){
      var fc=0;
      for(i=0;i<peds.length;i++)if(peds[i].cop&&!peds[i].dead)fc++;
      if(fc<wanted*2&&Math.random()<0.04)spawnPedNear(700,1300,{cop:true,hp:50,col:'#2b4fa0'});
    }
  }
}
function spawnTrafficOne(){
  for(var k=0;k<30;k++){
    var a=rnd(TAU),d=rnd(2000,1100);
    var x=P.x+Math.cos(a)*d,y=P.y+Math.sin(a)*d;
    var tx=Math.floor(x/TILE),ty=Math.floor(y/TILE);
    if(tileType(tx,ty)!==ROAD)continue;
    var c=makeCar(tx*TILE+32,ty*TILE+32,CARCOL[(Math.random()*CARCOL.length)|0]);
    if(tx%7===0){c.axis=0;c.road=tx;c.dir=Math.random()<0.5?1:-1;c.lane=c.dir>0?-14:14;c.x=tx*TILE+32+c.lane;c.ang=c.dir>0?Math.PI/2:-Math.PI/2;}
    else{c.axis=1;c.road=ty;c.dir=Math.random()<0.5?1:-1;c.lane=c.dir>0?14:-14;c.y=ty*TILE+32+c.lane;c.ang=c.dir>0?0:Math.PI;}
    c.last=-1;cars.push(c);return;
  }
}
function spawnCop(){
  var a=rnd(TAU),d=1400;
  var x=P.x+Math.cos(a)*d,y=P.y+Math.sin(a)*d;
  var c=makeCar(x,y,'#ffffff',true);
  c.cop=true;c.ang=Math.atan2(P.y-y,P.x-x);c.hp=90;
  cars.push(c);
}
function updateWanted(dt){
  if(wanted>0){
    crimeT-=dt;
    if(crimeT<=0){wanted--;crimeT=wanted>0?18:0;}
  }
}

/* ---------- firing ---------- */
function equip(w){
  if(w===2&&P.ammo[2]<=0){toast('NO SMG AMMO','#ff8fa3');return;}
  if(w===1&&P.ammo[1]<=0){toast('NO PISTOL AMMO','#ff8fa3');return;}
  P.wep=w;
}
function tryFire(){
  if(P.cool>0)return;
  var w=WEAPONS[P.wep];
  if(P.wep>0&&P.ammo[P.wep]<=0){P.wep=0;toast('OUT OF AMMO','#ff8fa3');return;}
  P.cool=w.rate;
  if(P.wep===0){
    for(var i=0;i<peds.length;i++){var p=peds[i];
      if(p.dead)continue;
      if(dist(P.x,P.y,p.x,p.y)<52&&Math.abs(norm(Math.atan2(p.y-P.y,p.x-P.x)-P.aim))<1.1){
        p.hp-=w.dmg;p.fear=6;blood(p.x,p.y,6);if(p.hp<=0)killPed(p,true);break;}}
    if(AC)sfxBlip(120,0.06);
    return;
  }
  P.ammo[P.wep]--;
  var n=P.wep===2?1:1;
  for(var j=0;j<n;j++){
    var a=P.aim+rnd(w.sp,-w.sp);
    bullets.push({x:P.x+Math.cos(a)*18,y:P.y+Math.sin(a)*18,vx:Math.cos(a)*950,vy:Math.sin(a)*950,life:0.7,own:'p',dmg:w.dmg});
  }
  parts.push({x:P.x+Math.cos(P.aim)*24,y:P.y+Math.sin(P.aim)*24,vx:0,vy:0,t:0.06,m:2,c:'#fff2b0',r:9});
  if(AC)sfxShot();
}

/* ---------- update ---------- */
function update(dt){
  var i,j;
  P.cool-=dt;P.hurt=Math.max(0,P.hurt-dt);
  // aim
  var sx=P.x-cam.x+VW/2,sy=P.y-cam.y+VH/2;
  P.aim=Math.atan2(mouse.y-sy,mouse.x-sx);
  // input
  ctrl.t=(keys.KeyW||keys.ArrowUp)?1:0;
  ctrl.b=(keys.KeyS||keys.ArrowDown)?1:0;
  ctrl.l=(keys.KeyA||keys.ArrowLeft)?1:0;
  ctrl.r=(keys.KeyD||keys.ArrowRight)?1:0;
  if(P.car){P.ang=P.car.ang;P.walk=0;}
  else{
    var dx=ctrl.r-ctrl.l,dy=ctrl.t-ctrl.b;
    if(dx||dy){
      var l=Math.hypot(dx,dy);dx/=l;dy/=l;
      P.ang=Math.atan2(dy,dx);
      var sprint=(keys.ShiftLeft||keys.ShiftRight)?1.6:1;
      var sp=160*sprint;
      var nx=P.x+dx*sp*dt,ny=P.y+dy*sp*dt;
      if(!blocked(nx,P.y,11))P.x=nx;
      if(!blocked(P.x,ny,11))P.y=ny;
      P.walk+=dt*(sprint>1?13:9);
    }
  }
  P.x=clamp(P.x,10,WW-10);P.y=clamp(P.y,10,WH-10);
  if(mouse.down||keys.Space)tryFire();
  // vehicles
  for(i=0;i<cars.length;i++){
    var c=cars[i];
    if(c.dead)continue;
    if(c===P.car)drivePlayer(c,dt);
    else if(c.cop)updateCopCar(c,dt);
    else if(c.ai)updateAICar(c,dt);
    if(c.smoke&&c.hp>40)c.smoke=0;
    if(c.smoke&&Math.random()<0.06)parts.push({x:c.x,y:c.y,vx:rnd(20,-20),vy:rnd(20,-20),t:rnd(1.4,0.8),m:3,c:'#666',r:rnd(8,4)});
  }
  // car-car separation
  for(i=0;i<cars.length;i++){var a=cars[i];if(a.dead||a===P.car)continue;
    for(j=i+1;j<cars.length;j++){var b2=cars[j];if(b2.dead)continue;
      var dd=dist(a.x,a.y,b2.x,b2.y);
      if(dd<46&&dd>0.01){
        var pu=(46-dd)/2,pa=Math.atan2(b2.y-a.y,b2.x-a.x);
        a.x-=Math.cos(pa)*pu;a.y-=Math.sin(pa)*pu;
        b2.x+=Math.cos(pa)*pu;b2.y+=Math.sin(pa)*pu;
        if((Math.abs(a.spd)+Math.abs(b2.spd))>160){damageCar(a,6,false);damageCar(b2,6,false);sfxCrash();}
        a.spd*=0.7;b2.spd*=0.7;
      }}
  }
  // peds
  for(i=0;i<peds.length;i++)updatePed(peds[i],dt);
  updateBullets(dt);updateParts(dt);updatePicks(dt);updateMis(dt);
  updateWanted(dt);maintain(dt);updateToasts(dt);
  // audio
  if(AC){
    if(P.car){engG.gain.value=0.07;engO.frequency.value=50+Math.abs(P.car.spd)*0.6;}
    else engG.gain.value=0;
    if(wanted>0){sirenG.gain.value=0.018;sirenO.frequency.value=(Math.floor(performance.now()/340)%2)?840:620;}
    else sirenG.gain.value=0;
  }
  // camera
  var f=P.car||P;
  var lead=P.car?Math.cos(P.car.ang)*P.car.spd*0.25:Math.cos(P.aim)*40;
  var leady=P.car?Math.sin(P.car.ang)*P.car.spd*0.25:Math.sin(P.aim)*40;
  var tx2=f.x-VW/2+lead,ty2=f.y-VH/2+leady;
  cam.x+=(tx2-cam.x)*Math.min(1,dt*7);
  cam.y+=(ty2-cam.y)*Math.min(1,dt*7);
  cam.x=WW>VW?clamp(cam.x,0,WW-VW):(WW-VW)/2;
  cam.y=WH>VH?clamp(cam.y,0,WH-VH):(WH-VH)/2;
}

/* ---------- rendering ---------- */
function drawGround(){
  var x0=Math.floor(cam.x/TILE)-1,x1=Math.floor((cam.x+VW)/TILE)+1;
  var y0=Math.floor(cam.y/TILE)-1,y1=Math.floor((cam.y+VH)/TILE)+1;
  var t=performance.now()*0.001;
  for(var ty=y0;ty<=y1;ty++)for(var tx=x0;tx<=x1;tx++){
    var T=tileType(tx,ty),X=tx*TILE,Y=ty*TILE;
    if(T===WATER){
      var v=Math.sin(tx*0.6+ty*0.8+t*2.2);
      ctx.fillStyle=v>0.3?'#1a6fa8':(v<-0.3?'#0f4f7f':'#155f95');
      ctx.fillRect(X,Y,TILE,TILE);
    }else if(T===SAND){
      ctx.fillStyle='#e6d39a';ctx.fillRect(X,Y,TILE,TILE);
      if(hash(tx,ty)%5===0){ctx.fillStyle='#d6c285';ctx.fillRect(X+18,Y+22,7,5);}
    }else if(T===GRASS){
      ctx.fillStyle='#3f8049';ctx.fillRect(X,Y,TILE,TILE);
      if(hash(tx,ty)%4===0){ctx.fillStyle='#4c9257';ctx.fillRect(X+10,Y+30,12,6);}
    }else{
      ctx.fillStyle='#33353d';ctx.fillRect(X,Y,TILE,TILE);
      ctx.fillStyle='#6b6e78';
      var n;
      n=tileType(tx,ty-1);if(n!==ROAD&&n!==WATER)ctx.fillRect(X,Y,TILE,9);
      n=tileType(tx,ty+1);if(n!==ROAD&&n!==WATER)ctx.fillRect(X,Y+TILE-9,TILE,9);
      n=tileType(tx-1,ty);if(n!==ROAD&&n!==WATER)ctx.fillRect(X,Y,9,TILE);
      n=tileType(tx+1,ty);if(n!==ROAD&&n!==WATER)ctx.fillRect(X+TILE-9,Y,9,TILE);
      ctx.fillStyle='#e8c33a';
      var d;
      if(tx%7===0&&ty%7!==0){for(d=6;d<TILE;d+=26)ctx.fillRect(X+TILE/2-2,Y+d,4,14);}
      else if(ty%7===0&&tx%7!==0){for(d=6;d<TILE;d+=26)ctx.fillRect(X+d,Y+TILE/2-2,14,4);}
    }
  }
}
function drawBuilds(){
  for(var i=0;i<blocks.length;i++){
    var b=blocks[i];
    if(b.x>cam.x+VW+40||b.x+b.w<cam.x-40||b.y>cam.y+VH+40||b.y+b.h<cam.y-40)continue;
    ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(b.x+12,b.y+14,b.w,b.h);
    ctx.fillStyle=b.c;ctx.fillRect(b.x,b.y,b.w,b.h);
    ctx.fillStyle='rgba(0,0,0,.3)';ctx.fillRect(b.x+9,b.y+9,b.w-18,b.h-18);
    var h1=hash((b.x/64)|0,(b.y/64)|0);
    if(h1%2===0){ctx.fillStyle='rgba(130,230,255,.35)';
      ctx.fillRect(b.x+b.w*0.32,b.y+b.h*0.3,Math.min(80,b.w*0.3),Math.min(60,b.h*0.3));}
    var n=2+(h1%4);
    for(var j=0;j<n;j++){
      var h2=hash(b.x+j*37,b.y+j*11);
      var ax=b.x+16+(h2%Math.max(1,b.w-64));
      var ay=b.y+16+(hash(b.y+j*5,b.x+j*3)%Math.max(1,b.h-56));
      ctx.fillStyle='#9aa3ad';ctx.fillRect(ax,ay,26,20);
      ctx.fillStyle='#5b6169';ctx.fillRect(ax+3,ay+3,20,6);
    }
    if(b.neon){
      ctx.strokeStyle=(b.k%2)?'#ff2d95':'#00e5ff';
      ctx.lineWidth=3;ctx.shadowColor=ctx.strokeStyle;ctx.shadowBlur=14;
      ctx.strokeRect(b.x+3,b.y+3,b.w-6,b.h-6);ctx.shadowBlur=0;
    }
  }
}
function drawPicks(){
  var t=performance.now()*0.004;
  for(var i=0;i<picks.length;i++){
    var q=picks[i];
    if(q.x<cam.x-40||q.x>cam.x+VW+40||q.y<cam.y-40||q.y>cam.y+VH+40)continue;
    var col=q.k==='armor'?'#00e5ff':q.k==='smg'?'#ffd166':'#7bd88f';
    ctx.save();ctx.translate(q.x,q.y+Math.sin(t+i)*4);
    ctx.shadowColor=col;ctx.shadowBlur=16;ctx.fillStyle=col;
    if(q.k==='money'){rr(-11,-8,22,16,3);ctx.fill();
      ctx.fillStyle='#0b3d1e';ctx.font='bold 13px monospace';ctx.textAlign='center';ctx.fillText('$',0,5);}
    else if(q.k==='health'){ctx.fillRect(-4,-12,8,24);ctx.fillRect(-12,-4,24,8);}
    else if(q.k==='armor'){ctx.beginPath();ctx.moveTo(0,-13);ctx.lineTo(11,-6);ctx.lineTo(0,13);ctx.lineTo(-11,-6);ctx.closePath();ctx.fill();}
    else{ctx.fillRect(-14,-4,26,8);ctx.fillRect(-4,-10,8,7);}
    ctx.restore();
  }
}
function drawMarker(){
  if(state!=='play')return;
  var p=missionPoint();
  if(!p)return;
  var pu=0.5+0.5*Math.sin(performance.now()*0.005);
  var g=ctx.createLinearGradient(p.x,p.y-170,p.x,p.y);
  g.addColorStop(0,'rgba(0,229,255,0)');g.addColorStop(1,'rgba(0,229,255,.45)');
  ctx.fillStyle=g;ctx.fillRect(p.x-15,p.y-170,30,170);
  ctx.fillStyle='rgba(255,45,149,'+(0.16+0.14*pu)+')';
  ctx.beginPath();ctx.arc(p.x,p.y,46,0,TAU);ctx.fill();
  ctx.strokeStyle='#ff2d95';ctx.lineWidth=4;
  ctx.beginPath();ctx.arc(p.x,p.y,44+pu*10,0,TAU);ctx.stroke();
}
function drawCar(c){
  ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.ang);
  var L=c.len,Wd=c.wid;
  ctx.fillStyle='rgba(0,0,0,.4)';rr(-L/2+4,-Wd/2+6,L,Wd,7);ctx.fill();
  if(P.car===c){ctx.shadowColor='#00e5ff';ctx.shadowBlur=18;}
  ctx.fillStyle=c.dead?'#1b1b1e':(c.cop?((Math.floor(performance.now()/120)+c.flash)%2?'#1b3fa0':'#e8e8ef'):c.col);
  rr(-L/2,-Wd/2,L,Wd,7);ctx.fill();ctx.shadowBlur=0;
  ctx.fillStyle='rgba(10,14,22,.85)';rr(-L*0.14,-Wd/2+3,L*0.36,Wd-6,4);ctx.fill();
  ctx.fillStyle='rgba(170,235,255,.55)';ctx.fillRect(L*0.17,-Wd/2+3,5,Wd-6);
  ctx.fillStyle='rgba(170,235,255,.35)';ctx.fillRect(-L*0.32,-Wd/2+3,4,Wd-6);
  if(!c.dead){
    ctx.fillStyle='#ffe9a8';ctx.fillRect(L/2-5,-Wd/2+3,4,6);ctx.fillRect(L/2-5,Wd/2-9,4,6);
    ctx.fillStyle='#ff4b4b';ctx.fillRect(-L/2+1,-Wd/2+3,3,6);ctx.fillRect(-L/2+1,Wd/2-9,3,6);
  }
  if(c.cop&&!c.dead){
    var f=Math.floor(performance.now()/120)%2;
    ctx.fillStyle=f?'#ff2d2d':'#2f6bff';ctx.fillRect(-7,-Wd/2-3,8,5);
    ctx.fillStyle=f?'#2f6bff':'#ff2d2d';ctx.fillRect(2,-Wd/2-3,8,5);
  }
  ctx.fillStyle='#15151a';
  ctx.fillRect(-L*0.3,-Wd/2-3,10,4);ctx.fillRect(L*0.2,-Wd/2-3,10,4);
  ctx.fillRect(-L*0.3,Wd/2-1,10,4);ctx.fillRect(L*0.2,Wd/2-1,10,4);
  ctx.restore();
}
function drawPed(p){
  ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.ang);
  if(p.dead){
    ctx.globalAlpha=clamp(1-p.dt/4,0,1);
    ctx.fillStyle='#7a1224';ctx.beginPath();ctx.ellipse(0,0,16,10,0,0,TAU);ctx.fill();
    ctx.fillStyle=p.col;rr(-9,-6,18,12,5);ctx.fill();
    ctx.globalAlpha=1;ctx.restore();return;
  }
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(2,5,11,8,0,0,TAU);ctx.fill();
  var s=Math.sin(p.walk)*3;
  ctx.fillStyle='#26314a';ctx.fillRect(-4,-9+s,7,5);ctx.fillRect(-4,4-s,7,5);
  ctx.fillStyle=p.col;rr(-8,-8,17,16,6);ctx.fill();
  ctx.fillStyle='#f0c8a0';ctx.beginPath();ctx.arc(3,0,6,0,TAU);ctx.fill();
  if(p.cop||p.gang){ctx.fillStyle='#222';ctx.fillRect(6,-2,13,4);}
  if(p.boss){ctx.fillStyle='#ff2d2d';ctx.beginPath();ctx.moveTo(0,-27);ctx.lineTo(7,-17);ctx.lineTo(-7,-17);ctx.closePath();ctx.fill();}
  ctx.restore();
}
function drawPlayer(){
  ctx.save();ctx.translate(P.x,P.y);ctx.rotate(P.aim);
  ctx.fillStyle='rgba(0,0,0,.4)';ctx.beginPath();ctx.ellipse(3,6,13,9,0,0,TAU);ctx.fill();
  var s=Math.sin(P.walk)*4;
  ctx.fillStyle='#e8e8ef';ctx.fillRect(-5,-10+s,8,6);ctx.fillRect(-5,4-s,8,6);
  ctx.fillStyle='#2fa8a0';rr(-9,-9,20,18,7);ctx.fill();
  ctx.fillStyle='#f0c8a0';ctx.beginPath();ctx.arc(4,0,7,0,TAU);ctx.fill();
  ctx.fillStyle='#3a2a1a';ctx.beginPath();ctx.arc(3,0,7,Math.PI,TAU);ctx.fill();
  if(P.wep>0){ctx.fillStyle='#1b1b1e';ctx.fillRect(8,-3,17,6);}
  ctx.restore();
}
function drawBullets(){
  for(var i=0;i<bullets.length;i++){var b=bullets[i];
    ctx.strokeStyle=b.own==='p'?'#fff2b0':'#ff8fa3';ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(b.x-b.vx*0.013,b.y-b.vy*0.013);ctx.stroke();}
}
function drawParts(){
  for(var i=0;i<parts.length;i++){var q=parts[i];
    ctx.globalAlpha=clamp(q.t*2,0,1);
    ctx.fillStyle=q.c;
    if(q.m===2){ctx.shadowColor=q.c;ctx.shadowBlur=12;}
    ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,TAU);ctx.fill();
    ctx.shadowBlur=0;ctx.globalAlpha=1;
  }
}
function blip(x,y,col,r){
  var R=88,cx=100,cy=100,s=0.055;
  var dx=cx+(x-P.x)*s,dy=cy+(y-P.y)*s;
  var d=Math.hypot(dx-cx,dy-cy);
  if(d>R-8){var a=Math.atan2(dy-cy,dx-cx);dx=cx+Math.cos(a)*(R-8);dy=cy+Math.sin(a)*(R-8);}
  ctx.fillStyle=col;ctx.beginPath();ctx.arc(dx,dy,r,0,TAU);ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,.7)';ctx.lineWidth=1.5;ctx.stroke();
}
function drawRadar(){
  var R=88,cx=100,cy=100,s=0.055;
  ctx.save();
  ctx.beginPath();ctx.arc(cx,cy,R,0,TAU);ctx.clip();
  ctx.fillStyle='#0b1d2e';ctx.fillRect(cx-R,cy-R,R*2,R*2);
  var half=R/s,sw=(half*2)/16;
  var sx=(P.x-half)/16,sy=(P.y-half)/16;
  var x0=Math.max(0,sx),y0=Math.max(0,sy),x1=Math.min(MM.width,sx+sw),y1=Math.min(MM.height,sy+sw);
  if(x1>x0&&y1>y0){
    var u0=(x0-sx)/sw,v0=(y0-sy)/sw,u1=(x1-sx)/sw,v1=(y1-sy)/sw;
    ctx.drawImage(MM,x0,y0,x1-x0,y1-y0,cx-R+u0*R*2,cy-R+v0*R*2,(u1-u0)*R*2,(v1-v0)*R*2);
  }
  var mp=missionPoint();
  if(mp)blip(mp.x,mp.y,'#ff2d95',6);
  for(var i=0;i<cars.length;i++)if(cars[i].cop&&!cars[i].dead)blip(cars[i].x,cars[i].y,'#4f9bff',4);
  for(var j=0;j<peds.length;j++)if(peds[j].mission&&!peds[j].dead)blip(peds[j].x,peds[j].y,'#ff3b3b',4);
  ctx.save();ctx.translate(cx,cy);ctx.rotate(P.ang);
  ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(11,0);ctx.lineTo(-7,6);ctx.lineTo(-7,-6);ctx.closePath();ctx.fill();
  ctx.restore();
  ctx.restore();
  ctx.lineWidth=4;ctx.strokeStyle='#ff2d95';ctx.beginPath();ctx.arc(cx,cy,R,0,TAU);ctx.stroke();
  ctx.lineWidth=2;ctx.strokeStyle='#00e5ff';ctx.beginPath();ctx.arc(cx,cy,R+5,0,TAU);ctx.stroke();
}
function star(x,y,r,fill){
  ctx.beginPath();
  for(var i=0;i<10;i++){
    var a=-Math.PI/2+i*Math.PI/5,rr2=i%2?r*0.45:r;
    var xx=x+Math.cos(a)*rr2,yy=y+Math.sin(a)*rr2;
    if(i===0)ctx.moveTo(xx,yy);else ctx.lineTo(xx,yy);
  }
  ctx.closePath();
  if(fill){ctx.fillStyle='#ffd166';ctx.shadowColor='#ffd166';ctx.shadowBlur=14;ctx.fill();ctx.shadowBlur=0;}
  ctx.strokeStyle='rgba(0,0,0,.85)';ctx.lineWidth=2;ctx.stroke();
}
function district(){
  var tx=Math.floor(P.x/TILE),ty=Math.floor(P.y/TILE);
  if(tx<14)return 'OCEAN BEACH';
  if(tx>=50)return 'ESCOBAR INTL';
  if(ty<16)return 'DOWNTOWN';
  if(ty>=46)return 'LITTLE HAVANA';
  return 'VICE POINT';
}
function drawHUD(){
  txt('$'+P.money.toLocaleString(),VW-24,44,'italic 30px "Arial Black",Impact,sans-serif','#7bd88f','right');
  for(var i=0;i<5;i++)star(VW-34-i*34,76,13,i<wanted);
  var bw=210,bx=24,by=VH-58;
  ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(bx-3,by-3,bw+6,bh0()+6);
  ctx.fillStyle='#3a1020';ctx.fillRect(bx,by,bw,15);
  ctx.fillStyle='#ff2d95';ctx.fillRect(bx,by,bw*clamp(P.hp/100,0,1),15);
  ctx.fillStyle='#3a1020';ctx.fillRect(bx,by+23,bw,15);
  ctx.fillStyle='#00e5ff';ctx.fillRect(bx,by+23,bw*clamp(P.armor/100,0,1),15);
  txt('HEALTH',bx+bw+10,by+13,'12px "Arial Black",sans-serif','#ff9ec9');
  txt('ARMOR',bx+bw+10,by+36,'12px "Arial Black",sans-serif','#9be9ff');
  txt(district(),bx,VH-16,'italic 16px "Arial Black",sans-serif','#ffd166');
  var w=WEAPONS[P.wep];
  txt(w.n,VW-24,VH-42,'italic 24px "Arial Black",Impact,sans-serif','#00e5ff','right');
  txt(P.wep===0?'—':P.ammo[P.wep]+' RDS',VW-24,VH-17,'14px "Arial Black",sans-serif','#fff','right');
  drawRadar();
  if(radioT>0)txt('\u266A '+STATIONS[stIdx].n,24,214,'italic 18px "Arial Black",Impact,sans-serif','#ff2d95');
  if(mis.i<MIS.length){
    var m=MIS[mis.i];
    txt(m.t,VW/2,36,'italic 20px "Arial Black",Impact,sans-serif','#ff2d95','center');
    var o=mis.phase==='to'?'GO TO THE MARKER':m.o;
    if(mis.phase==='go'){
      if(m.type==='kill')o+='   ('+mis.kills+'/'+m.n+')';
      if(m.time)o+='   \u00B7   '+Math.max(0,mis.timer).toFixed(0)+'s';
    }
    txt(o,VW/2,58,'13px "Arial Black",sans-serif','#ffe6f2','center');
  }else{
    txt('VICE CITY IS YOURS \u00B7 PROPERTY INCOME ACTIVE',VW/2,36,'italic 18px "Arial Black",Impact,sans-serif','#7bd88f','center');
  }
  for(var j=0;j<toasts.length;j++){
    var t=toasts[j];
    ctx.globalAlpha=clamp(t.t,0,1);
    txt(t.s,VW/2,96+j*27,'italic 19px "Arial Black",Impact,sans-serif',t.c,'center');
    ctx.globalAlpha=1;
  }
  if(P.hurt>0){ctx.fillStyle='rgba(255,0,60,'+(P.hurt*0.55)+')';ctx.fillRect(0,0,VW,VH);}
  ctx.strokeStyle='#00e5ff';ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(mouse.x,mouse.y,9,0,TAU);ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(mouse.x-15,mouse.y);ctx.lineTo(mouse.x-5,mouse.y);
  ctx.moveTo(mouse.x+5,mouse.y);ctx.lineTo(mouse.x+15,mouse.y);
  ctx.moveTo(mouse.x,mouse.y-15);ctx.lineTo(mouse.x,mouse.y-5);
  ctx.moveTo(mouse.x,mouse.y+5);ctx.lineTo(mouse.x,mouse.y+15);
  ctx.stroke();
}
function bh0(){return 15;}

function render(){
  ctx.clearRect(0,0,VW,VH);
  ctx.save();
  ctx.translate(-Math.round(cam.x),-Math.round(cam.y));
  drawGround();
  drawBuilds();
  drawPicks();
  drawMarker();
  for(var i=0;i<cars.length;i++)drawCar(cars[i]);
  for(var j=0;j<peds.length;j++)drawPed(peds[j]);
  if(!P.car)drawPlayer();
  drawBullets();
  drawParts();
  ctx.restore();
  drawHUD();
}

/* ---------- main loop ---------- */
var last=0;
function frame(t){
  requestAnimationFrame(frame);
  var dt=Math.min(0.05,(t-last)/1000||0);last=t;
  if(state==='play')update(dt);
  render();
}
function boot(){
  cam.x=P.x-VW/2;cam.y=P.y-VH/2;
  spawnTraffic();spawnPicks();
  for(var i=0;i<26;i++)spawnPedNear(120,1800,{});
  showOv('VICE CITY','NEON EMPIRE \u00B7 1986',
    '<b>W A S D</b> walk / drive &middot; <b>MOUSE</b> aim &middot; <b>CLICK</b> shoot<br>'+
    '<b>E</b> steal or exit car &middot; <b>1</b> pistol <b>2</b> SMG &middot; <b>R</b> radio station<br>'+
    'Complete 5 story missions. Watch your wanted level. Don\'t get WASTED.',
    'START GAME',function(){initAudio();state='play';toast('VICE CITY, 1986','#ff2d95');});
  requestAnimationFrame(frame);
}
boot();
</script>
</body>
