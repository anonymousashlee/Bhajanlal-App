<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plan — Calendar & To-Do</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f4f6fb;
      --bg-accent: radial-gradient(1200px 500px at 10% -10%, rgba(99,102,241,.12), transparent 60%),
                    radial-gradient(900px 500px at 100% 0%, rgba(236,72,153,.10), transparent 55%);
      --surface: #ffffff;
      --surface-2: #f8f9fc;
      --surface-3: #eef1f7;
      --text: #182033;
      --text-muted: #667085;
      --text-subtle: #98a2b3;
      --border: rgba(24,32,51,.08);
      --border-strong: rgba(24,32,51,.16);
      --accent: #ec4899;
      --accent-2: #f472b6;
      --accent-soft: rgba(99,102,241,.12);
      --accent-contrast: #ffffff;
      --danger: #ef4444;
      --danger-soft: rgba(239,68,68,.12);
      --success: #10b981;
      --success-soft: rgba(16,185,129,.12);
      --warning: #f59e0b;
      --warning-soft: rgba(245,158,11,.14);
      --shadow: 0 1px 2px rgba(16,24,40,.04), 0 12px 32px rgba(16,24,40,.06);
      --shadow-lg: 0 20px 60px rgba(16,24,40,.14);
      --radius: 20px;
      --radius-sm: 12px;
      --radius-xs: 8px;
      --transition: 180ms cubic-bezier(.2,.8,.2,1);
      --font: 'Manrope', system-ui, -apple-system, sans-serif;
    }
    [data-theme="dark"] {
      --bg: #0c111b;
      --bg-accent: radial-gradient(900px 500px at 0% -10%, rgba(99,102,241,.22), transparent 55%),
                    radial-gradient(700px 400px at 100% 0%, rgba(236,72,153,.16), transparent 55%);
      --surface: #151c2c;
      --surface-2: #1b2437;
      --surface-3: #243049;
      --text: #edf2f8;
      --text-muted: #a7b3c7;
      --text-subtle: #728099;
      --border: rgba(255,255,255,.08);
      --border-strong: rgba(255,255,255,.16);
      --accent: #f472b6;
      --accent-2: #f9a8d4;
      --accent-soft: rgba(129,140,248,.18);
      --accent-contrast: #0c111b;
      --danger: #f87171;
      --danger-soft: rgba(248,113,113,.16);
      --success: #34d399;
      --success-soft: rgba(52,211,153,.16);
      --warning: #fbbf24;
      --warning-soft: rgba(251,191,36,.16);
      --shadow: 0 1px 2px rgba(0,0,0,.25), 0 16px 40px rgba(0,0,0,.28);
      --shadow-lg: 0 24px 70px rgba(0,0,0,.45);
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      background: var(--bg);
      background-image: var(--bg-accent);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
      transition: background .25s ease, color .25s ease;
    }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .app {
      max-width: 1280px;
      margin: 0 auto;
      padding: 28px 20px 40px;
    }

    /* Header */
    .header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .brand { display: flex; align-items: center; gap: 14px; }
    .logo {
      width: 44px; height: 44px; border-radius: 14px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display: grid; place-items: center; color: #fff;
      box-shadow: 0 8px 24px rgba(99,102,241,.35);
      flex-shrink: 0;
    }
    .brand h1 { margin: 0; font-size: clamp(24px, 3vw, 32px); font-weight: 800; letter-spacing: -.03em; }
    .brand p { margin: 2px 0 0; color: var(--text-muted); font-size: 14px; }
    .header-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 9px 14px; border-radius: 11px;
      border: 1px solid var(--border); background: var(--surface);
      color: var(--text); font-size: 13px; font-weight: 600;
      transition: all var(--transition); box-shadow: 0 1px 2px rgba(0,0,0,.02);
    }
    .btn:hover { background: var(--surface-2); border-color: var(--border-strong); transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff; border-color: transparent;
      box-shadow: 0 8px 20px rgba(99,102,241,.3);
    }
    .btn-primary:hover { filter: brightness(1.05); background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
    .btn-ghost { background: transparent; border-color: transparent; box-shadow: none; color: var(--text-muted); }
    .btn-ghost:hover { background: var(--surface-2); color: var(--text); }
    .btn-icon { padding: 9px; width: 40px; height: 40px; justify-content: center; }
    .btn svg { width: 16px; height: 16px; flex-shrink: 0; }

    /* Layout */
    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(0, .85fr);
      gap: 20px;
      align-items: stretch;
    }
    @media (max-width: 980px) { .layout { grid-template-columns: 1fr; } }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .panel-header {
      padding: 20px 22px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    }
    .panel-title { margin: 0; font-size: 18px; font-weight: 750; letter-spacing: -.01em; }
    .panel-sub { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
    .panel-body { padding: 20px 22px; }

    /* Calendar */
    .cal-nav { display: flex; align-items: center; gap: 6px; }
    .month-label { font-size: 20px; font-weight: 750; letter-spacing: -.02em; min-width: 200px; }
    @media (max-width: 560px) { .month-label { min-width: 0; font-size: 18px; } }
    .weekdays {
      display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px;
      margin-bottom: 6px; padding: 0 2px;
    }
    .weekday {
      text-align: center; font-size: 11px; font-weight: 700;
      color: var(--text-subtle); text-transform: uppercase; letter-spacing: .06em;
      padding: 8px 0;
    }
    .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
    .day {
      aspect-ratio: 1;
      border: 1px solid transparent;
      background: transparent;
      border-radius: 14px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 4px; position: relative;
      transition: all var(--transition);
      color: var(--text); font-size: 14px; font-weight: 550;
      padding: 4px;
    }
    .day:hover:not(.empty) { background: var(--surface-2); border-color: var(--border); }
    .day.empty { cursor: default; }
    .day.outside { color: var(--text-subtle); opacity: .55; }
    .day.today .day-num {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff; width: 30px; height: 30px; border-radius: 10px;
      display: grid; place-items: center; font-weight: 700;
      box-shadow: 0 4px 12px rgba(99,102,241,.35);
    }
    .day.selected { background: var(--accent-soft); border-color: rgba(99,102,241,.25); }
    .day.selected:not(.today) .day-num { color: var(--accent); font-weight: 750; }
    .day-num { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 10px; }
    .day-dots { display: flex; gap: 3px; height: 5px; align-items: center; }
    .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
    .dot.done { background: var(--success); }
    .dot.high { background: var(--danger); }
    .day.today .dot { background: rgba(255,255,255,.9); }
    .day.selected .dot { opacity: .9; }

    .cal-footer {
      margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--border);
      display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: space-between;
    }
    .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--text-muted); }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .legend i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

    /* Todo panel */
    .todo-panel { display: flex; flex-direction: column; min-height: 560px; }
    .todo-panel .panel-body { display: flex; flex-direction: column; flex: 1; padding-top: 16px; }
    .date-badge {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 6px 12px; border-radius: 999px;
      background: var(--surface-2); border: 1px solid var(--border);
      font-size: 12px; font-weight: 650; color: var(--text-muted);
    }
    .date-badge strong { color: var(--text); }
    .progress-wrap { margin-top: 14px; }
    .progress-meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
    .progress-bar { height: 6px; background: var(--surface-3); border-radius: 999px; overflow: hidden; }
    .progress-bar span { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--success)); border-radius: 999px; transition: width .3s ease; }

    .composer {
      margin-top: 16px; background: var(--surface-2); border: 1px solid var(--border);
      border-radius: 14px; padding: 12px; transition: border-color var(--transition), box-shadow var(--transition);
    }
    .composer:focus-within { border-color: rgba(99,102,241,.4); box-shadow: 0 0 0 4px var(--accent-soft); }
    .composer-main { display: flex; gap: 8px; }
    .composer-main input {
      flex: 1; border: none; background: transparent; padding: 8px 4px;
      font-size: 14px; outline: none; min-width: 0;
    }
    .composer-main input::placeholder { color: var(--text-subtle); }
    .composer-options { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; align-items: center; }
    .chip-input, .chip-select {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 5px 10px; border-radius: 9px; border: 1px solid var(--border);
      background: var(--surface); font-size: 12px; color: var(--text-muted);
    }
    .chip-input input, .chip-select select {
      border: none; background: transparent; outline: none; font-size: 12px; color: var(--text); padding: 0; min-width: 0;
    }
    .chip-input input[type="time"] { width: 95px; }
    .chip-input input[type="text"] { width: 110px; }
    .chip-select select { cursor: pointer; }

    .filters { display: flex; gap: 6px; margin: 16px 0 12px; flex-wrap: wrap; }
    .filter-btn {
      padding: 6px 12px; border-radius: 999px; border: 1px solid var(--border);
      background: transparent; color: var(--text-muted); font-size: 12px; font-weight: 650;
      transition: all var(--transition);
    }
    .filter-btn:hover { color: var(--text); background: var(--surface-2); }
    .filter-btn.active { background: var(--accent-soft); color: var(--accent); border-color: rgba(99,102,241,.25); }

    .task-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; flex: 1; overflow-y: auto; min-height: 120px; }
    .task {
      display: flex; gap: 12px; align-items: flex-start;
      padding: 12px; border-radius: 14px; border: 1px solid var(--border);
      background: var(--surface); transition: all var(--transition);
      animation: taskIn .22s ease;
    }
    @keyframes taskIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .task:hover { border-color: var(--border-strong); background: var(--surface-2); }
    .task.done { opacity: .72; }
    .task.done .task-title { text-decoration: line-through; color: var(--text-muted); }
    .task.dragging { opacity: .45; }
    .task.drag-over { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }

    .check {
      width: 22px; height: 22px; margin-top: 1px; flex-shrink: 0;
      border-radius: 7px; border: 2px solid var(--border-strong);
      background: var(--surface); display: grid; place-items: center;
      transition: all var(--transition); padding: 0; color: transparent;
    }
    .check:hover { border-color: var(--accent); }
    .task.done .check { background: var(--success); border-color: var(--success); color: #fff; }
    .check svg { width: 13px; height: 13px; }

    .task-content { flex: 1; min-width: 0; }
    .task-title { font-size: 14px; font-weight: 600; word-break: break-word; line-height: 1.45; }
    .task-meta { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 5px; align-items: center; }
    .badge {
      font-size: 11px; font-weight: 650; padding: 2px 8px; border-radius: 999px;
      display: inline-flex; align-items: center; gap: 4px;
    }
    .badge.high { color: var(--danger); background: var(--danger-soft); }
    .badge.medium { color: #b45309; background: var(--warning-soft); }
    [data-theme="dark"] .badge.medium { color: var(--warning); }
    .badge.low { color: var(--success); background: var(--success-soft); }
    .badge.time, .badge.tag { color: var(--text-muted); background: var(--surface-3); }
    .task-notes { font-size: 12px; color: var(--text-muted); margin-top: 5px; white-space: pre-wrap; }

    .task-actions { display: flex; gap: 2px; opacity: 0; transition: opacity var(--transition); }
    .task:hover .task-actions, .task:focus-within .task-actions { opacity: 1; }
    @media (hover: none) { .task-actions { opacity: 1; } }
    .action-btn {
      width: 30px; height: 30px; border-radius: 8px; border: none; background: transparent;
      color: var(--text-subtle); display: grid; place-items: center;
    }
    .action-btn:hover { background: var(--surface-3); color: var(--text); }
    .action-btn.delete:hover { background: var(--danger-soft); color: var(--danger); }
    .action-btn svg { width: 15px; height: 15px; }

    .empty-state {
      flex: 1; display: none; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 32px 16px; color: var(--text-muted);
    }
    .empty-state.visible { display: flex; }
    .empty-icon {
      width: 64px; height: 64px; border-radius: 20px; background: var(--surface-2);
      display: grid; place-items: center; margin-bottom: 14px; color: var(--text-subtle);
    }
    .empty-state h3 { margin: 0 0 4px; font-size: 15px; color: var(--text); }
    .empty-state p { margin: 0; font-size: 13px; max-width: 260px; }

    .todo-footer {
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
      margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border);
      font-size: 12px; color: var(--text-muted); flex-wrap: wrap;
    }

    /* Search overlay results */
    .search-wrap { position: relative; }
    .search-input {
      width: 240px; max-width: 100%; padding: 9px 12px 9px 36px;
      border-radius: 11px; border: 1px solid var(--border); background: var(--surface);
      font-size: 13px; outline: none; transition: all var(--transition);
    }
    .search-input:focus { border-color: rgba(99,102,241,.4); box-shadow: 0 0 0 4px var(--accent-soft); }
    .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-subtle); width: 15px; height: 15px; }
    @media (max-width: 640px) { .search-input { width: 100%; } .search-wrap { width: 100%; order: 10; } .header-actions { width: 100%; } }

    .search-results {
      margin: 0 22px 20px; border: 1px solid var(--border); border-radius: 14px;
      background: var(--surface-2); overflow: hidden; display: none;
    }
    .search-results.visible { display: block; }
    .search-results-header { padding: 10px 14px; font-size: 11px; font-weight: 700; color: var(--text-subtle); text-transform: uppercase; letter-spacing: .06em; border-bottom: 1px solid var(--border); }
    .search-item {
      display: flex; width: 100%; padding: 10px 14px; gap: 12px; align-items: center;
      border: none; background: transparent; text-align: left; cursor: pointer;
      border-bottom: 1px solid var(--border);
    }
    .search-item:last-child { border-bottom: none; }
    .search-item:hover { background: var(--surface); }
    .search-item-date { font-size: 12px; color: var(--text-muted); min-width: 96px; font-variant-numeric: tabular-nums; }
    .search-item-text { font-size: 13px; font-weight: 550; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .search-item-text.done { text-decoration: line-through; color: var(--text-muted); }

    /* Modal */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(15,23,42,.45);
      display: none; align-items: center; justify-content: center; padding: 20px;
      z-index: 100; backdrop-filter: blur(4px);
    }
    .modal-overlay.open { display: flex; }
    .modal {
      width: 100%; max-width: 520px; background: var(--surface); border: 1px solid var(--border);
      border-radius: 20px; box-shadow: var(--shadow-lg); padding: 22px;
      animation: modalIn .18s ease;
    }
    @keyframes modalIn { from { opacity: 0; transform: translateY(8px) scale(.98); } to { opacity: 1; transform: none; } }
    .modal h2 { margin: 0 0 16px; font-size: 20px; letter-spacing: -.02em; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 12px; font-weight: 700; color: var(--text-muted); margin-bottom: 6px; }
    .field input, .field select, .field textarea {
      width: 100%; padding: 10px 12px; border-radius: 11px;
      border: 1px solid var(--border); background: var(--surface-2);
      font-size: 14px; outline: none; transition: all var(--transition);
    }
    .field input:focus, .field select:focus, .field textarea:focus {
      border-color: rgba(99,102,241,.4); box-shadow: 0 0 0 4px var(--accent-soft); background: var(--surface);
    }
    .field textarea { resize: vertical; min-height: 74px; }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 480px) { .field-row { grid-template-columns: 1fr; } }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }

    /* Toast */
    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(16px);
      background: #182033; color: #fff; padding: 12px 16px; border-radius: 12px;
      font-size: 13px; font-weight: 600; box-shadow: var(--shadow-lg);
      opacity: 0; pointer-events: none; transition: all .2s ease; z-index: 200;
      display: flex; align-items: center; gap: 12px;
    }
    [data-theme="dark"] .toast { background: #edf2f8; color: #182033; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
    .toast button { background: rgba(255,255,255,.15); color: inherit; border: none; padding: 4px 10px; border-radius: 7px; font-size: 12px; font-weight: 700; }
    [data-theme="dark"] .toast button { background: rgba(24,32,51,.1); }

    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="brand">
        <div class="logo" aria-hidden="true">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/><path d="m9 16 2 2 4-4"/></svg>
        </div>
        <div>
          <h1>Plan</h1>
          <p id="greeting">Your calendar and tasks, together.</p>
        </div>
      </div>
      <div class="header-actions">
        <div class="search-wrap">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input id="searchInput" class="search-input" type="search" placeholder="Search tasks..." aria-label="Search tasks across all dates">
        </div>
        <button class="btn btn-icon" id="themeBtn" aria-label="Toggle theme" title="Toggle theme">
          <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
        </button>
        <button class="btn" id="exportBtn" title="Export tasks as JSON">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
          Export
        </button>
        <button class="btn" id="importBtn" title="Import tasks from JSON">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/></svg>
          Import
        </button>
        <input type="file" id="importFile" accept="application/json" hidden>
      </div>
    </header>

    <div class="layout">
      <!-- Calendar -->
      <section class="panel" aria-labelledby="cal-heading">
        <div class="panel-header">
          <div>
            <h2 class="panel-title month-label" id="cal-heading"></h2>
            <div class="panel-sub" id="calSub"></div>
          </div>
          <div class="cal-nav">
            <button class="btn btn-icon" id="prevMonth" aria-label="Previous month">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
            </button>
            <button class="btn" id="todayBtn">Today</button>
            <button class="btn btn-icon" id="nextMonth" aria-label="Next month">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
            </button>
          </div>
        </div>
        <div id="searchResults" class="search-results" aria-live="polite"></div>
        <div class="panel-body">
          <div class="weekdays" aria-hidden="true">
            <div class="weekday">Sun</div><div class="weekday">Mon</div><div class="weekday">Tue</div>
            <div class="weekday">Wed</div><div class="weekday">Thu</div><div class="weekday">Fri</div><div class="weekday">Sat</div>
          </div>
          <div class="days" id="daysGrid" role="grid" aria-label="Calendar days"></div>
          <div class="cal-footer">
            <div class="legend">
              <span><i style="background:var(--accent)"></i> Tasks</span>
              <span><i style="background:var(--danger)"></i> High priority</span>
              <span><i style="background:var(--success)"></i> Completed</span>
            </div>
            <div class="legend" id="monthStats"></div>
          </div>
        </div>
      </section>

      <!-- Todo -->
      <section class="panel todo-panel" aria-labelledby="todo-heading">
        <div class="panel-header">
          <div>
            <h2 class="panel-title" id="todo-heading">Tasks</h2>
            <div class="panel-sub" id="selectedDateLabel"></div>
          </div>
          <div class="date-badge" id="dayBadge"></div>
        </div>
        <div class="panel-body">
          <div class="progress-wrap">
            <div class="progress-meta">
              <span id="progressText">0 of 0 done</span>
              <span id="progressPct">0%</span>
            </div>
            <div class="progress-bar" aria-hidden="true"><span id="progressFill"></span></div>
          </div>

          <div class="composer">
            <div class="composer-main">
              <input id="taskInput" type="text" placeholder="Add a task for this day..." maxlength="240" aria-label="New task title">
              <button class="btn btn-primary" id="addBtn">Add</button>
            </div>
            <div class="composer-options">
              <label class="chip-select">Priority
                <select id="priorityInput" aria-label="Priority">
                  <option value="medium">Medium</option>
                  <option value="high">High</option>
                  <option value="low">Low</option>
                </select>
              </label>
              <label class="chip-input">Time
                <input id="timeInput" type="time" aria-label="Time">
              </label>
              <label class="chip-input">Tag
                <input id="tagInput" type="text" placeholder="e.g. work" maxlength="24" aria-label="Tag">
              </label>
            </div>
          </div>

          <div class="filters" role="group" aria-label="Filter tasks">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="active">Active</button>
            <button class="filter-btn" data-filter="done">Done</button>
            <button class="filter-btn" data-filter="high">High priority</button>
          </div>

          <ul class="task-list" id="taskList" aria-label="Task list"></ul>
          <div class="empty-state" id="emptyState">
            <div class="empty-icon">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
            </div>
            <h3>No tasks yet</h3>
            <p>Add a task above to plan this day. Your tasks are saved automatically.</p>
          </div>

          <div class="todo-footer">
            <span id="taskCount">0 tasks</span>
            <div style="display:flex; gap:8px;">
              <button class="btn btn-ghost" id="clearDoneBtn">Clear completed</button>
            </div>
          </div>
        </div>
      </section>
    </div>
  </div>

  <div class="modal-overlay" id="editModal" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="editTitle">
      <h2 id="editTitle">Edit task</h2>
      <div class="field">
        <label for="editText">Task</label>
        <input id="editText" type="text" maxlength="240">
      </div>
      <div class="field-row">
        <div class="field">
          <label for="editPriority">Priority</label>
          <select id="editPriority">
            <option value="high">High</option>
            <option value="medium">Medium</option>
            <option value="low">Low</option>
          </select>
        </div>
        <div class="field">
          <label for="editTime">Time</label>
          <input id="editTime" type="time">
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="editTag">Tag</label>
          <input id="editTag" type="text" maxlength="24" placeholder="Optional">
        </div>
        <div class="field">
          <label for="editDate">Date</label>
          <input id="editDate" type="date">
        </div>
      </div>
      <div class="field">
        <label for="editNotes">Notes</label>
        <textarea id="editNotes" placeholder="Optional details..."></textarea>
      </div>
      <div class="modal-actions">
        <button class="btn" id="editCancel">Cancel</button>
        <button class="btn btn-primary" id="editSave">Save changes</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    (() => {
      'use strict';

      const STORAGE_KEY = 'plan.tasks.v1';
      const THEME_KEY = 'plan.theme';
      const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
      const WEEKDAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

      const $ = (s) => document.querySelector(s);
      const $$ = (s) => Array.from(document.querySelectorAll(s));

      const daysGrid = $('#daysGrid');
      const calHeading = $('#cal-heading');
      const calSub = $('#calSub');
      const selectedDateLabel = $('#selectedDateLabel');
      const dayBadge = $('#dayBadge');
      const taskList = $('#taskList');
      const emptyState = $('#emptyState');
      const taskInput = $('#taskInput');
      const searchInput = $('#searchInput');
      const searchResults = $('#searchResults');
      const toastEl = $('#toast');

      const today = new Date();
      const todayKey = dateKey(today);
      let view = new Date(today.getFullYear(), today.getMonth(), 1);
      let selected = todayKey;
      let filter = 'all';
      let tasks = loadTasks();
      let editing = null; // {dateKey, id}
      let lastDeleted = null;
      let toastTimer = null;

      // --- Theme ---
      function getPreferredTheme() {
        try {
          const stored = localStorage.getItem(THEME_KEY);
          if (stored === 'light' || stored === 'dark') return stored;
        } catch {}
        return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      function applyTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        const icon = $('#themeIcon');
        icon.innerHTML = theme === 'dark'
          ? '<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41m11.32-11.32l1.41-1.41"/>'
          : '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
        $('#themeBtn').setAttribute('aria-label', theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode');
      }
      let theme = getPreferredTheme();
      applyTheme(theme);
      $('#themeBtn').addEventListener('click', () => {
        theme = theme === 'dark' ? 'light' : 'dark';
        try { localStorage.setItem(THEME_KEY, theme); } catch {}
        applyTheme(theme);
      });

      // --- Storage ---
      function loadTasks() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return migrateLegacy();
          const parsed = JSON.parse(raw);
          if (parsed && typeof parsed === 'object' && !Array.isArray(parsed)) return sanitizeTasks(parsed);
        } catch {}
        return {};
      }
      function saveTasks() {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); } catch {}
      }
      function sanitizeTasks(obj) {
        const out = {};
        for (const [k, arr] of Object.entries(obj)) {
          if (!/^\d{4}-\d{2}-\d{2}$/.test(k) || !Array.isArray(arr)) continue;
          const clean = arr.map(sanitizeTask).filter(Boolean);
          if (clean.length) out[k] = clean;
        }
        return out;
      }
      function sanitizeTask(t) {
        if (!t || typeof t !== 'object' || typeof t.text !== 'string') return null;
        const text = t.text.trim().slice(0, 240);
        if (!text) return null;
        return {
          id: typeof t.id === 'string' ? t.id : uid(),
          text,
          done: !!t.done,
          priority: ['high','medium','low'].includes(t.priority) ? t.priority : 'medium',
          time: typeof t.time === 'string' && /^\d{2}:\d{2}$/.test(t.time) ? t.time : '',
          tag: typeof t.tag === 'string' ? t.tag.trim().slice(0, 24) : '',
          notes: typeof t.notes === 'string' ? t.notes.slice(0, 1000) : '',
          createdAt: Number.isFinite(t.createdAt) ? t.createdAt : Date.now()
        };
      }
      function migrateLegacy() {
        // Migrate from older calendar-todo versions in this workspace
        const candidates = ['bh-tasks-v2', 'calendar-todo-tasks', 'tasks'];
        for (const key of candidates) {
          try {
            const raw = localStorage.getItem(key);
            if (!raw) continue;
            const parsed = JSON.parse(raw);
            const src = parsed && parsed.tasks && typeof parsed.tasks === 'object' ? parsed.tasks : parsed;
            if (src && typeof src === 'object' && !Array.isArray(src)) {
              const migrated = sanitizeTasks(src);
              if (Object.keys(migrated).length) return migrated;
            }
          } catch {}
        }
        return {};
      }

      // --- Helpers ---
      function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
      function pad(n) { return String(n).padStart(2, '0'); }
      function dateKey(d) { return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
      function parseKey(key) { const [y,m,d] = key.split('-').map(Number); return new Date(y, m-1, d); }
      function formatLong(key) {
        const d = parseKey(key);
        return d.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
      }
      function formatShort(key) {
        const d = parseKey(key);
        return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
      }
      function relativeDay(key) {
        if (key === todayKey) return 'Today';
        const d = parseKey(key);
        const t = new Date(today.getFullYear(), today.getMonth(), today.getDate());
        const diff = Math.round((d - t) / 86400000);
        if (diff === 1) return 'Tomorrow';
        if (diff === -1) return 'Yesterday';
        return WEEKDAYS[d.getDay()];
      }
      function escapeHtml(str) {
        return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
      }
      function getTasks(key) { return tasks[key] || []; }
      function setTasks(key, arr) {
        if (arr.length) tasks[key] = arr;
        else delete tasks[key];
      }

      // --- Calendar ---
      function renderCalendar() {
        const year = view.getFullYear();
        const month = view.getMonth();
        calHeading.textContent = `${MONTHS[month]} ${year}`;
        const monthTasks = countMonthTasks(year, month);
        calSub.textContent = `${monthTasks.total} task${monthTasks.total !== 1 ? 's' : ''} this month`;

        daysGrid.innerHTML = '';
        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const prevDays = new Date(year, month, 0).getDate();

        const totalCells = Math.ceil((firstDay + daysInMonth) / 7) * 7;
        for (let i = 0; i < totalCells; i++) {
          const dayOffset = i - firstDay + 1;
          let cellDate, outside = false;
          if (dayOffset < 1) {
            cellDate = new Date(year, month - 1, prevDays + dayOffset);
            outside = true;
          } else if (dayOffset > daysInMonth) {
            cellDate = new Date(year, month + 1, dayOffset - daysInMonth);
            outside = true;
          } else {
            cellDate = new Date(year, month, dayOffset);
          }
          const key = dateKey(cellDate);
          const cellTasks = getTasks(key);
          const btn = document.createElement('button');
          btn.className = 'day' + (outside ? ' outside' : '') + (key === todayKey ? ' today' : '') + (key === selected ? ' selected' : '');
          btn.setAttribute('role', 'gridcell');
          btn.setAttribute('aria-label', `${formatLong(key)}${cellTasks.length ? `, ${cellTasks.length} task${cellTasks.length>1?'s':''}` : ''}`);
          btn.setAttribute('aria-selected', key === selected ? 'true' : 'false');
          if (!outside) btn.dataset.date = key;
          else btn.dataset.date = key;

          const num = document.createElement('span');
          num.className = 'day-num';
          num.textContent = cellDate.getDate();
          btn.appendChild(num);

          if (cellTasks.length) {
            const dots = document.createElement('span');
            dots.className = 'day-dots';
            const hasHigh = cellTasks.some(t => !t.done && t.priority === 'high');
            const allDone = cellTasks.every(t => t.done);
            const dotCount = Math.min(cellTasks.length, 3);
            for (let d = 0; d < dotCount; d++) {
              const dot = document.createElement('span');
              dot.className = 'dot' + (allDone ? ' done' : (hasHigh && d === 0 ? ' high' : ''));
              dots.appendChild(dot);
            }
            btn.appendChild(dots);
          } else {
            const dots = document.createElement('span');
            dots.className = 'day-dots';
            btn.appendChild(dots);
          }

          btn.addEventListener('click', () => selectDate(key));
          daysGrid.appendChild(btn);
        }

        $('#monthStats').textContent = monthTasks.done ? `${monthTasks.done}/${monthTasks.total} completed` : '';
      }

      function countMonthTasks(year, month) {
        let total = 0, done = 0;
        const prefix = `${year}-${pad(month+1)}-`;
        for (const [k, arr] of Object.entries(tasks)) {
          if (k.startsWith(prefix)) { total += arr.length; done += arr.filter(t => t.done).length; }
        }
        return { total, done };
      }

      function selectDate(key) {
        selected = key;
        const d = parseKey(key);
        view = new Date(d.getFullYear(), d.getMonth(), 1);
        renderCalendar();
        renderTasks();
        searchInput.value = '';
        searchResults.classList.remove('visible');
        searchResults.innerHTML = '';
      }

      // --- Tasks ---
      function renderTasks() {
        const dayTasks = getTasks(selected);
        selectedDateLabel.textContent = formatLong(selected);
        const rel = relativeDay(selected);
        dayBadge.innerHTML = `<strong>${rel}</strong>${rel !== formatShort(selected) ? ` · ${formatShort(selected)}` : ''}`;

        const filtered = dayTasks.filter(t => {
          if (filter === 'active') return !t.done;
          if (filter === 'done') return t.done;
          if (filter === 'high') return t.priority === 'high';
          return true;
        });

        const sorted = [...filtered].sort((a, b) => {
          if (a.done !== b.done) return a.done ? 1 : -1;
          const pr = { high: 0, medium: 1, low: 2 };
          if (pr[a.priority] !== pr[b.priority]) return pr[a.priority] - pr[b.priority];
          if (a.time && b.time) return a.time.localeCompare(b.time);
          if (a.time) return -1;
          if (b.time) return 1;
          return a.createdAt - b.createdAt;
        });

        taskList.innerHTML = '';
        if (sorted.length === 0) {
          emptyState.classList.add('visible');
          emptyState.querySelector('p').textContent = dayTasks.length
            ? 'No tasks match this filter.'
            : 'Add a task above to plan this day. Your tasks are saved automatically.';
        } else {
          emptyState.classList.remove('visible');
        }

        sorted.forEach(task => taskList.appendChild(createTaskEl(task)));

        const doneCount = dayTasks.filter(t => t.done).length;
        const total = dayTasks.length;
        const pct = total ? Math.round((doneCount / total) * 100) : 0;
        $('#progressText').textContent = `${doneCount} of ${total} done`;
        $('#progressPct').textContent = `${pct}%`;
        $('#progressFill').style.width = pct + '%';
        $('#taskCount').textContent = `${total} task${total !== 1 ? 's' : ''}`;
        $('#clearDoneBtn').disabled = doneCount === 0;
        $('#clearDoneBtn').style.opacity = doneCount === 0 ? '.5' : '1';
      }

      function createTaskEl(task) {
        const li = document.createElement('li');
        li.className = 'task' + (task.done ? ' done' : '');
        li.draggable = true;
        li.dataset.id = task.id;

        const check = document.createElement('button');
        check.className = 'check';
        check.setAttribute('aria-label', task.done ? 'Mark as active' : 'Mark as done');
        check.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
        check.addEventListener('click', () => toggleTask(task.id));

        const content = document.createElement('div');
        content.className = 'task-content';

        const title = document.createElement('div');
        title.className = 'task-title';
        title.textContent = task.text;
        content.appendChild(title);

        const meta = document.createElement('div');
        meta.className = 'task-meta';
        const prBadge = document.createElement('span');
        prBadge.className = `badge ${task.priority}`;
        prBadge.textContent = task.priority.charAt(0).toUpperCase() + task.priority.slice(1);
        meta.appendChild(prBadge);
        if (task.time) {
          const tb = document.createElement('span');
          tb.className = 'badge time';
          tb.textContent = formatTime(task.time);
          meta.appendChild(tb);
        }
        if (task.tag) {
          const tg = document.createElement('span');
          tg.className = 'badge tag';
          tg.textContent = task.tag;
          meta.appendChild(tg);
        }
        content.appendChild(meta);

        if (task.notes) {
          const notes = document.createElement('div');
          notes.className = 'task-notes';
          notes.textContent = task.notes;
          content.appendChild(notes);
        }

        const actions = document.createElement('div');
        actions.className = 'task-actions';
        actions.appendChild(iconBtn('Edit task', '<path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>', () => openEdit(task.id)));
        actions.appendChild(iconBtn('Delete task', '<polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>', () => deleteTask(task.id), true));

        li.append(check, content, actions);

        // Drag reorder
        li.addEventListener('dragstart', (e) => { li.classList.add('dragging'); e.dataTransfer.setData('text/plain', task.id); e.dataTransfer.effectAllowed = 'move'; });
        li.addEventListener('dragend', () => li.classList.remove('dragging'));
        li.addEventListener('dragover', (e) => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; li.classList.add('drag-over'); });
        li.addEventListener('dragleave', () => li.classList.remove('drag-over'));
        li.addEventListener('drop', (e) => {
          e.preventDefault();
          li.classList.remove('drag-over');
          const fromId = e.dataTransfer.getData('text/plain');
          if (!fromId || fromId === task.id) return;
          reorderTask(fromId, task.id);
        });

        return li;
      }

      function iconBtn(label, svgPath, onClick, isDelete = false) {
        const b = document.createElement('button');
        b.className = 'action-btn' + (isDelete ? ' delete' : '');
        b.setAttribute('aria-label', label);
        b.title = label;
        b.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${svgPath}</svg>`;
        b.addEventListener('click', (e) => { e.stopPropagation(); onClick(); });
        return b;
      }

      function formatTime(t) {
        const [h, m] = t.split(':').map(Number);
        const ampm = h >= 12 ? 'PM' : 'AM';
        const hh = h % 12 || 12;
        return `${hh}:${pad(m)} ${ampm}`;
      }

      function addTask() {
        const text = taskInput.value.trim();
        if (!text) { showToast('Type a task first'); taskInput.focus(); return; }
        const task = {
          id: uid(),
          text: text.slice(0, 240),
          done: false,
          priority: $('#priorityInput').value,
          time: $('#timeInput').value,
          tag: $('#tagInput').value.trim().slice(0, 24),
          notes: '',
          createdAt: Date.now()
        };
        const arr = getTasks(selected);
        arr.push(task);
        setTasks(selected, arr);
        saveTasks();
        taskInput.value = '';
        $('#tagInput').value = '';
        $('#timeInput').value = '';
        $('#priorityInput').value = 'medium';
        renderCalendar();
        renderTasks();
        taskInput.focus();
      }

      function toggleTask(id) {
        const arr = getTasks(selected);
        const t = arr.find(x => x.id === id);
        if (!t) return;
        t.done = !t.done;
        saveTasks();
        renderCalendar();
        renderTasks();
      }

      function deleteTask(id) {
        const arr = getTasks(selected);
        const idx = arr.findIndex(x => x.id === id);
        if (idx === -1) return;
        const [removed] = arr.splice(idx, 1);
        lastDeleted = { key: selected, task: removed, index: idx };
        setTasks(selected, arr);
        saveTasks();
        renderCalendar();
        renderTasks();
        showToast('Task deleted', 'Undo', () => {
          if (!lastDeleted) return;
          const a = getTasks(lastDeleted.key);
          a.splice(Math.min(lastDeleted.index, a.length), 0, lastDeleted.task);
          setTasks(lastDeleted.key, a);
          lastDeleted = null;
          saveTasks();
          renderCalendar();
          renderTasks();
          hideToast();
        });
      }

      function reorderTask(fromId, toId) {
        const arr = getTasks(selected);
        const fromIdx = arr.findIndex(t => t.id === fromId);
        const toIdx = arr.findIndex(t => t.id === toId);
        if (fromIdx < 0 || toIdx < 0) return;
        const [moved] = arr.splice(fromIdx, 1);
        arr.splice(toIdx, 0, moved);
        setTasks(selected, arr);
        saveTasks();
        renderTasks();
      }

      function clearCompleted() {
        const arr = getTasks(selected);
        const remaining = arr.filter(t => !t.done);
        if (remaining.length === arr.length) return;
        setTasks(selected, remaining);
        saveTasks();
        renderCalendar();
        renderTasks();
        showToast('Completed tasks cleared');
      }

      // --- Edit modal ---
      function openEdit(id) {
        const arr = getTasks(selected);
        const t = arr.find(x => x.id === id);
        if (!t) return;
        editing = { key: selected, id };
        $('#editText').value = t.text;
        $('#editPriority').value = t.priority;
        $('#editTime').value = t.time;
        $('#editTag').value = t.tag;
        $('#editNotes').value = t.notes;
        $('#editDate').value = selected;
        $('#editModal').classList.add('open');
        $('#editModal').setAttribute('aria-hidden', 'false');
        $('#editText').focus();
      }
      function closeEdit() {
        editing = null;
        $('#editModal').classList.remove('open');
        $('#editModal').setAttribute('aria-hidden', 'true');
      }
      function saveEdit() {
        if (!editing) return;
        const { key, id } = editing;
        const arr = getTasks(key);
        const t = arr.find(x => x.id === id);
        if (!t) { closeEdit(); return; }
        const text = $('#editText').value.trim();
        if (!text) { showToast('Task title cannot be empty'); return; }
        t.text = text.slice(0, 240);
        t.priority = $('#editPriority').value;
        t.time = $('#editTime').value;
        t.tag = $('#editTag').value.trim().slice(0, 24);
        t.notes = $('#editNotes').value.slice(0, 1000);
        const newDate = $('#editDate').value || key;

        if (newDate !== key) {
          setTasks(key, arr.filter(x => x.id !== id));
          const dest = getTasks(newDate);
          dest.push(t);
          setTasks(newDate, dest);
          selected = newDate;
          const nd = parseKey(newDate);
          view = new Date(nd.getFullYear(), nd.getMonth(), 1);
        } else {
          setTasks(key, arr);
        }
        saveTasks();
        closeEdit();
        renderCalendar();
        renderTasks();
        showToast('Task updated');
      }

      // --- Search ---
      function handleSearch(q) {
        const query = q.trim().toLowerCase();
        if (!query) { searchResults.classList.remove('visible'); searchResults.innerHTML = ''; return; }
        const matches = [];
        for (const [key, arr] of Object.entries(tasks)) {
          for (const t of arr) {
            const hay = `${t.text} ${t.tag} ${t.notes}`.toLowerCase();
            if (hay.includes(query)) matches.push({ key, task: t });
          }
        }
        matches.sort((a, b) => a.key.localeCompare(b.key) || a.task.time.localeCompare(b.task.time));
        searchResults.innerHTML = '';
        const header = document.createElement('div');
        header.className = 'search-results-header';
        header.textContent = `${matches.length} result${matches.length !== 1 ? 's' : ''}`;
        searchResults.appendChild(header);
        if (!matches.length) {
          const empty = document.createElement('div');
          empty.style.padding = '14px';
          empty.style.fontSize = '13px';
          empty.style.color = 'var(--text-muted)';
          empty.textContent = 'No matching tasks found.';
          searchResults.appendChild(empty);
        } else {
          matches.slice(0, 20).forEach(({ key, task }) => {
            const item = document.createElement('button');
            item.className = 'search-item';
            item.type = 'button';
            const d = document.createElement('span');
            d.className = 'search-item-date';
            d.textContent = formatShort(key);
            const t = document.createElement('span');
            t.className = 'search-item-text' + (task.done ? ' done' : '');
            t.textContent = task.text;
            item.append(d, t);
            item.addEventListener('click', () => selectDate(key));
            searchResults.appendChild(item);
          });
        }
        searchResults.classList.add('visible');
      }

      // --- Export / Import ---
      function exportTasks() {
        const data = { version: 1, exportedAt: new Date().toISOString(), tasks };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `plan-tasks-${todayKey}.json`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
        showToast('Tasks exported');
      }
      function importTasks(file) {
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const parsed = JSON.parse(reader.result);
            const src = parsed && parsed.tasks && typeof parsed.tasks === 'object' ? parsed.tasks : parsed;
            if (!src || typeof src !== 'object' || Array.isArray(src)) throw new Error('Invalid format');
            const imported = sanitizeTasks(src);
            const count = Object.values(imported).reduce((n, arr) => n + arr.length, 0);
            if (!count) { showToast('No valid tasks found in file'); return; }
            // Merge: imported tasks added, avoid id collisions
            for (const [key, arr] of Object.entries(imported)) {
              const existing = getTasks(key);
              const existingIds = new Set(existing.map(t => t.id));
              for (const t of arr) {
                if (existingIds.has(t.id)) t.id = uid();
                existing.push(t);
              }
              setTasks(key, existing);
            }
            saveTasks();
            renderCalendar();
            renderTasks();
            showToast(`Imported ${count} task${count !== 1 ? 's' : ''}`);
          } catch {
            showToast('Could not import file');
          }
        };
        reader.readAsText(file);
      }

      // --- Toast ---
      function showToast(msg, actionLabel, actionFn) {
        clearTimeout(toastTimer);
        toastEl.innerHTML = '';
        const span = document.createElement('span');
        span.textContent = msg;
        toastEl.appendChild(span);
        if (actionLabel && actionFn) {
          const b = document.createElement('button');
          b.textContent = actionLabel;
          b.addEventListener('click', actionFn);
          toastEl.appendChild(b);
        }
        toastEl.classList.add('show');
        toastTimer = setTimeout(hideToast, 3200);
      }
      function hideToast() { toastEl.classList.remove('show'); }

      // --- Greeting ---
      function setGreeting() {
        const h = new Date().getHours();
        const word = h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';
        $('#greeting').textContent = `${word}. Plan your day with clarity.`;
      }

      // --- Events ---
      $('#prevMonth').addEventListener('click', () => { view = new Date(view.getFullYear(), view.getMonth() - 1, 1); renderCalendar(); });
      $('#nextMonth').addEventListener('click', () => { view = new Date(view.getFullYear(), view.getMonth() + 1, 1); renderCalendar(); });
      $('#todayBtn').addEventListener('click', () => selectDate(todayKey));
      $('#addBtn').addEventListener('click', addTask);
      taskInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); addTask(); } });
      $('#clearDoneBtn').addEventListener('click', clearCompleted);

      $$('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          $$('.filter-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          filter = btn.dataset.filter;
          renderTasks();
        });
      });

      searchInput.addEventListener('input', (e) => handleSearch(e.target.value));
      searchInput.addEventListener('keydown', (e) => { if (e.key === 'Escape') { searchInput.value = ''; handleSearch(''); searchInput.blur(); } });

      $('#exportBtn').addEventListener('click', exportTasks);
      $('#importBtn').addEventListener('click', () => $('#importFile').click());
      $('#importFile').addEventListener('change', (e) => {
        const f = e.target.files && e.target.files[0];
        if (f) importTasks(f);
        e.target.value = '';
      });

      $('#editCancel').addEventListener('click', closeEdit);
      $('#editSave').addEventListener('click', saveEdit);
      $('#editModal').addEventListener('click', (e) => { if (e.target === $('#editModal')) closeEdit(); });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && $('#editModal').classList.contains('open')) closeEdit();
        const tag = document.activeElement?.tagName;
        const inField = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
        if (e.key === '/' && !e.metaKey && !e.ctrlKey && !e.altKey && !inField) {
          e.preventDefault(); searchInput.focus();
        }
        if (!e.metaKey && !e.ctrlKey && !e.altKey && !inField) {
          if (e.key === 'n' || e.key === 'N') { e.preventDefault(); taskInput.focus(); }
          if (e.key === 't' || e.key === 'T') { e.preventDefault(); $('#themeBtn').click(); }
        }
      });

      // --- Init ---
      setGreeting();
      renderCalendar();
      renderTasks();
    })();
  </script>
</body>
</html>
