<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>VICE CITY: HEATWAVE — Neon Open-World Driving</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #07040f radial-gradient(circle at 50% 0%, #2a0f45 0%, #07040f 60%);
    font-family: "Courier New", ui-monospace, monospace;
  }
  #stage {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  /* Fixed 16:9 render target, letterboxed & scaled to any window */
  #game {
    width: min(100vw, calc(100vh * 16 / 9));
    height: min(100vh, calc(100vw * 9 / 16));
    image-rendering: auto;
    background: #0a0818;
    box-shadow: 0 0 60px rgba(255, 46, 136, 0.35), 0 0 140px rgba(0, 240, 255, 0.18);
    border: 2px solid rgba(255, 46, 136, 0.5);
    cursor: crosshair;
    touch-action: none;
  }
  #hint {
    position: fixed; left: 50%; bottom: 8px; transform: translateX(-50%);
    color: rgba(255, 233, 245, 0.5); font-size: 12px; letter-spacing: 2px;
    pointer-events: none; text-transform: uppercase;
  }
</style>
</head>
<body>
  <div id="stage">
    <canvas id="game" width="960" height="540"></canvas>
  </div>
  <div id="hint">WASD / Arrows drive &middot; E enter-exit &middot; Mouse / Space fire &middot; 1-3 mission cards</div>
  <script src="vice-city-heatwave.js" defer></script>
</body>
</html>
