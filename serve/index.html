<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chrono — Todo Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0d12;
    --bg-2: #12151c;
    --panel: #181c26;
    --panel-2: #1f2430;
    --border: #262b38;
    --text: #e8ecf4;
    --muted: #8a93a6;
    --accent: #7c5cff;
    --accent-2: #3dd9b3;
    --danger: #ff5c7a;
    --warn: #ffb347;
    --ok: #3dd9b3;
    --shadow: 0 20px 60px rgba(0,0,0,.45);
    --radius: 16px;
  }
  [data-theme="light"] {
    --bg: #f5f7fb;
    --bg-2: #eef1f7;
    --panel: #ffffff;
    --panel-2: #f0f3fa;
    --border: #dde2ec;
    --text: #1a1f2e;
    --muted: #6b7385;
    --shadow: 0 20px 60px rgba(20,30,60,.12);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: radial-gradient(1200px 600px at 80% -10%, rgba(124,92,255,.18), transparent 60%),
                radial-gradient(900px 500px at -10% 110%, rgba(61,217,179,.12), transparent 60%),
                var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .app { display: grid; grid-template-columns: 260px 1fr; min-height: 100vh; }
  @media (max-width: 900px) { .app { grid-template-columns: 1fr; } .sidebar { display: none; } }

  /* Sidebar */
  .sidebar {
    background: linear-gradient(180deg, var(--panel), var(--bg-2));
    border-right: 1px solid var(--border);
    padding: 24px 18px;
    display: flex; flex-direction: column; gap: 24px;
    position: sticky; top: 0; height: 100vh;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-mark {
    width: 40px; height: 40px; border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: grid; place-items: center; font-weight: 700; color: white;
    box-shadow: 0 8px 24px rgba(124,92,255,.4);
  }
  .brand h1 { font-family: 'Space Grotesk', sans-serif; font-size: 20px; margin: 0; }
  .brand span { font-size: 11px; color: var(--muted); letter-spacing: .5px; text-transform: uppercase; }
  .nav { display: flex; flex-direction: column; gap: 4px; }
  .nav button {
    background: transparent; border: none; color: var(--muted);
    padding: 10px 12px; border-radius: 10px; text-align: left;
    font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 10px;
    transition: all .15s ease;
  }
  .nav button:hover { background: var(--panel-2); color: var(--text); }
  .nav button.active { background: linear-gradient(135deg, rgba(124,92,255,.25), rgba(61,217,179,.12)); color: var(--text); }
  .nav button .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .nav button.active .dot { background: var(--accent); box-shadow: 0 0 8px var(--accent); }

  .quick-add {
    background: linear-gradient(135deg, var(--accent), #5a3fd9);
    border: none; color: white; padding: 12px; border-radius: 12px;
    font-weight: 600; cursor: pointer; font-size: 14px;
    box-shadow: 0 10px 30px rgba(124,92,255,.35);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .quick-add:hover { transform: translateY(-2px); box-shadow: 0 14px 36px rgba(124,92,255,.45); }

  .stats { margin-top: auto; background: var(--panel-2); border: 1px solid var(--border); border-radius: 12px; padding: 14px; }
  .stats-row { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .stats-row b { color: var(--text); }
  .progress { height: 6px; background: var(--border); border-radius: 99px; overflow: hidden; }
  .progress > div { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); border-radius: 99px; transition: width .4s ease; }

  /* Main */
  .main { padding: 28px 32px; display: flex; flex-direction: column; gap: 24px; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .topbar h2 { font-family: 'Space Grotesk', sans-serif; font-size: 28px; margin: 0; }
  .topbar .sub { color: var(--muted); font-size: 14px; margin-top: 2px; }
  .topbar-actions { display: flex; gap: 10px; align-items: center; }
  .icon-btn {
    background: var(--panel); border: 1px solid var(--border); color: var(--text);
    width: 40px; height: 40px; border-radius: 10px; cursor: pointer;
    display: grid; place-items: center; transition: all .15s ease;
  }
  .icon-btn:hover { background: var(--panel-2); border-color: var(--accent); }
  .search {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 0 14px; height: 40px; display: flex; align-items: center; gap: 8px; min-width: 220px;
  }
  .search input { background: transparent; border: none; color: var(--text); outline: none; flex: 1; font-size: 14px; }

  /* Calendar */
  .calendar-card {
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 20px; box-shadow: var(--shadow);
  }
  .cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .cal-header h3 { font-family: 'Space Grotesk', sans-serif; font-size: 20px; margin: 0; }
  .cal-nav { display: flex; gap: 6px; }
  .cal-nav button { background: var(--panel-2); border: 1px solid var(--border); color: var(--text); width: 34px; height: 34px; border-radius: 8px; cursor: pointer; }
  .cal-nav button:hover { border-color: var(--accent); }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .cal-dow { text-align: center; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; padding: 6px 0; }
  .cal-day {
    aspect-ratio: 1; background: var(--panel-2); border: 1px solid transparent;
    border-radius: 12px; padding: 8px; cursor: pointer; position: relative;
    transition: all .15s ease; display: flex; flex-direction: column; gap: 4px;
    min-height: 70px;
  }
  .cal-day:hover { border-color: var(--accent); transform: translateY(-1px); }
  .cal-day.other { opacity: .35; }
  .cal-day.today { border-color: var(--accent); background: linear-gradient(135deg, rgba(124,92,255,.15), var(--panel-2)); }
  .cal-day.selected { background: linear-gradient(135deg, rgba(124,92,255,.3), rgba(61,217,179,.15)); border-color: var(--accent-2); }
  .cal-day .num { font-size: 13px; font-weight: 600; }
  .cal-day .dots { display: flex; gap: 3px; flex-wrap: wrap; margin-top: auto; }
  .cal-day .dot { width: 6px; height: 6px; border-radius: 50%; }

  /* Tasks panel */
  .tasks-card {
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 20px; box-shadow: var(--shadow);
  }
  .tasks-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; flex-wrap: wrap; gap: 10px; }
  .tasks-header h3 { font-family: 'Space Grotesk', sans-serif; font-size: 18px; margin: 0; }
  .filters { display: flex; gap: 6px; }
  .filters button { background: var(--panel-2); border: 1px solid var(--border); color: var(--muted); padding: 6px 12px; border-radius: 8px; font-size: 12px; cursor: pointer; }
  .filters button.active { background: var(--accent); color: white; border-color: var(--accent); }

  .task-list { display: flex; flex-direction: column; gap: 8px; }
  .task {
    display: flex; align-items: flex-start; gap: 12px;
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 14px; transition: all .15s ease;
    animation: slideIn .25s ease;
  }
  @keyframes slideIn { from { opacity: 0; transform: translateY(6px);} to { opacity:1; transform: translateY(0);} }
  .task:hover { border-color: var(--accent); }
  .task.done { opacity: .55; }
  .task.done .title { text-decoration: line-through; }
  .task .checkbox {
    width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--border);
    cursor: pointer; flex-shrink: 0; display: grid; place-items: center; transition: all .15s ease;
    margin-top: 2px;
  }
  .task .checkbox.checked { background: var(--accent-2); border-color: var(--accent-2); color: #0b0d12; }
  .task-body { flex: 1; min-width: 0; }
  .task .title { font-weight: 500; font-size: 14px; }
  .task .meta { display: flex; gap: 8px; margin-top: 4px; flex-wrap: wrap; align-items: center; }
  .task .meta span { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 4px; }
  .tag { padding: 2px 8px; border-radius: 6px; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .4px; }
  .pri-high { background: rgba(255,92,122,.15); color: var(--danger); }
  .pri-med { background: rgba(255,179,71,.15); color: var(--warn); }
  .pri-low { background: rgba(61,217,179,.15); color: var(--ok); }
  .cat { background: rgba(124,92,255,.15); color: var(--accent); }
  .task .actions { display: flex; gap: 4px; opacity: 0; transition: opacity .15s; }
  .task:hover .actions { opacity: 1; }
  .task .actions button { background: transparent; border: none; color: var(--muted); cursor: pointer; padding: 4px; border-radius: 6px; }
  .task .actions button:hover { color: var(--danger); background: rgba(255,92,122,.1); }

  .empty { text-align: center; padding: 40px 20px; color: var(--muted); }
  .empty svg { opacity: .4; margin-bottom: 12px; }

  /* Modal */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,.6); backdrop-filter: blur(6px);
    display: none; align-items: center; justify-content: center; z-index: 50;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: var(--panel); border: 1px solid var(--border); border-radius: 20px;
    width: 92%; max-width: 460px; padding: 24px; box-shadow: var(--shadow);
    animation: pop .2s ease;
  }
  @keyframes pop { from { opacity:0; transform: scale(.96);} to { opacity:1; transform: scale(1);} }
  .modal h3 { font-family: 'Space Grotesk', sans-serif; margin: 0 0 16px; font-size: 20px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .5px; }
  .field input, .field select, .field textarea {
    width: 100%; background: var(--panel-2); border: 1px solid var(--border);
    color: var(--text); padding: 10px 12px; border-radius: 10px; font-size: 14px;
    font-family: inherit; outline: none; transition: border-color .15s;
  }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }
  .field textarea { resize: vertical; min-height: 70px; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 8px; }
  .btn { padding: 10px 16px; border-radius: 10px; border: 1px solid var(--border); cursor: pointer; font-size: 14px; font-weight: 500; }
  .btn-ghost { background: transparent; color: var(--text); }
  .btn-primary { background: var(--accent); color: white; border-color: var(--accent); }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--panel); border: 1px solid var(--border); padding: 12px 18px;
    border-radius: 12px; opacity: 0; transition: all .25s ease; z-index: 60; font-size: 13px;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">C</div>
      <div><h1>Chrono</h1><span>Todo Calendar</span></div>
    </div>
    <nav class="nav">
      <button class="active" data-view="today"><span class="dot"></span> Today</button>
      <button data-view="calendar"><span class="dot"></span> Calendar</button>
      <button data-view="tasks"><span class="dot"></span> All Tasks</button>
      <button data-view="upcoming"><span class="dot"></span> Upcoming</button>
    </nav>
    <button class="quick-add" id="quickAdd">+ New Task</button>
    <div class="stats">
      <div class="stats-row"><span>Completed</span><b id="statDone">0</b></div>
      <div class="stats-row"><span>Remaining</span><b id="statLeft">0</b></div>
      <div class="stats-row"><span>Progress</span><b id="statPct">0%</b></div>
      <div class="progress"><div id="progressBar" style="width:0%"></div></div>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div>
        <h2 id="viewTitle">Today</h2>
        <div class="sub" id="viewSub">Your focus for the day</div>
      </div>
      <div class="topbar-actions">
        <div class="search"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><input id="searchInput" placeholder="Search tasks..." /></div>
        <button class="icon-btn" id="themeToggle" title="Toggle theme">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
      </div>
    </div>

    <section id="calendarSection" class="calendar-card">
      <div class="cal-header">
        <h3 id="calMonth">Month</h3>
        <div class="cal-nav">
          <button id="prevMonth">‹</button>
          <button id="todayBtn">Today</button>
          <button id="nextMonth">›</button>
        </div>
      </div>
      <div class="cal-grid" id="calGrid"></div>
    </section>

    <section class="tasks-card">
      <div class="tasks-header">
        <h3 id="tasksTitle">Tasks</h3>
        <div class="filters">
          <button class="active" data-filter="all">All</button>
          <button data-filter="active">Active</button>
          <button data-filter="done">Done</button>
        </div>
      </div>
      <div class="task-list" id="taskList"></div>
    </section>
  </main>
</div>

<div class="modal-backdrop" id="modal">
  <div class="modal">
    <h3 id="modalTitle">New Task</h3>
    <div class="field">
      <label>Title</label>
      <input id="tTitle" placeholder="What needs to be done?" />
    </div>
    <div class="field-row">
      <div class="field">
        <label>Date</label>
        <input type="date" id="tDate" />
      </div>
      <div class="field">
        <label>Time</label>
        <input type="time" id="tTime" />
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label>Priority</label>
        <select id="tPri">
          <option value="low">Low</option>
          <option value="med" selected>Medium</option>
          <option value="high">High</option>
        </select>
      </div>
      <div class="field">
        <label>Category</label>
        <select id="tCat">
          <option>Work</option>
          <option>Personal</option>
          <option>Health</option>
          <option>Learning</option>
          <option>Other</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label>Notes</label>
      <textarea id="tNotes" placeholder="Optional details..."></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="cancelBtn">Cancel</button>
      <button class="btn btn-primary" id="saveBtn">Save Task</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = (s) => document.querySelector(s);
const $$ = (s) => document.querySelectorAll(s);

const STORAGE_KEY = 'chrono_tasks_v1';
const THEME_KEY = 'chrono_theme';

let tasks = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
let view = 'today';
let filter = 'all';
let selectedDate = new Date();
let calDate = new Date();
let editingId = null;
let searchQuery = '';

function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); }

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function fmtDate(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function parseDate(s) { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function isToday(d) { const t = new Date(); return d.toDateString() === t.toDateString(); }

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

// Theme
function applyTheme(th) {
  document.documentElement.setAttribute('data-theme', th);
  localStorage.setItem(THEME_KEY, th);
}
applyTheme(localStorage.getItem(THEME_KEY) || 'dark');
$('#themeToggle').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme');
  applyTheme(cur === 'dark' ? 'light' : 'dark');
});

// Navigation
$$('.nav button').forEach(b => b.addEventListener('click', () => {
  $$('.nav button').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  view = b.dataset.view;
  render();
}));

// Filters
$$('.filters button').forEach(b => b.addEventListener('click', () => {
  $$('.filters button').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  filter = b.dataset.filter;
  renderTasks();
}));

// Search
$('#searchInput').addEventListener('input', e => { searchQuery = e.target.value.toLowerCase(); renderTasks(); });

// Calendar
function renderCalendar() {
  const grid = $('#calGrid');
  grid.innerHTML = '';
  const y = calDate.getFullYear(), m = calDate.getMonth();
  $('#calMonth').textContent = calDate.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
  const first = new Date(y, m, 1);
  const startDay = first.getDay();
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const prevDays = new Date(y, m, 0).getDate();

  const dows = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  dows.forEach(d => {
    const el = document.createElement('div');
    el.className = 'cal-dow'; el.textContent = d; grid.appendChild(el);
  });

  // leading
  for (let i = startDay - 1; i >= 0; i--) {
    const day = prevDays - i;
    const cell = makeDayCell(new Date(y, m-1, day), true); grid.appendChild(cell);
  }
  for (let d = 1; d <= daysInMonth; d++) {
    const cell = makeDayCell(new Date(y, m, d), false); grid.appendChild(cell);
  }
  // trailing
  const total = startDay + daysInMonth;
  const rem = (7 - (total % 7)) % 7;
  for (let d = 1; d <= rem; d++) {
    const cell = makeDayCell(new Date(y, m+1, d), true); grid.appendChild(cell);
  }
}

function makeDayCell(date, other) {
  const cell = document.createElement('div');
  cell.className = 'cal-day' + (other ? ' other' : '') + (isToday(date) ? ' today' : '') + (selectedDate.toDateString() === date.toDateString() ? ' selected' : '');
  cell.innerHTML = `<div class="num">${date.getDate()}</div><div class="dots"></div>`;
  const dots = cell.querySelector('.dots');
  const dayTasks = tasks.filter(t => t.date === fmtDate(date));
  // color dots by priority
  const colors = { high: 'var(--danger)', med: 'var(--warn)', low: 'var(--ok)' };
  dayTasks.slice(0,5).forEach(t => {
    const dot = document.createElement('span');
    dot.className = 'dot';
    dot.style.background = colors[t.pri] || 'var(--accent)';
    dots.appendChild(dot);
  });
  cell.addEventListener('click', () => { selectedDate = date; renderCalendar(); renderTasks(); });
  return cell;
}

$('#prevMonth').addEventListener('click', () => { calDate.setMonth(calDate.getMonth()-1); renderCalendar(); });
$('#nextMonth').addEventListener('click', () => { calDate.setMonth(calDate.getMonth()+1); renderCalendar(); });
$('#todayBtn').addEventListener('click', () => { calDate = new Date(); selectedDate = new Date(); renderCalendar(); renderTasks(); });

// Tasks rendering
function filteredTasks() {
  let list = [...tasks];
  // view-based
  if (view === 'today') {
    const today = fmtDate(new Date());
    list = list.filter(t => t.date === today);
  } else if (view === 'upcoming') {
    const today = fmtDate(new Date());
    list = list.filter(t => t.date >= today && !t.done).sort((a,b) => a.date.localeCompare(b.date));
  } else if (view === 'calendar') {
    list = list.filter(t => t.date === fmtDate(selectedDate));
  }
  // filter status
  if (filter === 'active') list = list.filter(t => !t.done);
  else if (filter === 'done') list = list.filter(t => t.done);
  // search
  if (searchQuery) list = list.filter(t => (t.title + ' ' + (t.notes||'') + ' ' + t.cat).toLowerCase().includes(searchQuery));
  // sort by date then time
  list.sort((a,b) => (a.date+a.time).localeCompare(b.date+b.time));
  return list;
}

function renderTasks() {
  const list = $('#taskList');
  list.innerHTML = '';
  const items = filteredTasks();
  if (items.length === 0) {
    list.innerHTML = `<div class="empty"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg><div>No tasks here. Add one to get started.</div></div>`;
    return;
  }
  items.forEach(t => {
    const el = document.createElement('div');
    el.className = 'task' + (t.done ? ' done' : '');
    const priCls = t.pri === 'high' ? 'pri-high' : t.pri === 'med' ? 'pri-med' : 'pri-low';
    const priLabel = t.pri === 'high' ? 'High' : t.pri === 'med' ? 'Med' : 'Low';
    el.innerHTML = `
      <div class="checkbox ${t.done?'checked':''}" data-id="${t.id}">${t.done?'✓':''}</div>
      <div class="task-body">
        <div class="title">${escapeHtml(t.title)}</div>
        <div class="meta">
          <span>📅 ${t.date}</span>
          ${t.time ? `<span>⏰ ${t.time}</span>` : ''}
          <span class="tag ${priCls}">${priLabel}</span>
          <span class="tag cat">${t.cat}</span>
        </div>
        ${t.notes ? `<div style="font-size:12px;color:var(--muted);margin-top:6px;">${escapeHtml(t.notes)}</div>` : ''}
      </div>
      <div class="actions">
        <button data-edit="${t.id}" title="Edit">✎</button>
        <button data-del="${t.id}" title="Delete">✕</button>
      </div>`;
    list.appendChild(el);
  });
  // bind
  list.querySelectorAll('.checkbox').forEach(c => c.addEventListener('click', () => toggleDone(c.dataset.id)));
  list.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', () => openModal(b.dataset.edit)));
  list.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => deleteTask(b.dataset.del)));
}

function escapeHtml(s) { return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function toggleDone(id) {
  const t = tasks.find(x => x.id === id);
  if (!t) return;
  t.done = !t.done;
  save(); renderTasks(); renderCalendar(); updateStats(); toast(t.done ? 'Task completed 🎉' : 'Task reopened');
}

function deleteTask(id) {
  tasks = tasks.filter(x => x.id !== id);
  save(); renderTasks(); renderCalendar(); updateStats(); toast('Task deleted');
}

function updateStats() {
  const total = tasks.length;
  const done = tasks.filter(t => t.done).length;
  const left = total - done;
  const pct = total ? Math.round(done/total*100) : 0;
  $('#statDone').textContent = done;
  $('#statLeft').textContent = left;
  $('#statPct').textContent = pct + '%';
  $('#progressBar').style.width = pct + '%';
}

// Modal
function openModal(id = null) {
  editingId = id;
  $('#modalTitle').textContent = id ? 'Edit Task' : 'New Task';
  if (id) {
    const t = tasks.find(x => x.id === id);
    $('#tTitle').value = t.title;
    $('#tDate').value = t.date;
    $('#tTime').value = t.time || '';
    $('#tPri').value = t.pri;
    $('#tCat').value = t.cat;
    $('#tNotes').value = t.notes || '';
  } else {
    $('#tTitle').value = '';
    $('#tDate').value = fmtDate(selectedDate);
    $('#tTime').value = '';
    $('#tPri').value = 'med';
    $('#tCat').value = 'Work';
    $('#tNotes').value = '';
  }
  $('#modal').classList.add('open');
  setTimeout(() => $('#tTitle').focus(), 50);
}
function closeModal() { $('#modal').classList.remove('open'); editingId = null; }

$('#quickAdd').addEventListener('click', () => openModal());
$('#cancelBtn').addEventListener('click', closeModal);
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });

$('#saveBtn').addEventListener('click', () => {
  const title = $('#tTitle').value.trim();
  if (!title) { toast('Title is required'); return; }
  const data = {
    title,
    date: $('#tDate').value || fmtDate(new Date()),
    time: $('#tTime').value,
    pri: $('#tPri').value,
    cat: $('#tCat').value,
    notes: $('#tNotes').value.trim(),
  };
  if (editingId) {
    const t = tasks.find(x => x.id === editingId);
    Object.assign(t, data);
    toast('Task updated');
  } else {
    tasks.push({ id: uid(), done: false, createdAt: Date.now(), ...data });
    toast('Task added');
  }
  save(); closeModal(); renderTasks(); renderCalendar(); updateStats();
});

// Titles per view
function render() {
  const titles = { today: ['Today','Your focus for the day'], calendar: ['Calendar', `Tasks on ${selectedDate.toLocaleDateString()}`], tasks: ['All Tasks','Everything on your plate'], upcoming: ['Upcoming','What\'s next'] };
  $('#viewTitle').textContent = titles[view][0];
  $('#viewSub').textContent = titles[view][1];
  renderCalendar();
  renderTasks();
  updateStats();
}

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  if (e.key === 'n' && !e.target.matches('input,textarea,select')) openModal();
  if (e.key === 'Escape') closeModal();
});

render();
</script>
</body>
</html>
