<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VICE COAST — Neon City</title>
<style>
  html,body{margin:0;height:100%;background:#0b0d12;overflow:hidden;
    font-family:"Trebuchet MS",system-ui,-apple-system,sans-serif;user-select:none}
  canvas{display:block;cursor:crosshair}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
/* ================= CORE / CONSTANTS ================= */
const cvs=document.getElementById('c'),ctx=cvs.getContext('2d');
let W=0,H=0;
function resize(){W=cvs.width=innerWidth;H=cvs.height=innerHeight;}
addEventListener('resize',resize);resize();

const BLOCK=600,ROAD=140,SIDE=44,N=7,WORLD=(N-1)*BLOCK,LANE=36;
const TAU=Math.PI*2;
const rand=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[(Math.random()*a.length)|0];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const d2=(x1,y1,x2,y2)=>{const a=x2-x1,b=y2-y1;return a*a+b*b;};
const angDiff=(a,b)=>{let d=b-a;while(d>Math.PI)d-=TAU;while(d<-Math.PI)d+=TAU;return d;};
function roadAx(v){const c=Math.round(v/BLOCK)*BLOCK;return{c:c,d:Math.abs(v-c)};}
function onRoad(x,y){return roadAx(x).d<ROAD/2||roadAx(y).d<ROAD/2;}
function onSide(x,y){if(onRoad(x,y))return false;const a=roadAx(x),b=roadAx(y);
  return a.d<ROAD/2+SIDE||b.d<ROAD/2+SIDE;}

/* ================= AUDIO ================= */
let audio=null,engOsc=null,engGain=null;
function initAudio(){
  if(audio)return;
  try{
    audio=new (window.AudioContext||window.webkitAudioContext)();
    engOsc=audio.createOscillator();engGain=audio.createGain();
    engOsc.type='sawtooth';engOsc.frequency.value=55;engGain.gain.value=0;
    engOsc.connect(engGain).connect(audio.destination);engOsc.start();
  }catch(e){audio=null;}
}
function blip(f1,f2,dur,vol,type){
  if(!audio)return;
  try{
    const o=audio.createOscillator(),g=audio.createGain();
    o.type=type||'square';
    o.frequency.setValueAtTime(f1,audio.currentTime);
    o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),audio.currentTime+dur);
    g.gain.setValueAtTime(vol,audio.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,audio.currentTime+dur);
    o.connect(g).connect(audio.destination);
    o.start();o.stop(audio.currentTime+dur+0.02);
  }catch(e){}
}
const sndShot=()=>blip(320,70,0.13,0.16,'square');
const sndHit =()=>blip(140,50,0.18,0.2,'sawtooth');
const sndCash=()=>blip(700,1400,0.14,0.14,'triangle');
const sndSiren=()=>blip(600,900,0.25,0.06,'sine');
const sndBoom=()=>blip(90,25,0.5,0.3,'sawtooth');

/* ================= WORLD GEOMETRY ================= */
const NEON=['#ff4fa3','#22d3ee','#fbbf24','#a78bfa','#34d399','#f97316','#38bdf8','#f43f5e','#e879f9'];
const buildings=[],trees=[];
function mkBuilding(x,y,w,h){
  if(w<40||h<40)return;
  buildings.push({x:x,y:y,w:w,h:h,ht:rand(26,66),
    col:pick(NEON),face:pick(['#262b36','#2d3240','#232733','#303646'])});
}
for(let i=0;i<N-1;i++)for(let j=0;j<N-1;j++){
  const x0=i*BLOCK+ROAD/2+SIDE,y0=j*BLOCK+ROAD/2+SIDE;
  const x1=(i+1)*BLOCK-ROAD/2-SIDE,y1=(j+1)*BLOCK-ROAD/2-SIDE;
  const g=18,m=Math.random();
  if(m<0.34){mkBuilding(x0,y0,x1-x0,y1-y0);}
  else if(m<0.67){const mx=(x0+x1)/2;
    mkBuilding(x0,y0,mx-g/2-x0,y1-y0);mkBuilding(mx+g/2,y0,x1-mx-g/2,y1-y0);}
  else{const mx=(x0+x1)/2,my=(y0+y1)/2;
    mkBuilding(x0,y0,mx-g/2-x0,my-g/2-y0);mkBuilding(mx+g/2,y0,x1-mx-g/2,my-g/2-y0);
    mkBuilding(x0,my+g/2,mx-g/2-x0,y1-my-g/2);mkBuilding(mx+g/2,my+g/2,x1-mx-g/2,y1-my-g/2);}
  const c=[i*BLOCK+ROAD/2+20,j*BLOCK+ROAD/2+20];
  trees.push({x:c[0],y:c[1]},{x:(i+1)*BLOCK-ROAD/2-20,y:c[1]},
    {x:c[0],y:(j+1)*BLOCK-ROAD/2-20},{x:(i+1)*BLOCK-ROAD/2-20,y:(j+1)*BLOCK-ROAD/2-20});
}
function inBuilding(x,y,pad){
  pad=pad||0;
  for(let i=0;i<buildings.length;i++){const b=buildings[i];
    if(x>b.x-pad&&x<b.x+b.w+pad&&y>b.y-pad&&y<b.y+b.h+pad)return true;}
  return false;
}
function randSide(){
  for(let t=0;t<400;t++){
    const i=(Math.random()*(N-1))|0,j=(Math.random()*(N-1))|0;
    const x0=i*BLOCK,y0=j*BLOCK;
    const side=(Math.random()*4)|0;let x,y;
    if(side===0){x=rand(x0,x0+BLOCK);y=y0+ROAD/2+SIDE*0.5;}
    else if(side===1){x=rand(x0,x0+BLOCK);y=y0+BLOCK-ROAD/2-SIDE*0.5;}
    else if(side===2){x=x0+ROAD/2+SIDE*0.5;y=rand(y0,y0+BLOCK);}
    else{x=x0+BLOCK-ROAD/2-SIDE*0.5;y=rand(y0,y0+BLOCK);}
    if(!inBuilding(x,y,4))return{x:x,y:y};
  }
  return{x:500,y:780};
}

/* ================= ENTITIES ================= */
const P={x:500,y:780,a:0,hp:100,money:0,wanted:0,inCar:null,
  cool:0,walk:0,hurt:0,bob:0,speed:0};
let cars=[],peds=[],bullets=[],parts=[],texts=[],packages=[];
let trafficT=0,copT=0,lastCrime=0,got=0,total=12;
let trauma=0,hitstop=0,tGlobal=0,state='play',deadT=0,helpT=9,sirenT=0;
const cam={x:0,y:0};
const mouse={x:0,y:0,down:false};
const keys={};

function mkCar(x,y,a,opt){
  opt=opt||{};
  return{x:x,y:y,a:a,speed:0,ctrl:opt.ctrl||'npc',
    kind:opt.kind||'car',l:opt.kind==='cop'?62:56,w:opt.kind==='cop'?30:28,
    col:opt.col||pick(['#e2e8f0','#f43f5e','#38bdf8','#fbbf24','#a78bfa','#34d399','#fb923c','#94a3b8']),
    hp:opt.kind==='cop'?160:120,max:opt.kind==='cop'?330:460,cool:0,
    axis:'h',dir:1,road:0,smoke:0,flash:0};
}
function spawnTraffic(){
  const axis=Math.random()<0.5?'h':'v';
  const road=((Math.random()*N)|0)*BLOCK;
  const dir=Math.random()<0.5?1:-1;
  const along=rand(0,WORLD);
  const c=mkCar(0,0,0,{});
  c.axis=axis;c.dir=dir;c.road=road;
  if(axis==='h'){c.x=along;c.y=road+dir*LANE;c.a=dir>0?0:Math.PI;}
  else{c.x=road-dir*LANE;c.y=along;c.a=dir>0?Math.PI/2:-Math.PI/2;}
  c.speed=rand(110,180);c.ctrl='npc';
  cars.push(c);
}
function spawnCop(){
  const ang=Math.random()*TAU,r=rand(650,900);
  let x=clamp(P.x+Math.cos(ang)*r,20,WORLD-20),y=clamp(P.y+Math.sin(ang)*r,20,WORLD-20);
  if(!onRoad(x,y)){const k=roadAx(Math.random()<0.5?x:y);x=roadAx(x).c;y=roadAx(y).c;}
  const c=mkCar(x,y,Math.atan2(P.y-y,P.x-x),{kind:'cop'});
  c.ctrl='cop';c.speed=120;cars.push(c);
}
function spawnPeds(n){
  for(let i=0;i<n;i++){
    const p=randSide();
    peds.push({x:p.x,y:p.y,a:rand(0,TAU),tx:p.x,ty:p.y,state:'walk',t:0,
      hp:30,dead:false,fade:8,col:pick(NEON),skin:pick(['#f2c9a0','#c98b5e','#8d5524','#ffe0bd']),ph:rand(0,TAU)});
  }
}
function spawnPackages(){
  packages=[];
  for(let i=0;i<total;i++){const p=randSide();packages.push({x:p.x,y:p.y,got:false});}
}
function newGame(){
  cars=[];peds=[];bullets=[];parts=[];texts=[];
  P.x=500;P.y=780;P.a=0;P.hp=100;P.money=0;P.wanted=0;P.inCar=null;P.cool=0;
  got=0;lastCrime=0;trauma=0;hitstop=0;deadT=0;state='play';helpT=9;
  for(let i=0;i<14;i++)spawnTraffic();
  spawnPeds(34);spawnPackages();
  toast('COLLECT THE 12 NEON PACKAGES','#ff4fa3',4);
}

/* ================= FX ================= */
function toast(txt,col,t){texts.push({ui:true,txt:txt,col:col||'#fff',life:t||3,max:t||3,x:0,y:0});}
function floatTxt(x,y,txt,col){texts.push({x:x,y:y,txt:txt,col:col||'#fff',life:1.4,max:1.4});}
function burst(x,y,n,col,spd,life){
  for(let i=0;i<n;i++){const a=Math.random()*TAU,s=rand(spd*0.3,spd);
    parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,
      life:rand(life*0.5,life),max:life,col:col,sz:rand(2,5)});}
}
function explosion(x,y){
  burst(x,y,46,'#ff9f43',420,1.1);burst(x,y,26,'#fff3c4',300,0.5);
  parts.push({x:x,y:y,vx:0,vy:0,life:0.6,max:0.6,col:'#ff6b35',sz:10,ring:true});
  trauma=Math.min(1,trauma+0.95);hitstop=0.09;sndBoom();
}
function addText(txt,x,y,col){floatTxt(x,y,txt,col);}

/* ================= INPUT ================= */
function onKey(code){
  if(code==='KeyE')enterExit();
  if(code==='KeyP'&&state!=='dead')state=state==='pause'?'play':'pause';
  if(code==='KeyH')helpT=helpT>0?0:999;
  if(code==='KeyR'&&state==='dead')newGame();
}
addEventListener('keydown',e=>{
  keys[e.code]=true;initAudio();
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
  onKey(e.code);
});
addEventListener('keyup',e=>{keys[e.code]=false;});
cvs.addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY;});
cvs.addEventListener('mousedown',()=>{mouse.down=true;initAudio();});
addEventListener('mouseup',()=>{mouse.down=false;});
cvs.addEventListener('contextmenu',e=>e.preventDefault());

function enterExit(){
  if(state!=='play')return;
  if(P.inCar){
    const c=P.inCar;
    const px=c.x+Math.cos(c.a+Math.PI/2)*(c.w/2+18);
    const py=c.y+Math.sin(c.a+Math.PI/2)*(c.w/2+18);
    let ex=px,ey=py;
    if(inBuilding(ex,ey,14)){ex=c.x-Math.cos(c.a+Math.PI/2)*(c.w/2+18);
      ey=c.y-Math.sin(c.a+Math.PI/2)*(c.w/2+18);}
    if(inBuilding(ex,ey,14)){ex=c.x;ey=c.y;}
    P.x=ex;P.y=ey;P.inCar=null;c.ctrl='free';c.speed*=0.4;
    if(engGain)engGain.gain.value=0;
    return;
  }
  let best=null,bd=80*80;
  for(const c of cars){const d=d2(P.x,P.y,c.x,c.y);if(d<bd){bd=d;best=c;}}
  if(!best)return;
  if(best.ctrl==='npc'){
    const p=randSide();peds.push({x:best.x,y:best.y,a:0,tx:p.x,ty:p.y,state:'flee',
      t:5,hp:30,dead:false,fade:8,col:pick(NEON),skin:pick(['#f2c9a0','#c98b5e','#8d5524']),ph:rand(0,TAU)});
    crime(1);
  }
  if(best.ctrl==='cop')crime(2);
  best.ctrl='p';P.inCar=best;best.speed*=0.5;
  toast(best.kind==='cop'?'POLICE CRUISER STOLEN':'VEHICLE HIJACKED','#fbbf24',1.6);
}

/* ================= COMBAT / CRIME ================= */
function crime(n){
  lastCrime=0;
  P.wanted=clamp(Math.max(P.wanted,n>1?P.wanted+n:n),0,5);
  if(P.wanted>0)sndSiren();
}
function shoot(){
  const ox=P.x+Math.cos(P.a)*16,oy=P.y+Math.sin(P.a)*16;
  bullets.push({x:ox,y:oy,vx:Math.cos(P.a)*900,vy:Math.sin(P.a)*900,
    life:0.7,from:'p',dmg:26});
  P.cool=0.16;sndShot();
  burst(ox,oy,4,'#ffe066',140,0.16);
  for(const p of peds){if(!p.dead&&d2(p.x,p.y,P.x,P.y)<420*420&&p.state!=='flee'){
    p.state='flee';p.t=rand(3,5);}}
}
function copShoot(c){
  const ang=Math.atan2(P.y-c.y,P.x-c.x)+rand(-0.07,0.07);
  bullets.push({x:c.x+Math.cos(ang)*30,y:c.y+Math.sin(ang)*30,
    vx:Math.cos(ang)*760,vy:Math.sin(ang)*760,life:0.8,from:'cop',dmg:9});
  blip(260,80,0.1,0.1,'square');
}
function damagePlayer(n,kx,ky){
  if(state!=='play')return;
  P.hp-=n;P.hurt=0.35;trauma=Math.min(1,trauma+n/60);
  if(kx!==undefined){P.x+=kx;P.y+=ky;collideWorld(P,13);}
  if(P.hp<=0){P.hp=0;state='dead';deadT=0;trauma=1;hitstop=0.15;
    if(P.inCar){P.inCar.ctrl='free';P.inCar=null;}
    if(engGain)engGain.gain.value=0;}
}
function killPed(p,byPlayer){
  if(p.dead)return;
  p.dead=true;p.fade=8;
  burst(p.x,p.y,14,'#e11d48',220,0.7);
  burst(p.x,p.y,6,p.col,160,0.5);
  hitstop=0.06;trauma=Math.min(1,trauma+0.22);sndHit();
  if(byPlayer){P.money+=15;addText('+$15',p.x,p.y-14,'#4ade80');crime(1);}
}

/* ================= PHYSICS HELPERS ================= */
function hitRect(o,r,b){
  const cx=clamp(o.x,b.x,b.x+b.w),cy=clamp(o.y,b.y,b.y+b.h);
  let dx=o.x-cx,dy=o.y-cy,d2v=dx*dx+dy*dy;
  if(d2v>=r*r)return null;
  if(d2v===0){
    const l=o.x-b.x,rr=b.x+b.w-o.x,t=o.y-b.y,bo=b.y+b.h-o.y;
    const m=Math.min(l,rr,t,bo);
    if(m===l){o.x=b.x-r;return{nx:-1,ny:0};}
    if(m===rr){o.x=b.x+b.w+r;return{nx:1,ny:0};}
    if(m===t){o.y=b.y-r;return{nx:0,ny:-1};}
    o.y=b.y+b.h+r;return{nx:0,ny:1};
  }
  const d=Math.sqrt(d2v),depth=r-d;
  o.x+=dx/d*depth;o.y+=dy/d*depth;
  return{nx:dx/d,ny:dy/d};
}
function collideWorld(o,r){
  let hit=null;
  for(let i=0;i<buildings.length;i++){
    const b=buildings[i];
    if(o.x<b.x-r-2||o.x>b.x+b.w+r+2||o.y<b.y-r-2||o.y>b.y+b.h+r+2)continue;
    const h=hitRect(o,r,b);if(h)hit=h;
  }
  o.x=clamp(o.x,6,WORLD-6);o.y=clamp(o.y,6,WORLD-6);
  return hit;
}
function carImpact(c,h){
  const imp=Math.abs(c.speed);
  if(imp>150){
    c.hp-=imp*0.09;
    trauma=Math.min(1,trauma+clamp(imp/900,0,0.5));
    burst(c.x+Math.cos(c.a)*c.l/2,c.y+Math.sin(c.a)*c.l/2,8,'#ffe066',240,0.4);
    blip(180,60,0.2,0.18,'sawtooth');
    if(c.ctrl==='p')damagePlayer(imp*0.02);
  }
  c.speed=-c.speed*0.3;
  if(c.hp<=0&&c.kind!=='boom'){c.kind='boom';explosion(c.x,c.y);
    if(c.ctrl==='p'){damagePlayer(45);P.inCar=null;c.ctrl='free';}
    c.dead=true;}
}

/* ================= UPDATE ================= */
function upd(dt){
  tGlobal+=dt;
  if(hitstop>0){hitstop-=dt;return;}
  helpT=Math.max(0,helpT-dt);

  /* --- player on foot --- */
  if(state!=='play'){
    if(P.inCar){P.x=P.inCar.x;P.y=P.inCar.y;}
    collideWorld(P,13);
  }
  else if(!P.inCar){
    let mx=(keys['KeyD']||keys['ArrowRight']?1:0)-(keys['KeyA']||keys['ArrowLeft']?1:0);
    let my=(keys['KeyS']||keys['ArrowDown']?1:0)-(keys['KeyW']||keys['ArrowUp']?1:0);
    const len=Math.hypot(mx,my);
    const sprint=keys['ShiftLeft']||keys['ShiftRight'];
    const spd=sprint?265:175;
    if(len>0){mx/=len;my/=len;
      P.x+=mx*spd*dt;P.y+=my*spd*dt;P.walk+=spd*dt*0.05;}
    P.speed=len>0?spd:0;
    collideWorld(P,13);
    const mw={x:cam.x+mouse.x,y:cam.y+mouse.y};
    P.a=Math.atan2(mw.y-P.y,mw.x-P.x);
    P.cool-=dt;
    if((mouse.down||keys['Space'])&&P.cool<=0&&state==='play')shoot();
  }else{
    /* --- driving --- */
    const c=P.inCar;
    const up=keys['KeyW']||keys['ArrowUp'],dn=keys['KeyS']||keys['ArrowDown'];
    const lf=keys['KeyA']||keys['ArrowLeft'],rt=keys['KeyD']||keys['ArrowRight'];
    const acc=c.kind==='cop'?360:330;
    if(up)c.speed+=acc*dt;
    else if(dn)c.speed-=acc*1.25*dt;
    else c.speed*=Math.pow(0.55,dt);
    if(keys['Space'])c.speed*=Math.pow(0.06,dt);
    c.speed=clamp(c.speed,-c.max*0.45,c.max);
    const grip=clamp(Math.abs(c.speed)/160,0,1);
    if(lf)c.a-=2.5*dt*grip*Math.sign(c.speed||1);
    if(rt)c.a+=2.5*dt*grip*Math.sign(c.speed||1);
    c.x+=Math.cos(c.a)*c.speed*dt;
    c.y+=Math.sin(c.a)*c.speed*dt;
    const h=collideWorld(c,26);
    if(h)carImpact(c,h);
    P.x=c.x;P.y=c.y;
    P.speed=Math.abs(c.speed);
    if(Math.abs(c.speed)>140&&(lf||rt)&&Math.random()<0.5)
      parts.push({x:c.x-Math.cos(c.a)*24,y:c.y-Math.sin(c.a)*24,
        vx:rand(-20,20),vy:rand(-20,20),life:0.5,max:0.5,col:'rgba(200,200,210,0.5)',sz:rand(3,6)});
    if(c.hp<45&&Math.random()<0.3)
      parts.push({x:c.x,y:c.y,vx:rand(-20,20),vy:rand(-40,-10),
        life:0.9,max:0.9,col:'rgba(80,80,90,0.7)',sz:rand(4,9)});
    if(engGain){engGain.gain.value=0.05;
      engOsc.frequency.value=55+Math.abs(c.speed)*0.28;}
    // run over peds
    if(Math.abs(c.speed)>150)for(const p of peds){
      if(!p.dead&&d2(p.x,p.y,c.x,c.y)<30*30)killPed(p,c.ctrl==='p');}
  }
  if(!P.inCar&&engGain)engGain.gain.value=0;
  if(P.hurt>0)P.hurt-=dt;

  /* --- traffic --- */
  for(const c of cars){
    if(c.dead)continue;
    if(c.ctrl==='npc'){
      if(c.axis==='h'){
        c.x+=c.dir*c.speed*dt;c.y=c.road+c.dir*LANE;
        c.a=c.dir>0?0:Math.PI;
        const nx=c.dir>0?(Math.floor(c.x/BLOCK)+1)*BLOCK:(Math.ceil(c.x/BLOCK)-1)*BLOCK;
        if(nx>=0&&nx<=WORLD&&Math.abs(c.x-nx)<=Math.max(7,c.speed*dt+3))turn(c,'h',nx);
        if(c.x<-80||c.x>WORLD+80)recycle(c);
      }else{
        c.y+=c.dir*c.speed*dt;c.x=c.road-c.dir*LANE;
        c.a=c.dir>0?Math.PI/2:-Math.PI/2;
        const ny=c.dir>0?(Math.floor(c.y/BLOCK)+1)*BLOCK:(Math.ceil(c.y/BLOCK)-1)*BLOCK;
        if(ny>=0&&ny<=WORLD&&Math.abs(c.y-ny)<=Math.max(7,c.speed*dt+3))turn(c,'v',ny);
        if(c.y<-80||c.y>WORLD+80)recycle(c);
      }
      // brake for player car ahead
      const px=c.x+Math.cos(c.a)*70,py=c.y+Math.sin(c.a)*70;
      if(P.inCar&&d2(px,py,P.inCar.x,P.inCar.y)<46*46)c.speed*=Math.pow(0.02,dt);
      else c.speed+= (140-c.speed)*Math.min(1,dt*0.7);
    }else if(c.ctrl==='cop'){
      const tx=P.x,ty=P.y;
      const want=Math.atan2(ty-c.y,tx-c.x);
      const d=Math.sqrt(d2(c.x,c.y,tx,ty));
      const ahead={x:c.x+Math.cos(c.a)*54,y:c.y+Math.sin(c.a)*54};
      if(inBuilding(ahead.x,ahead.y,10))c.a+=2.6*dt;
      else c.a+=clamp(angDiff(c.a,want),-2.4*dt,2.4*dt);
      const target=d>120?(240+P.wanted*18):(d<90?-60:110);
      c.speed+=(target-c.speed)*Math.min(1,dt*1.6);
      c.x+=Math.cos(c.a)*c.speed*dt;c.y+=Math.sin(c.a)*c.speed*dt;
      const h=collideWorld(c,28);if(h)carImpact(c);
      c.cool-=dt;
      if(d<330&&c.cool<=0&&state==='play'){copShoot(c);c.cool=rand(0.7,1.3);
        if(d<160&&Math.random()<0.4)sndSiren();}
      if(d<40&&Math.abs(c.speed)>120&&P.hurt<=0){
        const kx=Math.cos(c.a)*18,ky=Math.sin(c.a)*18;
        damagePlayer(11,kx,ky);c.speed*=0.5;trauma=Math.min(1,trauma+0.4);}
      if(P.wanted===0)c.speed+=(330-c.speed)*dt;
      c.flash+=dt;
    }
    if(c.ctrl==='p')c.flash+=dt;
  }
  cars=cars.filter(c=>!c.dead);

  /* --- police spawn / despawn --- */
  copT-=dt;
  const nCop=cars.filter(c=>c.ctrl==='cop').length;
  if(P.wanted>0){
    if(copT<=0&&nCop<Math.min(P.wanted+1,6)){spawnCop();copT=2.6;}
    lastCrime+=dt;
    if(lastCrime>14){P.wanted--;lastCrime=0;
      if(P.wanted===0)toast('WANTED LEVEL CLEARED','#34d399',2);}
  }else{
    for(const c of cars)if(c.ctrl==='cop'&&d2(c.x,c.y,P.x,P.y)>1400*1400)c.dead=true;
  }
  trafficT-=dt;
  if(trafficT<=0){const live=cars.filter(c=>c.ctrl==='npc').length;
    if(live<15)spawnTraffic();trafficT=1.4;}

  /* --- peds --- */
  for(const p of peds){
    if(p.dead){p.fade-=dt;continue;}
    p.t-=dt;
    if(p.state==='walk'){
      if(p.t<=0||d2(p.x,p.y,p.tx,p.ty)<24*24){
        const s=randSide();p.tx=s.x;p.ty=s.y;p.t=rand(4,9);}
      const a=Math.atan2(p.ty-p.y,p.tx-p.x);
      p.a+=angDiff(p.a,a)*Math.min(1,dt*4);
      p.x+=Math.cos(p.a)*62*dt;p.y+=Math.sin(p.a)*62*dt;
      if(P.inCar&&Math.abs(P.inCar.speed)>170&&d2(p.x,p.y,P.inCar.x,P.inCar.y)<120*120){
        p.state='flee';p.t=4;}
    }else{
      const a=Math.atan2(p.y-P.y,p.x-P.x);
      p.a+=angDiff(p.a,a)*Math.min(1,dt*6);
      p.x+=Math.cos(p.a)*135*dt;p.y+=Math.sin(p.a)*135*dt;
      if(p.t<=0){p.state='walk';p.t=1;}
    }
    const h=collideWorld(p,11);
    if(h&&p.state==='flee'){p.a+=rand(-1.6,1.6);p.tx=p.x+Math.cos(p.a)*90;p.ty=p.y+Math.sin(p.a)*90;}
    p.ph+=dt*(p.state==='flee'?16:9);
  }
  peds=peds.filter(p=>!p.dead||p.fade>0);

  /* --- bullets --- */
  for(const b of bullets){
    b.life-=dt;
    const steps=3;
    for(let s=0;s<steps&&b.life>0;s++){
      b.x+=b.vx*dt/steps;b.y+=b.vy*dt/steps;
      if(b.x<0||b.y<0||b.x>WORLD||b.y>WORLD){b.life=0;break;}
      let blocked=false;
      for(let i=0;i<buildings.length;i++){const r=buildings[i];
        if(b.x>r.x&&b.x<r.x+r.w&&b.y>r.y&&b.y<r.y+r.h){blocked=true;break;}}
      if(blocked){b.life=0;burst(b.x,b.y,4,'#ffe066',120,0.25);break;}
      if(b.from==='p'){
        for(const p of peds){
          if(!p.dead&&d2(b.x,b.y,p.x,p.y)<15*15){
            p.hp-=b.dmg;b.life=0;
            burst(b.x,b.y,5,'#e11d48',160,0.4);
            if(p.hp<=0)killPed(p,true);else{p.state='flee';p.t=rand(3,5);}
            break;}}
        if(b.life<=0)break;
        for(const c of cars){
          if(c.dead||c.ctrl==='p')continue;
          if(d2(b.x,b.y,c.x,c.y)<27*27){
            c.hp-=b.dmg;b.life=0;burst(b.x,b.y,5,'#ffe066',150,0.3);
            if(c.ctrl==='npc'){c.speed*=0.7;}
            if(c.hp<=0){c.kind='boom';explosion(c.x,c.y);c.dead=true;
              if(c.ctrl==='cop')crime(1);}
            break;}}
      }else{
        if(state==='play'&&!P.inCar&&d2(b.x,b.y,P.x,P.y)<15*15){
          b.life=0;damagePlayer(b.dmg);burst(b.x,b.y,5,'#e11d48',150,0.4);}
        else if(P.inCar&&d2(b.x,b.y,P.inCar.x,P.inCar.y)<27*27){
          b.life=0;P.inCar.hp-=b.dmg*0.7;burst(b.x,b.y,5,'#ffe066',150,0.3);
          if(P.inCar.hp<=0){explosion(P.inCar.x,P.inCar.y);damagePlayer(40);
            P.inCar.dead=true;P.inCar=null;}}
      }
    }
  }
  bullets=bullets.filter(b=>b.life>0);

  /* --- packages --- */
  for(const pk of packages){
    if(pk.got)continue;
    if(d2(pk.x,pk.y,P.x,P.y)<30*30){
      pk.got=true;got++;P.money+=500;sndCash();
      burst(pk.x,pk.y,18,'#ff4fa3',240,0.8);
      addText('+$500',pk.x,pk.y-16,'#ff4fa3');
      if(got>=total){P.money+=5000;toast('CITY CONQUERED  +$5000','#fbbf24',6);sndCash();}
      else toast('PACKAGE '+got+'/'+total,'#ff4fa3',1.6);
    }
  }

  /* --- particles / texts --- */
  for(const p of parts){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
    p.vx*=Math.pow(0.2,dt);p.vy*=Math.pow(0.2,dt);}
  parts=parts.filter(p=>p.life>0);
  for(const t of texts){t.life-=dt;if(!t.ui){t.y-=26*dt;}}
  texts=texts.filter(t=>t.life>0);

  /* --- camera + feel --- */
  const fx=P.x+Math.cos(P.a)*P.speed*0.22,fy=P.y+Math.sin(P.a)*P.speed*0.22;
  const tx=fx-W/2,ty=fy-H/2;
  cam.x+= (tx-cam.x)*Math.min(1,dt*6);
  cam.y+= (ty-cam.y)*Math.min(1,dt*6);
  cam.x=clamp(cam.x,0,Math.max(0,WORLD-W));
  cam.y=clamp(cam.y,0,Math.max(0,WORLD-H));
  trauma=Math.max(0,trauma-dt*1.4);
  if(state==='dead'){deadT+=dt;if(deadT>3)newGame();}
}
function turn(c,from,at){
  if(Math.random()>0.33)return;
  const nd=Math.random()<0.5?1:-1;
  if(from==='h'){
    if(c.y<10||c.y>WORLD-10)return;
    c.axis='v';c.road=at;c.dir=nd;c.x=at-nd*LANE;
    c.a=nd>0?Math.PI/2:-Math.PI/2;
  }else{
    if(c.x<10||c.x>WORLD-10)return;
    c.axis='h';c.road=at;c.dir=nd;c.y=at+nd*LANE;
    c.a=nd>0?0:Math.PI;
  }
}
function recycle(c){
  const far=rand(700,1300),ang=rand(0,TAU);
  let x=clamp(P.x+Math.cos(ang)*far,10,WORLD-10);
  let y=clamp(P.y+Math.sin(ang)*far,10,WORLD-10);
  const axis=Math.random()<0.5?'h':'v';
  const road=((Math.random()*N)|0)*BLOCK,dir=Math.random()<0.5?1:-1;
  c.axis=axis;c.dir=dir;c.road=road;c.hp=120;c.dead=false;
  if(axis==='h'){c.x=rand(0,WORLD);c.y=road+dir*LANE;c.a=dir>0?0:Math.PI;}
  else{c.x=road-dir*LANE;c.y=rand(0,WORLD);c.a=dir>0?Math.PI/2:-Math.PI/2;}
  c.speed=rand(110,180);
}

/* ================= RENDER ================= */
function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function drawGround(vx,vy,vw,vh){
  ctx.fillStyle='#242833';ctx.fillRect(vx,vy,vw,vh);
  const i0=Math.max(0,Math.floor((vx-ROAD/2)/BLOCK)),i1=Math.min(N-2,Math.ceil((vx+vw+ROAD/2)/BLOCK));
  const j0=Math.max(0,Math.floor((vy-ROAD/2)/BLOCK)),j1=Math.min(N-2,Math.ceil((vy+vh+ROAD/2)/BLOCK));
  ctx.fillStyle='#3b4150';
  for(let i=i0;i<=i1;i++)for(let j=j0;j<=j1;j++)
    ctx.fillRect(i*BLOCK+ROAD/2,j*BLOCK+ROAD/2,BLOCK-ROAD,BLOCK-ROAD);
  ctx.fillStyle='#14161c';
  for(let k=Math.max(0,Math.floor(vx/BLOCK));k<=Math.min(N-1,Math.ceil((vx+vw)/BLOCK));k++)
    ctx.fillRect(k*BLOCK-ROAD/2,vy,ROAD,vh);
  for(let k=Math.max(0,Math.floor(vy/BLOCK));k<=Math.min(N-1,Math.ceil((vy+vh)/BLOCK));k++)
    ctx.fillRect(vx,k*BLOCK-ROAD/2,vw,ROAD);
  ctx.fillStyle='rgba(250,200,60,0.55)';
  for(let k=Math.max(0,Math.floor(vx/BLOCK));k<=Math.min(N-1,Math.ceil((vx+vw)/BLOCK));k++)
    for(let y=Math.floor(vy/54)*54;y<vy+vh;y+=54)ctx.fillRect(k*BLOCK-2,y,4,26);
  for(let k=Math.max(0,Math.floor(vy/BLOCK));k<=Math.min(N-1,Math.ceil((vy+vh)/BLOCK));k++)
    for(let x=Math.floor(vx/54)*54;x<vx+vw;x+=54)ctx.fillRect(x,k*BLOCK-2,26,4);
}
function drawBuildings(vx,vy,vw,vh){
  const cx=cam.x+W/2,cy=cam.y+H/2;
  for(const b of buildings){
    if(b.x>vx+vw||b.x+b.w<vx||b.y>vy+vh||b.y+b.h<vy)continue;
    const ox=(b.x+b.w/2-cx)*0.05*(b.ht/45),oy=(b.y+b.h/2-cy)*0.05*(b.ht/45);
    ctx.fillStyle='rgba(0,0,0,0.35)';
    ctx.fillRect(b.x+6,b.y+10,b.w,b.h);
    ctx.fillStyle=b.face;
    ctx.fillRect(b.x,b.y,b.w,b.h);
    if(ox>0){ctx.fillStyle='#171a22';ctx.beginPath();
      ctx.moveTo(b.x+b.w,b.y);ctx.lineTo(b.x+b.w+ox,b.y+oy);
      ctx.lineTo(b.x+b.w+ox,b.y+b.h+oy);ctx.lineTo(b.x+b.w,b.y+b.h);ctx.fill();}
    if(ox<0){ctx.fillStyle='#171a22';ctx.beginPath();
      ctx.moveTo(b.x,b.y);ctx.lineTo(b.x+ox,b.y+oy);
      ctx.lineTo(b.x+ox,b.y+b.h+oy);ctx.lineTo(b.x,b.y+b.h);ctx.fill();}
    if(oy>0){ctx.fillStyle='#1b1f28';ctx.beginPath();
      ctx.moveTo(b.x,b.y+b.h);ctx.lineTo(b.x+ox,b.y+b.h+oy);
      ctx.lineTo(b.x+b.w+ox,b.y+b.h+oy);ctx.lineTo(b.x+b.w,b.y+b.h);ctx.fill();}
    if(oy<0){ctx.fillStyle='#1b1f28';ctx.beginPath();
      ctx.moveTo(b.x,b.y);ctx.lineTo(b.x+ox,b.y+oy);
      ctx.lineTo(b.x+b.w+ox,b.y+oy);ctx.lineTo(b.x+b.w,b.y);ctx.fill();}
    ctx.fillStyle='#2f3542';
    ctx.fillRect(b.x+ox,b.y+oy,b.w,b.h);
    ctx.strokeStyle=b.col;ctx.lineWidth=2.5;
    ctx.strokeRect(b.x+ox+1,b.y+oy+1,b.w-2,b.h-2);
    ctx.fillStyle='rgba(255,255,255,0.06)';
    ctx.fillRect(b.x+ox+6,b.y+oy+6,b.w-12,10);
    if(b.ht>50){ctx.fillStyle=b.col;ctx.globalAlpha=0.5;
      ctx.fillRect(b.x+ox+b.w/2-14,b.y+oy+b.h/2-3,28,6);ctx.globalAlpha=1;}
  }
}
function drawTree(t){
  ctx.fillStyle='rgba(0,0,0,0.3)';ctx.beginPath();ctx.ellipse(t.x+7,t.y+6,16,10,0,0,TAU);ctx.fill();
  ctx.strokeStyle='#7a5230';ctx.lineWidth=5;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(t.x,t.y);ctx.lineTo(t.x,t.y-24);ctx.stroke();
  ctx.strokeStyle='#2fbf71';ctx.lineWidth=6;
  for(let i=0;i<6;i++){const a=i*TAU/6+0.3;
    ctx.beginPath();ctx.moveTo(t.x,t.y-24);
    ctx.quadraticCurveTo(t.x+Math.cos(a)*13,t.y-24+Math.sin(a)*9,
      t.x+Math.cos(a)*24,t.y-24+Math.sin(a)*18);ctx.stroke();}
}
function drawCar(c){
  ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.a);
  ctx.fillStyle='rgba(0,0,0,0.4)';rr(-c.l/2+4,-c.w/2+6,c.l,c.w,7);ctx.fill();
  ctx.fillStyle=c.kind==='cop'?'#e8eef7':c.col;
  rr(-c.l/2,-c.w/2,c.l,c.w,7);ctx.fill();
  ctx.fillStyle='rgba(15,18,26,0.85)';
  rr(-c.l/2+13,-c.w/2+4,17,c.w-8,4);ctx.fill();
  rr(c.l/2-24,-c.w/2+4,12,c.w-8,4);ctx.fill();
  ctx.fillStyle='#fff9c4';ctx.fillRect(c.l/2-5,-c.w/2+3,4,6);ctx.fillRect(c.l/2-5,c.w/2-9,4,6);
  ctx.fillStyle='#ef4444';ctx.fillRect(-c.l/2+1,-c.w/2+3,4,6);ctx.fillRect(-c.l/2+1,c.w/2-9,4,6);
  if(c.kind==='cop'){
    const on=Math.floor(tGlobal*8)%2===0;
    ctx.fillStyle=on?'#ef4444':'#3b82f6';ctx.fillRect(-4,-c.w/2+2,9,6);
    ctx.fillStyle=on?'#3b82f6':'#ef4444';ctx.fillRect(-4,c.w/2-8,9,6);
    ctx.fillStyle='#0f172a';ctx.fillRect(-2,-c.w/2,4,c.w);
    ctx.strokeStyle='#38bdf8';ctx.lineWidth=2;rr(-c.l/2,-c.w/2,c.l,c.w,7);ctx.stroke();
  }
  if(c.hp<50){ctx.fillStyle='rgba(60,60,70,0.6)';ctx.beginPath();
    ctx.arc(0,0,10+Math.sin(tGlobal*10)*3,0,TAU);ctx.fill();}
  ctx.restore();
}
function drawPed(p){
  const bob=Math.sin(p.ph)*2.2;
  if(p.dead){
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);
    ctx.globalAlpha=clamp(p.fade/3,0,1);
    ctx.fillStyle='#7f1d1d';ctx.beginPath();ctx.ellipse(0,0,17,9,0,0,TAU);ctx.fill();
    ctx.fillStyle=p.col;ctx.beginPath();ctx.ellipse(0,0,13,7,0,0,TAU);ctx.fill();
    ctx.globalAlpha=1;ctx.restore();return;
  }
  ctx.save();ctx.translate(p.x,p.y);
  ctx.fillStyle='rgba(0,0,0,0.35)';ctx.beginPath();ctx.ellipse(3,5,11,7,0,0,TAU);ctx.fill();
  ctx.rotate(p.a);
  ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(0,bob*0.3,9,0,TAU);ctx.fill();
  ctx.fillStyle=p.skin;ctx.beginPath();ctx.arc(3,bob*0.3,5.4,0,TAU);ctx.fill();
  ctx.restore();
}
function drawPlayer(){
  ctx.save();ctx.translate(P.x,P.y);
  ctx.fillStyle='rgba(0,0,0,0.4)';ctx.beginPath();ctx.ellipse(4,6,13,8,0,0,TAU);ctx.fill();
  ctx.rotate(P.a);
  const bob=Math.sin(P.walk)*2.4;
  if(P.hurt>0&&Math.floor(tGlobal*20)%2===0)ctx.globalAlpha=0.5;
  ctx.fillStyle='#111827';ctx.fillRect(-3,-9,10,18);
  ctx.fillStyle='#ff4fa3';ctx.beginPath();ctx.arc(0,bob*0.4,11,0,TAU);ctx.fill();
  ctx.fillStyle='#f2c9a0';ctx.beginPath();ctx.arc(3,bob*0.4,6.4,0,TAU);ctx.fill();
  ctx.fillStyle='#0f172a';ctx.fillRect(7,-2.5,16,5);
  ctx.fillStyle='#fbbf24';ctx.fillRect(21,-2,4,4);
  ctx.globalAlpha=1;ctx.restore();
}
function drawPackage(pk){
  const s=1+Math.sin(tGlobal*4+pk.x)*0.18;
  ctx.save();ctx.translate(pk.x,pk.y);ctx.scale(s,s);
  ctx.fillStyle='rgba(255,79,163,0.22)';ctx.beginPath();ctx.arc(0,0,22,0,TAU);ctx.fill();
  ctx.rotate(Math.PI/4);ctx.fillStyle='#ff4fa3';ctx.fillRect(-9,-9,18,18);
  ctx.fillStyle='#ffe4f0';ctx.fillRect(-3,-9,6,18);ctx.fillRect(-9,-3,18,6);
  ctx.restore();
}
function render(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle='#0b0d12';ctx.fillRect(0,0,W,H);
  const sh=trauma*trauma,shx=rand(-1,1)*sh*17,shy=rand(-1,1)*sh*17;
  ctx.save();ctx.translate(-cam.x+shx,-cam.y+shy);
  const vx=cam.x-80,vy=cam.y-80,vw=W+160,vh=H+160;
  drawGround(vx,vy,vw,vh);
  drawBuildings(vx,vy,vw,vh);
  for(const t of trees)if(t.x>vx&&t.x<vx+vw&&t.y>vy&&t.y<vy+vh)drawTree(t);
  for(const pk of packages)if(!pk.got&&pk.x>vx&&pk.x<vx+vw&&pk.y>vy&&pk.y<vy+vh)drawPackage(pk);
  for(const p of peds)if(p.x>vx-30&&p.x<vx+vw+30&&p.y>vy-30&&p.y<vy+vh+30)drawPed(p);
  for(const c of cars)if(!c.dead&&c.x>vx-60&&c.x<vx+vw+60&&c.y>vy-60&&c.y<vy+vh+60)drawCar(c);
  if(!P.inCar&&state!=='dead')drawPlayer();
  for(const b of bullets){
    ctx.strokeStyle=b.from==='p'?'#ffe066':'#60a5fa';ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(b.x-b.vx*0.014,b.y-b.vy*0.014);ctx.stroke();
  }
  for(const p of parts){
    const a=clamp(p.life/p.max,0,1);
    ctx.globalAlpha=a;
    if(p.ring){ctx.strokeStyle=p.col;ctx.lineWidth=8*a;ctx.beginPath();
      ctx.arc(p.x,p.y,(1-a)*90+10,0,TAU);ctx.stroke();}
    else{ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.sz*a+1,0,TAU);ctx.fill();}
    ctx.globalAlpha=1;
  }
  ctx.textAlign='center';
  for(const t of texts){
    if(t.ui)continue;
    ctx.globalAlpha=clamp(t.life/t.max,0,1);
    ctx.font='bold 17px Trebuchet MS';ctx.fillStyle='#000';
    ctx.fillText(t.txt,t.x+1,t.y+1);ctx.fillStyle=t.col;ctx.fillText(t.txt,t.x,t.y);
    ctx.globalAlpha=1;
  }
  ctx.restore();
  drawHUD();
}
function drawHUD(){
  ctx.textAlign='left';
  // money / hp
  ctx.font='bold 30px Trebuchet MS';ctx.fillStyle='#4ade80';
  ctx.fillText('$'+P.money.toLocaleString(),18,40);
  ctx.fillStyle='rgba(0,0,0,0.55)';rr(18,52,210,17,8);ctx.fill();
  const col=P.hp>55?'#4ade80':P.hp>25?'#fbbf24':'#ef4444';
  ctx.fillStyle=col;rr(20,54,206*clamp(P.hp/100,0,1),13,6);ctx.fill();
  ctx.font='bold 12px Trebuchet MS';ctx.fillStyle='#0b0d12';
  ctx.fillText('HEALTH',26,65);
  // wanted
  ctx.textAlign='right';ctx.font='26px Trebuchet MS';
  for(let i=0;i<5;i++){
    ctx.fillStyle=i<P.wanted?(Math.floor(tGlobal*6)%2===0?'#fbbf24':'#f59e0b'):'rgba(255,255,255,0.18)';
    ctx.fillText('★',W-18-i*27,42);
  }
  // objective
  ctx.font='bold 15px Trebuchet MS';ctx.fillStyle='#ff4fa3';
  ctx.fillText('PACKAGES '+got+'/'+total,W-18,66);
  // speedo
  if(P.inCar){
    ctx.font='bold 44px Trebuchet MS';ctx.fillStyle='rgba(255,255,255,0.9)';
    ctx.fillText(Math.round(Math.abs(P.speed)*0.16)+' km/h',W-18,H-28);
    ctx.font='13px Trebuchet MS';ctx.fillStyle='#38bdf8';
    ctx.fillText('HULL '+Math.max(0,Math.round(P.inCar.hp))+'%',W-18,H-56);
  }
  // toasts
  ctx.textAlign='center';
  let ty=H*0.22;
  for(const t of texts){
    if(!t.ui)continue;
    const a=clamp(t.life/Math.min(1,t.max),0,1);
    ctx.globalAlpha=a;
    ctx.font='bold 34px Trebuchet MS';
    ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillText(t.txt,W/2+2,ty+2);
    ctx.fillStyle=t.col;ctx.fillText(t.txt,W/2,ty);
    ctx.globalAlpha=1;ty+=44;
  }
  minimap();
  // crosshair
  ctx.strokeStyle='rgba(255,255,255,0.85)';ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(mouse.x,mouse.y,9,0,TAU);ctx.stroke();
  ctx.beginPath();ctx.moveTo(mouse.x-14,mouse.y);ctx.lineTo(mouse.x-4,mouse.y);
  ctx.moveTo(mouse.x+4,mouse.y);ctx.lineTo(mouse.x+14,mouse.y);
  ctx.moveTo(mouse.x,mouse.y-14);ctx.lineTo(mouse.x,mouse.y-4);
  ctx.moveTo(mouse.x,mouse.y+4);ctx.lineTo(mouse.x,mouse.y+14);ctx.stroke();
  if(helpT>0)help();
  if(state==='pause'){ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,0,W,H);
    ctx.font='bold 54px Trebuchet MS';ctx.fillStyle='#fff';ctx.textAlign='center';
    ctx.fillText('PAUSED',W/2,H/2);}
  if(state==='dead'){
    const a=clamp(deadT/0.6,0,1);
    ctx.fillStyle='rgba(80,0,10,'+(0.55*a)+')';ctx.fillRect(0,0,W,H);
    ctx.globalAlpha=a;ctx.font='bold 84px Trebuchet MS';ctx.fillStyle='#ef4444';
    ctx.textAlign='center';ctx.fillText('WASTED',W/2,H/2);
    ctx.font='20px Trebuchet MS';ctx.fillStyle='#fff';
    ctx.fillText('-$200 hospital bill · press R',W/2,H/2+52);
    ctx.globalAlpha=1;
  }
}
function minimap(){
  const s=168,m=W-190,my=H-190,k=s/WORLD;
  ctx.fillStyle='rgba(6,8,14,0.82)';rr(m-8,my-8,s+16,s+16,10);ctx.fill();
  ctx.strokeStyle='rgba(255,79,163,0.6)';ctx.lineWidth=2;rr(m-8,my-8,s+16,s+16,10);ctx.stroke();
  ctx.save();ctx.beginPath();ctx.rect(m,my,s,s);ctx.clip();
  ctx.fillStyle='#14161c';ctx.fillRect(m,my,s,s);
  ctx.fillStyle='#333a48';
  for(let i=0;i<N-1;i++)for(let j=0;j<N-1;j++)
    ctx.fillRect(m+(i*BLOCK+ROAD/2)*k,my+(j*BLOCK+ROAD/2)*k,(BLOCK-ROAD)*k,(BLOCK-ROAD)*k);
  ctx.fillStyle='rgba(120,140,170,0.5)';
  for(let i=0;i<N;i++){ctx.fillRect(m+i*BLOCK*k-ROAD*k/2,my,ROAD*k,s);
    ctx.fillRect(m,my+i*BLOCK*k-ROAD*k/2,s,ROAD*k);}
  for(const pk of packages)if(!pk.got){ctx.fillStyle='#ff4fa3';
    ctx.fillRect(m+pk.x*k-2,my+pk.y*k-2,5,5);}
  for(const c of cars)if(c.ctrl==='cop'){ctx.fillStyle='#3b82f6';
    ctx.fillRect(m+c.x*k-2,my+c.y*k-2,4,4);}
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(m+P.x*k,my+P.y*k,4,0,TAU);ctx.fill();
  ctx.strokeStyle='#fbbf24';ctx.lineWidth=2;ctx.beginPath();
  ctx.moveTo(m+P.x*k,my+P.y*k);
  ctx.lineTo(m+(P.x+Math.cos(P.a)*40)*k,my+(P.y+Math.sin(P.a)*40)*k);ctx.stroke();
  ctx.restore();
  ctx.font='11px Trebuchet MS';ctx.fillStyle='#94a3b8';ctx.textAlign='left';
  ctx.fillText('VICE COAST',m,my-14);
}
function help(){
  const lines=['VICE COAST — NEON CITY',
    'WASD / ARROWS   drive · move','MOUSE   aim     ·     CLICK / SPACE   fire',
    'E   hijack or leave vehicle','SHIFT   sprint     ·     P   pause     ·     H   toggle help',
    'Goal: grab all 12 neon packages. Cops respond to crime — 5★ is a bad night.'];
  ctx.textAlign='center';
  const w=Math.min(720,W-40);
  ctx.fillStyle='rgba(6,8,14,0.82)';rr(W/2-w/2,H-196,w,146,12);ctx.fill();
  ctx.strokeStyle='rgba(56,189,248,0.6)';ctx.lineWidth=2;rr(W/2-w/2,H-196,w,146,12);ctx.stroke();
  ctx.font='bold 20px Trebuchet MS';ctx.fillStyle='#38bdf8';
  ctx.fillText(lines[0],W/2,H-166);
  ctx.font='15px Trebuchet MS';ctx.fillStyle='#e2e8f0';
  for(let i=1;i<lines.length;i++)ctx.fillText(lines[i],W/2,H-138+(i-1)*24);
}

/* ================= LOOP ================= */
let last=performance.now();
function frame(now){
  let dt=(now-last)/1000;last=now;
  if(dt>0.05)dt=0.05;
  if(state!=='pause')upd(dt);
  render();
  requestAnimationFrame(frame);
}
newGame();
requestAnimationFrame(frame);
</script>
