<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Flux · Todo Calendar</title>
<style>
  /* ---------- design tokens ---------- */
  *,*::before,*::after{box-sizing:border-box}
  :root{
    color-scheme:light;
    --bg:#f5f6fb; --card:#ffffff; --card-2:#f8f9fd;
    --text:#151726; --muted:#676c80; --faint:#9aa0b8;
    --line:#e8eaf3;
    --accent:#5b5ef0; --accent-soft:#eeeefe; --on-accent:#ffffff;
    --high:#e5484d; --medium:#e2a336; --low:#2f9e6e;
    --danger:#e5484d;
    --shadow:0 1px 2px rgba(21,23,38,.05), 0 16px 40px -18px rgba(21,23,38,.25);
    --radius:18px;
  }
  html[data-theme="dark"]{
    color-scheme:dark;
    --bg:#0e1016; --card:#161923; --card-2:#1b1f2b;
    --text:#eef0f8; --muted:#9ba2ba; --faint:#6b7290;
    --line:#262b3a;
    --accent:#8f92ff; --accent-soft:#242741; --on-accent:#12131c;
    --high:#ff6b6b; --medium:#f0b429; --low:#5ad19a;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 20px 44px -20px rgba(0,0,0,.75);
  }
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font:15px/1.5 ui-sans-serif,-apple-system,"Segoe UI",Inter,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer;background:none;border:0}
  h1,h2,h3,p{margin:0}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  .app{max-width:1180px;margin:0 auto;padding:22px clamp(14px,3vw,28px) 56px}

  /* ---------- top bar ---------- */
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:20px}
  .brand{display:flex;align-items:center;gap:12px;min-width:0}
  .mark{width:40px;height:40px;border-radius:13px;flex:none;display:grid;place-items:center;
    background:linear-gradient(135deg,var(--accent),#8b7cf8);color:#fff;font-weight:800;font-size:17px;
    box-shadow:0 8px 18px -8px rgba(91,94,240,.8)}
  .brand h1{font-size:18px;letter-spacing:-.4px}
  .note{font-size:12.5px;color:var(--muted)}
  .note.warn{color:var(--danger);font-weight:600}
  .actions{display:flex;gap:9px;flex-wrap:wrap}

  /* ---------- buttons ---------- */
  .btn{min-height:42px;padding:9px 16px;border-radius:12px;border:1px solid var(--line);
    background:var(--card);font-weight:600;font-size:14px;transition:background .15s,transform .1s,filter .15s}
  .btn:hover{background:var(--card-2)}
  .btn:active{transform:translateY(1px)}
  .btn.primary{background:var(--accent);border-color:transparent;color:var(--on-accent)}
  .btn.primary:hover{filter:brightness(1.07);background:var(--accent)}
  .btn.ghost{background:transparent}
  .btn.danger{color:var(--danger)}
  .icon-btn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--card);
    display:grid;place-items:center;font-size:17px;transition:background .15s,transform .1s}
  .icon-btn:hover{background:var(--card-2)}
  .icon-btn:active{transform:translateY(1px)}

  /* ---------- layout ---------- */
  .layout{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(320px,.9fr);gap:18px;align-items:start}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:20px}
  .side{display:flex;flex-direction:column;gap:18px}
  .eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}

  /* ---------- calendar ---------- */
  .cal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
  .month-label{font-size:19px;font-weight:750;letter-spacing:-.4px}
  .weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:7px}
  .weekdays span{text-align:center;font-size:11.5px;font-weight:700;color:var(--faint);
    text-transform:uppercase;letter-spacing:.07em}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .cell{aspect-ratio:1/1;border-radius:14px;border:1px solid transparent;background:transparent;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
    transition:background .15s,transform .12s,border-color .15s;position:relative}
  .cell:hover{background:var(--accent-soft)}
  .cell .num{font-size:14px;font-weight:600;line-height:1}
  .cell.other .num{color:var(--faint);opacity:.65}
  .cell.today{border-color:var(--accent);background:var(--accent-soft)}
  .cell.today .num{color:var(--accent);font-weight:800}
  .cell.selected{background:var(--accent);border-color:var(--accent);box-shadow:0 8px 18px -10px rgba(91,94,240,.9)}
  .cell.selected .num{color:var(--on-accent);font-weight:800}
  .cell.all-done:not(.selected) .num{color:var(--low)}
  .cell:active{transform:scale(.95)}
  .dots{display:flex;gap:3px;height:6px;align-items:center}
  .dot{width:6px;height:6px;border-radius:50%;display:inline-block;flex:none}
  .dot.p-high{background:var(--high)} .dot.p-medium{background:var(--medium)} .dot.p-low{background:var(--low)}
  .dot.is-done{background:transparent;box-shadow:inset 0 0 0 1.5px var(--faint)}
  .cell.selected .dot.is-done{box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.75)}
  .legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line);
    font-size:12px;color:var(--muted)}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .grid.slide-r{animation:slideR .22s ease} .grid.slide-l{animation:slideL .22s ease}
  @keyframes slideR{from{opacity:.3;transform:translateX(14px)}to{opacity:1;transform:none}}
  @keyframes slideL{from{opacity:.3;transform:translateX(-14px)}to{opacity:1;transform:none}}

  /* ---------- day panel ---------- */
  .day-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:12px}
  .day-title{font-size:21px;font-weight:750;letter-spacing:-.5px;margin-top:2px}
  .count-pill{font-size:12.5px;font-weight:700;color:var(--accent);background:var(--accent-soft);
    padding:5px 11px;border-radius:999px;white-space:nowrap}
  .filters{display:flex;gap:7px;margin-bottom:14px;flex-wrap:wrap}
  .chip{padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--card-2);
    font-size:13px;font-weight:600;color:var(--muted);transition:.15s;min-height:34px}
  .chip:hover{border-color:var(--accent);color:var(--text)}
  .chip.active{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
  .chip span{opacity:.75;font-weight:700}

  .task-list{list-style:none;margin:0;padding:0 2px 0 0;display:flex;flex-direction:column;gap:9px;
    max-height:46vh;overflow-y:auto;scrollbar-width:thin}
  .task{display:flex;gap:11px;align-items:flex-start;padding:12px;border:1px solid var(--line);
    border-radius:14px;background:var(--card-2);transition:border-color .15s,transform .15s,opacity .15s}
  .task:hover{border-color:var(--accent);transform:translateY(-1px)}
  .task.done{opacity:.65}
  .task.done .t-title{text-decoration:line-through;color:var(--faint)}
  .check{position:relative;display:grid;place-items:center;min-width:38px;min-height:38px;margin:-8px 0 -8px -8px}
  .check input{position:absolute;opacity:0;width:22px;height:22px;margin:0;cursor:pointer}
  .box{width:22px;height:22px;border:2px solid var(--line);border-radius:8px;background:var(--card);
    display:grid;place-items:center;transition:.16s;pointer-events:none}
  .box::after{content:"\2713";font-size:13px;font-weight:800;color:var(--on-accent);transform:scale(0);transition:transform .16s cubic-bezier(.3,1.6,.5,1)}
  .check input:checked + .box{background:var(--accent);border-color:var(--accent)}
  .check input:checked + .box::after{transform:scale(1)}
  .check input:focus-visible + .box{outline:2px solid var(--accent);outline-offset:2px}
  .check input:hover + .box{border-color:var(--accent)}
  .t-body{flex:1;min-width:0}
  .t-title{font-weight:650;font-size:14.5px;word-break:break-word}
  .t-meta{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-top:5px;font-size:12.5px;color:var(--muted)}
  .t-time{font-variant-numeric:tabular-nums;font-weight:650;color:var(--text)}
  .t-time.none{color:var(--faint);font-weight:500}
  .badge{font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
    padding:3px 7px;border-radius:6px}
  .badge.high{background:color-mix(in srgb,var(--high) 14%,transparent);color:var(--high)}
  .badge.medium{background:color-mix(in srgb,var(--medium) 16%,transparent);color:var(--medium)}
  .badge.low{background:color-mix(in srgb,var(--low) 14%,transparent);color:var(--low)}
  .t-notes{flex-basis:100%;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
    overflow:hidden;color:var(--muted);font-size:12.5px}
  .row-actions{display:flex;gap:3px;opacity:0;transition:opacity .15s}
  .task:hover .row-actions,.task:focus-within .row-actions{opacity:1}
  .mini{width:34px;height:34px;border-radius:9px;font-size:14px;display:grid;place-items:center;
    color:var(--muted);transition:.14s}
  .mini:hover{background:var(--card);color:var(--text);box-shadow:0 2px 8px -4px rgba(0,0,0,.3)}
  .mini[data-act="delete"]:hover{color:var(--danger)}
  @media (hover:none){.row-actions{opacity:1}}

  .empty{text-align:center;padding:26px 14px 20px}
  .empty-art{width:64px;height:64px;margin:0 auto 12px;color:var(--faint);opacity:.85}
  .empty-title{font-weight:750;font-size:16px}
  .empty-text{color:var(--muted);font-size:13.5px;margin-top:5px;margin-bottom:15px}

  /* ---------- stats ---------- */
  .stats-card{display:flex;gap:20px;align-items:center}
  .ring-wrap{position:relative;width:118px;height:118px;flex:none}
  .ring{width:100%;height:100%;transform:rotate(-90deg)}
  .ring circle{fill:none;stroke-width:11;stroke-linecap:round}
  .ring-bg{stroke:var(--card-2)}
  .ring-fg{stroke:var(--accent);transition:stroke-dashoffset .6s cubic-bezier(.4,0,.2,1)}
  .ring-label{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
  .ring-label strong{font-size:22px;font-weight:800;letter-spacing:-.6px}
  .ring-label span{font-size:11px;color:var(--faint);font-weight:600}
  .stats-text{min-width:0}
  .stat-line{font-size:14.5px;color:var(--muted);margin-top:4px}
  .stat-line b{color:var(--text);font-weight:750}
  .stat-sub{font-size:13px;color:var(--accent);font-weight:650;margin-top:3px}
  .mini-stats{display:flex;gap:20px;margin-top:13px}
  .mini-stats div{display:flex;flex-direction:column}
  .mini-stats span{font-size:19px;font-weight:800;letter-spacing:-.4px}
  .mini-stats label{font-size:11.5px;color:var(--faint);font-weight:600}

  /* ---------- modal ---------- */
  .backdrop{position:fixed;inset:0;background:rgba(10,12,22,.55);backdrop-filter:blur(5px);
    display:grid;place-items:center;padding:18px;z-index:50;animation:fade .18s ease}
  .modal{width:min(470px,100%);max-height:92vh;overflow-y:auto;background:var(--card);border:1px solid var(--line);
    border-radius:22px;padding:22px;box-shadow:var(--shadow);animation:pop .22s cubic-bezier(.3,1.3,.5,1)}
  .modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
  .modal-head h3{font-size:17.5px;font-weight:750;letter-spacing:-.3px}
  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
  .field > span{font-size:12.5px;font-weight:700;color:var(--muted)}
  .field > span i{font-style:normal;font-weight:500;color:var(--faint)}
  .field input,.field select,.field textarea{
    width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:var(--card-2);
    transition:border-color .15s,box-shadow .15s;font-size:14.5px;min-height:44px}
  .field textarea{min-height:74px;resize:vertical}
  .field input:focus,.field select:focus,.field textarea:focus{
    outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
  .field input.invalid{border-color:var(--danger)}
  .err{font-style:normal;font-size:12.5px;color:var(--danger);font-weight:650}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .modal-foot{display:flex;gap:9px;align-items:center;margin-top:18px}
  .modal-foot .spacer{flex:1}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes pop{from{opacity:0;transform:scale(.96) translateY(10px)}to{opacity:1;transform:none}}
  body.modal-open{overflow:hidden}

  /* ---------- toast + fab ---------- */
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:60;
    display:flex;gap:16px;align-items:center;background:var(--text);color:var(--bg);
    padding:12px 18px;border-radius:13px;font-weight:650;font-size:14px;box-shadow:var(--shadow);
    animation:toastIn .26s cubic-bezier(.3,1.3,.5,1);max-width:calc(100vw - 32px)}
  .toast button{color:inherit;font-weight:800;text-decoration:underline;opacity:.85;padding:4px}
  .toast button:hover{opacity:1}
  @keyframes toastIn{from{opacity:0;transform:translate(-50%,16px)}to{opacity:1;transform:translate(-50%,0)}}
  .fab{display:none}
  noscript p{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;
    color:var(--muted);text-align:center}

  /* ---------- responsive ---------- */
  @media (max-width:960px){
    .layout{grid-template-columns:1fr}
    .task-list{max-height:none}
  }
  @media (max-width:560px){
    .app{padding-bottom:96px}
    .actions .btn.primary{display:none}
    .fab{display:grid;place-items:center;position:fixed;right:18px;bottom:18px;width:58px;height:58px;
      border-radius:50%;background:var(--accent);color:var(--on-accent);font-size:27px;border:0;
      box-shadow:0 14px 28px -10px rgba(91,94,240,.85);z-index:40;transition:transform .14s}
    .fab:active{transform:scale(.93)}
    .stats-card{flex-direction:column;text-align:center}
    .mini-stats{justify-content:center}
    .row{grid-template-columns:1fr}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
  }
</style>
</head>
<body>
<div class="app">
  <!-- top bar -->
  <header class="topbar">
    <div class="brand">
      <div class="mark" aria-hidden="true">✓</div>
      <div>
        <h1>Flux Todo Calendar</h1>
        <p class="note" id="storageNote">Saved on this device · works offline</p>
      </div>
    </div>
    <div class="actions">
      <button class="btn ghost" id="todayBtn" type="button">Today</button>
      <button class="icon-btn" id="themeBtn" type="button" aria-label="Switch theme">🌙</button>
      <button class="btn primary" id="newBtn" type="button">＋ New task</button>
    </div>
  </header>

  <noscript><p>This app needs JavaScript enabled to run.</p></noscript>

  <main class="layout">
    <!-- calendar -->
    <section class="card" aria-label="Calendar">
      <div class="cal-head">
        <button class="icon-btn" id="prevBtn" type="button" aria-label="Previous month">‹</button>
        <h2 class="month-label" id="monthLabel"></h2>
        <button class="icon-btn" id="nextBtn" type="button" aria-label="Next month">›</button>
      </div>
      <div class="weekdays" aria-hidden="true">
        <span>Su</span><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span>
      </div>
      <div class="grid" id="grid" role="group" aria-label="Day picker — use arrow keys"></div>
      <div class="legend">
        <span><i class="dot p-high"></i>High</span>
        <span><i class="dot p-medium"></i>Medium</span>
        <span><i class="dot p-low"></i>Low</span>
        <span><i class="dot is-done"></i>Done</span>
      </div>
    </section>

    <aside class="side">
      <!-- selected day -->
      <section class="card" aria-label="Tasks for selected day">
        <div class="day-head">
          <div>
            <p class="eyebrow" id="dayEyebrow">Today</p>
            <h3 class="day-title" id="dayTitle"></h3>
          </div>
          <span class="count-pill" id="dayCount"></span>
        </div>
        <div class="filters" role="group" aria-label="Filter tasks">
          <button class="chip active" type="button" data-filter="all">All <span id="cAll">0</span></button>
          <button class="chip" type="button" data-filter="active">Active <span id="cActive">0</span></button>
          <button class="chip" type="button" data-filter="done">Done <span id="cDone">0</span></button>
        </div>
        <ul class="task-list" id="taskList"></ul>
        <div class="empty" id="empty" hidden>
          <svg class="empty-art" viewBox="0 0 64 64" aria-hidden="true">
            <rect x="8" y="13" width="48" height="43" rx="8" fill="none" stroke="currentColor" stroke-width="3"/>
            <path d="M8 25h48M20 8v9M44 8v9" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
            <path d="M24 41l6 6 12-13" fill="none" stroke="currentColor" stroke-width="3"
                  stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <p class="empty-title" id="emptyTitle">Nothing planned</p>
          <p class="empty-text" id="emptyText"></p>
          <button class="btn primary" id="emptyBtn" type="button">Add a task</button>
        </div>
      </section>

      <!-- month stats -->
      <section class="card stats-card" aria-label="Month progress">
        <div class="ring-wrap">
          <svg class="ring" viewBox="0 0 120 120" aria-hidden="true">
            <circle class="ring-bg" cx="60" cy="60" r="52"></circle>
            <circle class="ring-fg" id="ringFg" cx="60" cy="60" r="52"></circle>
          </svg>
          <div class="ring-label"><strong id="pctLabel">0%</strong><span>this month</span></div>
        </div>
        <div class="stats-text">
          <p class="eyebrow">Month progress</p>
          <p class="stat-line"><b id="statDone">0</b> of <b id="statTotal">0</b> tasks done</p>
          <p class="stat-sub" id="statSub">—</p>
          <div class="mini-stats">
            <div><span id="mHigh">0</span><label>high priority left</label></div>
            <div><span id="mDays">0</span><label>active days</label></div>
          </div>
        </div>
      </section>
    </aside>
  </main>
</div>

<button class="fab" id="fab" type="button" aria-label="New task">＋</button>

<!-- add / edit modal -->
<div class="backdrop" id="backdrop" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-head">
      <h3 id="modalTitle">New task</h3>
      <button class="icon-btn" id="closeBtn" type="button" aria-label="Close dialog">✕</button>
    </div>
    <form id="taskForm" novalidate>
      <label class="field">
        <span>Title</span>
        <input id="fTitle" type="text" maxlength="120" placeholder="What needs doing?" autocomplete="off" required>
        <em class="err" id="titleErr" hidden>Give your task a title.</em>
      </label>
      <div class="row">
        <label class="field"><span>Date</span><input id="fDate" type="date" required></label>
        <label class="field"><span>Time <i>(optional)</i></span><input id="fTime" type="time"></label>
      </div>
      <label class="field">
        <span>Priority</span>
        <select id="fPriority">
          <option value="high">High</option>
          <option value="medium" selected>Medium</option>
          <option value="low">Low</option>
        </select>
      </label>
      <label class="field">
        <span>Notes <i>(optional)</i></span>
        <textarea id="fNotes" rows="3" maxlength="400" placeholder="Add details, links, context…"></textarea>
      </label>
      <div class="modal-foot">
        <button class="btn ghost danger" id="deleteBtn" type="button" hidden>Delete</button>
        <div class="spacer"></div>
        <button class="btn ghost" id="cancelBtn" type="button">Cancel</button>
        <button class="btn primary" type="submit">Save task</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden>
  <span id="toastMsg"></span>
  <button id="toastAction" type="button" hidden>Undo</button>
</div>

<script>
'use strict';
/* ============ helpers ============ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));

const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const MONTHS_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const TASKS_KEY = 'flux.tasks.v1';
const THEME_KEY = 'flux.theme.v1';

const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parseYmd = s => { const p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const monthStart = d => new Date(d.getFullYear(), d.getMonth(), 1);
const sameDay = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
const today = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
const uid = () => (window.crypto && crypto.randomUUID)
  ? crypto.randomUUID()
  : 'id-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
// escape user text before it goes into innerHTML (blocks injection)
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ============ state ============ */
const state = {
  tasks: [],
  view: monthStart(today()),
  selected: ymd(today()),
  filter: 'all',
  editingId: null,
  storageOk: true,
  lastFocus: null
};

const el = {
  grid: $('#grid'), monthLabel: $('#monthLabel'),
  dayEyebrow: $('#dayEyebrow'), dayTitle: $('#dayTitle'), dayCount: $('#dayCount'),
  taskList: $('#taskList'), empty: $('#empty'), emptyTitle: $('#emptyTitle'),
  emptyText: $('#emptyText'), emptyBtn: $('#emptyBtn'),
  cAll: $('#cAll'), cActive: $('#cActive'), cDone: $('#cDone'),
  ringFg: $('#ringFg'), pctLabel: $('#pctLabel'),
  statDone: $('#statDone'), statTotal: $('#statTotal'), statSub: $('#statSub'),
  mHigh: $('#mHigh'), mDays: $('#mDays'),
  backdrop: $('#backdrop'), form: $('#taskForm'), modalTitle: $('#modalTitle'),
  fTitle: $('#fTitle'), fDate: $('#fDate'), fTime: $('#fTime'),
  fPriority: $('#fPriority'), fNotes: $('#fNotes'), titleErr: $('#titleErr'),
  deleteBtn: $('#deleteBtn'), toast: $('#toast'), toastMsg: $('#toastMsg'),
  toastAction: $('#toastAction'), storageNote: $('#storageNote'), themeBtn: $('#themeBtn')
};

/* ============ persistence ============ */
function seed() {
  const t = today();
  const d = n => ymd(addDays(t, n));
  const now = Date.now();
  return [
    { id: uid(), title: 'Plan the week',        date: d(0), time: '09:30', priority: 'high',   notes: 'Pick the top 3 outcomes.', done: false, created: now },
    { id: uid(), title: 'Design sync',          date: d(0), time: '14:00', priority: 'medium', notes: '',                          done: false, created: now },
    { id: uid(), title: 'Workout',              date: d(0), time: '18:30', priority: 'low',    notes: '',                          done: true,  created: now },
    { id: uid(), title: 'Send invoice',         date: d(1), time: '',      priority: 'high',   notes: '',                          done: false, created: now },
    { id: uid(), title: 'Groceries',            date: d(2), time: '17:00', priority: 'medium', notes: 'Veggies, fruit, coffee.',    done: false, created: now },
    { id: uid(), title: 'Call family',          date: d(3), time: '20:00', priority: 'low',    notes: '',                          done: false, created: now },
    { id: uid(), title: 'Inbox zero',           date: d(-1),time: '11:00', priority: 'medium', notes: '',                          done: true,  created: now }
  ];
}
function loadTasks() {
  try {
    const raw = localStorage.getItem(TASKS_KEY);
    if (raw === null) { state.tasks = seed(); saveTasks(); return; }   // first run: friendly sample data
    const data = JSON.parse(raw);
    state.tasks = Array.isArray(data)
      ? data.filter(t => t && typeof t.title === 'string' && typeof t.date === 'string')
      : [];
  } catch (e) {
    state.storageOk = false;   // corrupt or blocked storage → start empty, warn user
    state.tasks = [];
  }
}
function saveTasks() {
  try { localStorage.setItem(TASKS_KEY, JSON.stringify(state.tasks)); state.storageOk = true; }
  catch (e) { state.storageOk = false; }   // private mode / quota → session-only, say so
  renderNote();
}
function renderNote() {
  el.storageNote.textContent = state.storageOk
    ? 'Saved on this device · works offline'
    : 'Storage blocked — changes last for this session only';
  el.storageNote.classList.toggle('warn', !state.storageOk);
}

/* ============ data helpers ============ */
const tasksOn = key => state.tasks.filter(t => t.date === key);
function sortTasks(list) {
  return list.slice().sort((a, b) => {
    const ta = a.time || '99:99', tb = b.time || '99:99';
    if (ta !== tb) return ta < tb ? -1 : 1;            // timed first, ascending
    if (!!a.done !== !!b.done) return a.done ? 1 : -1; // pending before done
    return (a.created || 0) - (b.created || 0);
  });
}

/* ============ render: calendar ============ */
function renderCalendar() {
  const y = state.view.getFullYear(), m = state.view.getMonth();
  el.monthLabel.textContent = MONTHS[m] + ' ' + y;
  const offset = new Date(y, m, 1).getDay();
  const daysInMonth = new Date(y, m + 1, 0).getDate();
  const prevDays = new Date(y, m, 0).getDate();
  const now = today();
  let html = '';
  for (let i = 0; i < 42; i++) {                       // fixed 6-week grid, no layout jumps
    let date, other = false;
    if (i < offset) { date = new Date(y, m - 1, prevDays - offset + i + 1); other = true; }
    else if (i - offset < daysInMonth) { date = new Date(y, m, i - offset + 1); }
    else { date = new Date(y, m + 1, i - offset - daysInMonth + 1); other = true; }
    const key = ymd(date);
    const list = tasksOn(key);
    const done = list.filter(t => t.done).length;
    const cls = ['cell'];
    if (other) cls.push('other');
    if (sameDay(date, now)) cls.push('today');
    if (key === state.selected) cls.push('selected');
    if (list.length && done === list.length) cls.push('all-done');
    const dots = list.slice(0, 3).map(t => '<i class="dot ' + (t.done ? 'is-done' : 'p-' + t.priority) + '"></i>').join('');
    const label = DAYS[date.getDay()] + ', ' + MONTHS[date.getMonth()] + ' ' + date.getDate() + ', ' + date.getFullYear() +
      (list.length ? ', ' + done + ' of ' + list.length + ' done' : ', no tasks');
    html += '<button type="button" class="' + cls.join(' ') + '" data-date="' + key + '" aria-label="' + label + '"' +
      (sameDay(date, now) ? ' aria-current="date"' : '') +
      (key === state.selected ? ' aria-pressed="true"' : '') + '>' +
      '<span class="num">' + date.getDate() + '</span>' +
      '<span class="dots" aria-hidden="true">' + dots + '</span></button>';
  }
  el.grid.innerHTML = html;
}

/* ============ render: day panel ============ */
function updateDayMeta() {
  const list = tasksOn(state.selected);
  const done = list.filter(t => t.done).length;
  el.dayCount.textContent = list.length ? done + '/' + list.length + ' done' : 'Clear day';
  el.cAll.textContent = list.length;
  el.cActive.textContent = list.length - done;
  el.cDone.textContent = done;
}
function taskHtml(t) {
  const p = t.priority || 'medium';
  return '<li class="task' + (t.done ? ' done' : '') + '" data-id="' + t.id + '">' +
    '<label class="check"><input type="checkbox" data-act="toggle"' + (t.done ? ' checked' : '') +
      ' aria-label="Mark ' + esc(t.title) + ' ' + (t.done ? 'not done' : 'done') + '">' +
      '<span class="box" aria-hidden="true"></span></label>' +
    '<div class="t-body"><p class="t-title">' + esc(t.title) + '</p><p class="t-meta">' +
      (t.time ? '<span class="t-time">' + esc(t.time) + '</span>' : '<span class="t-time none">anytime</span>') +
      '<span class="badge ' + p + '">' + p + '</span>' +
      (t.notes ? '<span class="t-notes">' + esc(t.notes) + '</span>' : '') +
    '</p></div>' +
    '<div class="row-actions">' +
      '<button class="mini" type="button" data-act="edit" aria-label="Edit ' + esc(t.title) + '">✎</button>' +
      '<button class="mini" type="button" data-act="delete" aria-label="Delete ' + esc(t.title) + '">🗑</button>' +
    '</div></li>';
}
function renderDay() {
  const date = parseYmd(state.selected);
  const now = today();
  const diff = Math.round((date - now) / 86400000);
  el.dayEyebrow.textContent = diff === 0 ? 'Today' : diff === 1 ? 'Tomorrow' : diff === -1 ? 'Yesterday' : DAYS[date.getDay()];
  el.dayTitle.textContent = MONTHS_SHORT[date.getMonth()] + ' ' + date.getDate() +
    (date.getFullYear() !== now.getFullYear() ? ', ' + date.getFullYear() : '');
  updateDayMeta();
  $$('.chip').forEach(c => c.classList.toggle('active', c.dataset.filter === state.filter));

  const list = tasksOn(state.selected);
  const filtered = sortTasks(list.filter(t =>
    state.filter === 'all' || (state.filter === 'done' ? t.done : !t.done)));
  if (filtered.length) {
    el.empty.hidden = true;
    el.taskList.innerHTML = filtered.map(taskHtml).join('');
  } else {
    el.taskList.innerHTML = '';
    el.empty.hidden = false;
    if (!list.length) {
      el.emptyTitle.textContent = 'Nothing planned';
      el.emptyText.textContent = "A clear day — add something when you're ready.";
      el.emptyBtn.hidden = false;
    } else {
      el.emptyTitle.textContent = state.filter === 'done' ? 'Nothing finished yet' : 'All done here';
      el.emptyText.textContent = state.filter === 'done'
        ? 'Completed tasks will show up in this list.'
        : 'Every task for this day is complete.';
      el.emptyBtn.hidden = true;
    }
  }
}

/* ============ render: stats ============ */
function renderStats() {
  const y = state.view.getFullYear(), m = state.view.getMonth();
  const inMonth = state.tasks.filter(t => { const d = parseYmd(t.date); return d.getFullYear() === y && d.getMonth() === m; });
  const total = inMonth.length;
  const done = inMonth.filter(t => t.done).length;
  const pct = total ? Math.round((done / total) * 100) : 0;
  const C = 2 * Math.PI * 52;
  el.ringFg.style.strokeDasharray = C;
  el.ringFg.style.strokeDashoffset = C * (1 - pct / 100);
  el.pctLabel.textContent = pct + '%';
  el.statDone.textContent = done;
  el.statTotal.textContent = total;
  el.statSub.textContent = total === 0 ? 'No tasks scheduled this month.'
    : done === total ? 'All caught up — nice work!'
    : (total - done) + ' to go this month';
  el.mHigh.textContent = inMonth.filter(t => t.priority === 'high' && !t.done).length;
  el.mDays.textContent = new Set(inMonth.map(t => t.date)).size;
}
function renderAll() { renderCalendar(); renderDay(); renderStats(); }

/* ============ selection & navigation ============ */
function selectDate(key, focusGrid) {
  state.selected = key;
  const d = parseYmd(key);
  if (d.getFullYear() !== state.view.getFullYear() || d.getMonth() !== state.view.getMonth())
    state.view = monthStart(d);
  renderAll();
  if (focusGrid) {
    const cell = el.grid.querySelector('[data-date="' + key + '"]');
    if (cell) cell.focus();
  }
}
function changeMonth(delta) {
  state.view = new Date(state.view.getFullYear(), state.view.getMonth() + delta, 1);
  renderCalendar(); renderStats();
  el.grid.classList.remove('slide-r', 'slide-l');
  void el.grid.offsetWidth;                            // reflow so the animation replays
  el.grid.classList.add(delta > 0 ? 'slide-r' : 'slide-l');
}

/* ============ modal ============ */
function openModal(task) {
  state.editingId = task ? task.id : null;
  state.lastFocus = document.activeElement;
  el.modalTitle.textContent = task ? 'Edit task' : 'New task';
  el.deleteBtn.hidden = !task;
  el.form.reset();
  el.fTitle.value = task ? task.title : '';
  el.fDate.value = task ? task.date : state.selected;   // default to the day you're on
  el.fTime.value = task ? (task.time || '') : '';
  el.fPriority.value = task ? (task.priority || 'medium') : 'medium';
  el.fNotes.value = task ? (task.notes || '') : '';
  el.titleErr.hidden = true;
  el.fTitle.classList.remove('invalid');
  el.backdrop.hidden = false;
  document.body.classList.add('modal-open');
  requestAnimationFrame(() => el.fTitle.focus());
}
function closeModal() {
  if (el.backdrop.hidden) return;
  el.backdrop.hidden = true;
  document.body.classList.remove('modal-open');
  state.editingId = null;
  if (state.lastFocus && document.contains(state.lastFocus)) state.lastFocus.focus();
}
function trapFocus(e) {
  const nodes = $$('button, input, select, textarea', el.backdrop)
    .filter(n => !n.disabled && !n.hidden && n.offsetParent !== null);
  if (!nodes.length) return;
  const first = nodes[0], last = nodes[nodes.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
}

/* ============ task actions ============ */
function toggleTask(id, checked) {
  const t = state.tasks.find(x => x.id === id);
  if (!t) return;
  t.done = checked;
  saveTasks();
  const li = el.taskList.querySelector('[data-id="' + id + '"]');
  if (li) {
    li.classList.toggle('done', checked);              // in-place so the check animates
    const cb = li.querySelector('input[type="checkbox"]');
    if (cb) cb.setAttribute('aria-label', 'Mark ' + t.title + ' ' + (checked ? 'not done' : 'done'));
  }
  updateDayMeta();
  renderCalendar();                                    // dots + counts refresh
  renderStats();
  if (state.filter !== 'all') setTimeout(renderDay, 450); // let the animation finish, then re-filter
}
function deleteTask(id) {
  const idx = state.tasks.findIndex(x => x.id === id);
  if (idx < 0) return;
  const removed = state.tasks.splice(idx, 1)[0];
  saveTasks();
  renderAll();
  showToast('Task deleted', 'Undo', () => {            // undo restores at the original position
    state.tasks.splice(Math.min(idx, state.tasks.length), 0, removed);
    saveTasks();
    renderAll();
    hideToast();
  });
}

/* ============ toast ============ */
let toastTimer = null;
function showToast(msg, actionLabel, onAction) {
  clearTimeout(toastTimer);
  el.toastMsg.textContent = msg;
  if (actionLabel) {
    el.toastAction.hidden = false;
    el.toastAction.textContent = actionLabel;
    el.toastAction.onclick = onAction;
  } else {
    el.toastAction.hidden = true;
    el.toastAction.onclick = null;
  }
  el.toast.hidden = false;
  el.toast.style.animation = 'none'; void el.toast.offsetWidth; el.toast.style.animation = '';
  toastTimer = setTimeout(hideToast, actionLabel ? 6000 : 2600);
}
function hideToast() {
  clearTimeout(toastTimer);
  el.toast.hidden = true;
}

/* ============ theme ============ */
let themeChoice = 'auto';
try { themeChoice = localStorage.getItem(THEME_KEY) || 'auto'; } catch (e) {}
function resolveTheme(choice) {
  const dark = choice === 'dark' || (choice === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  el.themeBtn.textContent = dark ? '☀️' : '🌙';
  el.themeBtn.setAttribute('aria-label', dark ? 'Switch to light theme' : 'Switch to dark theme');
}
resolveTheme(themeChoice);
el.themeBtn.addEventListener('click', () => {
  themeChoice = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  try { localStorage.setItem(THEME_KEY, themeChoice); } catch (e) {}
  resolveTheme(themeChoice);
});
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', ev => {
  if (themeChoice === 'auto') resolveTheme('auto');
});

/* ============ events ============ */
el.grid.addEventListener('click', e => {
  const cell = e.target.closest('.cell');
  if (cell) selectDate(cell.dataset.date, true);
});
el.grid.addEventListener('keydown', e => {
  const map = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -7, ArrowDown: 7 };
  if (e.key === 'PageUp' || e.key === 'PageDown') {    // month-jump, keep day-of-month (clamped)
    e.preventDefault();
    const d = parseYmd(state.selected);
    const target = new Date(d.getFullYear(), d.getMonth() + (e.key === 'PageDown' ? 1 : -1), 1);
    const maxDay = new Date(target.getFullYear(), target.getMonth() + 1, 0).getDate();
    target.setDate(Math.min(d.getDate(), maxDay));
    selectDate(ymd(target), true);
    return;
  }
  let delta = map[e.key];
  if (e.key === 'Home') delta = -parseYmd(state.selected).getDay();
  if (e.key === 'End') delta = 6 - parseYmd(state.selected).getDay();
  if (delta === undefined) return;
  e.preventDefault();
  selectDate(ymd(addDays(parseYmd(state.selected), delta)), true);
});
$('#prevBtn').addEventListener('click', () => changeMonth(-1));
$('#nextBtn').addEventListener('click', () => changeMonth(1));
$('#todayBtn').addEventListener('click', () => {
  const t = today();
  state.view = monthStart(t);
  selectDate(ymd(t), true);
});
$('#newBtn').addEventListener('click', () => openModal(null));
$('#fab').addEventListener('click', () => openModal(null));
el.emptyBtn.addEventListener('click', () => openModal(null));
$('#cancelBtn').addEventListener('click', closeModal);
$('#closeBtn').addEventListener('click', closeModal);
el.backdrop.addEventListener('mousedown', e => { if (e.target === el.backdrop) closeModal(); });
el.deleteBtn.addEventListener('click', () => {
  const id = state.editingId;
  if (id) { closeModal(); deleteTask(id); }
});
$$('.chip').forEach(chip => chip.addEventListener('click', () => {
  state.filter = chip.dataset.filter;
  renderDay();
}));
el.taskList.addEventListener('click', e => {
  const btn = e.target.closest('[data-act]');
  if (!btn || btn.tagName !== 'BUTTON') return;
  const li = btn.closest('.task');
  if (!li) return;
  if (btn.dataset.act === 'edit') openModal(state.tasks.find(t => t.id === li.dataset.id));
  else if (btn.dataset.act === 'delete') deleteTask(li.dataset.id);
});
el.taskList.addEventListener('change', e => {
  if (e.target.dataset && e.target.dataset.act === 'toggle') {
    const li = e.target.closest('.task');
    if (li) toggleTask(li.dataset.id, e.target.checked);
  }
});
el.form.addEventListener('submit', e => {
  e.preventDefault();
  const title = el.fTitle.value.trim();
  if (!title) {                                        // inline validation, no alert()
    el.titleErr.hidden = false;
    el.fTitle.classList.add('invalid');
    el.fTitle.focus();
    return;
  }
  const data = {
    title: title,
    date: el.fDate.value || state.selected,
    time: el.fTime.value,
    priority: el.fPriority.value,
    notes: el.fNotes.value.trim()
  };
  if (state.editingId) {
    const t = state.tasks.find(x => x.id === state.editingId);
    if (t) Object.assign(t, data);
    showToast('Task updated');
  } else {
    state.tasks.push(Object.assign({ id: uid(), done: false, created: Date.now() }, data));
    showToast('Task added');
  }
  saveTasks();
  state.selected = data.date;                          // jump to the day you saved on
  state.view = monthStart(parseYmd(data.date));
  closeModal();
  renderAll();
});
document.addEventListener('keydown', e => {
  if (!el.backdrop.hidden) {                           // dialog open: Esc closes, Tab trapped
    if (e.key === 'Escape') { closeModal(); return; }
    if (e.key === 'Tab') trapFocus(e);
    return;
  }
  const typing = e.target.matches('input, textarea, select') || e.target.isContentEditable;
  if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'n' || e.key === 'N') { e.preventDefault(); openModal(null); }
  if (e.key === 't' || e.key === 'T') {
    const t = today();
    state.view = monthStart(t);
    selectDate(ymd(t), true);
  }
});

/* ============ init ============ */
loadTasks();
renderNote();
renderAll();
</script>
</body>
</html>
