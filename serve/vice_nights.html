<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vice Nights — open-world driver</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0a0d14;
    font-family:ui-monospace,Menlo,Consolas,monospace}
  canvas{display:block;cursor:crosshair}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
/* ============ core setup ============ */
const cvs=document.getElementById('c'),ctx=cvs.getContext('2d');
let W=0,H=0;
const resize=()=>{W=cvs.width=innerWidth;H=cvs.height=innerHeight;};
addEventListener('resize',resize);resize();

const rnd=(a=1,b=0)=>b+Math.random()*(a-b);
const pick=a=>a[(Math.random()*a.length)|0];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const dist=(ax,ay,bx,by)=>Math.hypot(ax-bx,ay-by);
const norm=a=>{while(a>Math.PI)a-=2*Math.PI;while(a<-Math.PI)a+=2*Math.PI;return a;};
const nearest=(v,arr)=>{let b=arr[0],bd=1e9;for(const a of arr){const d=Math.abs(a-v);if(d<bd){bd=d;b=a;}}return b;};

/* ============ world ============ */
const MW=3400,MH=3200,WATER=3200,RD=130;      // map size, shoreline, road width
const roadsX=[],roadsY=[];
for(let v=200;v<=3000;v+=400){roadsX.push(v);roadsY.push(v);}
const buildings=[],palms=[];
const palette=['#ff5f9e','#37e6c8','#ffd166','#8a7dff','#ff8c42','#4cc9f0','#f72585','#b5e48c'];

function genWorld(){
  for(let i=0;i<roadsX.length-1;i++)for(let j=0;j<roadsY.length-1;j++){
    const x0=roadsX[i]+RD/2+16,x1=roadsX[i+1]-RD/2-16;
    const y0=roadsY[j]+RD/2+16,y1=roadsY[j+1]-RD/2-16;
    const hw=(x1-x0)/2,hh=(y1-y0)/2;
    for(let a=0;a<2;a++)for(let b=0;b<2;b++){
      const bx=x0+a*hw+7,by=y0+b*hh+7,bw=hw-14,bh=hh-14;
      if(bw<45||bh<45)continue;
      if(Math.random()<0.16){ palms.push({x:bx+bw/2,y:by+bh/2,s:rnd(1.15,.85)}); continue; } // empty lot
      buildings.push({x:bx,y:by,w:bw,h:bh,c:pick(palette)});
    }
  }
  for(let x=70;x<WATER;x+=230){ // border park palms
    palms.push({x:x+rnd(30,-30),y:rnd(110,40),s:rnd(1.1,.85)});
    palms.push({x:x+rnd(30,-30),y:MH-rnd(90,40),s:rnd(1.1,.85)});
  }
  for(let y=260;y<MH;y+=250)palms.push({x:rnd(3150,3090),y:y+rnd(35,-35),s:rnd(1.2,.9)}); // beach
}
genWorld();

/* ============ input ============ */
const keys={};
const mouse={x:0,y:0,down:false};
addEventListener('keydown',e=>{
  if(e.repeat)return;
  keys[e.code]=true;
  if(e.code==='KeyE')tryEnter();
  if(e.code==='Enter')respawn();
});
addEventListener('keyup',e=>keys[e.code]=false);
cvs.addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY;});
cvs.addEventListener('mousedown',()=>{mouse.down=true;initAudio();});
addEventListener('mouseup',()=>mouse.down=false);

/* ============ tiny audio ============ */
let AC=null;
function initAudio(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
function beep(f,d,type,vol){
  if(!AC)return;
  try{const o=AC.createOscillator(),g=AC.createGain();
    o.type=type;o.frequency.value=f;g.gain.value=vol;
    g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+d);
    o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+d);}catch(e){}
}

/* ============ state ============ */
let state='play',shake=0,helpT=14,heat=0,heatT=0,copT=0,missionT=0;
const player={x:roadsX[1],y:roadsY[1],a:0,hp:100,money:500,inCar:null,cool:0,aim:0,bob:0};
const cars=[],peds=[],bullets=[],parts=[],picks=[],toasts=[];
const carCols=['#e63946','#f4a261','#2a9d8f','#e9c46a','#8338ec','#3a86ff','#ff006e','#06d6a0','#ef476f'];
let mission={x:roadsX[4],y:roadsY[3]};

function say(t){toasts.push({t:3,txt:t});}

/* ============ entities ============ */
function mkCar(x,y,axis,dir,type){
  const a=axis==='v'?(dir>0?Math.PI/2:-Math.PI/2):(dir>0?0:Math.PI);
  return {x,y,a,v:0,axis,dir,type,ai:type==='traffic'||type==='parked',
    color:type==='cop'?'#101418':pick(carCols),hp:100,cool:0,spd:rnd(240,150),turnCd:0,road:null,brake:0};
}
function spawnTraffic(c){
  const axis=Math.random()<.5?'v':'h',dir=Math.random()<.5?1:-1;
  const ang=Math.random()*Math.PI*2,d=rnd(1050,550);
  const px=clamp(player.x+Math.cos(ang)*d,90,WATER-90);
  const py=clamp(player.y+Math.sin(ang)*d,90,MH-90);
  if(axis==='v'){const r=nearest(px,roadsX);c.road=r;c.axis='v';c.dir=dir;c.x=r-28*dir;c.y=py;}
  else{const r=nearest(py,roadsY);c.road=r;c.axis='h';c.dir=dir;c.y=r+28*dir;c.x=px;}
  c.v=0;c.turnCd=1;c.type='traffic';c.ai=true;
}
function spawnPed(p){
  const axis=Math.random()<.5?'v':'h';
  const ang=Math.random()*Math.PI*2,d=rnd(950,450);
  const px=clamp(player.x+Math.cos(ang)*d,60,WATER-60);
  const py=clamp(player.y+Math.sin(ang)*d,60,MH-60);
  if(axis==='v'){const r=nearest(px,roadsX);p.x=r+(Math.random()<.5?-1:1)*(RD/2+rnd(16,4));p.y=py;}
  else{const r=nearest(py,roadsY);p.y=r+(Math.random()<.5?-1:1)*(RD/2+rnd(16,4));p.x=px;}
  p.a=rnd(6.28);p.flee=0;p.from=null;p.hp=1;p.cool=0;
}
for(let i=0;i<34;i++){const c=mkCar(0,0,'v',1,'traffic');spawnTraffic(c);cars.push(c);}
for(let i=0;i<10;i++){ // parked cars
  const axis=Math.random()<.5?'v':'h',r=axis==='v'?pick(roadsX):pick(roadsY);
  const along=rnd(MH-120,120);
  const c=axis==='v'?mkCar(r+(Math.random()<.5?-1:1)*(RD/2-16),along,'v',1,'parked')
                    :mkCar(along,r+(Math.random()<.5?-1:1)*(RD/2-16),'h',1,'parked');
  c.a=axis==='v'?Math.PI/2:0;c.ai=false;cars.push(c);
}
for(let i=0;i<58;i++){const p={};spawnPed(p);peds.push(p);}

/* ============ helpers ============ */
function hitRect(x,y,r,o){return x+r>o.x&&x-r<o.x+o.w&&y+r>o.y&&y-r<o.y+o.h;}
function pushOut(x,y,r,o){
  const cx=clamp(x,o.x,o.x+o.w),cy=clamp(y,o.y,o.y+o.h);
  let dx=x-cx,dy=y-cy,d=Math.hypot(dx,dy);
  if(d>r)return null;
  if(d===0){ // deep inside: exit by nearest edge
    const l=x-o.x,rr=o.x+o.w-x,t=y-o.y,b=o.y+o.h-y,m=Math.min(l,rr,t,b);
    if(m===l)return{x:o.x-r,y};if(m===rr)return{x:o.x+o.w+r,y};
    if(m===t)return{x,y:o.y-r};return{x,y:o.y+o.h+r};
  }
  return{x:x+dx/d*(r-d),y:y+dy/d*(r-d)};
}
function collideWorld(x,y,r){
  let nx=x,ny=y;
  for(const b of buildings){
    if(Math.abs(nx-b.x-b.w/2)>b.w/2+r+40||Math.abs(ny-b.y-b.h/2)>b.h/2+r+40)continue;
    const p=pushOut(nx,ny,r,b); if(p){nx=p.x;ny=p.y;}
  }
  return{x:clamp(nx,20,WATER-24),y:clamp(ny,20,MH-20)};
}
function burst(x,y,c,n,spd){
  for(let i=0;i<n;i++){const a=rnd(6.28),s=rnd(spd,spd*.3);
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rnd(.7,.3),c,r:rnd(4,1.5)});}
}
function shoot(x,y,a,owner){
  bullets.push({x,y,vx:Math.cos(a)*950,vy:Math.sin(a)*950,life:.7,owner});
  parts.push({x,y,vx:Math.cos(a)*60,vy:Math.sin(a)*60,life:.08,c:'#fff8d6',r:6});
  beep(210,.07,'square',.03);
}
function damage(d){
  if(state!=='play')return;
  player.hp-=d;shake=Math.min(14,shake+4);
  if(player.hp<=0){player.hp=0;state='dead';beep(60,.6,'sawtooth',.06);}
}
function respawn(){
  if(state!=='dead')return;
  state='play';player.hp=100;player.inCar=null;heat=0;
  player.money=Math.floor(player.money/2);
  player.x=roadsX[2];player.y=roadsY[5];say('Respawned — half your cash is gone');
}
function crime(n){heat=Math.min(340,heat+n);heatT=5;}

/* ============ enter / exit cars ============ */
function tryEnter(){
  if(state!=='play')return;
  if(player.inCar){
    const c=player.inCar;player.inCar=null;
    player.x=c.x+Math.cos(c.a+Math.PI/2)*48;
    player.y=c.y+Math.sin(c.a+Math.PI/2)*48;
    c.v*=.3;say('On foot');return;
  }
  let best=null,bd=72;
  for(const c of cars){const d=dist(player.x,player.y,c.x,c.y);if(d<bd&&!c.wreck){bd=d;best=c;}}
  if(!best)return;
  if(best.type==='cop'){crime(70);say('Grand theft auto!');}
  else if(best.ai){spawnPed({});say('Vehicle acquired');} // eject the driver
  best.ai=false;best.type='player';best.road=null;
  player.inCar=best;beep(140,.12,'triangle',.04);
}

/* ============ updates ============ */
function updPlayer(dt){
  player.cool-=dt;
  if(player.inCar){
    const c=player.inCar;
    const thr=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0);
    const st=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0);
    c.v+=thr*460*dt; c.v-=c.v*1.3*dt; c.v=clamp(c.v,-170,440);
    c.a+=st*2.5*dt*clamp(Math.abs(c.v)/170,0,1)*(c.v<0?-1:1);
    let nx=c.x+Math.cos(c.a)*c.v*dt, ny=c.y+Math.sin(c.a)*c.v*dt;
    // building collision + crash damage
    let hit=false;
    for(const b of buildings){
      if(Math.abs(nx-b.x-b.w/2)>b.w/2+18||Math.abs(ny-b.y-b.h/2)>b.h/2+18)continue;
      if(hitRect(nx,ny,17,b)){hit=true;break;}
    }
    if(hit){
      if(Math.abs(c.v)>150){damage(Math.abs(c.v)*.045);burst(nx,ny,'#ffd166',8,180);beep(80,.2,'sawtooth',.05);}
      nx=c.x-Math.cos(c.a)*8;ny=c.y-Math.sin(c.a)*8;c.v*=-.25;shake=Math.min(12,shake+5);
    }
    c.x=clamp(nx,24,WATER-28);c.y=clamp(ny,24,MH-24);
    player.x=c.x;player.y=c.y;player.a=c.a;
    // run over pedestrians
    for(const p of peds){
      if(p.hp<=0)continue;
      if(Math.abs(c.v)>70&&dist(c.x,c.y,p.x,p.y)<26){
        p.hp=0;burst(p.x,p.y,'#c1121f',10,150);beep(90,.12,'sawtooth',.05);
        if(Math.abs(c.v)>120){crime(45);say('Hit and run!');}
        picks.push({x:p.x,y:p.y,v:60});}
    }
  }else{
    let dx=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0);
    let dy=(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0);
    const l=Math.hypot(dx,dy)||1,sp=175;
    const p=collideWorld(player.x+dx/l*sp*dt,player.y+dy/l*sp*dt,12);
    player.x=p.x;player.y=p.y;
    if(dx||dy){player.bob+=dt*10;}else{player.bob=0;}
  }
  // aim & fire
  player.aim=Math.atan2(mouse.y+cam.y-player.y,mouse.x+cam.x-player.x);
  if((mouse.down||keys.Space)&&player.cool<=0&&state==='play'){
    player.cool=.13;
    const ox=player.x+Math.cos(player.aim)*22,oy=player.y+Math.sin(player.aim)*22;
    shoot(ox,oy,player.aim,'player');crime(3);
    for(const p of peds)if(p.hp>0&&dist(player.x,player.y,p.x,p.y)<250)p.flee=4,p.from={x:player.x,y:player.y};
  }
}
function updCopCar(c,dt){
  const tx=player.x,ty=player.y,ang=Math.atan2(ty-c.y,tx-c.x);
  const d=dist(c.x,c.y,tx,ty);
  const want=d>140?360:150;                       // close in, then harass
  c.v+=(want-c.v)*dt*1.4;
  c.a+=clamp(norm(ang-c.a),-2.1*dt,2.1*dt)*(d>60?1:0);
  const nx=c.x+Math.cos(c.a)*c.v*dt,ny=c.y+Math.sin(c.a)*c.v*dt;
  let hit=false;
  for(const b of buildings)if(hitRect(nx,ny,17,b)){hit=true;break;}
  if(hit){c.v*=-.3;burst(nx,ny,'#ffd166',5,140);}
  c.x=clamp(nx,24,WATER-28);c.y=clamp(ny,24,MH-24);
  c.cool-=dt;
  if(d<380&&c.cool<=0&&state==='play'){c.cool=1.1;shoot(c.x+Math.cos(c.a)*30,c.y+Math.sin(c.a)*30,ang+ rnd(.1,-.1),'cop');}
  if(d<44&&Math.abs(c.v)>120&&state==='play'){damage(9);c.v*=.6;}
}
function updCopFoot(p,dt){
  const d=dist(p.x,p.y,player.x,player.y);
  const ang=Math.atan2(player.y-p.y,player.x-p.x);
  if(d>150){const np=collideWorld(p.x+Math.cos(ang)*140*dt,p.y+Math.sin(ang)*140*dt,11);p.x=np.x;p.y=np.y;}
  p.cool-=dt;
  if(d<420&&p.cool<=0&&state==='play'){p.cool=1.2;shoot(p.x+Math.cos(ang)*18,p.y+Math.sin(ang)*18,ang+rnd(.12,-.12),'cop');}
}
function updTraffic(c,dt){
  c.turnCd-=dt;
  const sp=c.spd*dt;
  if(c.axis==='v'){
    c.y+=c.dir*sp;c.x+=((c.road-28*c.dir)-c.x)*Math.min(1,dt*4);
    const perp=nearest(c.y,roadsY);
    if(Math.abs(c.y-perp)<64&&c.turnCd<=0&&Math.random()<.05){
      c.axis='h';c.road=perp;c.dir=Math.random()<.5?1:-1;
      c.y=perp+28*c.dir;c.turnCd=2;
    }
    if(c.y<-60||c.y>MH+60)spawnTraffic(c);
  }else{
    c.x+=c.dir*sp;c.y+=((c.road+28*c.dir)-c.y)*Math.min(1,dt*4);
    const perp=nearest(c.x,roadsX);
    if(Math.abs(c.x-perp)<64&&c.turnCd<=0&&Math.random()<.05){
      c.axis='v';c.road=perp;c.dir=Math.random()<.5?1:-1;
      c.x=perp-28*c.dir;c.turnCd=2;
    }
    if(c.x<-60||c.x>WATER+60)spawnTraffic(c);
  }
  for(const p of peds){ // traffic runs people over
    if(p.hp>0&&c.spd>110&&dist(c.x,c.y,p.x,p.y)<24){
      p.hp=0;burst(p.x,p.y,'#c1121f',8,140);
      if(player.inCar===c){crime(40);say('Hit and run!');picks.push({x:p.x,y:p.y,v:60});}
    }
  }
}
function updPeds(dt){
  for(const p of peds){
    if(p.hp<=0)continue;
    let sp=55;
    if(p.flee>0){
      p.flee-=dt;
      p.a=Math.atan2(p.y-p.from.y,p.x-p.from.x);sp=175;
    }else{
      if(Math.random()<.01)p.a+=rnd(1.4,-1.4);
      if(Math.random()<.003)p.a+=Math.PI;
    }
    const np=collideWorld(p.x+Math.cos(p.a)*sp*dt,p.y+Math.sin(p.a)*sp*dt,10);
    if(np.x===p.x&&np.y===p.y)p.a+=2.2; // stuck on a wall
    p.x=np.x;p.y=np.y;
  }
}
function updCopSpawns(dt){
  const stars=heat>=60?Math.min(5,Math.floor(heat/60)):0;
  copT-=dt;
  const live=cars.filter(c=>c.type==='cop').length;
  if(stars>0&&copT<=0&&live<stars*2){
    copT=3.2;
    const ang=Math.random()*Math.PI*2,d=rnd(1100,750);
    const px=clamp(player.x+Math.cos(ang)*d,90,WATER-90);
    const py=clamp(player.y+Math.sin(ang)*d,90,MH-90);
    const r=Math.random()<.7;
    if(r){
      const c=mkCar(px,py,'v',1,'cop');c.road=nearest(px,roadsX);c.x=c.road-28;c.y=py;
      c.ai=false;c.spd=420;cars.push(c);
    }else{
      peds.push({x:px,y:py,a:rnd(6.28),flee:0,hp:1,cool:0,cop:true});
    }
  }
  if(heatT>0){heatT-=dt;}else{heat=Math.max(0,heat-6*dt);}
  if(stars===0)for(let i=cars.length-1;i>=0;i--)if(cars[i].type==='cop')cars.splice(i,1);
}
function updBullets(dt){
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];b.life-=dt;
    b.x+=b.vx*dt;b.y+=b.vy*dt;
    let dead=b.life<=0;
    for(const r of buildings)if(hitRect(b.x,b.y,2,r)){dead=true;break;}
    if(!dead)for(const p of peds){
      if(p.hp>0&&p.cop!==true&&dist(b.x,b.y,p.x,p.y)<13){
        p.hp=0;dead=true;burst(p.x,p.y,'#c1121f',9,150);picks.push({x:p.x,y:p.y,v:rnd(90,30)});
        if(b.owner==='player'){crime(50);say('Casualty!');}
      }
      if(dead)break;
    }
    if(!dead&&b.owner==='player')for(const c of cars){
      if(c.type==='cop'&&dist(b.x,b.y,c.x,c.y)<22){dead=true;burst(b.x,b.y,'#ffd166',5,140);crime(25);break;}
    }
    if(!dead&&b.owner==='cop'&&state==='play'&&player.inCar===null&&dist(b.x,b.y,player.x,player.y)<13){
      dead=true;damage(8);burst(player.x,player.y,'#c1121f',5,120);
    }
    if(!dead&&b.owner==='cop'&&state==='play'&&player.inCar&&dist(b.x,b.y,player.x,player.y)<24){
      dead=true;burst(b.x,b.y,'#ffd166',4,120);damage(4);
    }
    if(dead)bullets.splice(i,1);
  }
}
function updFx(dt){
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.92;p.vy*=.92;p.life-=dt;
    if(p.life<=0)parts.splice(i,1);}
  for(let i=picks.length-1;i>=0;i--){const p=picks[i];
    if(dist(p.x,p.y,player.x,player.y)<30){player.money+=p.v;beep(1200,.09,'sine',.05);
      say('+$'+p.v);picks.splice(i,1);continue;}
    if(Math.random()<.004)picks.splice(i,1);}
  for(let i=toasts.length-1;i>=0;i--){toasts[i].t-=dt;if(toasts[i].t<=0)toasts.splice(i,1);}
  shake=Math.max(0,shake-30*dt);helpT-=dt;
  if(missionT>0){missionT-=dt;return;}
  if(dist(player.x,player.y,mission.x,mission.y)<46){
    player.money+=250;beep(900,.15,'triangle',.05);say('Job done! +$250');
    mission={x:pick(roadsX)+rnd(40,-40),y:pick(roadsY)+rnd(40,-40)};
    missionT=1.5;
  }
}

/* ============ camera ============ */
const cam={x:0,y:0};
function updCam(){
  cam.x=clamp(player.x-W/2,0,Math.max(0,MW-W));
  cam.y=clamp(player.y-H/2,0,Math.max(0,MH-H));
}

/* ============ drawing ============ */
function star(x,y,r){
  ctx.beginPath();
  for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.46:r;
    ctx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);}
  ctx.closePath();
}
function drawGround(){
  ctx.fillStyle='#16222b';ctx.fillRect(0,0,MW,MH);            // city ground
  ctx.fillStyle='#e8c98f';ctx.fillRect(WATER-140,0,140,MH);   // beach
  ctx.fillStyle='#0b2f6b';ctx.fillRect(WATER,0,MW-WATER,MH);  // ocean
  ctx.fillStyle='#1d5fa8';
  for(let y=0;y<MH;y+=46)ctx.fillRect(WATER+8,y+((y/46)%2?14:0),60,4);
  // roads
  ctx.fillStyle='#2b303a';
  for(const x of roadsX)ctx.fillRect(x-RD/2,0,RD,MH);
  for(const y of roadsY)ctx.fillRect(0,y-RD/2,MW,RD);
  // lane dashes + edges
  ctx.strokeStyle='#f2d27a';ctx.lineWidth=3;ctx.setLineDash([26,26]);
  for(const x of roadsX){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,MH);ctx.stroke();}
  for(const y of roadsY){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(MW,y);ctx.stroke();}
  ctx.setLineDash([]);ctx.strokeStyle='#4c525e';ctx.lineWidth=2;
  for(const x of roadsX){ctx.beginPath();ctx.moveTo(x-RD/2,0);ctx.lineTo(x-RD/2,MH);
    ctx.moveTo(x+RD/2,0);ctx.lineTo(x+RD/2,MH);ctx.stroke();}
  for(const y of roadsY){ctx.beginPath();ctx.moveTo(0,y-RD/2);ctx.lineTo(MW,y-RD/2);
    ctx.moveTo(0,y+RD/2);ctx.lineTo(MW,y+RD/2);ctx.stroke();}
}
function drawPalm(p){
  ctx.save();ctx.translate(p.x,p.y);ctx.scale(p.s,p.s);
  ctx.strokeStyle='#7a5230';ctx.lineWidth=5;ctx.beginPath();
  ctx.moveTo(0,0);ctx.quadraticCurveTo(4,-14,2,-26);ctx.stroke();
  ctx.strokeStyle='#1f9d55';ctx.lineWidth=4;
  for(let i=0;i<6;i++){const a=-Math.PI/2+(i-2.5)*.6;
    ctx.beginPath();ctx.moveTo(2,-26);
    ctx.quadraticCurveTo(Math.cos(a)*14,-26+Math.sin(a)*10,Math.cos(a)*24,-26+Math.sin(a)*18);
    ctx.stroke();}
  ctx.fillStyle='#5b3a1e';ctx.beginPath();ctx.arc(2,-24,3,0,7);ctx.fill();
  ctx.restore();
}
function drawBuilding(b){
  ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillRect(b.x+8,b.y+10,b.w,b.h); // night shadow
  ctx.fillStyle=b.c;ctx.globalAlpha=.9;ctx.fillRect(b.x,b.y,b.w,b.h);ctx.globalAlpha=1;
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(b.x+6,b.y+6,b.w-12,b.h-12); // roof
  ctx.strokeStyle=b.c;ctx.lineWidth=3;ctx.shadowColor=b.c;ctx.shadowBlur=14;
  ctx.strokeRect(b.x+2,b.y+2,b.w-4,b.h-4);ctx.shadowBlur=0;
  // lit windows
  ctx.fillStyle='#ffe9a8';
  for(let i=0;i<6;i++){
    const wx=b.x+10+((i*37)%(Math.max(20,b.w-26))),wy=b.y+10+((i*53)%(Math.max(20,b.h-26)));
    if((i+b.x|0)%3)ctx.fillRect(wx,wy,7,9);
  }
}
function drawCar(c){
  ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.a);
  const w=52,h=26;
  // headlight glow
  ctx.fillStyle='rgba(255,240,180,.10)';
  ctx.beginPath();ctx.moveTo(w/2,0);ctx.lineTo(w/2+95,-42);ctx.lineTo(w/2+95,42);ctx.closePath();ctx.fill();
  ctx.fillStyle='rgba(0,0,0,.4)';ctx.fillRect(-w/2+3,-h/2+4,w,h-2);
  ctx.fillStyle=c.color;ctx.fillRect(-w/2,-h/2,w,h);
  ctx.fillStyle='rgba(10,20,35,.85)';ctx.fillRect(-6,-h/2+3,16,h-6); // windshield
  ctx.fillStyle='rgba(255,255,255,.25)';ctx.fillRect(-w/2,-h/2,w,4);
  ctx.fillStyle='#111';ctx.fillRect(-w/2+6,-h/2-3,10,4);ctx.fillRect(-w/2+6,h/2-1,10,4);
  ctx.fillRect(w/2-16,-h/2-3,10,4);ctx.fillRect(w/2-16,h/2-1,10,4);
  ctx.fillStyle='#fff3b0';ctx.fillRect(w/2-4,-h/2+3,4,6);ctx.fillRect(w/2-4,h/2-9,4,6);
  if(c.type==='cop'){
    const t=(Date.now()/160|0)%2;
    ctx.fillStyle=t?'#ff2d2d':'#2d6bff';ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=16;
    ctx.fillRect(-4,-h/2-4,8,5);ctx.fillRect(-4,h/2-1,8,5);ctx.shadowBlur=0;
    ctx.fillStyle='#e8e8e8';ctx.fillRect(-w/2+8,-4,16,8);
  }
  ctx.restore();
}
function drawPed(p){
  if(p.hp<=0)return;
  if(p.cop){ // on-foot officer
    ctx.save();ctx.translate(p.x,p.y);
    ctx.fillStyle='#1c3f95';ctx.beginPath();ctx.arc(0,0,10,0,7);ctx.fill();
    ctx.fillStyle='#f2c9a0';ctx.beginPath();ctx.arc(0,-4,5,0,7);ctx.fill();
    ctx.strokeStyle='#111';ctx.lineWidth=4;ctx.beginPath();
    ctx.moveTo(0,0);ctx.lineTo(Math.cos(player.aim)*16,Math.sin(player.aim)*16);ctx.stroke();
    ctx.restore();return;
  }
  ctx.save();ctx.translate(p.x,p.y);
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(2,6,9,5,0,0,7);ctx.fill();
  ctx.fillStyle=p.hp<=0?'#c1121f':pick0(p,'shirt','#e76f51');
  ctx.beginPath();ctx.arc(0,0,9,0,7);ctx.fill();
  ctx.fillStyle='#f2c9a0';ctx.beginPath();ctx.arc(0,-3,5,0,7);ctx.fill();
  if(p.flee>0){ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();
    ctx.moveTo(-4,-13);ctx.lineTo(-7,-19);ctx.moveTo(4,-13);ctx.lineTo(7,-19);ctx.stroke();}
  ctx.restore();
}
const shirtPool=['#e76f51','#2a9d8f','#e9c46a','#8338ec','#ef476f','#06d6a0','#3a86ff'];
function pick0(o,key,def){if(!o[key])o[key]=pick(shirtPool);return o[key];}
function drawPlayer(){
  ctx.save();ctx.translate(player.x,player.y);
  if(player.inCar){ctx.restore();return;}
  ctx.fillStyle='rgba(0,0,0,.4)';ctx.beginPath();ctx.ellipse(2,8,10,5,0,0,7);ctx.fill();
  const bob=Math.sin(player.bob)*2;
  ctx.fillStyle='#ff2d87';ctx.beginPath();ctx.arc(0,bob*.3,11,0,7);ctx.fill(); // pink shirt
  ctx.fillStyle='#f7c59f';ctx.beginPath();ctx.arc(0,-5+bob*.3,6,0,7);ctx.fill();
  ctx.strokeStyle='#161616';ctx.lineWidth=5;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(player.aim)*20,Math.sin(player.aim)*20);ctx.stroke();
  ctx.restore();
}
function drawMission(){
  const pulse=1+Math.sin(Date.now()/220)*.15;
  ctx.save();ctx.translate(mission.x,mission.y);
  ctx.strokeStyle='#ffd166';ctx.lineWidth=4;ctx.shadowColor='#ffd166';ctx.shadowBlur=18;
  ctx.beginPath();ctx.arc(0,0,30*pulse,0,7);ctx.stroke();ctx.shadowBlur=0;
  ctx.fillStyle='rgba(255,209,102,.22)';ctx.fill();
  ctx.fillStyle='#ffd166';ctx.font='bold 13px monospace';ctx.textAlign='center';
  ctx.fillText('JOB',0,-42);ctx.restore();
}
function drawWorld(){
  ctx.save();
  ctx.translate(-cam.x+(shake?rnd(shake,-shake):0),-cam.y+(shake?rnd(shake,-shake):0));
  const x0=cam.x-80,x1=cam.x+W+80,y0=cam.y-80,y1=cam.y+H+80;
  drawGround();
  for(const b of buildings)if(b.x<x1&&b.x+b.w>x0&&b.y<y1&&b.y+b.h>y0)drawBuilding(b);
  for(const p of palms)if(p.x>x0&&p.x<x1&&p.y>y0&&p.y<y1)drawPalm(p);
  drawMission();
  for(const p of picks){ctx.fillStyle='#7dff9b';ctx.shadowColor='#7dff9b';ctx.shadowBlur=12;
    ctx.beginPath();ctx.arc(p.x,p.y,7+Math.sin(Date.now()/150)*2,0,7);ctx.fill();ctx.shadowBlur=0;
    ctx.fillStyle='#0a3d16';ctx.font='bold 9px monospace';ctx.textAlign='center';ctx.fillText('$',p.x,p.y+3);}
  for(const c of cars)if(c.x>x0&&c.x<x1&&c.y>y0&&c.y<y1)drawCar(c);
  for(const p of peds)if(p.hp>0&&p.x>x0&&p.x<x1&&p.y>y0&&p.y<y1)drawPed(p);
  drawPlayer();
  for(const b of bullets){ctx.strokeStyle=b.owner==='player'?'#fff7cf':'#ff8b8b';
    ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(b.x-b.vx*.014,b.y-b.vy*.014);ctx.stroke();}
  for(const p of parts){ctx.globalAlpha=clamp(p.life*2,0,1);ctx.fillStyle=p.c;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();}
  ctx.globalAlpha=1;
  ctx.restore();
}
function drawMinimap(){
  const MS=176,mx=W-MS-16,my=H-MS-16,s=MS/MW;
  ctx.save();
  ctx.fillStyle='rgba(5,8,14,.88)';ctx.fillRect(mx-4,my-4,MS+8,MS+8);
  ctx.strokeStyle='#3a4356';ctx.lineWidth=2;ctx.strokeRect(mx-4,my-4,MS+8,MS+8);
  ctx.beginPath();ctx.rect(mx,my,MS,MS);ctx.clip();
  ctx.fillStyle='#16222b';ctx.fillRect(mx,my,MS,MS);
  ctx.fillStyle='#0b2f6b';ctx.fillRect(mx+WATER*s,my,(MW-WATER)*s,MS);
  ctx.strokeStyle='#4b5568';ctx.lineWidth=3;
  for(const x of roadsX){ctx.beginPath();ctx.moveTo(mx+x*s,my);ctx.lineTo(mx+x*s,my+MH*s);ctx.stroke();}
  for(const y of roadsY){ctx.beginPath();ctx.moveTo(mx,my+y*s);ctx.lineTo(mx+MW*s,my+y*s);ctx.stroke();}
  ctx.fillStyle='#ffd166';ctx.beginPath();ctx.arc(mx+mission.x*s,my+mission.y*s,4,0,7);ctx.fill();
  for(const c of cars)if(c.type==='cop'){ctx.fillStyle='#4cc9f0';
    ctx.fillRect(mx+c.x*s-2,my+c.y*s-2,4,4);}
  ctx.fillStyle='#ff2d87';ctx.beginPath();
  ctx.arc(mx+player.x*s,my+player.y*s,4.5,0,7);ctx.fill();
  ctx.strokeStyle='#ff2d87';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(mx+player.x*s,my+player.y*s);
  ctx.lineTo(mx+(player.x+Math.cos(player.a)*40)*s,my+(player.y+Math.sin(player.a)*40)*s);ctx.stroke();
  ctx.restore();
}
function drawHUD(){
  // health + cash
  ctx.textAlign='left';
  ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(16,16,220,58);
  ctx.fillStyle='#39d353';ctx.font='bold 20px monospace';
  ctx.fillText('$'+player.money,28,42);
  ctx.fillStyle='#2b2f3a';ctx.fillRect(28,52,196,12);
  ctx.fillStyle=player.hp>40?'#39d353':'#ff3b3b';
  ctx.fillRect(28,52,196*clamp(player.hp/100,0,1),12);
  ctx.strokeStyle='#0a0d14';ctx.lineWidth=2;ctx.strokeRect(28,52,196,12);
  // wanted stars
  const stars=heat>=60?Math.min(5,Math.floor(heat/60)):0;
  for(let i=0;i<5;i++){
    const x=W-36-(5-i)*40,y=38;
    star(x,y,15);
    if(i<stars){ctx.fillStyle='#ffd166';ctx.shadowColor='#ffd166';ctx.shadowBlur=14;ctx.fill();ctx.shadowBlur=0;}
    else{ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=2;ctx.stroke();}
  }
  ctx.fillStyle='rgba(255,255,255,.5)';ctx.font='11px monospace';ctx.textAlign='right';
  ctx.fillText('WANTED',W-26,70);
  // speed
  if(player.inCar){
    const kmh=Math.abs(Math.round(player.inCar.v*.42));
    ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(W/2-70,H-64,140,44);
    ctx.fillStyle='#4cc9f0';ctx.font='bold 24px monospace';ctx.textAlign='center';
    ctx.fillText(kmh+' km/h',W/2,H-34);
  }
  // toasts
  ctx.textAlign='center';ctx.font='bold 15px monospace';
  toasts.forEach((t,i)=>{
    ctx.globalAlpha=clamp(t.t,0,1);
    ctx.fillStyle='rgba(0,0,0,.6)';const w=ctx.measureText(t.txt).width+26;
    ctx.fillRect(W/2-w/2,90+i*32,w,26);
    ctx.fillStyle='#ffd166';ctx.fillText(t.txt,W/2,108+i*32);
  });
  ctx.globalAlpha=1;
  // controls help
  if(helpT>0){
    ctx.globalAlpha=clamp(helpT/2,0,1);
    ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(16,H-140,330,124);
    ctx.fillStyle='#cfd8e3';ctx.font='13px monospace';ctx.textAlign='left';
    ['WASD — move / drive','E — enter or exit vehicle','MOUSE — aim, CLICK/SPACE — shoot',
     'Yellow ring — job marker ($250)','Reach 5 stars and the heat is on'].forEach((t,i)=>
      ctx.fillText(t,30,H-116+i*23));
    ctx.globalAlpha=1;
  }
  // off-screen mission arrow
  const sx=mission.x-cam.x,sy=mission.y-cam.y;
  if(sx<24||sy<24||sx>W-24||sy>H-24){
    const ang=Math.atan2(sy-H/2,sx-W/2);
    const rx=W/2+Math.cos(ang)*(W/2-46),ry=H/2+Math.sin(ang)*(H/2-46);
    ctx.save();ctx.translate(rx,ry);ctx.rotate(ang);
    ctx.fillStyle='#ffd166';ctx.shadowColor='#ffd166';ctx.shadowBlur=12;
    ctx.beginPath();ctx.moveTo(15,0);ctx.lineTo(-9,9);ctx.lineTo(-9,-9);ctx.closePath();ctx.fill();
    ctx.restore();
  }
  drawMinimap();
  // vignette
  const g=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.35,W/2,H/2,Math.max(W,H)*.75);
  g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.55)');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  if(state==='dead'){
    ctx.fillStyle='rgba(120,0,20,.55)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff3b3b';
    ctx.font='bold '+Math.min(96,W/7)+'px monospace';
    ctx.shadowColor='#ff0044';ctx.shadowBlur=30;
    ctx.fillText('WASTED',W/2,H/2);ctx.shadowBlur=0;
    ctx.fillStyle='#fff';ctx.font='18px monospace';
    ctx.fillText('Press ENTER to respawn',W/2,H/2+50);
  }
}

/* ============ main loop ============ */
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(state==='play'){
    updPlayer(dt);
    for(const c of cars){
      if(c.ai&&c.type==='traffic')updTraffic(c,dt);
      else if(c.type==='cop')updCopCar(c,dt);
    }
    for(const p of peds){
      if(p.cop&&p.hp>0)updCopFoot(p,dt);
    }
    updPeds(dt);updCopSpawns(dt);updBullets(dt);updFx(dt);
  }
  updCam();
  drawWorld();drawHUD();
  requestAnimationFrame(frame);
}
say('Welcome to Vice Nights');
requestAnimationFrame(frame);
</script>
