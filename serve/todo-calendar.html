<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Daymark — Todo Calendar</title>
<style>
  :root{
    --bg:#f3f4fb; --panel:#ffffff; --panel-2:#f8f8fd; --ink:#161a2b; --ink-2:#5d637d;
    --line:#e7e8f4; --accent:#5b5bd6; --accent-2:#8b5cf6; --accent-soft:#eceafd;
    --high:#ff5c7a; --med:#f5a524; --low:#2fbf9b;
    --shadow:0 10px 30px rgba(30,34,80,.08); --radius:18px;
  }
  [data-theme="dark"]{
    --bg:#0d0f16; --panel:#151824; --panel-2:#1b1f2e; --ink:#eceef8; --ink-2:#9aa1bd;
    --line:#262b3d; --accent:#7c7cff; --accent-2:#a78bfa; --accent-soft:#232741;
    --shadow:0 12px 34px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font:15px/1.5 "Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  button,input,textarea,select{font:inherit; color:inherit}
  button{cursor:pointer; background:none; border:0}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:8px}
  .app{display:grid; grid-template-columns:372px 1fr; height:100vh; gap:18px; padding:18px}

  /* ---------- sidebar ---------- */
  .panel{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    display:flex; flex-direction:column; overflow:hidden; box-shadow:var(--shadow)}
  .brand{padding:20px 20px 14px; display:flex; align-items:center; gap:11px; border-bottom:1px solid var(--line)}
  .logo{width:36px; height:36px; border-radius:11px; display:grid; place-items:center; color:#fff;
    background:linear-gradient(135deg,var(--accent),var(--accent-2)); font-weight:800; letter-spacing:-.5px}
  .brand h1{margin:0; font-size:17px; letter-spacing:-.3px}
  .brand p{margin:1px 0 0; font-size:12px; color:var(--ink-2)}
  .brand .spacer{flex:1}

  .today-card{margin:16px 16px 10px; padding:14px; border-radius:14px; display:flex; gap:14px; align-items:center;
    background:linear-gradient(135deg,var(--accent-soft),transparent); border:1px solid var(--line)}
  .ring{width:56px; height:56px; flex:0 0 56px; position:relative}
  .ring svg{transform:rotate(-90deg)}
  .ring span{position:absolute; inset:0; display:grid; place-items:center; font-size:12px; font-weight:700}
  .today-card .d{font-size:17px; font-weight:700; letter-spacing:-.3px}
  .today-card .s{font-size:12.5px; color:var(--ink-2); margin-top:2px}

  .quick{padding:6px 16px 12px; display:flex; gap:8px}
  .quick input{flex:1; padding:11px 13px; border-radius:12px; border:1px solid var(--line);
    background:var(--panel-2); transition:.15s}
  .quick input:focus{border-color:var(--accent); background:var(--panel); outline:none}
  .quick button{padding:0 16px; border-radius:12px; color:#fff; font-weight:600;
    background:linear-gradient(135deg,var(--accent),var(--accent-2)); box-shadow:0 6px 16px rgba(91,91,214,.3)}
  .quick button:hover{filter:brightness(1.07)}

  .chips{display:flex; gap:7px; padding:0 16px 12px; flex-wrap:wrap}
  .chip{padding:6px 12px; border-radius:999px; font-size:12.5px; font-weight:600;
    border:1px solid var(--line); color:var(--ink-2); background:var(--panel-2); transition:.15s}
  .chip:hover{border-color:var(--accent); color:var(--accent)}
  .chip[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:#fff; box-shadow:0 4px 12px rgba(91,91,214,.28)}
  .search{margin:0 16px 10px; padding:9px 12px; border-radius:11px; border:1px solid var(--line);
    background:var(--panel-2); width:calc(100% - 32px)}
  .search:focus{outline:none; border-color:var(--accent)}

  .list-head{padding:2px 18px 8px; font-size:11.5px; font-weight:700; letter-spacing:.09em;
    text-transform:uppercase; color:var(--ink-2); display:flex; justify-content:space-between}
  .list{flex:1; overflow-y:auto; padding:0 12px 16px; display:flex; flex-direction:column; gap:8px}
  .list::-webkit-scrollbar{width:8px}
  .list::-webkit-scrollbar-thumb{background:var(--line); border-radius:8px}

  .task{display:flex; gap:11px; align-items:flex-start; padding:11px 12px; border-radius:13px;
    background:var(--panel-2); border:1px solid var(--line); transition:.16s; animation:pop .18s ease}
  @keyframes pop{from{opacity:0; transform:translateY(-4px)}to{opacity:1; transform:none}}
  .task:hover{border-color:var(--accent); transform:translateY(-1px); box-shadow:var(--shadow)}
  .task.dragging{opacity:.4}
  .task.done .t{color:var(--ink-2); text-decoration:line-through}
  .check{width:21px; height:21px; flex:0 0 21px; margin-top:1px; border-radius:7px; border:1.8px solid var(--line);
    background:var(--panel); display:grid; place-items:center; transition:.15s}
  .check svg{width:12px; height:12px; stroke:#fff; stroke-width:3.2; fill:none; stroke-linecap:round;
    stroke-linejoin:round; stroke-dasharray:22; stroke-dashoffset:22; transition:.2s}
  .task.done .check{background:var(--accent); border-color:var(--accent)}
  .task.done .check svg{stroke-dashoffset:0}
  .body{flex:1; min-width:0}
  .t{margin:0; font-size:14px; font-weight:600; letter-spacing:-.15px; word-break:break-word}
  .meta{display:flex; gap:6px; margin-top:5px; flex-wrap:wrap; align-items:center}
  .tag{font-size:11px; font-weight:600; padding:2px 7px; border-radius:6px; background:var(--panel);
    border:1px solid var(--line); color:var(--ink-2); display:inline-flex; gap:4px; align-items:center}
  .dot{width:7px; height:7px; border-radius:50%}
  .edit{opacity:0; padding:3px 6px; border-radius:8px; color:var(--ink-2); font-size:14px; transition:.15s}
  .task:hover .edit, .edit:focus-visible{opacity:1}
  .edit:hover{background:var(--accent-soft); color:var(--accent)}
  .empty{padding:34px 20px; text-align:center; color:var(--ink-2)}
  .empty b{display:block; color:var(--ink); font-size:14.5px; margin-bottom:4px}
  .empty span{font-size:12.5px}

  /* ---------- calendar ---------- */
  .cal{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); display:flex; flex-direction:column; overflow:hidden; min-width:0}
  .cal-head{display:flex; align-items:center; gap:12px; padding:16px 20px; border-bottom:1px solid var(--line); flex-wrap:wrap}
  .cal-head h2{margin:0; font-size:20px; letter-spacing:-.5px; min-width:190px}
  .cal-head h2 span{color:var(--ink-2); font-weight:500; font-size:15px}
  .nav{display:flex; gap:6px; margin-left:auto}
  .nav button, .icon-btn{padding:8px 13px; border-radius:10px; border:1px solid var(--line);
    background:var(--panel-2); font-size:13px; font-weight:600; color:var(--ink-2); transition:.15s}
  .nav button:hover, .icon-btn:hover{border-color:var(--accent); color:var(--accent); background:var(--accent-soft)}
  .nav .today-btn{color:#fff; background:linear-gradient(135deg,var(--accent),var(--accent-2)); border-color:transparent}
  .weekdays{display:grid; grid-template-columns:repeat(7,1fr); border-bottom:1px solid var(--line); background:var(--panel-2)}
  .weekdays div{padding:10px 0; text-align:center; font-size:11.5px; font-weight:700; letter-spacing:.07em;
    text-transform:uppercase; color:var(--ink-2)}
  .grid{flex:1; display:grid; grid-template-columns:repeat(7,1fr); grid-auto-rows:1fr; min-height:0}
  .cell{position:relative; padding:8px 8px 6px; border-right:1px solid var(--line); border-bottom:1px solid var(--line);
    text-align:left; display:flex; flex-direction:column; gap:5px; transition:.14s; min-height:0; overflow:hidden}
  .cell:nth-child(7n){border-right:0}
  .cell:hover{background:var(--accent-soft)}
  .cell.out{background:var(--panel-2); color:var(--ink-2)}
  .cell.out .num{opacity:.45}
  .cell.sel{background:var(--accent-soft); box-shadow:inset 0 0 0 2px var(--accent)}
  .cell.drop{background:var(--accent-soft); box-shadow:inset 0 0 0 2px var(--accent)}
  .num{width:27px; height:27px; display:grid; place-items:center; border-radius:50%; font-size:13.5px; font-weight:600}
  .cell.today .num{background:linear-gradient(135deg,var(--accent),var(--accent-2)); color:#fff; font-weight:800}
  .mini{display:flex; flex-direction:column; gap:3px; min-width:0}
  .pill{display:flex; gap:5px; align-items:center; font-size:11.5px; padding:3px 6px; border-radius:7px;
    background:var(--panel); border:1px solid var(--line); overflow:hidden}
  .pill i{width:6px; height:6px; border-radius:50%; flex:0 0 6px}
  .pill span{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .pill.d{opacity:.55; text-decoration:line-through}
  .more-n{font-size:11px; color:var(--ink-2); padding-left:5px; font-weight:600}
  .cell .count{position:absolute; top:9px; right:9px; font-size:10.5px; font-weight:700; color:var(--ink-2);
    background:var(--panel-2); border:1px solid var(--line); border-radius:999px; padding:1px 6px}

  /* ---------- modal ---------- */
  .backdrop{position:fixed; inset:0; background:rgba(12,14,30,.45); backdrop-filter:blur(3px);
    display:none; place-items:center; padding:18px; z-index:50}
  .backdrop.on{display:grid}
  .modal{width:min(440px,100%); background:var(--panel); border:1px solid var(--line); border-radius:20px;
    box-shadow:0 30px 70px rgba(0,0,0,.3); animation:pop .2s ease; overflow:hidden}
  .modal header{padding:18px 20px 0; display:flex; justify-content:space-between; align-items:center}
  .modal h3{margin:0; font-size:16.5px; letter-spacing:-.3px}
  .modal form{padding:16px 20px 20px; display:flex; flex-direction:column; gap:13px}
  label{font-size:12px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-2)}
  .field{display:flex; flex-direction:column; gap:6px}
  .field input, .field textarea, .field select{padding:11px 13px; border-radius:11px; border:1px solid var(--line);
    background:var(--panel-2); width:100%; resize:vertical}
  .field input:focus, .field textarea:focus, .field select:focus{outline:none; border-color:var(--accent); background:var(--panel)}
  .row{display:flex; gap:12px}
  .row .field{flex:1}
  .prios{display:flex; gap:8px}
  .prio-opt{flex:1; padding:9px; border-radius:11px; border:1px solid var(--line); background:var(--panel-2);
    font-size:13px; font-weight:600; color:var(--ink-2); display:flex; gap:7px; align-items:center; justify-content:center}
  .prio-opt[aria-pressed="true"]{border-color:var(--accent); background:var(--accent-soft); color:var(--ink)}
  .actions{display:flex; gap:10px; justify-content:flex-end; margin-top:4px}
  .btn{padding:11px 18px; border-radius:12px; font-weight:650; font-size:14px; border:1px solid var(--line);
    background:var(--panel-2); color:var(--ink-2)}
  .btn.primary{color:#fff; border-color:transparent; background:linear-gradient(135deg,var(--accent),var(--accent-2))}
  .btn.danger{color:#ff5c7a}
  .btn:hover{filter:brightness(1.05)}

  /* ---------- toast ---------- */
  .toast{position:fixed; left:50%; bottom:26px; transform:translate(-50%,140%); z-index:60;
    background:var(--ink); color:var(--bg); padding:11px 16px; border-radius:13px; font-size:13.5px;
    display:flex; gap:14px; align-items:center; box-shadow:0 14px 34px rgba(0,0,0,.3); transition:.28s cubic-bezier(.2,.9,.3,1.2)}
  .toast.on{transform:translate(-50%,0)}
  .toast button{color:#a5a5ff; font-weight:700; font-size:13.5px}

  @media (max-width:920px){
    .app{grid-template-columns:1fr; grid-template-rows:auto 1fr; height:auto; min-height:100vh; padding:12px; gap:12px}
    .cal{order:1} .panel{order:2; max-height:none}
    .list{max-height:420px}
    .mini{display:none}
    .cal-head h2{min-width:0; font-size:17px}
    .cell{padding:5px 4px}
    .count{display:none}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none !important; transition:none !important}}
</style>
</head>
<body>
<div class="app">
  <!-- ===== task panel ===== -->
  <aside class="panel">
    <div class="brand">
      <div class="logo">D</div>
      <div><h1>Daymark</h1><p>Plan the day, own the week</p></div>
      <div class="spacer"></div>
      <button class="icon-btn" id="themeBtn" aria-label="Toggle dark mode">☾</button>
    </div>

    <div class="today-card">
      <div class="ring">
        <svg width="56" height="56" viewBox="0 0 56 56">
          <circle cx="28" cy="28" r="23" fill="none" stroke="var(--line)" stroke-width="7"/>
          <circle id="ringFg" cx="28" cy="28" r="23" fill="none" stroke="url(#g)" stroke-width="7"
                  stroke-linecap="round" stroke-dasharray="144.5" stroke-dashoffset="144.5"/>
          <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="var(--accent)"/><stop offset="1" stop-color="var(--accent-2)"/>
          </linearGradient></defs>
        </svg>
        <span id="ringPct">0%</span>
      </div>
      <div>
        <div class="d" id="selLabel">—</div>
        <div class="s" id="selSub">—</div>
      </div>
    </div>

    <form class="quick" id="quickForm">
      <input id="quickInput" placeholder="Quick add for this day…" aria-label="Quick add task" autocomplete="off"/>
      <button type="submit">Add</button>
    </form>

    <div class="chips" role="group" aria-label="Filter tasks">
      <button class="chip" data-filter="day" aria-pressed="true">Selected day</button>
      <button class="chip" data-filter="week" aria-pressed="false">Next 7 days</button>
      <button class="chip" data-filter="all" aria-pressed="false">All</button>
      <button class="chip" data-filter="done" aria-pressed="false">Done</button>
    </div>
    <input class="search" id="search" placeholder="Search  ( / )" aria-label="Search tasks" autocomplete="off"/>

    <div class="list-head"><span id="listTitle">Tasks</span><span id="listCount"></span></div>
    <div class="list" id="list"></div>
  </aside>

  <!-- ===== calendar ===== -->
  <main class="cal">
    <div class="cal-head">
      <h2 id="monthLabel">Month <span>Year</span></h2>
      <div class="nav">
        <button id="prevBtn" aria-label="Previous month">‹ Prev</button>
        <button class="today-btn" id="todayBtn">Today</button>
        <button id="nextBtn" aria-label="Next month">Next ›</button>
        <button id="newBtn" aria-label="New task">＋ New task</button>
      </div>
    </div>
    <div class="weekdays" id="weekdays"></div>
    <div class="grid" id="grid" role="grid" aria-label="Month calendar"></div>
  </main>
</div>

<!-- ===== edit modal ===== -->
<div class="backdrop" id="backdrop">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <header>
      <h3 id="mTitle">New task</h3>
      <button class="icon-btn" id="closeBtn" aria-label="Close">✕</button>
    </header>
    <form id="taskForm">
      <div class="field">
        <label for="fTitle">Title</label>
        <input id="fTitle" required maxlength="120" placeholder="What needs doing?"/>
      </div>
      <div class="row">
        <div class="field"><label for="fDate">Date</label><input id="fDate" type="date" required/></div>
        <div class="field"><label for="fTime">Time</label><input id="fTime" type="time"/></div>
      </div>
      <div class="field">
        <label>Priority</label>
        <div class="prios" id="prios">
          <button type="button" class="prio-opt" data-p="low" aria-pressed="false"><i class="dot" style="background:var(--low)"></i>Low</button>
          <button type="button" class="prio-opt" data-p="med" aria-pressed="true"><i class="dot" style="background:var(--med)"></i>Medium</button>
          <button type="button" class="prio-opt" data-p="high" aria-pressed="false"><i class="dot" style="background:var(--high)"></i>High</button>
        </div>
      </div>
      <div class="field"><label for="fNotes">Notes</label><textarea id="fNotes" rows="3" maxlength="400" placeholder="Optional details…"></textarea></div>
      <div class="actions">
        <button type="button" class="btn danger" id="delBtn" hidden>Delete</button>
        <button type="button" class="btn" id="cancelBtn">Cancel</button>
        <button type="submit" class="btn primary">Save task</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast"><span id="toastMsg"></span><button id="toastUndo" hidden>Undo</button></div>

<script>
(function(){
  "use strict";
  const $ = (s,r)=> (r||document).querySelector(s);
  const $$ = (s,r)=> Array.prototype.slice.call((r||document).querySelectorAll(s));
  const KEY = "daymark.tasks.v1", THEME = "daymark.theme";
  const PRIO = {high:"var(--high)", med:"var(--med)", low:"var(--low)"};
  const DOW = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];

  /* ---------- date helpers (local time, no UTC drift) ---------- */
  const pad = n => String(n).padStart(2,"0");
  const iso = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
  const parse = s => { const p = s.split("-").map(Number); return new Date(p[0],p[1]-1,p[2]); };
  const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
  const startOfWeek = d => addDays(d, -((d.getDay()+6)%7)); // Monday-first
  const today = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
  const longDate = d => d.toLocaleDateString(undefined,{weekday:"long", month:"long", day:"numeric"});
  const shortDate = d => d.toLocaleDateString(undefined,{month:"short", day:"numeric"});

  /* ---------- state ---------- */
  let tasks = load(), sel = iso(today()), view = {y:today().getFullYear(), m:today().getMonth()};
  let filter = "day", query = "", editingId = null, prio = "med", lastDeleted = null;

  function load(){
    try{ const raw = localStorage.getItem(KEY); if(raw) return JSON.parse(raw); }catch(e){}
    return seed();
  }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(tasks)); }catch(e){} }
  function seed(){
    const t = today(), s = [
      ["Design review with the team","0","high","Bring the latest mockups"],
      ["Ship calendar drag & drop","0","high",""],
      ["Buy groceries","0","low","Milk, spinach, coffee"],
      ["Gym — upper body","1","med",""],
      ["Dentist appointment","2","high","Reach 10 mins early"],
      ["Plan sprint backlog","3","med",""],
      ["Call parents","4","low",""],
      ["Read 20 pages","5","low",""]
    ];
    return s.map((r,i)=>({id:"t"+Date.now()+i, title:r[0], date:iso(addDays(t,+r[1])),
      time:["09:30","11:00","16:00","18:30","10:15","09:00","20:00","22:00"][i], prio:r[2], notes:r[3], done:false}));
  }

  /* ---------- filtering ---------- */
  function visible(){
    const selDate = parse(sel), weekEnd = addDays(selDate,7);
    let out = tasks.filter(t=>{
      if(query && t.title.toLowerCase().indexOf(query)<0 && (t.notes||"").toLowerCase().indexOf(query)<0) return false;
      if(filter==="day")   return t.date===sel;
      if(filter==="week")  return t.date>=sel && t.date<iso(weekEnd);
      if(filter==="done")  return !!t.done;
      return true;
    });
    const rank = {high:0, med:1, low:2};
    return out.sort((a,b)=> a.date.localeCompare(b.date) || a.done-b.done
      || rank[a.prio]-rank[b.prio] || (a.time||"99:99").localeCompare(b.time||"99:99"));
  }

  /* ---------- rendering ---------- */
  function render(){ renderPanel(); renderCalendar(); }

  function renderPanel(){
    const d = parse(sel), dayTasks = tasks.filter(t=>t.date===sel);
    const done = dayTasks.filter(t=>t.done).length, pct = dayTasks.length ? Math.round(done/dayTasks.length*100) : 0;
    $("#selLabel").textContent = longDate(d);
    $("#selSub").textContent = dayTasks.length ? done+" of "+dayTasks.length+" done · "+pct+"% complete"
                                               : "Nothing scheduled — add something";
    $("#ringPct").textContent = pct+"%";
    $("#ringFg").setAttribute("stroke-dashoffset", String(144.5*(1-pct/100)));

    const list = visible();
    $("#listTitle").textContent = filter==="day" ? "Tasks · "+shortDate(d)
      : filter==="week" ? "Next 7 days" : filter==="done" ? "Completed" : "All tasks";
    $("#listCount").textContent = list.length ? list.filter(t=>!t.done).length+" open" : "";

    $("#list").innerHTML = list.length ? list.map(t=>{
      const dd = parse(t.date);
      const when = filter==="day" ? (t.time||"Anytime")
        : shortDate(dd)+(t.time?" · "+t.time:"");
      return '<div class="task'+(t.done?" done":"")+'" draggable="true" data-id="'+t.id+'">'
        + '<button class="check" data-act="toggle" aria-label="Toggle complete" aria-pressed="'+t.done+'">'
        + '<svg viewBox="0 0 16 16"><polyline points="3,8.5 6.5,12 13,4.5"/></svg></button>'
        + '<div class="body"><p class="t">'+esc(t.title)+'</p><div class="meta">'
        + '<span class="tag">'+when+'</span>'
        + '<span class="tag"><i class="dot" style="background:'+PRIO[t.prio]+'"></i>'
        + (t.prio==="high"?"High":t.prio==="low"?"Low":"Medium")+'</span>'
        + (t.notes?'<span class="tag" title="'+esc(t.notes)+'">✎ note</span>':'')
        + '</div></div>'
        + '<button class="edit" data-act="edit" aria-label="Edit task">✎</button></div>';
    }).join("") : '<div class="empty"><b>'+(query?"No matches":"All clear here")
        +'</b><span>'+(query?"Try another keyword.":"Hit N or use the box above to add your first task.")+'</span></div>';
  }

  function renderCalendar(){
    $("#monthLabel").innerHTML = viewMonthName()+' <span>'+view.y+'</span>';
    const first = new Date(view.y, view.m, 1), gridStart = startOfWeek(first);
    const byDate = {};
    tasks.forEach(t=>{ (byDate[t.date] = byDate[t.date]||[]).push(t); });
    const t0 = iso(today()), selIso = sel;
    let html = "";
    for(let i=0;i<42;i++){
      const d = addDays(gridStart,i), key = iso(d), list = byDate[key]||[];
      const cls = ["cell"];
      if(d.getMonth()!==view.m) cls.push("out");
      if(key===t0) cls.push("today");
      if(key===selIso) cls.push("sel");
      const open = list.filter(t=>!t.done).length;
      const pills = list.slice(0,3).map(t=>
        '<div class="pill'+(t.done?" d":"")+'"><i style="background:'+PRIO[t.prio]+'"></i><span>'+esc(t.title)+'</span></div>').join("");
      html += '<button class="'+cls.join(" ")+'" data-date="'+key+'" role="gridcell" '
        + 'aria-label="'+longDate(d)+', '+list.length+' tasks" aria-selected="'+(key===selIso)+'">'
        + '<span class="num">'+d.getDate()+'</span>'
        + (open?'<span class="count">'+open+'</span>':'')
        + '<span class="mini">'+pills+(list.length>3?'<span class="more-n">+'+(list.length-3)+' more</span>':'')+'</span>'
        + '</button>';
    }
    $("#grid").innerHTML = html;
  }

  function viewMonthName(){ return new Date(view.y, view.m, 1).toLocaleDateString(undefined,{month:"long"}); }
  function esc(s){ return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

  /* ---------- actions ---------- */
  function goDay(key){
    sel = key; const d = parse(key);
    view = {y:d.getFullYear(), m:d.getMonth()}; // follow the selection
    render();
  }
  function addTask(title, date, opts){
    const t = Object.assign({id:"t"+Date.now()+Math.random().toString(36).slice(2,6), title:title,
      date:date, time:"", prio:"med", notes:"", done:false}, opts||{});
    tasks.push(t); save(); render(); return t;
  }
  function removeTask(id){
    const i = tasks.findIndex(t=>t.id===id);
    if(i<0) return;
    lastDeleted = {task:tasks[i], index:i};
    tasks.splice(i,1); save(); render();
    toast("Task deleted", true);
  }
  let toastTimer;
  function toast(msg, undo){
    clearTimeout(toastTimer);
    $("#toastMsg").textContent = msg;
    $("#toastUndo").hidden = !undo;
    $("#toast").classList.add("on");
    toastTimer = setTimeout(()=>$("#toast").classList.remove("on"), undo?5200:2200);
  }

  /* ---------- modal ---------- */
  function openModal(task){
    editingId = task ? task.id : null;
    $("#mTitle").textContent = task ? "Edit task" : "New task";
    $("#fTitle").value = task ? task.title : "";
    $("#fDate").value = task ? task.date : sel;
    $("#fTime").value = task ? (task.time||"") : "";
    $("#fNotes").value = task ? (task.notes||"") : "";
    setPrio(task ? task.prio : "med");
    $("#delBtn").hidden = !task;
    $("#backdrop").classList.add("on");
    setTimeout(()=>$("#fTitle").focus(), 30);
  }
  function closeModal(){ $("#backdrop").classList.remove("on"); editingId = null; }
  function setPrio(p){ prio = p; $$(".prio-opt").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.p===p))); }

  /* ---------- events ---------- */
  $("#quickForm").addEventListener("submit", e=>{
    e.preventDefault();
    const v = $("#quickInput").value.trim(); if(!v) return;
    addTask(v, sel); $("#quickInput").value = "";
    toast("Added to "+shortDate(parse(sel)));
  });
  $$(".chip").forEach(c=>c.addEventListener("click", ()=>{
    filter = c.dataset.filter;
    $$(".chip").forEach(x=>x.setAttribute("aria-pressed", String(x===c)));
    renderPanel();
  }));
  $("#search").addEventListener("input", e=>{ query = e.target.value.trim().toLowerCase(); renderPanel(); });

  $("#grid").addEventListener("click", e=>{
    const cell = e.target.closest(".cell"); if(cell) goDay(cell.dataset.date);
  });
  // drag a task onto a day to reschedule
  $("#list").addEventListener("dragstart", e=>{
    const card = e.target.closest(".task"); if(!card) return;
    card.classList.add("dragging"); e.dataTransfer.setData("text/plain", card.dataset.id);
    e.dataTransfer.effectAllowed = "move";
  });
  $("#list").addEventListener("dragend", e=>{
    const card = e.target.closest(".task"); if(card) card.classList.remove("dragging");
    $$(".cell.drop").forEach(c=>c.classList.remove("drop"));
  });
  $("#grid").addEventListener("dragover", e=>{
    const cell = e.target.closest(".cell"); if(!cell) return;
    e.preventDefault(); cell.classList.add("drop"); e.dataTransfer.dropEffect = "move";
  });
  $("#grid").addEventListener("dragleave", e=>{ const c = e.target.closest(".cell"); if(c) c.classList.remove("drop"); });
  $("#grid").addEventListener("drop", e=>{
    const cell = e.target.closest(".cell"); if(!cell) return;
    e.preventDefault(); cell.classList.remove("drop");
    const id = e.dataTransfer.getData("text/plain"), t = tasks.find(x=>x.id===id);
    if(t && t.date!==cell.dataset.date){ t.date = cell.dataset.date; save(); render(); toast("Moved to "+shortDate(parse(t.date))); }
  });

  $("#list").addEventListener("click", e=>{
    const btn = e.target.closest("[data-act]"); if(!btn) return;
    const card = btn.closest(".task"), t = tasks.find(x=>x.id===card.dataset.id); if(!t) return;
    if(btn.dataset.act==="toggle"){ t.done = !t.done; save(); render(); }
    else openModal(t);
  });

  $("#prevBtn").addEventListener("click", ()=>{ view.m--; if(view.m<0){view.m=11; view.y--;} renderCalendar(); });
  $("#nextBtn").addEventListener("click", ()=>{ view.m++; if(view.m>11){view.m=0; view.y++;} renderCalendar(); });
  $("#todayBtn").addEventListener("click", ()=>{ const t = today(); goDay(iso(t)); });
  $("#newBtn").addEventListener("click", ()=>openModal(null));
  $("#closeBtn").addEventListener("click", closeModal);
  $("#cancelBtn").addEventListener("click", closeModal);
  $("#backdrop").addEventListener("mousedown", e=>{ if(e.target===$("#backdrop")) closeModal(); });
  $$(".prio-opt").forEach(b=>b.addEventListener("click", ()=>setPrio(b.dataset.p)));
  $("#delBtn").addEventListener("click", ()=>{ if(editingId){ removeTask(editingId); closeModal(); } });

  $("#taskForm").addEventListener("submit", e=>{
    e.preventDefault();
    const data = {title:$("#fTitle").value.trim(), date:$("#fDate").value,
                  time:$("#fTime").value, prio:prio, notes:$("#fNotes").value.trim()};
    if(!data.title || !data.date) return;
    if(editingId){ Object.assign(tasks.find(t=>t.id===editingId), data); toast("Task updated"); }
    else { addTask(data.title, data.date, data); toast("Task created"); }
    save(); sel = data.date; goDay(data.date); closeModal();
  });
  $("#toastUndo").addEventListener("click", ()=>{
    if(lastDeleted){ tasks.splice(lastDeleted.index, 0, lastDeleted.task); lastDeleted = null; save(); render(); }
    $("#toast").classList.remove("on");
  });

  // theme
  function applyTheme(t){
    document.documentElement.setAttribute("data-theme", t);
    $("#themeBtn").textContent = t==="dark" ? "☀" : "☾";
    try{ localStorage.setItem(THEME, t); }catch(e){}
  }
  $("#themeBtn").addEventListener("click", ()=>{
    applyTheme(document.documentElement.getAttribute("data-theme")==="dark" ? "light" : "dark");
  });

  // keyboard shortcuts
  document.addEventListener("keydown", e=>{
    const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
    if(e.key==="Escape"){ closeModal(); return; }
    if(typing) return;
    if(e.key==="n" || e.key==="N"){ e.preventDefault(); openModal(null); }
    else if(e.key==="/"){ e.preventDefault(); $("#search").focus(); }
    else if(e.key==="t" || e.key==="T"){ goDay(iso(today())); }
    else if(e.key==="ArrowLeft"){ goDay(iso(addDays(parse(sel), e.shiftKey?-7:-1))); }
    else if(e.key==="ArrowRight"){ goDay(iso(addDays(parse(sel), e.shiftKey?7:1))); }
    else if(e.key==="ArrowUp"){ goDay(iso(addDays(parse(sel), -7))); }
    else if(e.key==="ArrowDown"){ goDay(iso(addDays(parse(sel), 7))); }
  });

  /* ---------- boot ---------- */
  $("#weekdays").innerHTML = DOW.map(d=>"<div>"+d+"</div>").join("");
  applyTheme((function(){ try{ return localStorage.getItem(THEME); }catch(e){ return null; } })()
             || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
  render();
})();
</script>
</body>
</html>
