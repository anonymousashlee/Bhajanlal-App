<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vice City Arcade — 1986</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#05060f;font-family:'Segoe UI',sans-serif;color:#e8e8ff}
canvas{display:block}
#hud{position:fixed;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;pointer-events:none;font-size:13px;text-shadow:0 0 6px #000}
#hud .box{background:rgba(5,6,15,.6);border:1px solid rgba(0,240,255,.3);border-radius:10px;padding:6px 10px;backdrop-filter:blur(4px)}
#msg{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:rgba(5,6,15,.75);border:1px solid #ff4f9a;border-radius:10px;padding:8px 16px;font-size:13px;pointer-events:none;transition:opacity .3s}
#minimap{position:fixed;bottom:16px;right:16px;width:120px;height:120px;border:2px solid rgba(0,240,255,.5);border-radius:8px;background:#0a0f1f}
#help{position:fixed;top:10px;left:50%;transform:translateX(-50%);font-size:11px;opacity:.7;pointer-events:none}
</style></head><body>
<canvas id="g"></canvas>
<div id="hud">
<div class="box">💰 <span id="money">0</span></div>
<div class="box">❤ <span id="hp">100</span>  🔫 <span id="ammo">30</span></div>
<div class="box" id="wanted">★ 0</div>
<div class="box" id="radio">📻 Flash FM</div>
</div>
<div id="help">WASD move/drive · Mouse aim/shoot · E enter/exit car · R radio · Shift sprint · M map</div>
<div id="msg"></div>
<canvas id="minimap"></canvas>
<script>
'use strict';
const cv=document.getElementById('g'),cx=cv.getContext('2d');
const mm=document.getElementById('minimap'),mc=mm.getContext('2d');
let VW=0,VH=0;function resize(){VW=cv.width=innerWidth;VH=cv.height=innerHeight;}addEventListener('resize',resize);resize();
const TAU=Math.PI*2,rnd=(a,b)=>a+Math.random()*(b-a),ri=(a,b)=>(a+Math.random()*(b-a+1))|0,clamp=(v,a,b)=>v<a?a:v>b?b:v;
const dist=(ax,ay,bx,by)=>Math.hypot(ax-bx,ay-by);
const WORLD=2400,ROAD=130,GRID=320;
const buildings=[],trees=[],peds=[],cars=[],bullets=[],parts=[],pickups=[];
const keys={};let mouse={x:0,y:0,down:false};
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key===' ' )e.preventDefault();});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY;});
addEventListener('mousedown',()=>mouse.down=true);addEventListener('mouseup',()=>mouse.down=false);
// world gen
function onRoad(x,y){const gx=x%GRID,gy=y%GRID;return (gx<ROAD||gx>GRID-ROAD)||(gy<ROAD||gy>GRID-ROAD);}
for(let i=0;i<90;i++){let x,y,w,h;do{x=ri(60,WORLD-260);y=ri(60,WORLD-260);w=ri(60,150);h=ri(60,150);}while(onRoad(x+w/2,y+h/2));buildings.push({x,y,w,h,c:`hsl(${ri(200,320)},40%,${ri(18,32)}%)`});}
for(let i=0;i<120;i++){let x,y;do{x=ri(40,WORLD-40);y=ri(40,WORLD-40);}while(onRoad(x,y));trees.push({x,y});}
// peds
for(let i=0;i<60;i++){let x,y;do{x=ri(40,WORLD-40);y=ri(40,WORLD-40);}while(onRoad(x,y));peds.push({x,y,vx:0,vy:0,spd:rnd(.3,.7),dir:rnd(0,TAU),hp:30,alive:true,panic:0,color:`hsl(${ri(0,360)},60%,60%)`});}
// cars
const CARCOLS=['#ff4f9a','#22c7c7','#f2b134','#7a5cf6','#e8563f','#3f8ef0','#f0f0f5','#2fbf71'];
for(let i=0;i<18;i++){let x,y;do{x=ri(ROAD,WORLD-ROAD);y=ri(ROAD,WORLD-ROAD);}while(!onRoad(x,y));cars.push({x,y,a:rnd(0,TAU),spd:0,health:100,player:false,col:CARCOLS[i%CARCOLS.length],vx:0,vy:0});}
// pickups (packages)
for(let i=0;i<5;i++){let x,y;do{x=ri(40,WORLD-40);y=ri(40,WORLD-40);}while(onRoad(x,y));pickups.push({x,y,taken:false});}
const player={x:WORLD/2,y:WORLD/2,a:0,spd:0,onFoot:true,car:null,hp:100,ammo:30,money:0,wanted:0,stars:0,wantTimer:0,shootCd:0,sprint:false};
const delivery={x:WORLD/2+400,y:WORLD/2+400,active:false};
let msgT=0,msgText='';
function showMsg(t){msgText=t;msgT=2.5;document.getElementById('msg').textContent=t;document.getElementById('msg').style.opacity=1;}
let radioIdx=0,radioNames=['Flash FM','V-Rock','Fever 105','Radio Espantoso','VCPR'];
let audioCtx=null,ambient=null,ambientGain=null;
function initAudio(){if(audioCtx)return;try{audioCtx=new (window.AudioContext||window.webkitAudioContext)();ambientGain=audioCtx.createGain();ambientGain.gain.value=.04;ambientGain.connect(audioCtx.destination);ambientLoop();}catch(e){}}
function ambientLoop(){if(!audioCtx)return;const now=audioCtx.currentTime;const notes=[261,294,329,392,440,523];const n=notes[ri(0,notes.length-1)];const o=audioCtx.createOscillator();o.type='triangle';o.frequency.value=n/2;const g=audioCtx.createGain();g.gain.setValueAtTime(.08,now);g.gain.exponentialRampToValueAtTime(.0001,now+1.2);o.connect(g);g.connect(ambientGain);o.start(now);o.stop(now+1.2);setTimeout(ambientLoop,900+rnd(0,600));}
function jingle(){if(!audioCtx)return;const now=audioCtx.currentTime;[523,659,784].forEach((f,i)=>{const o=audioCtx.createOscillator();o.type='square';o.frequency.value=f;const g=audioCtx.createGain();g.gain.setValueAtTime(.12,now+i*.12);g.gain.exponentialRampToValueAtTime(.0001,now+i*.12+.18);o.connect(g);g.connect(audioCtx.destination);o.start(now+i*.12);o.stop(now+i*.12+.18);});}
// input: E enter/exit, R radio
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(k==='e'){
    if(player.onFoot){let nearest=null,nd=999;for(const c of cars){const d=dist(player.x,player.y,c.x,c.y);if(d<40&&d<nd){nd=d;nearest=c;}}if(nearest){nearest.player=true;player.car=nearest;player.onFoot=false;showMsg('Entered vehicle');}}
    else{const c=player.car;c.player=false;player.x=c.x+30;player.y=c.y;player.car=null;player.onFoot=true;showMsg('Exited vehicle');}
  }
  if(k==='r'){radioIdx=(radioIdx+1)%radioNames.length;document.getElementById('radio').textContent='📻 '+radioNames[radioIdx];jingle();}
});
let cam={x:player.x,y:player.y};
function update(dt){
  // movement
  const speedMul=player.onFoot?(keys['shift']?1.6:1):1;
  if(player.onFoot){
    let mx=0,my=0;if(keys['w'])my=-1;if(keys['s'])my=1;if(keys['a'])mx=-1;if(keys['d'])mx=1;
    const len=Math.hypot(mx,my)||1;mx/=len;my/=len;
    const acc=0.6*speedMul;player.spd=Math.min(player.spd+acc*dt*60,4*speedMul);if(mx===0&&my===0)player.spd*=0.85;
    player.x+=mx*player.spd;player.y+=my*player.spd;
    if(mx||my)player.a=Math.atan2(my,mx);
  } else {
    const c=player.car;
    let thr=0;if(keys['w'])thr=1;if(keys['s'])thr=-0.6;
    c.spd+=thr*0.3*dt*60;c.spd*=0.98;c.spd=clamp(c.spd,-3,6);
    if(keys['a'])c.a-=0.05*dt*60*(1+Math.abs(c.spd)*.2);
    if(keys['d'])c.a+=0.05*dt*60*(1+Math.abs(c.spd)*.2);
    c.x+=Math.cos(c.a)*c.spd;c.y+=Math.sin(c.a)*c.spd;
    player.x=c.x;player.y=c.y;player.a=c.a;
  }
  player.x=clamp(player.x,20,WORLD-20);player.y=clamp(player.y,20,WORLD-20);
  // shooting
  player.shootCd=Math.max(0,player.shootCd-dt);
  if(mouse.down&&player.ammo>0&&player.shootCd<=0){
    player.ammo--;player.shootCd=0.18;
    const wx=mouse.x+cam.x-VW/2,wy=mouse.y+cam.y-VH/2;
    const a=Math.atan2(wy-player.y,wx-player.x);
    bullets.push({x:player.x,y:player.y,vx:Math.cos(a)*14,vy:Math.sin(a)*14,life:1.2,fromPlayer:true});
    // wanted bump
    player.wantTimer=5;player.wanted=Math.min(5,player.wanted+0.15);
  }
  // bullets
  for(const b of bullets){b.x+=b.vx;b.y+=b.vy;b.life-=dt;if(b.life<=0)b.dead=true;}
  // bullet hits
  for(const b of bullets){
    if(b.dead||!b.fromPlayer)continue;
    for(const p of peds){if(!p.alive)continue;if(dist(b.x,b.y,p.x,p.y)<12){p.hp-=40;p.alive=p.hp>0;if(!p.alive){player.money+=50;player.wantTimer=8;player.wanted=Math.min(5,player.wanted+0.6);parts.push({x:p.x,y:p.y,t:0.6});}b.dead=true;}}
    for(const c of cars){if(c.player)continue;if(dist(b.x,b.y,c.x,c.y)<22){c.health-=25;if(c.health<=0){player.money+=100;player.wantTimer=8;player.wanted=Math.min(5,player.wanted+0.8);parts.push({x:c.x,y:c.y,t:0.8});cars.splice(cars.indexOf(c),1);}b.dead=true;}}
  }
  bullets=bullets.filter(b=>!b.dead&&b.x>0&&b.x<WORLD&&b.y>0&&b.y<WORLD);
  // peds ai
  for(const p of peds){
    if(!p.alive)continue;
    if(p.panic>0){p.panic-=dt;p.vx=Math.cos(p.dir)*p.spd*3;p.vy=Math.sin(p.dir)*p.spd*3;}
    else {p.dir+=rnd(-.05,.05);p.vx=Math.cos(p.dir)*p.spd;p.vy=Math.sin(p.dir)*p.spd;}
    // flee from player if close
    if(dist(p.x,p.y,player.x,player.y)<120){p.panic=1.5;p.dir=Math.atan2(p.y-player.y,p.x-player.x);}
    p.x=clamp(p.x+p.vx,WORLD?0:0,WORLD);p.y=clamp(p.y+p.vy,0,WORLD);
  }
  // wanted decay
  player.wantTimer=Math.max(0,player.wantTimer-dt);
  if(player.wantTimer<=0)player.wanted=Math.max(0,player.wanted-dt*0.3);
  player.stars=Math.ceil(player.wanted);
  // police spawn
  if(player.wanted>=1&&Math.random()<player.wanted*0.02*dt*60){
    const ang=rnd(0,TAU);const d=400;
    cars.push({x:clamp(player.x+Math.cos(ang)*d,ROAD,WORLD-ROAD),y:clamp(player.y+Math.sin(ang)*d,ROAD,WORLD-ROAD),a:Math.atan2(player.y-(player.y+Math.sin(ang)*d),player.x-(player.x+Math.cos(ang)*d)),spd:4,health:100,player:false,col:'#1a3a8f',vx:0,vy:0,police:true});
  }
  // police chase
  for(const c of cars){
    if(!c.police)continue;
    const a=Math.atan2(player.y-c.y,player.x-c.x);c.a=a;c.spd=4.5;c.x+=Math.cos(c.a)*c.spd;c.y+=Math.sin(c.a)*c.spd;
    if(dist(c.x,c.y,player.x,player.y)<26){player.hp-=0.5*dt*60;if(player.hp<=0){player.hp=100;player.money=Math.max(0,player.money-200);player.x=WORLD/2;player.y=WORLD/2;player.wanted=0;player.wantTimer=0;showMsg('Busted! Lost $200');}}
  }
  // pickups
  for(const pk of pickups){if(pk.taken)continue;if(dist(player.x,player.y,pk.x,pk.y)<24){pk.taken=true;player.money+=250;showMsg('+ Package $250');if(pickups.every(p=>p.taken)){delivery.active=true;showMsg('Deliver to marker!');}}}
  // delivery
  if(delivery.active&&dist(player.x,player.y,delivery.x,delivery.y)<30){delivery.active=false;player.money+=2000;player.wanted=0;player.wantTimer=0;showMsg('Mission complete! +$2000');for(const pk of pickups)pk.taken=false;for(let i=0;i<5;i++){let x,y;do{x=ri(40,WORLD-40);y=ri(40,WORLD-40);}while(onRoad(x,y));pickups[i]={x,y,taken:false};}}
  // parts
  for(const p of parts){p.t-=dt;if(p.t<=0)p.dead=true;}parts=parts.filter(p=>!p.dead);
  // cam
  cam.x+=(player.x-cam.x)*0.12;cam.y+=(player.y-cam.y)*0.12;
  cam.x=clamp(cam.x,VW/2,WORLD-VW/2);cam.y=clamp(cam.y,VH/2,WORLD-VH/2);
  // hud
  document.getElementById('money').textContent=player.money;
  document.getElementById('hp').textContent=Math.ceil(player.hp);
  document.getElementById('ammo').textContent=player.ammo;
  document.getElementById('wanted').textContent='★ '+player.stars+(player.wanted>0?' ('+player.wanted.toFixed(1)+')':'');
  // msg fade
  if(msgT>0){msgT-=dt;if(msgT<=0){msgT=0;document.getElementById('msg').style.opacity=0;}}
  // reload ammo
  if(player.ammo<=0&&Math.random()<0.01){player.ammo=30;showMsg('Ammo refilled');}
}
function draw(){
  cx.fillStyle='#0a1a14';cx.fillRect(0,0,VW,VH);
  const sx=cam.x-VW/2,sy=cam.y-VH/2;
  // water border
  cx.fillStyle='#0a2a4a';cx.fillRect(-sx,-sy,WORLD+400,80);cx.fillRect(-sx,WORLD-80-sy,WORLD+400,80+400);
  // grass base
  cx.fillStyle='#1a3a2a';cx.fillRect(-sx,-sy,WORLD,WORLD);
  // roads
  cx.fillStyle='#2a2a30';for(let x=0;x<WORLD;x+=GRID)cx.fillRect(x-sx+GRID/2-ROAD/2,0-sy,ROAD,WORLD);for(let y=0;y<WORLD;y+=GRID)cx.fillRect(0-sx,y-sy+GRID/2-ROAD/2,WORLD,ROAD);
  // road markings
  cx.strokeStyle='rgba(255,220,120,.35)';cx.lineWidth=2;cx.setLineDash([12,16]);
  for(let x=ROAD/2;x<WORLD;x+=GRID){cx.beginPath();cx.moveTo(x-sx,0-sy);cx.lineTo(x-sx,WORLD-sy);cx.stroke();}
  for(let y=ROAD/2;y<WORLD;y+=GRID){cx.beginPath();cx.moveTo(0-sx,y-sy);cx.lineTo(WORLD-sx,y-sy);cx.stroke();}
  cx.setLineDash([]);
  // buildings
  for(const b of buildings){cx.fillStyle=b.c;cx.fillRect(b.x-sx,b.y-sy,b.w,b.h);cx.strokeStyle='rgba(0,0,0,.4)';cx.strokeRect(b.x-sx,b.y-sy,b.w,b.h);cx.fillStyle='rgba(255,220,120,.15)';for(let yy=b.y+8;yy<b.y+b.h-8;yy+=14)for(let xx=b.x+8;xx<b.x+b.w-8;xx+=14)if(Math.random()<.6)cx.fillRect(xx-sx,yy-sy,6,8);}
  // trees
  for(const t of trees){cx.fillStyle='#0f6b3a';cx.beginPath();cx.arc(t.x-sx,t.y-sy,12,0,TAU);cx.fill();cx.fillStyle='#3a2a1a';cx.fillRect(t.x-2-sx,t.y-2-sy,4,6);}
  // pickups
  for(const pk of pickups){if(pk.taken)continue;cx.fillStyle='#ff4f9a';cx.shadowColor='#ff4f9a';cx.shadowBlur=12;cx.beginPath();cx.arc(pk.x-sx,pk.y-sy,9,0,TAU);cx.fill();cx.shadowBlur=0;cx.fillStyle='#fff';cx.font='bold 10px sans-serif';cx.textAlign='center';cx.fillText('$',pk.x-sx,pk.y-sy+4);}
  // delivery marker
  if(delivery.active){cx.strokeStyle='#00f0ff';cx.lineWidth=3;cx.shadowColor='#00f0ff';cx.shadowBlur=16;cx.beginPath();cx.arc(delivery.x-sx,delivery.y-sy,22,0,TAU);cx.stroke();cx.shadowBlur=0;cx.fillStyle='rgba(0,240,255,.15)';cx.fill();}
  // cars
  for(const c of cars){cx.save();cx.translate(c.x-sx,c.y-sy);cx.rotate(c.a);cx.fillStyle=c.col;cx.fillRect(-18,-10,36,20);cx.fillStyle='rgba(0,0,0,.5)';cx.fillRect(8,-8,6,16);if(c.police){cx.fillStyle='#fff';cx.fillRect(-10,-6,8,4);cx.fillStyle='#1a3a8f';cx.fillRect(2,-6,8,4);}cx.restore();}
  // peds
  for(const p of peds){if(!p.alive)continue;cx.fillStyle=p.color;cx.beginPath();cx.arc(p.x-sx,p.y-sy,6,0,TAU);cx.fill();}
  // player
  cx.save();cx.translate(player.x-sx,player.y-sy);
  if(player.onFoot){cx.fillStyle='#f2b134';cx.beginPath();cx.arc(0,0,8,0,TAU);cx.fill();cx.strokeStyle='#000';cx.lineWidth=2;cx.beginPath();cx.moveTo(0,0);cx.lineTo(Math.cos(player.a)*14,Math.sin(player.a)*14);cx.stroke();}
  else{cx.rotate(player.a);cx.fillStyle='#ff2d2d';cx.fillRect(-20,-11,40,22);cx.fillStyle='#222';cx.fillRect(10,-9,8,18);}
  cx.restore();
  // bullets
  cx.fillStyle='#ffe066';for(const b of bullets){cx.beginPath();cx.arc(b.x-sx,b.y-sy,3,0,TAU);cx.fill();}
  // parts
  for(const p of parts){cx.globalAlpha=p.t;cx.fillStyle='#ff4f9a';cx.beginPath();cx.arc(p.x-sx,p.y-sy,12*(1-p.t/0.6+0.3),0,TAU);cx.fill();cx.globalAlpha=1;}
  // vignette
  const g=cx.createRadialGradient(VW/2,VH/2,VW*.3,VW/2,VH/2,VW*.75);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.5)');cx.fillStyle=g;cx.fillRect(0,0,VW,VH);
  // minimap
  mc.fillStyle='#0a0f1f';mc.fillRect(0,0,120,120);
  const sc=120/WORLD;
  mc.fillStyle='#1a3a2a';mc.fillRect(0,0,120,120);
  for(const b of buildings){mc.fillStyle='rgba(120,120,160,.6)';mc.fillRect(b.x*sc,b.y*sc,b.w*sc,b.h*sc);}
  for(const pk of pickups){if(pk.taken)continue;mc.fillStyle='#ff4f9a';mc.fillRect(pk.x*sc-1,pk.y*sc-1,3,3);}
  if(delivery.active){mc.fillStyle='#00f0ff';mc.fillRect(delivery.x*sc-2,delivery.y*sc-2,4,4);}
  mc.fillStyle='#ff2d2d';mc.fillRect(player.x*sc-2,player.y*sc-2,4,4);
  mc.strokeStyle='rgba(255,255,255,.2)';mc.strokeRect(0,0,120,120);
}
let last=performance.now();
function loop(now){const dt=Math.min(0.05,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop);}
requestAnimationFrame(loop);
// init audio on first interaction
addEventListener('click',initAudio,{once:true});addEventListener('keydown',initAudio,{once:true});
</script></body></html>
