<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Do — A calm to-do app</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f7fb;
    --surface: #ffffff;
    --surface-2: #f0f2f7;
    --surface-3: #e7eaf2;
    --text: #111827;
    --text-dim: #5b6478;
    --text-subtle: #94a0b8;
    --border: rgba(17,24,39,.08);
    --border-strong: rgba(17,24,39,.14);
    --accent: #e8339e;
    --accent-2: #f472b6;
    --accent-soft: rgba(232,51,158,.12);
    --accent-glow: rgba(232,51,158,.35);
    --danger: #ef4444;
    --danger-soft: rgba(239,68,68,.12);
    --success: #10b981;
    --success-soft: rgba(16,185,129,.12);
    --warning: #f59e0b;
    --warning-soft: rgba(245,158,11,.14);
    --info: #0ea5e9;
    --shadow-sm: 0 1px 2px rgba(17,24,39,.05);
    --shadow: 0 8px 24px rgba(17,24,39,.08);
    --shadow-lg: 0 24px 60px rgba(17,24,39,.16);
    --radius: 18px;
    --radius-sm: 12px;
    --radius-xs: 8px;
    --transition: 220ms cubic-bezier(.4,0,.2,1);
    --font: 'Inter', system-ui, -apple-system, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
  }
  [data-theme="dark"] {
    --bg: #0b0f1a;
    --surface: #131929;
    --surface-2: #1a2133;
    --surface-3: #232b40;
    --text: #e6ecf5;
    --text-dim: #9aa6bf;
    --text-subtle: #5d6a85;
    --border: rgba(255,255,255,.08);
    --border-strong: rgba(255,255,255,.14);
    --accent: #f472b6;
    --accent-2: #f9a8d4;
    --accent-soft: rgba(244,114,182,.16);
    --accent-glow: rgba(244,114,182,.4);
    --danger: #f87171;
    --danger-soft: rgba(248,113,113,.16);
    --success: #34d399;
    --success-soft: rgba(52,211,153,.16);
    --warning: #fbbf24;
    --warning-soft: rgba(251,191,36,.16);
    --shadow: 0 8px 28px rgba(0,0,0,.35);
    --shadow-lg: 0 24px 60px rgba(0,0,0,.5);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex; justify-content: center;
    padding: 36px 16px 100px;
    transition: background .3s ease, color .3s ease;
    -webkit-font-smoothing: antialiased;
    background-image:
      radial-gradient(1200px 600px at 10% -10%, var(--accent-soft), transparent 60%),
      radial-gradient(900px 500px at 110% 10%, var(--accent-soft), transparent 60%);
  }
  .app { width: 100%; max-width: 780px; }

  /* focus rings */
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

  /* ---------- Header ---------- */
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; gap: 16px; flex-wrap: wrap; }
  .title-block h1 {
    font-size: 34px; font-weight: 800; letter-spacing: -.03em; margin: 0 0 2px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .subtitle { color: var(--text-dim); font-size: 14px; margin: 0; font-weight: 500; }
  .header-right { display: flex; align-items: center; gap: 10px; }
  .progress-ring { position: relative; width: 50px; height: 50px; flex-shrink: 0; }
  .progress-ring svg { transform: rotate(-90deg); }
  .progress-ring .track { fill: none; stroke: var(--surface-3); stroke-width: 4; }
  .progress-ring .bar { fill: none; stroke: url(#grad); stroke-width: 4; stroke-linecap: round; transition: stroke-dashoffset .6s cubic-bezier(.4,0,.2,1); }
  .progress-ring .pct { position: absolute; inset: 0; display: grid; place-items: center; font-size: 11px; font-weight: 700; color: var(--text-dim); }
  .icon-btn {
    border: 1px solid var(--border); background: var(--surface);
    color: var(--text); width: 42px; height: 42px; border-radius: 13px;
    cursor: pointer; display: grid; place-items: center;
    transition: transform .15s ease, background .2s ease, border-color .2s ease;
  }
  .icon-btn:hover { background: var(--surface-2); border-color: var(--border-strong); }
  .icon-btn:active { transform: scale(.92); }

  /* ---------- Composer ---------- */
  .composer {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 10px 10px 10px 16px; margin-bottom: 14px;
    transition: border-color .2s, box-shadow .2s;
  }
  .composer:focus-within { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft), var(--shadow); }
  .composer-row { display: flex; align-items: center; gap: 10px; }
  .composer input.title-input {
    flex: 1; border: none; outline: none; background: transparent;
    color: var(--text); font-size: 16px; padding: 10px 0; font-family: inherit; font-weight: 500;
  }
  .composer input.title-input::placeholder { color: var(--text-subtle); font-weight: 400; }
  .add-btn {
    border: none; background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff; font-weight: 700; font-size: 14px; font-family: inherit;
    padding: 11px 20px; border-radius: 12px; cursor: pointer;
    transition: filter .15s, transform .15s, opacity .2s;
    box-shadow: 0 4px 14px var(--accent-glow); white-space: nowrap;
  }
  .add-btn:hover { filter: brightness(1.08); }
  .add-btn:active { transform: scale(.95); }
  .add-btn:disabled { opacity: .4; cursor: default; transform: none; box-shadow: none; }
  .composer-extras {
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--border);
  }
  .chip-select, .chip-input {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 999px; padding: 5px 12px; font-size: 12.5px; font-weight: 600;
    color: var(--text-dim); cursor: pointer; transition: border-color .15s, background .15s;
  }
  .chip-select:hover, .chip-input:hover { border-color: var(--border-strong); }
  .chip-select select, .chip-input input {
    border: none; background: transparent; color: var(--text); font-family: inherit;
    font-size: 12.5px; font-weight: 600; outline: none; cursor: pointer;
  }
  .chip-input input { cursor: text; width: 90px; }
  .chip-select svg, .chip-input svg { color: var(--text-subtle); }

  /* ---------- Search ---------- */
  .searchbar {
    display: flex; align-items: center; gap: 10px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 8px 14px; margin-bottom: 14px;
    transition: border-color .2s;
  }
  .searchbar:focus-within { border-color: var(--accent); }
  .searchbar input { flex: 1; border: none; outline: none; background: transparent; color: var(--text); font-size: 14px; font-family: inherit; }
  .searchbar svg { color: var(--text-subtle); flex-shrink: 0; }
  .kbd { font-family: var(--mono); font-size: 10.5px; color: var(--text-subtle); background: var(--surface-2); border: 1px solid var(--border); border-radius: 5px; padding: 2px 6px; }

  /* ---------- Toolbar ---------- */
  .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; }
  .filters { display: flex; background: var(--surface-2); border-radius: 12px; padding: 4px; gap: 2px; border: 1px solid var(--border); }
  .filter-btn {
    border: none; background: transparent; color: var(--text-dim);
    font-size: 13px; font-weight: 600; font-family: inherit;
    padding: 7px 14px; border-radius: 9px; cursor: pointer;
    transition: background .18s, color .18s;
  }
  .filter-btn[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .meta { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--text-dim); flex-wrap: wrap; }
  .select-sort, .select-priority {
    border: 1px solid var(--border); background: var(--surface-2); color: var(--text-dim);
    font-size: 12.5px; font-weight: 600; font-family: inherit;
    padding: 6px 10px; border-radius: 9px; cursor: pointer; outline: none;
  }
  .link-btn {
    border: none; background: none; color: var(--text-dim);
    font-size: 13px; font-family: inherit; cursor: pointer; padding: 4px 2px; border-radius: 6px;
    transition: color .15s;
  }
  .link-btn:hover { color: var(--danger); }
  .link-btn:disabled { opacity: .4; cursor: default; }
  .count-badge { font-weight: 700; color: var(--text); }

  /* ---------- Tag chips ---------- */
  .tag-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .tag-chip {
    border: 1px solid var(--border); background: var(--surface-2); color: var(--text-dim);
    font-size: 12px; font-weight: 600; font-family: inherit;
    padding: 5px 11px; border-radius: 999px; cursor: pointer;
    transition: background .15s, color .15s, border-color .15s;
  }
  .tag-chip:hover { border-color: var(--border-strong); color: var(--text); }
  .tag-chip.active { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }

  /* ---------- List / Sections ---------- */
  .sections { display: flex; flex-direction: column; gap: 18px; }
  .section { }
  .section-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 8px; padding: 0 4px;
  }
  .section-title {
    font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
    color: var(--text-subtle); display: flex; align-items: center; gap: 8px;
  }
  .section-title .dot { width: 7px; height: 7px; border-radius: 50%; }
  .section-title .dot.overdue { background: var(--danger); }
  .section-title .dot.today { background: var(--accent); }
  .section-title .dot.tomorrow { background: var(--info); }
  .section-title .dot.week { background: var(--warning); }
  .section-title .dot.later { background: var(--text-subtle); }
  .section-title .dot.none { background: var(--text-subtle); opacity: .5; }
  .section-title .dot.completed { background: var(--success); }
  .section-count { font-size: 11.5px; font-weight: 600; color: var(--text-subtle); background: var(--surface-2); padding: 2px 8px; border-radius: 999px; }

  ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  li {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow-sm);
    display: flex; flex-direction: column;
    transition: transform .2s, opacity .2s, border-color .2s, box-shadow .2s;
    position: relative; overflow: hidden;
    animation: rise .32s cubic-bezier(.2,.8,.3,1) both;
  }
  li:hover { border-color: var(--border-strong); box-shadow: var(--shadow); }
  li.dragging { opacity: .4; transform: scale(.98); }
  li.dragover { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  li.removing { opacity: 0; transform: translateX(30px) scale(.96); }
  li.done { background: color-mix(in srgb, var(--surface) 88%, var(--success-soft)); }
  li.expanded { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft), var(--shadow); }
  @keyframes rise { from { opacity:0; transform: translateY(10px) scale(.97);} to { opacity:1; transform:none;} }

  .row-main {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 14px;
  }
  .drag-handle {
    color: var(--text-subtle); cursor: grab; flex-shrink: 0;
    display: grid; place-items: center; padding: 4px 2px; border-radius: 6px;
    transition: color .15s, background .15s;
  }
  .drag-handle:hover { color: var(--text-dim); background: var(--surface-2); }
  .drag-handle:active { cursor: grabbing; }
  .drag-handle.disabled { opacity: .25; cursor: default; pointer-events: none; }

  .check {
    width: 24px; height: 24px; border: 2px solid var(--border-strong);
    border-radius: 50%; cursor: pointer; flex-shrink: 0;
    background: transparent; display: grid; place-items: center;
    transition: background .22s, border-color .22s, transform .22s; padding: 0; color: #fff;
  }
  .check:hover { border-color: var(--accent); transform: scale(1.05); }
  .check svg { opacity: 0; transform: scale(.4); transition: .22s; }
  li.done .check svg { opacity: 1; transform: scale(1); }

  .body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .row1 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .text {
    font-size: 15px; line-height: 1.4; word-break: break-word;
    border: none; background: transparent; color: var(--text);
    font-family: inherit; outline: none; border-radius: 8px; padding: 2px 4px; margin: -2px -4px;
    flex: 1; min-width: 0; cursor: text;
  }
  li.done .text { color: var(--text-dim); text-decoration: line-through; }
  .text.editing { background: var(--surface-2); text-decoration: none; color: var(--text); }

  .priority-dot {
    width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
  }
  .priority-dot.high { background: var(--danger); box-shadow: 0 0 0 3px var(--danger-soft); }
  .priority-dot.med { background: var(--warning); box-shadow: 0 0 0 3px var(--warning-soft); }
  .priority-dot.low { background: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

  .meta-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .tag {
    font-size: 11.5px; font-weight: 600; color: var(--text-dim);
    background: var(--surface-2); padding: 2px 8px; border-radius: 999px;
  }
  .due {
    font-size: 11.5px; font-weight: 600; color: var(--text-subtle);
    display: inline-flex; align-items: center; gap: 4px;
  }
  .due.overdue { color: var(--danger); }
  .due.soon { color: var(--warning); }
  .due.ok { color: var(--text-dim); }
  .notes-preview {
    font-size: 12.5px; color: var(--text-subtle); font-style: italic;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;
  }

  .row-actions { display: flex; align-items: center; gap: 2px; flex-shrink: 0; }
  .action-btn {
    border: none; background: transparent; color: var(--text-subtle);
    width: 30px; height: 30px; border-radius: 8px; cursor: pointer;
    display: grid; place-items: center;
    transition: background .15s, color .15s; opacity: 0;
  }
  li:hover .action-btn, li:focus-within .action-btn, li.expanded .action-btn { opacity: 1; }
  .action-btn:hover { background: var(--surface-2); color: var(--text); }
  .action-btn.danger:hover { background: var(--danger-soft); color: var(--danger); }

  /* ---------- Expand panel ---------- */
  .expand-panel {
    border-top: 1px solid var(--border);
    padding: 14px 16px 16px;
    display: none; flex-direction: column; gap: 12px;
    background: var(--surface-2);
    animation: slideDown .2s ease;
  }
  li.expanded .expand-panel { display: flex; }
  @keyframes slideDown { from { opacity:0; transform: translateY(-6px);} to { opacity:1; transform:none;} }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label { font-size: 11.5px; font-weight: 700; color: var(--text-dim); letter-spacing: .04em; text-transform: uppercase; }
  .field input, .field select, .field textarea {
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
    font-family: inherit; font-size: 13.5px; padding: 9px 11px; border-radius: 10px;
    outline: none; transition: border-color .15s, box-shadow .15s;
  }
  .field input:focus, .field select:focus, .field textarea:focus {
    border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .field textarea { resize: vertical; min-height: 60px; line-height: 1.5; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .panel-actions { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .btn {
    border: none; background: var(--surface); color: var(--text);
    font-family: inherit; font-size: 13px; font-weight: 600;
    padding: 8px 14px; border-radius: 10px; cursor: pointer;
    border: 1solid var(--border); transition: background .15s, border-color .15s;
  }
  .btn:hover { background: var(--surface-3); }
  .btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; border: none; box-shadow: 0 3px 10px var(--accent-glow); }
  .btn.primary:hover { filter: brightness(1.06); }
  .btn.danger { color: var(--danger); }
  .btn.danger:hover { background: var(--danger-soft); border-color: var(--danger); }

  /* ---------- Empty ---------- */
  .empty {
    text-align: center; padding: 56px 24px; color: var(--text-dim);
    background: var(--surface); border: 1px dashed var(--border);
    border-radius: var(--radius);
  }
  .empty .glyph { font-size: 40px; margin-bottom: 12px; }
  .empty p { margin: 0; font-size: 15px; font-weight: 600; }
  .empty .hint { font-size: 13px; margin-top: 6px; opacity: .8; font-weight: 400; }

  /* ---------- Footer ---------- */
  footer {
    margin-top: 26px; text-align: center; font-size: 12px;
    color: var(--text-subtle); display: flex; justify-content: center; gap: 14px; flex-wrap: wrap;
  }
  footer kbd { font-family: var(--mono); font-size: 10.5px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; }

  /* ---------- Toast ---------- */
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--surface); border: 1px solid var(--border); color: var(--text);
    padding: 12px 16px; border-radius: 12px; box-shadow: var(--shadow-lg);
    display: flex; align-items: center; gap: 12px; font-size: 14px; font-weight: 500;
    opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s;
    z-index: 50; max-width: 90vw;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
  .toast button {
    border: none; background: var(--accent-soft); color: var(--accent);
    font-weight: 700; font-size: 13px; padding: 6px 12px; border-radius: 8px; cursor: pointer;
  }

  /* ---------- Modal (import/export/help) ---------- */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,.45);
    backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center;
    z-index: 60; padding: 20px;
  }
  .modal-backdrop.show { display: flex; }
  .modal {
    background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow-lg);
    width: 100%; max-width: 460px; padding: 22px; border: 1px solid var(--border);
    animation: pop .2s cubic-bezier(.2,.8,.3,1);
  }
  @keyframes pop { from { opacity:0; transform: scale(.95);} to { opacity:1; transform:none;} }
  .modal h2 { margin: 0 0 6px; font-size: 18px; }
  .modal p { margin: 0 0 14px; color: var(--text-dim); font-size: 13.5px; line-height: 1.5; }
  .modal textarea {
    width: 100%; min-height: 120px; border: 1px solid var(--border); border-radius: 10px;
    background: var(--surface-2); color: var(--text); font-family: var(--mono); font-size: 12px;
    padding: 10px; outline: none; resize: vertical;
  }
  .modal .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }

  /* ---------- Confetti-ish celebration ---------- */
  .celebrate {
    position: fixed; inset: 0; pointer-events: none; z-index: 40; overflow: hidden;
  }

  @media (max-width: 600px) {
    body { padding: 20px 10px 80px; }
    .title-block h1 { font-size: 26px; }
    .toolbar { flex-direction: column; align-items: stretch; }
    .filters { justify-content: center; }
    .meta { justify-content: center; }
    .composer-extras { gap: 6px; }
    .field-row { grid-template-columns: 1fr; }
    .row-main { padding: 10px 12px; }
    .action-btn { opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="title-block">
      <h1 id="greeting">Do</h1>
      <p class="subtitle" id="subtitle">Loading…</p>
    </div>
    <div class="header-right">
      <div class="progress-ring" title="Completion">
        <svg width="50" height="50" viewBox="0 0 50 50">
          <defs>
            <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="var(--accent)"/>
              <stop offset="100%" stop-color="var(--accent-2)"/>
            </linearGradient>
          </defs>
          <circle class="track" cx="25" cy="25" r="21"/>
          <circle class="bar" id="progressBar" cx="25" cy="25" r="21" stroke-dasharray="131.95" stroke-dashoffset="131.95"/>
        </svg>
        <div class="pct" id="progressPct">0%</div>
      </div>
      <button class="icon-btn" id="exportBtn" aria-label="Export / Import" title="Export / Import">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      </button>
      <button class="icon-btn" id="themeToggle" aria-label="Toggle theme" title="Toggle theme (T)">
        <svg id="themeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
      </button>
    </div>
  </header>

  <form class="composer" id="composer" autocomplete="off">
    <div style="flex:1; min-width:0;">
      <div class="composer-row">
        <input class="title-input" id="newTask" type="text" placeholder="What needs to be done?" maxlength="300" aria-label="New task" />
        <button class="add-btn" id="addBtn" type="submit" disabled>Add</button>
      </div>
      <div class="composer-extras">
        <label class="chip-select" title="Priority">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2l3 7h7l-5.5 4.5L18 21l-6-4-6 4 1.5-7.5L2 9h7z"/></svg>
          <select id="newPriority">
            <option value="med">Medium</option>
            <option value="high">High</option>
            <option value="low">Low</option>
          </select>
        </label>
        <label class="chip-select" title="Due date">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
          <input type="date" id="newDue" style="cursor:pointer;" />
        </label>
        <label class="chip-input" title="Tag">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L2 12V2h10l8.6 8.6a2 2 0 0 1 0 2.8z"/><circle cx="7" cy="7" r="1.5"/></svg>
          <input type="text" id="newTag" placeholder="tag" maxlength="20" />
        </label>
        <label class="chip-input" title="Notes" style="flex:1; min-width:140px;">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/></svg>
          <input type="text" id="newNotes" placeholder="notes (optional)" maxlength="300" />
        </label>
      </div>
    </div>
  </form>

  <div class="searchbar">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    <input id="search" type="text" placeholder="Search tasks…" aria-label="Search" />
    <span class="kbd">/</span>
  </div>

  <div class="toolbar">
    <div class="filters" role="group" aria-label="Status filter">
      <button class="filter-btn" data-filter="all" aria-pressed="true">All</button>
      <button class="filter-btn" data-filter="active" aria-pressed="false">Active</button>
      <button class="filter-btn" data-filter="done" aria-pressed="false">Done</button>
    </div>
    <div class="meta">
      <select class="select-priority" id="priorityFilter" aria-label="Priority filter">
        <option value="all">All priorities</option>
        <option value="high">High</option>
        <option value="med">Medium</option>
        <option value="low">Low</option>
      </select>
      <select class="select-sort" id="sort" aria-label="Sort">
        <option value="manual">Manual order</option>
        <option value="created">Newest first</option>
        <option value="due">Due date</option>
        <option value="priority">Priority</option>
        <option value="alpha">A → Z</option>
      </select>
      <span id="count" class="count-badge">0 remaining</span>
      <button class="link-btn" id="clearDone" disabled>Clear done</button>
    </div>
  </div>

  <div class="tag-chips" id="tagChips"></div>

  <div class="sections" id="sections" aria-live="polite"></div>
  <div class="empty" id="empty" hidden>
    <div class="glyph">✨</div>
    <p id="emptyTitle">All clear</p>
    <p class="hint" id="emptyHint">Add your first task above — press Enter.</p>
  </div>

  <footer>
    <span><kbd>Enter</kbd> add · <kbd>/</kbd> search · <kbd>T</kbd> theme · <kbd>Esc</kbd> cancel</span>
    <span>Stored locally in your browser</span>
  </footer>
</div>

<div class="toast" id="toast">
  <span id="toastMsg">Task deleted</span>
  <button id="toastUndo">Undo</button>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <h2 id="modalTitle">Export / Import</h2>
    <p>Copy your tasks as JSON to back them up, or paste JSON here to restore.</p>
    <textarea id="modalText" spellcheck="false"></textarea>
    <div class="modal-actions">
      <button class="btn" id="modalClose">Close</button>
      <button class="btn" id="modalCopy">Copy</button>
      <button class="btn primary" id="modalImport">Import</button>
    </div>
  </div>
</div>

<div class="celebrate" id="confetti"></div>

<script>
(() => {
  const STORAGE_KEY = "do.tasks.v3";
  const THEME_KEY = "do.theme";
  const SORT_KEY = "do.sort";
  const PRIO_KEY = "do.prioFilter";

  const $ = (s) => document.querySelector(s);
  const sectionsEl = $("#sections");
  const empty = $("#empty");
  const input = $("#newTask");
  const addBtn = $("#addBtn");
  const countEl = $("#count");
  const subtitle = $("#subtitle");
  const greeting = $("#greeting");
  const clearDoneBtn = $("#clearDone");
  const searchInput = $("#search");
  const sortSelect = $("#sort");
  const priorityFilter = $("#priorityFilter");
  const progressBar = $("#progressBar");
  const progressPct = $("#progressPct");
  const tagChipsEl = $("#tagChips");
  const confettiEl = $("#confetti");

  let tasks = load();
  let filter = "all";
  let sort = loadSort();
  let priorityF = loadPrioFilter();
  let tagFilter = null;
  let search = "";
  let dragId = null;
  let pendingDelete = null;
  let toastTimer = null;
  let expandedId = null;
  let lastCelebratedPct = 0;

  sortSelect.value = sort;
  priorityFilter.value = priorityF;

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      const data = raw ? JSON.parse(raw) : null;
      if (Array.isArray(data)) return normalize(data);
      // migrate older versions
      for (const key of ["tasks.v2","tasks.v1"]) {
        const v = localStorage.getItem(key);
        if (v) {
          const arr = JSON.parse(v);
          if (Array.isArray(arr)) return normalize(arr.map(t => ({
            ...t,
            priority: t.priority || "med",
            due: t.due || null,
            tag: t.tag || "",
            notes: t.notes || "",
            order: t.order || Date.now(),
            completedAt: t.done ? (t.completedAt || Date.now()) : null,
          })));
        }
      }
      return [];
    } catch { return []; }
  }
  function normalize(arr) {
    return arr.map(t => ({
      id: t.id || uid(),
      text: String(t.text || "").trim(),
      done: !!t.done,
      priority: ["high","med","low"].includes(t.priority) ? t.priority : "med",
      due: t.due || null,
      tag: (t.tag || "").trim(),
      notes: (t.notes || "").trim(),
      created: t.created || Date.now(),
      order: t.order || Date.now(),
      completedAt: t.completedAt || (t.done ? Date.now() : null),
    })).filter(t => t.text);
  }
  function save() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); } catch {} }
  function loadSort() { try { return localStorage.getItem(SORT_KEY) || "manual"; } catch { return "manual"; } }
  function saveSort() { try { localStorage.setItem(SORT_KEY, sort); } catch {} }
  function loadPrioFilter() { try { return localStorage.getItem(PRIO_KEY) || "all"; } catch { return "all"; } }
  function savePrioFilter() { try { localStorage.setItem(PRIO_KEY, priorityF); } catch {} }

  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);

  /* ---------- Date helpers ---------- */
  function startOfDay(d) { const x = new Date(d); x.setHours(0,0,0,0); return x; }
  function todayStr() { return new Date().toISOString().slice(0,10); }
  function bucket(t) {
    if (t.done) return "completed";
    if (!t.due) return "none";
    const today = startOfDay(new Date());
    const dd = startOfDay(new Date(t.due + "T00:00:00"));
    const diff = Math.round((dd - today) / 86400000);
    if (diff < 0) return "overdue";
    if (diff === 0) return "today";
    if (diff === 1) return "tomorrow";
    if (diff <= 7) return "week";
    return "later";
  }
  const BUCKET_ORDER = ["overdue","today","tomorrow","week","later","none","completed"];
  const BUCKET_LABEL = {
    overdue: "Overdue", today: "Today", tomorrow: "Tomorrow",
    week: "This week", later: "Later", none: "No due date", completed: "Completed",
  };
  const BUCKET_DOT = {
    overdue:"overdue", today:"today", tomorrow:"tomorrow", week:"week",
    later:"later", none:"none", completed:"completed",
  };

  function dueClass(d) {
    const today = startOfDay(new Date());
    const dd = startOfDay(new Date(d + "T00:00:00"));
    const diff = Math.round((dd - today)/86400000);
    if (diff < 0) return "overdue";
    if (diff <= 2) return "soon";
    return "ok";
  }
  function formatDue(d) {
    const today = startOfDay(new Date());
    const dd = startOfDay(new Date(d + "T00:00:00"));
    const diff = Math.round((dd - today)/86400000);
    if (diff === 0) return "Today";
    if (diff === 1) return "Tomorrow";
    if (diff === -1) return "Yesterday";
    if (diff < -1) return `${-diff}d overdue`;
    if (diff < 7) return dd.toLocaleDateString(undefined, { weekday: "short" });
    return dd.toLocaleDateString(undefined, { month: "short", day: "numeric" });
  }

  /* ---------- Actions ---------- */
  function addTask() {
    const text = input.value.trim();
    if (!text) return;
    const priority = $("#newPriority").value;
    const due = $("#newDue").value || null;
    const tag = $("#newTag").value.trim();
    const notes = $("#newNotes").value.trim();
    const maxOrder = tasks.reduce((m,t)=>Math.max(m, t.order||0), 0);
    tasks.unshift({ id: uid(), text, done: false, priority, due, tag, notes, created: Date.now(), order: maxOrder + 1, completedAt: null });
    save();
    input.value = ""; $("#newTag").value = ""; $("#newDue").value = ""; $("#newNotes").value = "";
    $("#newPriority").value = "med";
    updateAddBtn();
    if (filter === "done") { filter = "all"; syncFilterButtons(); }
    render();
    input.focus();
    showToast("Task added", null);
    triggerConfetti();
  }

  function triggerConfetti() {
    // Create celebration particles
    const colors = [var(--accent), var(--accent-2), var(--success), var(--warning)];
    for (let i = 0; i < 20; i++) {
      const particle = document.createElement('div');
      particle.style.position = 'fixed';
      particle.style.width = '8px';
      particle.style.height = '8px';
      particle.style.background = colors[Math.floor(Math.random() * colors.length)];
      particle.style.borderRadius = '2px';
      particle.style.left = (window.innerWidth / 2) + 'px';
      particle.style.top = (window.innerHeight / 2) + 'px';
      particle.style.pointerEvents = 'none';
      particle.style.zIndex = '100';
      particle.style.opacity = '1';
      particle.style.transition = 'transform 1s ease-out, opacity 1s ease-out';
      particle.style.transform = `translate(${Math.random() * 200 - 100}px, ${Math.random() * 200 - 100}px)`;
      confettiEl.appendChild(particle);
      setTimeout(() => { particle.style.opacity = '0'; }, 10);
      setTimeout(() => { particle.remove(); }, 1000);
    }
  }

  function toggleTask(id) {
    const t = tasks.find(t => t.id === id);
    if (!t) return;
    t.done = !t.done;
    t.completedAt = t.done ? Date.now() : null;
    save(); render();
    if (t.done) checkCelebration();
  }

  function checkCelebration() {
    const total = tasks.length;
    const doneCount = tasks.filter(t => t.done).length;
    const pct = total ? Math.round((doneCount/total)*100) : 0;
    if (pct > lastCelebratedPct) {
      lastCelebratedPct = Math.max(lastCelebratedPct, pct);
      showToast(`Progress: ${pct}% complete`, null);
    }
  }

  function deleteTask(id, undoable = true) {
    const t = tasks.find(t => t.id === id);
    if (!t) return;
    const li = sectionsEl.querySelector(`[data-id="${id}"]`);
    if (li) li.classList.add("removing");
    setTimeout(() => {
      const idx = tasks.findIndex(x => x.id === id);
      if (idx === -1) return;
      const removed = tasks.splice(idx, 1)[0];
      if (expandedId === id) expandedId = null;
      save(); render();
      if (undoable) {
        pendingDelete = removed;
        showToast("Task deleted", () => {
          tasks.unshift(pendingDelete);
          pendingDelete = null;
          save(); render();
          hideToast();
        });
      }
    }, 170);
  }

  function editTask(id, text) {
    const t = tasks.find(t => t.id === id);
    if (!t) return;
    const trimmed = text.trim();
    if (!trimmed) { deleteTask(id); return; }
    t.text = trimmed; save(); render();
  }

  function updateTask(id, patch) {
    const t = tasks.find(t => t.id === id);
    if (!t) return;
    Object.assign(t, patch);
    if (patch.done !== undefined) t.completedAt = patch.done ? Date.now() : null;
    save(); render();
  }

  function clearDone() {
    const done = tasks.filter(t => t.done);
    if (!done.length) return;
    tasks = tasks.filter(t => !t.done);
    save(); render();
    showToast(`Cleared ${done.length} task${done.length>1?"s":""}`, null);
  }

  function clearAll() {
    if (!tasks.length) return;
    if (!confirm("Delete all tasks? This cannot be undone.")) return;
    tasks = []; save(); render();
    showToast("All tasks cleared", null);
  }

  /* ---------- Filtering / grouping ---------- */
  function visibleTasks() {
    let out = tasks.slice();
    if (filter === "active") out = out.filter(t => !t.done);
    if (filter === "done") out = out.filter(t => t.done);
    if (priorityF !== "all") out = out.filter(t => t.priority === priorityF);
    if (tagFilter) out = out.filter(t => t.tag === tagFilter);
    if (search.trim()) {
      const q = search.toLowerCase();
      out = out.filter(t => t.text.toLowerCase().includes(q) || (t.tag||"").toLowerCase().includes(q) || (t.notes||"").toLowerCase().includes(q));
    }
    // sort
    if (sort === "created") out.sort((a,b) => b.created - a.created);
    else if (sort === "due") out.sort((a,b) => {
      if (!a.due && !b.due) return (b.order||0)-(a.order||0);
      if (!a.due) return 1;
      if (!b.due) return -1;
      return a.due.localeCompare(b.due);
    });
    else if (sort === "priority") {
      const rank = { high:0, med:1, low:2 };
      out.sort((a,b) => (rank[a.priority]||1)-(rank[b.priority]||1) || (b.order||0)-(a.order||0));
    } else if (sort === "alpha") {
      out.sort((a,b) => a.text.localeCompare(b.text));
    } else {
      out.sort((a,b) => (a.order||0)-(b.order||0));
    }
    return out;
  }

  function groupTasks(list) {
    const groups = {};
    BUCKET_ORDER.forEach(b => groups[b] = []);
    list.forEach(t => groups[bucket(t)].push(t));
    return BUCKET_ORDER.filter(b => groups[b].length).map(b => ({ key: b, items: groups[b] }));
  }

  /* ---------- Rendering ---------- */
  function render() {
    const visible = visibleTasks();
    const groups = groupTasks(visible);
    sectionsEl.innerHTML = "";

    if (visible.length === 0) {
      empty.hidden = false;
      if (tasks.length === 0) { $("#emptyTitle").textContent = "All clear"; $("#emptyHint").textContent = "Add your first task above — press Enter."; }
      else if (search.trim()) { $("#emptyTitle").textContent = "No matches"; $("#emptyHint").textContent = "Try a different search term."; }
      else if (filter === "active") { $("#emptyTitle").textContent = "Nothing active"; $("#emptyHint").textContent = "Everything is done. Nice work!"; }
      else if (filter === "done") { $("#emptyTitle").textContent = "Nothing done yet"; $("#emptyHint").textContent = "Complete a task to see it here."; }
      else { $("#emptyTitle").textContent = "No tasks"; $("#emptyHint").textContent = "Add one above."; }
    } else {
      empty.hidden = true;
      groups.forEach(g => {
        const section = document.createElement("section");
        section.className = "section";
        const header = document.createElement("div");
        header.className = "section-header";
        header.innerHTML = `
          <span class="section-title"><span class="dot ${BUCKET_DOT[g.key]}"></span>${BUCKET_LABEL[g.key]}</span>
          <span class="section-count">${g.items.length}</span>`;
        section.appendChild(header);
        const ul = document.createElement("ul");
        g.items.forEach(t => ul.appendChild(taskEl(t)));
        section.appendChild(ul);
        sectionsEl.appendChild(section);
      });
    }

    const remaining = tasks.filter(t => !t.done).length;
    const doneCount = tasks.length - remaining;
    const total = tasks.length;
    const pct = total ? Math.round((doneCount/total)*100) : 0;

    countEl.textContent = remaining === 1 ? "1 remaining" : `${remaining} remaining`;
    clearDoneBtn.disabled = doneCount === 0;
    clearDoneBtn.textContent = doneCount ? `Clear done (${doneCount})` : "Clear done";

    if (tasks.length === 0) subtitle.textContent = "Nothing pending — enjoy your day.";
    else if (remaining === 0) subtitle.textContent = "Everything's done. 🎉";
    else subtitle.textContent = `${remaining} to go · ${doneCount} done`;

    // greeting
    updateGreeting();

    // progress ring
    const circ = 2*Math.PI*21;
    progressBar.setAttribute("stroke-dasharray", circ.toFixed(2));
    progressBar.setAttribute("stroke-dashoffset", (circ*(1-pct/100)).toFixed(2));
    progressPct.textContent = pct + "%";

    renderTagChips();
  }

  function taskEl(t) {
    const li = document.createElement("li");
    li.dataset.id = t.id;
    if (t.done) li.classList.add("done");
    if (expandedId === t.id) li.classList.add("expanded");

    const canDrag = sort === "manual" && !search.trim() && filter === "all" && !tagFilter && priorityF === "all";
    li.draggable = canDrag;

    if (canDrag) {
      li.addEventListener("dragstart", (e) => { dragId = t.id; li.classList.add("dragging"); e.dataTransfer.effectAllowed = "move"; });
      li.addEventListener("dragend", () => { dragId = null; li.classList.remove("dragging"); document.querySelectorAll("li.dragover").forEach(x=>x.classList.remove("dragover")); });
      li.addEventListener("dragover", (e) => { e.preventDefault(); if (dragId && dragId !== t.id) li.classList.add("dragover"); });
      li.addEventListener("dragleave", () => li.classList.remove("dragover"));
      li.addEventListener("drop", (e) => {
        e.preventDefault(); li.classList.remove("dragover");
        if (!dragId || dragId === t.id) return;
        const from = tasks.find(x=>x.id===dragId);
        const to = tasks.find(x=>x.id===t.id);
        if (!from || !to) return;
        const fromOrder = from.order; from.order = to.order; to.order = fromOrder;
        save(); render();
      });
    }

    // main row
    const main = document.createElement("div");
    main.className = "row-main";

    const handle = document.createElement("div");
    handle.className = "drag-handle" + (canDrag ? "" : " disabled");
    handle.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg>';
    handle.title = "Drag to reorder";

    const check = document.createElement("button");
    check.className = "check";
    check.setAttribute("aria-label", t.done ? "Mark as active" : "Mark as done");
    check.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
    check.addEventListener("click", (e) => { e.stopPropagation(); toggleTask(t.id); });

    const body = document.createElement("div");
    body.className = "body";
    const row1 = document.createElement("div");
    row1.className = "row1";

    const text = document.createElement("div");
    text.className = "text";
    text.textContent = t.text;
    text.title = "Double-click to edit";
    text.addEventListener("dblclick", (e) => { e.stopPropagation(); startEdit(text, t); });

    const dot = document.createElement("span");
    dot.className = "priority-dot " + (t.priority || "med");
    dot.title = (t.priority||"med") + " priority";

    row1.append(text, dot);
    body.appendChild(row1);

    const metaRow = document.createElement("div");
    metaRow.className = "meta-row";
    if (t.tag) {
      const tag = document.createElement("span");
      tag.className = "tag";
      tag.textContent = "#" + t.tag;
      metaRow.appendChild(tag);
    }
    if (t.due) {
      const due = document.createElement("span");
      due.className = "due " + dueClass(t.due);
      due.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg> ${formatDue(t.due)}`;
      metaRow.appendChild(due);
    }
    if (t.notes) {
      const np = document.createElement("span");
      np.className = "notes-preview";
      np.textContent = t.notes;
      metaRow.appendChild(np);
    }
    if (metaRow.children.length) body.appendChild(metaRow);

    const actions = document.createElement("div");
    actions.className = "row-actions";

    const expandBtn = document.createElement("button");
    expandBtn.className = "action-btn";
    expandBtn.setAttribute("aria-label", "Edit details");
    expandBtn.title = "Edit details";
    expandBtn.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>';
    expandBtn.addEventListener("click", (e) => { e.stopPropagation(); toggleExpand(t.id); });

    const del = document.createElement("button");
    del.className = "action-btn danger";
    del.setAttribute("aria-label", "Delete task");
    del.title = "Delete";
    del.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>';
    del.addEventListener("click", (e) => { e.stopPropagation(); deleteTask(t.id); });

    actions.append(expandBtn, del);

    main.append(handle, check, body, actions);
    li.appendChild(main);

    // expand panel
    const panel = document.createElement("div");
    panel.className = "expand-panel";
    panel.innerHTML = `
      <div class="field">
        <label>Notes</label>
        <textarea id="notes-${t.id}" placeholder="Add notes…">${escapeHtml(t.notes||"")}</textarea>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Priority</label>
          <select id="prio-${t.id}">
            <option value="high" ${t.priority==="high"?"selected":""}>High</option>
            <option value="med" ${t.priority==="med"?"selected":""}>Medium</option>
            <option value="low" ${t.priority==="low"?"selected":""}>Low</option>
          </select>
        </div>
        <div class="field">
          <label>Due date</label>
          <input type="date" id="due-${t.id}" value="${t.due||""}" />
        </div>
      </div>
      <div class="field">
        <label>Tag</label>
        <input type="text" id="tag-${t.id}" value="${escapeAttr(t.tag||"")}" placeholder="tag" maxlength="20" />
      </div>
      <div class="panel-actions">
        <button class="btn danger" data-act="delete">Delete</button>
        <div style="display:flex; gap:8px;">
          <button class="btn" data-act="cancel">Cancel</button>
          <button class="btn primary" data-act="save">Save</button>
        </div>
      </div>
    `;
    panel.addEventListener("click", (e) => {
      const act = e.target?.dataset?.act;
      if (!act) return;
      e.stopPropagation();
      if (act === "delete") { deleteTask(t.id); }
      else if (act === "cancel") { toggleExpand(null); }
      else if (act === "save") {
        const notes = $(`#notes-${t.id}`).value.trim();
        const priority = $(`#prio-${t.id}`).value;
        const due = $(`#due-${t.id}`).value || null;
        const tag = $(`#tag-${t.id}`).value.trim();
        updateTask(t.id, { notes, priority, due, tag });
        toggleExpand(null);
      }
    });
    li.appendChild(panel);

    li.addEventListener("click", (e) => {
      // click on row (not interactive) toggles expand
      if (e.target.closest("button, input, textarea, select, .text")) return;
      toggleExpand(t.id);
    });

    return li;
  }

  function toggleExpand(id) {
    expandedId = (expandedId === id) ? null : id;
    render();
  }

  function escapeHtml(s) { return String(s).replace(/&/g,"&").replace(/</g,"<").replace(/>/g,">"); }
  function escapeAttr(s) { return String(s).replace(/"/g,"""); }

  function startEdit(el, t) {
    if (el.isContentEditable) return;
    const original = t.text;
    el.contentEditable = "true";
    el.classList.add("editing");
    el.focus();
    const range = document.createRange();
    range.selectNodeContents(el);
    const sel = getSelection();
    sel.removeAllRanges(); sel.addRange(range);

    const finish = (commit) => {
      el.contentEditable = "false";
      el.classList.remove("editing");
      el.removeEventListener("blur", onBlur);
      el.removeEventListener("keydown", onKey);
      const val = el.textContent;
      if (commit) editTask(t.id, val); else { el.textContent = original; }
    };
    const onBlur = () => finish(true);
    const onKey = (e) => {
      if (e.key === "ENTER") { e.preventDefault(); el.blur(); }
      if (e.key === "Escape") { e.preventDefault(); el.textContent = original; el.blur(); }
    };
    el.addEventListener("blur", onBlur, { once: true });
    el.addEventListener("keydown", onKey);
  }

  /* ---------- Tag chips ---------- */
  function renderTagChips() {
    const tags = [...new Set(tasks.map(t=>t.tag).filter(Boolean))].sort();
    tagChipsEl.innerHTML = "";
    if (!tags.length) return;
    const allChip = document.createElement("button");
    allChip.className = "tag-chip" + (tagFilter === null ? " active" : "");
    allChip.textContent = "All tags";
    allChip.addEventListener("click", () => { tagFilter = null; render(); });
    tagChipsEl.appendChild(allChip);
    tags.forEach(tag => {
      const c = document.createElement("button");
      c.className = "tag-chip" + (tagFilter === tag ? " active" : "");
      c.textContent = "#" + tag;
      c.addEventListener("click", () => { tagFilter = (tagFilter === tag) ? null : tag; render(); });
      tagChipsEl.appendChild(c);
    });
  }

  /* ---------- Filters ---------- */
  function syncFilterButtons() {
    document.querySelectorAll(".filter-btn").forEach(b => {
      b.setAttribute("aria-pressed", String(b.dataset.filter === filter));
    });
  }
  document.querySelectorAll(".filter-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      filter = btn.dataset.filter;
      syncFilterButtons();
      render();
    });
  });

  /* ---------- Composer ---------- */
  function updateAddBtn() { addBtn.disabled = input.value.trim().length === 0; }
  input.addEventListener("input", updateAddBtn);
  $("#composer").addEventListener("submit", (e) => { e.preventDefault(); addTask(); });

  /* ---------- Theme ---------- */
  const sunIcon = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4l1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4m11.4-11.4l1.4-1.4"/>';
  const moonIcon = '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>';
  function applyTheme(theme) {
    document.documentElement.setAttribute("data-theme", theme);
    $("#themeIcon").innerHTML = theme === "dark" ? sunIcon : moonIcon;
    $("#themeToggle").setAttribute("aria-label", theme === "dark" ? "Switch to light mode" : "Switch to dark mode");
  }
  let theme;
  try { theme = localStorage.getItem(THEME_KEY) || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"); }
  catch { theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"; }
  applyTheme(theme);
  $("#themeToggle").addEventListener("click", () => {
    theme = theme === "dark" ? "light" : "dark";
    try { localStorage.setItem(THEME_KEY, theme); } catch {}
    applyTheme(theme);
  });

  /* ---------- Toast ---------- */
  const toast = $("#toast");
  const toastMsg = $("#toastMsg");
  const toastUndo = $("#toastUndo");
  function showToast(msg, undoFn) {
    toastMsg.textContent = msg;
    toastUndo.style.display = undoFn ? "" : "none";
    toast.classList.add("show");
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, 4500);
    toastUndo.onclick = () => { if (undoFn) undoFn(); };
  }
  function hideToast() { toast.classList.remove("show"); pendingDelete = null; }

  /* ---------- Modal ---------- */
  const modalBackdrop = $("#modalBackdrop");
  const modalText = $("#modalText");
  function openModal() {
    const data = JSON.stringify(tasks, null, 2);
    modalText.value = data;
    modalBackdrop.classList.add("show");
  }
  function closeModal() { modalBackdrop.classList.remove("show"); }
  $("#exportBtn").addEventListener("click", openModal);
  $("#modalClose").addEventListener("click", closeModal);
  modalBackdrop.addEventListener("click", (e) => { if (e.target === modalBackdrop) closeModal(); });
  $("#modalCopy").addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(modalText.value); showToast("Copied to clipboard", null); }
    catch { showToast("Copy failed — select manually", null); }
  });
  $("#modalImport").addEventListener("click", () => {
    try {
      const parsed = JSON.parse(modalText.value);
      if (!Array.isArray(parsed)) throw new Error("Expected array");
      tasks = normalize(parsed);
      save(); render();
      closeModal();
      showToast(`Imported ${tasks.length} task${tasks.length===1?"":"s"}`, null);
    } catch (e) {
      showToast("Invalid JSON: " + e.message, null);
    }
  });

  /* ---------- Greeting ---------- */
  function updateGreeting() {
    const h = new Date().getHours();
    let g = "Good evening";
    if (h < 5) g = "Good night";
    else if (h < 12) g = "Good morning";
    else if (h < 17) g = "Good afternoon";
    const remaining = tasks.filter(t=>!t.done).length;
    greeting.textContent = g;
  }

  /* ---------- Init ---------- */
  updateGreeting();
  render();
  input.focus();

  // Keyboard shortcuts
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      if (expandedId !== null) { toggleExpand(null); }
      else if (document.querySelector('.modal-backdrop.show')) { closeModal(); }
    }
    if (e.key === 'n' && e.target === input) { e.preventDefault(); addTask(); }
    if (e.key === '/') { e.preventDefault(); searchInput.focus(); }
    if (e.key === 't' && !e.target.matches('input, textarea, select')) { e.preventDefault(); theme = theme === 'dark' ? 'light' : 'dark'; applyTheme(theme); try { localStorage.setItem(THEME_KEY, theme); } catch {} }
  });

})();
</script>
</body>
</html>
