<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GTA Vice City - Open World</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #050512; font-family: 'Arial', sans-serif; }
    #canvas { display: block; width: 100%; height: 100%; }
    #hud { position: fixed; top: 0; left: 0; width: 100%; pointer-events: none; z-index: 10; }
    .panel { position: absolute; background: rgba(0, 0, 0, 0.6); color: #fff; padding: 8px 14px; border-radius: 8px; font-size: 13px; border: 1px solid rgba(255, 100, 200, 0.4); backdrop-filter: blur(4px); }
    #money { top: 16px; left: 16px; font-size: 18px; color: #00ff88; font-weight: bold; }
    #wanted { top: 16px; right: 16px; color: #ff4444; font-weight: bold; }
    #health { top: 48px; left: 16px; }
    #armor { top: 72px; left: 16px; }
    #weapon { top: 96px; left: 16px; }
    #mission { top: 16px; left: 50%; transform: translateX(-50%); text-align: center; max-width: 60%; }
    #controls { bottom: 16px; left: 16px; font-size: 11px; color: #aaa; line-height: 1.5; }
    #speed { bottom: 16px; right: 16px; font-size: 20px; color: #ff66cc; font-weight: bold; }
    #crosshair { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 12px; height: 12px; pointer-events: none; z-index: 10; }
    #crosshair::before, #crosshair::after { content: ''; position: absolute; background: #ff3366; }
    #crosshair::before { left: 5px; top: 0; width: 2px; height: 12px; }
    #crosshair::after { top: 5px; left: 0; width: 12px; height: 2px; }
    #minimap { position: fixed; bottom: 16px; right: 16px; width: 140px; height: 140px; border: 2px solid #ff66cc; border-radius: 50%; background: rgba(0, 0, 0, 0.6); overflow: hidden; z-index: 10; }
    #minimap canvas { width: 100%; height: 100%; }
    #title { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; color: #ff66cc; z-index: 20; text-shadow: 0 0 20px #ff00ff; }
    #title h1 { font-size: 48px; letter-spacing: 4px; }
    #title p { font-size: 16px; color: #aaa; margin-top: 10px; }
    #title button { margin-top: 20px; padding: 12px 32px; background: #ff3366; color: #fff; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; pointer-events: auto; }
    #title button:hover { background: #ff66cc; }
    #death { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #ff0000; font-size: 48px; display: none; text-shadow: 0 0 20px #ff0000; z-index: 20; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="hud">
    <div id="money" class="panel">$ 50,000</div>
    <div id="wanted" class="panel">Wanted: 0</div>
    <div id="health" class="panel">HP: 100</div>
    <div id="armor" class="panel">Armor: 0</div>
    <div id="weapon" class="panel">Weapon: Fist</div>
    <div id="mission" class="panel">Welcome to Vice City - Press ENTER to start</div>
    <div id="controls" class="panel">
      WASD: Move/Drive | Mouse: Look | Click: Shoot<br>
      E: Enter/Exit Vehicle | Space: Jump | Shift: Sprint<br>
      1-4: Weapons | R: Reload | F: Horn
    </div>
    <div id="speed" class="panel">0 km/h</div>
    <div id="minimap"><canvas id="minimapCanvas" width="140" height="140"></canvas></div>
  </div>
  <div id="crosshair"></div>
  <div id="title">
    <h1>GTA VICE CITY</h1>
    <p>Open World Crime Sandbox</p>
    <button id="startBtn">START GAME</button>
  </div>
  <div id="death">WASTED</div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
import * as THREE from 'three';

// ---- Globals ----
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas'), antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;

const clock = new THREE.Clock();
let gameState = 'title';
let player = { pos: new THREE.Vector3(0, 0, 0), vel: new THREE.Vector3(), yaw: 0, pitch: 0, onGround: false, inVehicle: null, health: 100, armor: 0, money: 50000, wanted: 0, weapon: 0, ammo: [Infinity, 30, 120, 50], reloading: false };
const keys = {};
const mouse = { x: 0, y: 0, down: false };
const raycaster = new THREE.Raycaster();
const GRAVITY = -25;
const WORLD = 500;

// ---- Lighting (Vice City sunset) ----
const ambient = new THREE.AmbientLight(0x4040aa, 0.6);
scene.add(ambient);
const sun = new THREE.DirectionalLight(0xff6699, 1.4);
sun.position.set(100, 80, 50);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -200; sun.shadow.camera.right = 200; sun.shadow.camera.top = 200; sun.shadow.camera.bottom = -200; sun.shadow.camera.far = 400;
scene.add(sun);
const hemi = new THREE.HemisphereLight(0xff66cc, 0x220044, 0.5);
scene.add(hemi);

// Sky gradient
const skyGeo = new THREE.SphereGeometry(500, 32, 16);
const skyMat = new THREE.ShaderMaterial({
  uniforms: { topColor: { value: new THREE.Color(0xff3366) }, bottomColor: { value: new THREE.Color(0x220044)}, offset: { value: 500 }, exponent: { value: 0.6 } },
  vertexShader: `varying vec3 vWorldPosition; void main(){ vWorldPosition=(modelMatrix*vec4(position,1.0)).xyz; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader: `uniform vec3 topColor; uniform vec3 bottomColor; uniform float offset; uniform float exponent; varying vec3 vWorldPosition; void main(){ float h=normalize(vWorldPosition+offset).y; gl_FragColor=vec4(mix(bottomColor,topColor,max(pow(max(h,0.0),exponent),0.0)),1.0); }`,
  side: THREE.BackSide
});
scene.add(new THREE.Mesh(skyGeo, skyMat));

// ---- Materials ----
const matRoad = new THREE.MeshStandardMaterial({ color: 0x2a2a30, roughness: 0.9 });
const matSidewalk = new THREE.MeshStandardMaterial({ color: 0x6a6a72, roughness: 0.8 });
const matBuilding = (c) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.7, metalness: 0.1 });
const matWater = new THREE.MeshStandardMaterial({ color: 0x0044aa, roughness: 0.1, metalness: 0.3, transparent: true, opacity: 0.85 });
const matGrass = new THREE.MeshStandardMaterial({ color: 0x1a4a2a, roughness: 0.9 });
const matNeon = (c) => new THREE.MeshBasicMaterial({ color: c });
const neonColors = [0xff00ff, 0x00ffff, 0xff6600, 0x00ff88, 0xff0066];

// ---- World generation ----
const colliders = [];
const buildings = [];
const vehicles = [];
const npcs = [];
const bullets = [];
const particles = [];

function addCollider(box) { colliders.push(box); }

// Ground plane
const ground = new THREE.Mesh(new THREE.PlaneGeometry(WORLD * 2, WORLD * 2), matGrass);
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

// Water (ocean on one side)
const water = new THREE.Mesh(new THREE.PlaneGeometry(WORLD * 2, 80), matWater);
water.rotation.x = -Math.PI / 2; water.position.set(0, -0.5, -WORLD + 40); scene.add(water);

// Grid roads
const roadW = 14;
for (let i = -WORLD / 2; i <= WORLD / 2; i += 60) {
  // horizontal
  const r1 = new THREE.Mesh(new THREE.PlaneGeometry(WORLD * 2, roadW), matRoad);
  r1.rotation.x = -Math.PI / 2; r1.position.set(0, 0.01, i); r1.receiveShadow = true; scene.add(r1);
  // vertical
  const r2 = new THREE.Mesh(new THREE.PlaneGeometry(roadW, WORLD * 2), matRoad);
  r2.rotation.x = -Math.PI / 2; r2.position.set(i, 0.01, 0); r2.receiveShadow = true; scene.add(r2);
}
// Sidewalk strips
for (let i = -WORLD / 2; i <= WORLD / 2; i += 60) {
  for (let s = -1; s <= 1; s += 2) {
    const sw = new THREE.Mesh(new THREE.PlaneGeometry(WORLD * 2, 4), matSidewalk);
    sw.rotation.x = -Math.PI / 2; sw.position.set(0, 0.02, i + s * 9); scene.add(sw);
    const sw2 = new THREE.Mesh(new THREE.PlaneGeometry(4, WORLD * 2), matSidewalk);
    sw2.rotation.x = -Math.PI / 2; sw2.position.set(i + s * 9, 0.02, 0); scene.add(sw2);
  }
}

// Buildings
function makeBuilding(x, z, w, d, h, color) {
  const g = new THREE.BoxGeometry(w, h, d);
  const m = matBuilding(color);
  const mesh = new THREE.Mesh(g, m);
  mesh.position.set(x, h / 2, z);
  mesh.castShadow = true; mesh.receiveShadow = true;
  scene.add(mesh);
  buildings.push(mesh);
  // collider
  const box = new THREE.Box3().setFromCenterAndSize(new THREE.Vector3(x, h / 2, z), new THREE.Vector3(w, h, d));
  addCollider(box);
  // neon sign
  if (Math.random() < 0.4) {
    const sign = new THREE.Mesh(new THREE.PlaneGeometry(w * 0.6, 2), matNeon(neonColors[Math.floor(Math.random() * neonColors.length)]));
    sign.position.set(x, h - 1, z + d / 2 + 0.1);
    scene.add(sign);
  }
  // windows
  const winMat = new THREE.MeshBasicMaterial({ color: 0xffff88, transparent: true, opacity: 0.7 });
  for (let wy = 4; wy < h - 2; wy += 4) {
    for (let wx = -w / 2 + 2; wx < w / 2 - 1; wx += 3) {
      if (Math.random() < 0.6) {
        const win = new THREE.Mesh(new THREE.PlaneGeometry(1.2, 1.5), winMat);
        win.position.set(x + wx, wy, z + d / 2 + 0.05);
        scene.add(win);
      }
    }
  }
}

const palette = [0x3a3a5a, 0x5a4a6a, 0x4a5a6a, 0x6a5a4a, 0x4a4a6a, 0x5a5a7a, 0x7a5a5a, 0x4a6a5a];
for (let bx = -WORLD / 2 + 30; bx < WORLD / 2 - 30; bx += 60) {
  for (let bz = -WORLD / 2 + 30; bz < WORLD / 2 - 30; bz += 60) {
    // skip roads intersection area
    if (Math.abs(bx % 60) < 20 && Math.abs(bz % 60) < 20) continue;
    const num = 1 + Math.floor(Math.random() * 3);
    for (let n = 0; n < num; n++) {
      const w = 8 + Math.random() * 14, d = 8 + Math.random() * 14, h = 12 + Math.random() * 30;
      const ox = (Math.random() - 0.5) * 30, oz = (Math.random() - 0.5) * 30;
      makeBuilding(bx + ox, bz + oz, w, d, h, palette[Math.floor(Math.random() * palette.length)]);
    }
  }
}

// Trees
const treeMat = new THREE.MeshStandardMaterial({ color: 0x2a6a3a });
for (let i = 0; i < 150; i++) {
  const x = (Math.random() - 0.5) * WORLD * 1.8, z = (Math.random() - 0.5) * WORLD * 1.8;
  // avoid roads
  if (Math.abs(x % 60) < 8 || Math.abs(z % 60) < 8) continue;
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.4, 3), new THREE.MeshStandardMaterial({ color: 0x4a3a2a }));
  trunk.position.set(x, 1.5, z); trunk.castShadow = true; scene.add(trunk);
  const leaves = new THREE.Mesh(new THREE.SphereGeometry(2.5 + Math.random() * 2, 8, 8), treeMat);
  leaves.position.set(x, 4.5, z); leaves.castShadow = true; scene.add(leaves);
}

// ---- Vehicle factory ----
function makeVehicle(x, z, color, hue = 0) {
  const group = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.9, 4.5), new THREE.MeshStandardMaterial({ color, metalness: 0.4, roughness: 0.4 }));
  body.position.y = 0.9; body.castShadow = true; group.add(body);
  // cabin
  const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.7, 2.2), new THREE.MeshStandardMaterial({ color: 0x111122, metalness: 0.6, roughness: 0.2 }));
  cabin.position.set(0, 1.65, -0.4); group.add(cabin);
  // wheels
  const wMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
  [ [-1.0, 0.4, 1.6], [1.0, 0.4, 1.6], [-1.0, 0.4, -1.6], [1.0, 0.4, -1.6] ].forEach(p => {
    const wh = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 0.3, 12), wMat);
    wh.rotation.z = Math.PI / 2; wh.position.set(p[0], p[1], p[2]); group.add(wh);
  });
  // lights
  const hl = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.2, 0.1), new THREE.MeshBasicMaterial({ color: 0xffffaa }));
  hl.position.set(-0.7, 0.9, 2.3); group.add(hl);
  const hl2 = hl.clone(); hl2.position.x = 0.7; group.add(hl2);
  group.position.set(x, 0, z);
  scene.add(group);
  const v = { mesh: group, pos: group.position, vel: new THREE.Vector3(), yaw: 0, speed: 0, color, horn: false };
  vehicles.push(v);
  return v;
}

// Spawn vehicles around
for (let i = 0; i < 40; i++) {
  const x = (Math.random() - 0.5) * WORLD * 1.6, z = (Math.random() - 0.5) * WORLD * 1.6;
  if (Math.abs(x % 60) > 8 && Math.abs(z % 60) > 8) continue;
  makeVehicle(x, z, [0xff3366, 0x00ccff, 0xffaa00, 0x88ff00, 0xffffff, 0x333333][Math.floor(Math.random() * 6)]);
}

// ---- NPC ----
function makeNPC(x, z) {
  const group = new THREE.Group();
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 1.6), new THREE.MeshStandardMaterial({ color: Math.random() * 0xffffff }));
  body.position.y = 0.8; group.add(body);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.3, 8, 8), new THREE.MeshStandardMaterial({ color: 0xffcc99 }));
  head.position.y = 1.9; group.add(head);
  group.position.set(x, 0, z);
  scene.add(group);
  const n = { mesh: group, pos: group.position, vel: new THREE.Vector3(), yaw: Math.random() * Math.PI * 2, state: 'wander', target: new THREE.Vector3(x, z, 0), timer: Math.random() * 3, health: 100, alive: true };
  npcs.push(n);
  return n;
}
for (let i = 0; i < 50; i++) {
  const x = (Math.random() - 0.5) * WORLD * 1.6, z = (Math.random() - 0.5) * WORLD * 1.6;
  makeNPC(x, z);
}

// ---- Player mesh ----
const playerMesh = new THREE.Group();
const pBody = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 1.6), new THREE.MeshStandardMaterial({ color: 0x00ff88 }));
pBody.position.y = 0.8; playerMesh.add(pBody);
const pHead = new THREE.Mesh(new THREE.SphereGeometry(0.3, 8, 8), new THREE.MeshStandardMaterial({ color: 0xffcc99 }));
pHead.position.y = 1.9; playerMesh.add(pHead);
scene.add(playerMesh);

// ---- Input ----
window.addEventListener('keydown', e => { keys[e.code] = true; if (e.code === 'Enter' && gameState === 'title') startGame(); });
window.addEventListener('keyup', e => { keys[e.code] = false; });
window.addEventListener('mousemove', e => {
  if (gameState !== 'play') return;
  mouse.x = e.movementX || 0; mouse.y = e.movementY || 0;
  player.yaw -= mouse.x * 0.002;
  player.pitch = Math.max(-1.2, Math.min(1.2, player.pitch - mouse.y * 0.002));
});
window.addEventListener('mousedown', e => { if (gameState === 'play') { mouse.down = true; shoot(); } });
window.addEventListener('mouseup', e => { mouse.down = false; });
document.getElementById('canvas').addEventListener('click', () => { if (gameState === 'play') document.body.requestPointerLock(); });
document.getElementById('startBtn').addEventListener('click', startGame);

function startGame() {
  gameState = 'play';
  document.getElementById('title').style.display = 'none';
  document.body.requestPointerLock();
  player.pos.set(0, 0, 0);
}

// ---- Shooting ----
const weaponNames = ['Fist', 'Pistol', 'SMG', 'Rifle'];
const weaponDamage = [15, 25, 18, 40];
const weaponRange = [3, 60, 40, 100];
const weaponCooldown = [0.4, 0.25, 0.1, 0.6];
let lastShot = 0;
function shoot() {
  const now = clock.getElapsedTime();
  if (now - lastShot < weaponCooldown[player.weapon]) return;
  if (player.weapon > 0 && player.ammo[player.weapon] <= 0) { if (player.reloading) return; reload(); return; }
  lastShot = now;
  if (player.weapon > 0) player.ammo[player.weapon]--;
  // raycast
  const dir = new THREE.Vector3(0, 0, -1).applyEuler(new THREE.Euler(player.pitch, player.yaw, 0, 'YXZ'));
  raycaster.set(player.pos.clone().add(new THREE.Vector3(0, 1.6, 0)), dir);
  const targets = [...npcs.filter(n => n.alive).map(n => n.mesh), ...vehicles.map(v => v.mesh)];
  const hits = raycaster.intersectObjects(targets, true);
  if (hits.length) {
    const h = hits[0];
    // find npc
    const npc = npcs.find(n => n.mesh === h.object || n.mesh.children.includes(h.object));
    if (npc) { npc.health -= weaponDamage[player.weapon]; if (npc.health <= 0) { npc.alive = false; scene.remove(npc.mesh); player.money += 50; player.wanted = Math.min(5, player.wanted + 0.3); spawnParticles(npc.pos, 0xff0000, 10); } }
    const v = vehicles.find(vv => vv.mesh === h.object || vv.mesh.children.includes(h.object));
    if (v) { v.health = (v.health || 100) - weaponDamage[player.weapon]; spawnParticles(h.point, 0xff6600, 5); }
    // bullet impact
    spawnParticles(h.point, 0xffff00, 3);
  }
  // tracer
  const tracer = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, weaponRange[player.weapon]), new THREE.MeshBasicMaterial({ color: 0xffff00, transparent: true, opacity: 0.6 }));
  tracer.position.copy(player.pos).add(new THREE.Vector3(0, 1.6, 0)).add(dir.clone().multiplyScalar(weaponRange[player.weapon] / 2));
  tracer.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
  scene.add(tracer);
  setTimeout(() => scene.remove(tracer), 60);
  // recoil
  player.pitch += 0.02 * (Math.random() - 0.5);
}

function reload() {
  if (player.reloading) return; player.reloading = true;
  setTimeout(() => { player.ammo[player.weapon] = 120; player.reloading = false; }, 1200);
}

// ---- Particles ----
function spawnParticles(pos, color, n) {
  for (let i = 0; i < n; i++) {
    const p = new THREE.Mesh(new THREE.SphereGeometry(0.1), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 1 }));
    p.position.copy(pos);
    const vel = new THREE.Vector3((Math.random() - 0.5) * 8, Math.random() * 8, (Math.random() - 0.5) * 8);
    particles.push({ mesh: p, vel, lifetime: 0.6, age: 0 });
    scene.add(p);
  }
}

// ---- Vehicle enter/exit ----
function nearestVehicle() {
  let best = null, bestD = 4;
  for (const v of vehicles) {
    const d = v.pos.distanceTo(player.pos);
    if (d < bestD) { bestD = d; best = v; }
  }
  return best;
}
window.addEventListener('keydown', e => {
  if (e.code === 'KeyE' && gameState === 'play') {
    if (player.inVehicle) {
      // exit
      const v = player.inVehicle;
      player.pos.copy(v.pos).add(new THREE.Vector3(3, 0, 0));
      player.inVehicle = null;
      v.speed = 0;
    } else {
      const v = nearestVehicle();
      if (v) { player.inVehicle = v; }
    }
  }
  if (e.code === 'Digit1') player.weapon = 0;
  if (e.code === 'Digit2') player.weapon = 1;
  if (e.code === 'Digit3') player.weapon = 2;
  if (e.code === 'Digit4') player.weapon = 3;
  if (e.code === 'KeyR') reload();
});

// ---- NPC AI update ----
function updateNPCs(dt) {
  for (const n of npcs) {
    if (!n.alive) continue;
    n.timer -= dt;
    if (n.timer <= 0) {
      n.target.set(n.pos.x + (Math.random() - 0.5) * 20, 0, n.pos.z + (Math.random() - 0.5) * 20);
      n.timer = 2 + Math.random() * 4;
      n.yaw = Math.atan2(n.target.x - n.pos.x, n.target.z - n.pos.z);
    }
    const dx = n.target.x - n.pos.x, dz = n.target.z - n.pos.z;
    const dist = Math.hypot(dx, dz);
    if (dist > 1) {
      const sp = 1.5;
      n.pos.x += (dx / dist) * sp * dt;
      n.pos.z += (dz / dist) * sp * dt;
      n.yaw = Math.atan2(dx, dz);
    }
    n.mesh.position.copy(n.pos);
    n.mesh.rotation.y = n.yaw;
    // flee if wanted high & close to player
    const pdist = n.pos.distanceTo(player.pos);
    if (player.wanted > 2 && pdist < 20) {
      const fx = n.pos.x - player.pos.x, fz = n.pos.z - player.pos.z;
      const fd = Math.hypot(fx, fz);
      n.pos.x += (fx / fd) * 4 * dt;
      n.pos.z += (fz / fd) * 4 * dt;
    }
  }
}

// ---- Collision ----
function resolveCollisions(pos, radius = 0.5) {
  for (const b of colliders) {
    const closest = new THREE.Vector3(
      Math.max(b.min.x, Math.min(pos.x, b.max.x)),
      pos.y,
      Math.max(b.min.z, Math.min(pos.z, b.max.z))
    );
    const dx = pos.x - closest.x, dz = pos.z - closest.z;
    const dist = Math.hypot(dx, dz);
    if (dist < radius && closest.y < pos.y + 2 && closest.y > pos.y - 2) {
      if (dist > 0.001) { pos.x += (dx / dist) * (radius - dist); pos.z += (dz / dist) * (radius - dist); }
      else { pos.x += radius; }
    }
  }
  // world bounds
  pos.x = Math.max(-WORLD + 5, Math.min(WORLD - 5, pos.x));
  pos.z = Math.max(-WORLD + 5, Math.min(WORLD - 5, pos.z));
}

// ---- Update ----
let wantedTimer = 0;
function update(dt) {
  if (gameState !== 'play') return;
  // wanted decay
  wantedTimer += dt;
  if (wantedTimer > 5) { wantedTimer = 0; if (player.wanted > 0) player.wanted = Math.max(0, player.wanted - 0.1); }

  const inV = player.inVehicle;
  if (inV) {
    // driving
    const v = inV;
    const fwd = keys['KeyW'] || keys['ArrowUp'];
    const back = keys['KeyS'] || keys['ArrowDown'];
    const left = keys['KeyA'] || keys['ArrowLeft'];
    const right = keys['KeyD'] || keys['ArrowRight'];
    if (fwd) v.speed = Math.min(v.speed + 20 * dt, 60);
    if (back) v.speed = Math.max(v.speed - 30 * dt, -20);
    if (!fwd && !back) v.speed *= 0.95;
    if (left) v.yaw += (v.speed > 0 ? 1 : -1) * 2 * dt;
    if (right) v.yaw -= (v.speed > 0 ? 1 : -1) * 2 * dt;
    const fx = Math.sin(v.yaw), fz = Math.cos(v.yaw);
    v.pos.x += fx * v.speed * dt;
    v.pos.z += fz * v.speed * dt;
    v.mesh.position.copy(v.pos);
    v.mesh.rotation.y = v.yaw;
    player.pos.copy(v.pos);
    player.pos.y = 0;
    // horn
    if (keys['KeyF']) v.horn = true; else v.horn = false;
    document.getElementById('speed').textContent = Math.round(Math.abs(v.speed)) + ' km/h';
  } else {
    // walking
    document.getElementById('speed').textContent = '0 km/h';
    const speed = keys['ShiftLeft'] ? 8 : 4;
    const fwd = new THREE.Vector3(Math.sin(player.yaw), 0, Math.cos(player.yaw));
    const right = new THREE.Vector3(Math.cos(player.yaw), 0, -Math.sin(player.yaw));
    const move = new THREE.Vector3();
    if (keys['KeyW']) move.add(fwd);
    if (keys['KeyS']) move.sub(fwd);
    if (keys['KeyA']) move.sub(right);
    if (keys['KeyD']) move.add(right);
    if (move.length() > 0) { move.normalize().multiplyScalar(speed); }
    player.vel.x = move.x;
    player.vel.z = move.z;
    // gravity
    player.vel.y += GRAVITY * dt;
    player.pos.x += player.vel.x * dt;
    player.pos.z += player.vel.z * dt;
    player.pos.y += player.vel.y * dt;
    if (player.pos.y <= 0) { player.pos.y = 0; player.vel.y = 0; player.onGround = true; }
    else player.onGround = false;
    if (keys['Space'] && player.onGround) { player.vel.y = 9; player.onGround = false; }
    resolveCollisions(player.pos, 0.5);
    // shooting auto while mouse down for smg/rifle
    if (mouse.down && (player.weapon === 2 || player.weapon === 3)) { shoot(); }
  }
  // update player mesh
  if (!inV) {
    playerMesh.position.copy(player.pos);
    playerMesh.rotation.y = player.yaw;
    playerMesh.visible = true;
  } else {
    playerMesh.visible = false;
  }
  // camera follow
  if (inV) {
    const v = inV;
    const camOff = new THREE.Vector3(-Math.sin(v.yaw) * 12, 5, -Math.cos(v.yaw) * 12);
    camera.position.copy(v.pos).add(camOff);
    camera.lookAt(v.pos.clone().add(new THREE.Vector3(0, 1, 0)));
  } else {
    const camOff = new THREE.Vector3(-Math.sin(player.yaw) * 6 * Math.cos(player.pitch), 2 + 3 * Math.sin(Math.max(0, player.pitch)), -Math.cos(player.yaw) * 6 * Math.cos(player.pitch));
    // simpler: over shoulder
    const eye = player.pos.clone().add(new THREE.Vector3(0, 1.6, 0));
    const dir = new THREE.Vector3(Math.sin(player.yaw) * Math.cos(player.pitch), Math.sin(player.pitch), Math.cos(player.yaw) * Math.cos(player.pitch));
    camera.position.copy(eye).sub(dir.clone().multiplyScalar(6)).add(new THREE.Vector3(0, 2, 0));
    camera.lookAt(eye.clone().add(dir.clone().multiplyScalar(10)));
  }

  updateNPCs(dt);

  // particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.age += dt;
    p.vel.y += GRAVITY * dt * 0.5;
    p.mesh.position.add(p.vel.clone().multiplyScalar(dt));
    p.mesh.material.opacity = 1 - p.age / p.lifetime;
    if (p.age >= p.lifetime) { scene.remove(p.mesh); particles.splice(i, 1); }
  }

  // HUD
  document.getElementById('money').textContent = '$ ' + player.money.toLocaleString();
  document.getElementById('health').textContent = 'HP: ' + Math.round(player.health);
  document.getElementById('armor').textContent = 'Armor: ' + player.armor;
  document.getElementById('weapon').textContent = 'Weapon: ' + weaponNames[player.weapon] + (player.weapon > 0 ? ' (' + player.ammo[player.weapon] + ')' : '');
  document.getElementById('wanted').textContent = 'Wanted: ' + Math.round(player.wanted);
  // minimap
  drawMinimap();

  // death
  if (player.health <= 0) {
    document.getElementById('death').style.display = 'block';
    setTimeout(() => { player.health = 100; player.pos.set(0, 0, 0); player.inVehicle = null; document.getElementById('death').style.display = 'none'; }, 3000);
  }
}

// ---- Minimap ----
const mmCtx = document.getElementById('minimapCanvas').getContext('2d');
function drawMinimap() {
  mmCtx.fillStyle = 'rgba(0, 0, 0, 0.8)'; mmCtx.fillRect(0, 0, 140, 140);
  mmCtx.save(); mmCtx.translate(70, 70);
  const scale = 140 / WORLD;
  // player
  mmCtx.fillStyle = '#00ff88'; mmCtx.beginPath(); mmCtx.arc(0, 0, 3, 0, Math.PI * 2); mmCtx.fill();
  // direction
  mmCtx.strokeStyle = '#00ff88'; mmCtx.beginPath(); mmCtx.moveTo(0, 0); mmCtx.lineTo(Math.sin(player.yaw) * 8, Math.cos(player.yaw) * 8); mmCtx.stroke();
  // vehicles
  mmCtx.fillStyle = '#ff66cc';
  for (const v of vehicles) {
    const rx = (v.pos.x - player.pos.x) * scale, rz = (v.pos.z - player.pos.z) * scale;
    if (Math.hypot(rx, rz) < 68) { mmCtx.fillRect(rx - 1, rz - 1, 2, 2); }
  }
  // npcs
  mmCtx.fillStyle = '#ffaa00';
  for (const n of npcs) { if (!n.alive) continue;
    const rx = (n.pos.x - player.pos.x) * scale, rz = (n.pos.z - player.pos.z) * scale;
    if (Math.hypot(rx, rz) < 68) { mmCtx.fillRect(rx - 1, rz - 1, 2, 2); }
  }
  mmCtx.restore();
}

// ---- Wanted gain when shooting NPCs ----
function gainWanted(amount) {
  player.wanted = Math.min(5, player.wanted + amount);
  spawnParticles(player.pos, 0xff6600, 5);
}

// ---- Animation loop ----
let lastTime = 0;
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  update(dt);
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
