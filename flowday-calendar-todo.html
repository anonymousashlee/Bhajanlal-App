<!DOCTYPE html>
<html lang='en' data-theme='light'>
<head>
<meta charset='UTF-8' />
<meta name='viewport' content='width=device-width, initial-scale=1.0' />
<meta name='description' content='Flowday — a calm, beautiful calendar and task planner.' />
<title>Flowday — Calendar & Tasks</title>
<style>
:root{--bg:#f5f7fb;--bg-2:#eef1f8;--panel:#ffffff;--panel-2:#f7f9fd;--panel-3:#eef2f9;--border:#e3e8f2;--border-2:#d6dde9;--text:#0f172a;--muted:#5b6478;--faint:#94a0b8;--accent:#4f46e5;--accent-2:#6366f1;--accent-soft:#eef0ff;--accent-text:#4338ca;--today:#f59e0b;--today-soft:#fef3c7;--success:#10b981;--success-soft:#d1fae5;--danger:#ef4444;--danger-soft:#fee2e2;--warning:#f59e0b;--shadow:0 1px 2px rgba(15,23,42,.04),0 14px 36px rgba(15,23,42,.08);--shadow-sm:0 1px 3px rgba(15,23,42,.08);--shadow-lg:0 24px 60px rgba(15,23,42,.16);--r:16px;--r-sm:10px;--ease:cubic-bezier(.22,1,.36,1);--dur:.22s}
[data-theme='dark']{--bg:#0b0f19;--bg-2:#11162a;--panel:#151b2e;--panel-2:#1c2338;--panel-3:#232c44;--border:#26304a;--border-2:#313c5a;--text:#eef2ff;--muted:#a3adc4;--faint:#6e7a96;--accent:#818cf8;--accent-2:#a5b4fc;--accent-soft:#1e2344;--accent-text:#a5b4fc;--today:#fbbf24;--today-soft:#3a2e10;--success:#34d399;--success-soft:#0f3328;--danger:#f87171;--danger-soft:#3a1a20;--warning:#fbbf24;--shadow:0 1px 2px rgba(0,0,0,.4),0 16px 40px rgba(0,0,0,.45);--shadow-sm:0 2px 8px rgba(0,0,0,.35);--shadow-lg:0 24px 60px rgba(0,0,0,.55)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
input,textarea,select{font:inherit;color:inherit}
a{color:var(--accent-text);text-decoration:none}
.app{display:flex;flex-direction:column;height:100vh}
.topbar{display:flex;align-items:center;gap:12px;padding:12px 18px;background:var(--panel);border-bottom:1px solid var(--border);box-shadow:0 1px 0 var(--border);z-index:20;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;letter-spacing:-.01em}
.brand-mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;box-shadow:0 4px 12px rgba(79,70,229,.35)}
.brand-sub{font-size:11px;color:var(--faint);font-weight:500;letter-spacing:.02em;text-transform:uppercase}
.topbar .spacer{flex:1}
.nav-seg{display:flex;background:var(--panel-2);border:1px solid var(--border);border-radius:999px;padding:3px;gap:2px}
.nav-seg button{padding:6px 13px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted);transition:all var(--dur) var(--ease)}
.nav-seg button:hover{color:var(--text)}
.nav-seg button.active{background:var(--panel);color:var(--accent-text);box-shadow:var(--shadow-sm)}
.icon-btn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--muted);transition:all var(--dur) var(--ease);background:var(--panel-2);border:1px solid var(--border)}
.icon-btn:hover{color:var(--text);background:var(--panel-3)}
.search-box{display:flex;align-items:center;gap:8px;background:var(--panel-2);border:1px solid var(--border);border-radius:10px;padding:0 12px;height:36px;width:220px;transition:all var(--dur) var(--ease)}
.search-box:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);background:var(--panel)}
.search-box input{border:none;background:none;outline:none;width:100%;font-size:13px}
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:10px;font-size:13px;font-weight:600;transition:all var(--dur) var(--ease);white-space:nowrap}
.btn-primary{background:var(--accent);color:#fff;box-shadow:0 6px 16px rgba(79,70,229,.3)}
.btn-primary:hover{background:var(--accent-2);transform:translateY(-1px);box-shadow:0 8px 20px rgba(79,70,229,.4)}
.btn-ghost{background:var(--panel-2);color:var(--text);border:1px solid var(--border)}
.btn-ghost:hover{background:var(--panel-3)}
.btn-danger{background:var(--danger-soft);color:var(--danger)}
.btn-danger:hover{background:var(--danger);color:#fff}
.btn-sm{padding:5px 10px;font-size:12px}
.layout{display:grid;grid-template-columns:260px 1fr 320px;flex:1;min-height:0;overflow:hidden}
@media (max-width:1180px){.layout{grid-template-columns:260px 1fr}.right-col{display:none}}
@media (max-width:860px){.layout{grid-template-columns:1fr}.left-col,.right-col{position:fixed;top:58px;bottom:0;z-index:40;width:86%;max-width:320px;background:var(--panel);box-shadow:var(--shadow-lg);transform:translateX(-110%);transition:transform .3s var(--ease);overflow:auto}.right-col{right:0;left:auto;transform:translateX(110%)}.left-col.open,.right-col.open{transform:translateX(0)}.scrim{display:block}}
.scrim{display:none;position:fixed;inset:0;background:rgba(15,23,42,.4);backdrop-filter:blur(2px);z-index:35}
.scrim.show{display:block}
.left-col,.right-col{overflow:auto;padding:16px;border-right:1px solid var(--border);background:var(--panel)}
.right-col{border-right:none;border-left:1px solid var(--border)}
.main{overflow:auto;padding:18px 22px;background:var(--bg)}
.side-section{margin-bottom:18px}
.side-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);margin-bottom:8px;padding:0 6px}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:9px;font-size:13px;font-weight:500;color:var(--muted);transition:all var(--dur) var(--ease);text-align:left}
.nav-item:hover{background:var(--panel-2);color:var(--text)}
.nav-item.active{background:var(--accent-soft);color:var(--accent-text);font-weight:600}
.nav-item .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.nav-item .count{margin-left:auto;font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.list-item{display:flex;align-items:center;gap:9px;width:100%;padding:7px 10px;border-radius:9px;font-size:13px;color:var(--muted);transition:all var(--dur) var(--ease)}
.list-item:hover{background:var(--panel-2);color:var(--text)}
.list-item.active{background:var(--accent-soft);color:var(--accent-text);font-weight:600}
.list-item .swatch{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.list-item .count{margin-left:auto;font-size:11px;color:var(--faint)}
.mini{background:var(--panel-2);border:1px solid var(--border);border-radius:var(--r);padding:12px}
.mini-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.mini-title{font-size:13px;font-weight:700}
.mini-nav{display:flex;gap:2px}
.mini-nav button{width:26px;height:26px;border-radius:7px;color:var(--muted);display:grid;place-items:center}
.mini-nav button:hover{background:var(--panel-3);color:var(--text)}
.mini-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.mini-dow{text-align:center;font-size:10px;font-weight:700;color:var(--faint);padding:4px 0}
.mini-day{aspect-ratio:1;border-radius:7px;font-size:11px;font-weight:600;color:var(--muted);display:flex;align-items:center;justify-content:center;position:relative;transition:all var(--dur) var(--ease)}
.mini-day:hover{background:var(--panel-3);color:var(--text)}
.mini-day.out{color:var(--faint);opacity:.5}
.mini-day.today{color:var(--today);font-weight:800}
.mini-day.sel{background:var(--accent);color:#fff}
.mini-day .dot{position:absolute;bottom:3px;width:3px;height:3px;border-radius:50%;background:var(--accent)}
.mini-day.sel .dot{background:#fff}
.main-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:12px;flex-wrap:wrap}
.main-title{font-size:24px;font-weight:800;letter-spacing:-.02em}
.main-sub{font-size:13px;color:var(--muted);margin-top:2px}
.main-actions{display:flex;gap:8px;align-items:center}
.calendar{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow-sm)}
.dow-row{display:grid;grid-template-columns:repeat(7,1fr);background:var(--panel-2);border-bottom:1px solid var(--border)}
.dow{padding:10px 6px;text-align:center;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.dow.weekend{color:var(--faint)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:minmax(118px,1fr)}
.cell{border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:8px 9px;cursor:pointer;transition:background var(--dur) var(--ease);position:relative;display:flex;flex-direction:column;gap:4px;min-height:118px}
.cell:nth-child(7n){border-right:none}
.cell:hover{background:var(--panel-2)}
.cell.sel{background:var(--accent-soft)}
.cell.today .daynum{background:var(--today);color:#fff}
.cell.out{background:var(--bg-2);opacity:.7}
.cell.out .daynum{color:var(--faint)}
.cell-head{display:flex;align-items:center;justify-content:space-between}
.daynum{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted);transition:all var(--dur) var(--ease)}
.add-hint{opacity:0;font-size:16px;color:var(--faint);transition:opacity var(--dur)}
.cell:hover .add-hint{opacity:1}
.chip{font-size:11px;font-weight:600;padding:3px 7px;border-radius:6px;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c);border-left:2px solid var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;transition:transform var(--dur) var(--ease)}
.chip:hover{transform:translateX(2px)}
.chip b{font-weight:700;margin-right:4px;font-variant-numeric:tabular-nums}
.more{font-size:10px;color:var(--faint);font-weight:600;padding-left:2px}
.cell-tasks{display:flex;align-items:center;gap:5px;font-size:10px;font-weight:600;color:var(--muted);margin-top:auto}
.pdot{width:6px;height:6px;border-radius:50%}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}
.week-col{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:10px;min-height:420px;display:flex;flex-direction:column;gap:6px}
.week-col.today{border-color:var(--today);box-shadow:0 0 0 2px var(--today-soft)}
.week-head{display:flex;align-items:center;justify-content:space-between;padding-bottom:8px;border-bottom:1px solid var(--border);margin-bottom:4px}
.week-dow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--faint)}
.week-date{font-size:18px;font-weight:800;letter-spacing:-.02em}
.week-items{display:flex;flex-direction:column;gap:6px;flex:1}
.week-item{padding:7px 9px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;border-left:3px solid var(--c);background:color-mix(in srgb,var(--c) 12%,transparent);color:var(--text);transition:transform var(--dur) var(--ease)}
.week-item:hover{transform:translateX(2px)}
.week-item.task.done{text-decoration:line-through;opacity:.55}
.week-item .wi-time{font-size:10px;color:var(--muted);font-weight:500;margin-top:2px}
.week-add{margin-top:auto;padding:6px;border-radius:8px;border:1px dashed var(--border);color:var(--faint);font-size:12px;font-weight:600;text-align:center;transition:all var(--dur)}
.week-add:hover{border-color:var(--accent);color:var(--accent-text);background:var(--accent-soft)}
.day-view{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:720px){.day-view{grid-template-columns:1fr}}
.day-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:16px;box-shadow:var(--shadow-sm)}
.day-card h3{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
.timeline{display:flex;flex-direction:column;gap:8px}
.tl-item{display:flex;gap:12px;padding:10px 12px;border-radius:10px;background:var(--panel-2);border-left:3px solid var(--c);transition:transform var(--dur) var(--ease)}
.tl-item:hover{transform:translateX(2px)}
.tl-time{font-size:12px;font-weight:700;color:var(--muted);min-width:52px;font-variant-numeric:tabular-nums}
.tl-body{flex:1;min-width:0}
.tl-title{font-size:13px;font-weight:600}
.tl-meta{font-size:11px;color:var(--muted);margin-top:2px}
.task-list{display:flex;flex-direction:column;gap:6px}
.task-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--panel-2);transition:all var(--dur) var(--ease);cursor:pointer}
.task-row:hover{background:var(--panel-3)}
.task-row.done .task-title{text-decoration:line-through;color:var(--faint)}
.checkbox{width:20px;height:20px;border-radius:6px;border:2px solid var(--border-2);display:grid;place-items:center;flex-shrink:0;transition:all var(--dur) var(--ease);color:#fff}
.checkbox.checked{background:var(--success);border-color:var(--success)}
.task-body{flex:1;min-width:0}
.task-title{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task-meta{display:flex;align-items:center;gap:8px;margin-top:3px;font-size:11px;color:var(--muted);flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:5px;padding:2px 7px;border-radius:5px;background:var(--panel-3);font-size:10px;font-weight:600}
.swatch{width:8px;height:8px;border-radius:2px}
.prio{font-size:10px;font-weight:700;padding:2px 6px;border-radius:5px;text-transform:uppercase;letter-spacing:.04em}
.prio.high{background:var(--danger-soft);color:var(--danger)}
.prio.medium{background:var(--today-soft);color:var(--warning)}
.prio.low{background:var(--success-soft);color:var(--success)}
.list-view{display:flex;flex-direction:column;gap:14px}
.group{display:flex;flex-direction:column;gap:6px}
.group-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);padding:4px 2px;display:flex;align-items:center;gap:8px}
.group-title .cnt{font-size:10px;background:var(--panel-2);padding:1px 7px;border-radius:999px;color:var(--muted)}
.row{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:11px;background:var(--panel);border:1px solid var(--border);transition:all var(--dur) var(--ease);cursor:pointer}
.row:hover{border-color:var(--border-2);transform:translateY(-1px);box-shadow:var(--shadow-sm)}
.row.done{opacity:.6}
.row.done .task-title{text-decoration:line-through}
.agenda-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.agenda-date{font-size:15px;font-weight:800;letter-spacing:-.01em}
.agenda-sub{font-size:11px;color:var(--muted);margin-top:2px}
.agenda-section{margin-bottom:14px}
.agenda-section h4{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);margin-bottom:8px;display:flex;align-items:center;justify-content:space-between}
.agenda-tasks,.agenda-events{display:flex;flex-direction:column;gap:6px}
.task-item,.event-item{padding:9px 11px;border-radius:9px;background:var(--panel-2);cursor:pointer;transition:all var(--dur) var(--ease);border-left:3px solid transparent}
.task-item:hover,.event-item:hover{background:var(--panel-3)}
.task-item.done{opacity:.55}
.task-item.done .task-title{text-decoration:line-through}
.event-item{border-left-color:var(--c)}
.event-time{font-size:11px;font-weight:700;color:var(--accent-text);margin-bottom:2px}
.event-title{font-size:13px;font-weight:600}
.event-meta{font-size:10px;color:var(--muted);margin-top:2px}
.agenda-empty{padding:18px 10px;text-align:center;color:var(--faint);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:6px}
.agenda-empty svg{opacity:.5}
.quick-add{display:flex;gap:6px;margin-top:10px}
.quick-add input{flex:1;height:34px;padding:0 10px;border-radius:8px;border:1px solid var(--border);background:var(--panel-2);font-size:12px;outline:none}
.quick-add input:focus{border-color:var(--accent);background:var(--panel)}
.quick-add button{height:34px;padding:0 10px;border-radius:8px;background:var(--accent);color:#fff;font-size:12px;font-weight:600}
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.overlay.open{display:flex}
.modal{background:var(--panel);border-radius:18px;width:100%;max-width:500px;max-height:90vh;overflow:auto;box-shadow:var(--shadow-lg);animation:pop .25s var(--ease)}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:none}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 12px;border-bottom:1px solid var(--border)}
.modal-head h2{font-size:17px;font-weight:800;letter-spacing:-.01em}
.close-btn{width:30px;height:30px;border-radius:8px;color:var(--muted);display:grid;place-items:center}
.close-btn:hover{background:var(--panel-2);color:var(--text)}
.modal-body{padding:16px 20px;display:flex;flex-direction:column;gap:14px}
.modal-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--faint)}
.field input,.field textarea,.field select{padding:9px 11px;border-radius:9px;border:1px solid var(--border);background:var(--panel-2);font-size:13px;outline:none;transition:all var(--dur) var(--ease);width:100%}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent);background:var(--panel);box-shadow:0 0 0 3px var(--accent-soft)}
.field textarea{min-height:70px;resize:vertical}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.color-picks{display:flex;gap:6px;flex-wrap:wrap}
.color-pick{width:26px;height:26px;border-radius:7px;border:2px solid transparent;transition:all var(--dur) var(--ease);cursor:pointer}
.color-pick.sel{border-color:var(--text);transform:scale(1.1)}
.color-pick:hover{transform:scale(1.08)}
.prio-picks{display:flex;gap:6px}
.prio-pick{flex:1;padding:8px;border-radius:9px;border:1px solid var(--border);background:var(--panel-2);font-size:12px;font-weight:600;color:var(--muted);transition:all var(--dur)}
.prio-pick.sel{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-text)}
.modal-foot .btn-danger{margin-right:auto}
.toast-host{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--text);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow-lg);animation:toastin .3s var(--ease)}
@keyframes toastin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px}
.stat-val{font-size:20px;font-weight:800;letter-spacing:-.02em}
.stat-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);margin-top:2px}
.stat.accent .stat-val{color:var(--accent-text)}
.empty-state{padding:40px 20px;text-align:center;color:var(--faint);display:flex;flex-direction:column;align-items:center;gap:10px}
.empty-state h3{font-size:15px;font-weight:700;color:var(--muted)}
.empty-state p{font-size:12px;max-width:260px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:999px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--faint)}
.menu-btn,.agenda-btn{display:none}
@media (max-width:860px){.menu-btn,.agenda-btn{display:grid}}
</style>
</head>
<body>
<div class='app'>
  <header class='topbar'>
    <button class='icon-btn menu-btn' id='menuBtn' aria-label='Menu'><svg width='18' height='18' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2.2' stroke-linecap='round'><line x1='3' y1='6' x2='21' y2='6'/><line x1='3' y1='12' x2='21' y2='12'/><line x1='3' y1='18' x2='21' y2='18'/></svg></button>
    <div class='brand'><div class='brand-mark'>F</div><div><div>Flowday</div><div class='brand-sub'>Calendar & Tasks</div></div></div>

    <button class='icon-btn' id='themeBtn' title='Toggle theme (D)'><svg width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2.2' stroke-linecap='round'><path d='M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z'/></svg></button>
    <button class='btn btn-primary' id='newTaskBtn'><svg width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2.6' stroke-linecap='round'><line x1='12' y1='5' x2='12' y2='19'/><line x1='5' y1='12' x2='19' y2='12'/></svg>New task</button>

        <button class='nav-item' data-filter='overdue'><span class='dot' style='background:var(--danger)'></span>Overdue<span class='count' id='cOver'></span></button>

      </div>
      <div class='side-section'><div class='side-title'>Lists</div><div id='listsNav'></div><button class='nav-item' id='addListBtn' style='color:var(--accent-text);font-weight:600'><svg width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2.4' stroke-linecap='round'><line x1='12' y1='5' x2='12' y2='19'/><line x1='5' y1='12' x2='19' y2='12'/></svg>New list</button></div>
      <div class='side-section'><div class='side-title'>Tools</div><button class='nav-item' id='exportBtn'><span class='dot' style='background:var(--muted)'></span>Export data</button><button class='nav-item' id='importBtn'><span class='dot' style='background:var(--muted)'></span>Import data</button><input type='file' id='importFile' accept='application/json' hidden /></div>

      <div class='stats'><div class='stat accent'><div class='stat-val' id='stTotal'>0</div><div class='stat-label'>Tasks</div></div><div class='stat'><div class='stat-val' id='stDone'>0</div><div class='stat-label'>Done</div></div><div class='stat'><div class='stat-val' id='stLeft'>0</div><div class='stat-label'>Left</div></div></div>
      <div class='agenda-section'><h4>Tasks <button class='btn btn-sm btn-ghost' id='addTaskForDay2'>+ Task</button></h4><div class='agenda-tasks' id='agendaTasks'></div></div>
      <div class='agenda-section'><h4>Events <button class='btn btn-sm btn-ghost' id='addEventForDay'>+ Event</button></h4><div class='agenda-events' id='agendaEvents'></div></div>

    </aside>

<div class='scrim' id='scrim'></div>
<div class='overlay' id='overlay'><div class='modal' id='modal'></div></div>
<div class='toast-host' id='toastHost'></div>
<script>
(function(){
  'use strict';
  const KEY='flowday.v3';
  const $=(s,el=document)=>el.querySelector(s);
  const $$=(s,el=document)=>Array.from(el.querySelectorAll(s));
  const uid=()=>Math.random().toString(36).slice(2,10);
  const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const PALETTE=['#4f46e5','#ec4899','#f59e0b','#10b981','#0ea5e9','#8b5cf6','#ef4444','#64748b','#14b8a6','#f97316'];
  const PRIOS={high:{label:'High',color:'#ef4444'},medium:{label:'Medium',color:'#f59e0b'},low:{label:'Low',color:'#10b981'}};
  const I={check:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',close:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>',empty:'<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="9" y1="14" x2="15" y2="14"/></svg>'};
  const TODAY=new Date();TODAY.setHours(0,0,0,0);
  const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const parseYmd=s=>{if(!s)return new Date();const[y,m,d]=String(s).split('-').map(Number);return new Date(y,(m||1)-1,d||1)};
  const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
  const startOfWeek=d=>{const x=new Date(d);const day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);x.setHours(0,0,0,0);return x};
  const monthName=(d,long=true)=>d.toLocaleString('en-US',{month:long?'long':'short'});
  const fmtLong=d=>d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
  const fmtShort=d=>d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
  const isToday=s=>s===ymd(TODAY);
  function seed(){
    const lists=[{id:'l1',name:'Personal',color:PALETTE[0]},{id:'l2',name:'Work',color:PALETTE[3]},{id:'l3',name:'Health',color:PALETTE[2]}];
    const tasks=[{id:uid(),title:'Plan the week',date:ymd(TODAY),time:'09:00',priority:'high',listId:'l2',notes:'Review goals and set top 3 priorities',completed:false,createdAt:Date.now()},{id:uid(),title:'Morning run',date:ymd(addDays(TODAY,1)),time:'07:00',priority:'medium',listId:'l3',notes:'5k easy pace',completed:false,createdAt:Date.now()},{id:uid(),title:'Read 20 pages',date:ymd(addDays(TODAY,2)),priority:'low',listId:'l1',notes:'',completed:false,createdAt:Date.now()},{id:uid(),title:'Grocery shopping',date:ymd(addDays(TODAY,-1)),priority:'medium',listId:'l1',notes:'Milk, eggs, greens',completed:true,createdAt:Date.now()}];
    const events=[{id:uid(),title:'Team standup',date:ymd(TODAY),start:'09:30',end:'10:00',listId:'l2',notes:'Daily sync'},{id:uid(),title:'Dentist',date:ymd(addDays(TODAY,3)),start:'14:00',end:'15:00',listId:'l1',notes:'Annual checkup'},{id:uid(),title:'Yoga class',date:ymd(addDays(TODAY,1)),start:'18:00',end:'19:00',listId:'l3',notes:''}];
    return {theme:'light',view:'month',filter:'all',search:'',selected:ymd(TODAY),month:ymd(TODAY).slice(0,7)+'-01',lists,tasks,events};
  }
  function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.tasks)&&Array.isArray(s.lists))return s}catch(e){}return seed()}
  let state=load();
  function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
  const listOf=id=>state.lists.find(l=>l.id===id)||{name:'Unlisted',color:PALETTE[7]};
  const tasksForDate=k=>state.tasks.filter(t=>t.date===k);
  const eventsForDate=k=>state.events.filter(e=>e.date===k).sort((a,b)=>a.start.localeCompare(b.start));
  function matchesSearch(t){const q=state.search.trim().toLowerCase();if(!q)return true;return (t.title||'').toLowerCase().includes(q)||(t.notes||'').toLowerCase().includes(q)}
  function render(){renderTheme();renderMini();renderNav();renderListsNav();renderStats();renderMain();renderAgenda()}
  function renderTheme(){document.documentElement.setAttribute('data-theme',state.theme)}
  function renderMini(){const m=parseYmd(state.month),y=m.getFullYear(),mo=m.getMonth();$('#miniTitle').textContent=monthName(m)+' '+y;const grid=$('#miniGrid');grid.innerHTML='';['M','T','W','T','F','S','S'].forEach(d=>{const e=document.createElement('div');e.className='mini-dow';e.textContent=d;grid.appendChild(e)});const start=startOfWeek(new Date(y,mo,1));for(let i=0;i<42;i++){const d=addDays(start,i),key=ymd(d),out=d.getMonth()!==mo;const b=document.createElement('button');b.className='mini-day'+(out?' out':'')+(key===ymd(TODAY)?' today':'')+(key===state.selected?' sel':'');b.dataset.date=key;b.textContent=d.getDate();if(state.tasks.some(t=>t.date===key&&!t.completed)||state.events.some(e=>e.date===key)){const dot=document.createElement('span');dot.className='dot';b.appendChild(dot)}grid.appendChild(b)}}
  function renderNav(){const counts={all:state.tasks.filter(t=>!t.completed).length,today:state.tasks.filter(t=>t.date===ymd(TODAY)&&!t.completed).length,upcoming:state.tasks.filter(t=>t.date>ymd(TODAY)&&!t.completed).length,overdue:state.tasks.filter(t=>t.date<ymd(TODAY)&&!t.completed).length,completed:state.tasks.filter(t=>t.completed).length};$('#cAll').textContent=counts.all;$('#cToday').textContent=counts.today;$('#cUp').textContent=counts.upcoming;$('#cOver').textContent=counts.overdue;$('#cDone').textContent=counts.completed}
  function renderListsNav(){const wrap=$('#listsNav');wrap.innerHTML='';state.lists.forEach(l=>{const c=state.tasks.filter(t=>t.listId===l.id&&!t.completed).length;const b=document.createElement('button');b.className='list-item'+(state.filter===l.id?' active':'');b.dataset.list=l.id;b.innerHTML=`<span class='swatch' style='background:${l.color}'></span>${esc(l.name)}<span class='count'>${c}</span>`;wrap.appendChild(b)});$$('.nav-item[data-filter]').forEach(b=>{const f=b.dataset.filter;const active=(state.filter===f)&&!state.lists.some(l=>l.id===state.filter);b.classList.toggle('active',active&&(state.view==='list'||state.search||['today','upcoming','overdue','completed','all'].includes(state.filter)))})}
  function renderStats(){const sel=state.selected;const ts=tasksForDate(sel);$('#stTotal').textContent=ts.length;$('#stDone').textContent=ts.filter(t=>t.completed).length;$('#stLeft').textContent=ts.filter(t=>!t.completed).length;$('#agendaDate').textContent=fmtLong(parseYmd(sel));$('#agendaSub').textContent=isToday(sel)?'Today · '+tasksForDate(sel).filter(t=>!t.completed).length+' pending':(tasksForDate(sel).filter(t=>!t.completed).length+' pending')}
  function renderMain(){const mc=$('#mainContent');mc.innerHTML='';const head=document.createElement('div');head.className='main-head';let title='',sub='';if(state.view==='month'){title=monthName(parseYmd(state.month))+' '+parseYmd(state.month).getFullYear();sub='Click a day to see its agenda. Double-click to add a task.'}else if(state.view==='week'){const ws=startOfWeek(parseYmd(state.selected));title='Week of '+fmtShort(ws);sub='Your week at a glance.'}else if(state.view==='day'){title=fmtLong(parseYmd(state.selected));sub='Schedule and tasks for this day.'}else{title='Agenda';sub=state.search?`Results for "${state.search}"`:(state.filter==='all'?'All tasks':state.filter)}head.innerHTML=`<div><div class='main-title'>${esc(title)}</div><div class='main-sub'>${esc(sub)}</div></div><div class='main-actions'>${state.view==='month'?`<button class='icon-btn' id='prevBtn' title='Previous month'>‹</button><button class='icon-btn' id='nextBtn' title='Next month'>›</button>`:''}${state.view==='week'?`<button class='icon-btn' id='prevWeek'>‹</button><button class='icon-btn' id='nextWeek'>›</button>`:''}${state.view==='day'?`<button class='icon-btn' id='prevDay'>‹</button><button class='icon-btn' id='nextDay'>›</button>`:''}</div>`;mc.appendChild(head);if(state.view==='month')mc.appendChild(buildMonth());else if(state.view==='week')mc.appendChild(buildWeek());else if(state.view==='day')mc.appendChild(buildDay());else mc.appendChild(buildList());const pb=$('#prevBtn'),nb=$('#nextBtn');if(pb)pb.onclick=()=>shiftMonth(-1);if(nb)nb.onclick=()=>shiftMonth(1);const pw=$('#prevWeek'),nw=$('#nextWeek');if(pw)pw.onclick=()=>{state.selected=ymd(addDays(parseYmd(state.selected),-7));state.month=state.selected.slice(0,7)+'-01';save();render()};if(nw)nw.onclick=()=>{state.selected=ymd(addDays(parseYmd(state.selected),7));state.month=state.selected.slice(0,7)+'-01';save();render()};const pd=$('#prevDay'),nd=$('#nextDay');if(pd)pd.onclick=()=>{state.selected=ymd(addDays(parseYmd(state.selected),-1));state.month=state.selected.slice(0,7)+'-01';save();render()};if(nd)nd.onclick=()=>{state.selected=ymd(addDays(parseYmd(state.selected),1));state.month=state.selected.slice(0,7)+'-01';save();render()}}
  function shiftMonth(n){const m=parseYmd(state.month);const d=new Date(m.getFullYear(),m.getMonth()+n,1);state.month=ymd(d);save();render()}
  function buildMonth(){const wrap=document.createElement('div');wrap.className='card calendar';const dow=document.createElement('div');dow.className='dow-row';['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].forEach((d,i)=>{const e=document.createElement('div');e.className='dow'+(i>4?' weekend':'');e.textContent=d;dow.appendChild(e)});wrap.appendChild(dow);const grid=document.createElement('div');grid.className='grid';const m=parseYmd(state.month),start=startOfWeek(new Date(m.getFullYear(),m.getMonth(),1));for(let i=0;i<42;i++){const d=addDays(start,i),key=ymd(d),out=d.getMonth()!==m.getMonth();const evs=eventsForDate(key);const tks=tasksForDate(key);const cell=document.createElement('div');cell.className='cell'+(out?' out':'')+(key===state.selected?' sel':'')+(key===ymd(TODAY)?' today':'');cell.dataset.date=key;const chips=evs.slice(0,2).map(e=>{const l=listOf(e.listId);return `<div class='chip' style='--c:${l.color}' data-eedit='${e.id}'><b>${esc(e.start)}</b>${esc(e.title)}</div>`}).join('');const more=evs.length>2?`<div class='more'>+${evs.length-2} more events</div>`:'';const done=tks.filter(t=>t.completed).length;const taskLine=tks.length?`<div class='cell-tasks'><span class='pdot' style='background:${done===tks.length&&tks.length?'var(--success)':'var(--accent)'}'></span>${done}/${tks.length} tasks</div>`:'';cell.innerHTML=`<div class='cell-head'><div class='daynum'>${d.getDate()}</div><div class='add-hint' data-add='${key}'>+</div></div>${chips}${more}${taskLine}`;grid.appendChild(cell)}wrap.appendChild(grid);return wrap}
  function buildWeek(){const wrap=document.createElement('div');wrap.className='week';const ws=startOfWeek(parseYmd(state.selected));for(let i=0;i<7;i++){const d=addDays(ws,i),key=ymd(d);const col=document.createElement('div');col.className='week-col'+(key===ymd(TODAY)?' today':'')+(key===state.selected?' sel':'');const evs=eventsForDate(key);const tks=tasksForDate(key).sort((a,b)=>(a.completed-b.completed)||(a.time||'99').localeCompare(b.time||'99'));const dow=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()];col.innerHTML=`<div class='week-head'><div><div class='week-dow'>${dow}</div><div class='week-date'>${d.getDate()}</div></div><div style='font-size:11px;color:var(--faint)'>${tks.filter(t=>!t.completed).length} tasks</div></div><div class='week-items'>${evs.map(e=>{const l=listOf(e.listId);return `<div class='week-item' style='--c:${l.color}' data-eedit='${e.id}'>${esc(e.title)}<div class='wi-time'>${esc(e.start)}${e.end?' – '+esc(e.end):''}</div></div>`}).join('')}${tks.map(t=>{const l=listOf(t.listId);const p=PRIOS[t.priority]||PRIOS.low;return `<div class='week-item task ${t.completed?'done':''}' style='--c:${l.color}' data-edit='${t.id}'>${esc(t.title)}<div class='wi-time'>${t.time||''} · ${esc(l.name)} · ${p.label}</div></div>`}).join('')}</div><button class='week-add' data-add='${key}'>+ Add</button>`;col.querySelector('.week-date').style.cursor='pointer';col.querySelector('.week-date').onclick=()=>{state.selected=key;state.month=key.slice(0,7)+'-01';save();render()};wrap.appendChild(col)}return wrap}
  function buildDay(){const wrap=document.createElement('div');wrap.className='day-view';const key=state.selected;const evs=eventsForDate(key);const tks=tasksForDate(key).sort((a,b)=>(a.completed-b.completed)||(a.time||'99').localeCompare(b.time||'99'));const left=document.createElement('div');left.className='day-card';left.innerHTML=`<h3>Events <span style='color:var(--faint);font-weight:500;text-transform:none;letter-spacing:0'>${evs.length}</span></h3><div class='timeline'>${evs.length?evs.map(e=>{const l=listOf(e.listId);return `<div class='tl-item' style='--c:${l.color}' data-eedit='${e.id}'><div class='tl-time'>${esc(e.start)}</div><div class='tl-body'><div class='tl-title'>${esc(e.title)}</div><div class='tl-meta'>${e.end?esc(e.start)+' – '+esc(e.end)+' · ':''}${esc(l.name)}${e.notes?' · '+esc(e.notes):''}</div></div></div>`}).join(''):`<div class='empty-state' style='padding:20px'>${I.empty}<p>No events scheduled</p></div>`}</div><button class='btn btn-ghost btn-sm' style='margin-top:12px;width:100%;justify-content:center' id='dayAddEvent'>+ Add event</button>`;const right=document.createElement('div');right.className='day-card';right.innerHTML=`<h3>Tasks <span style='color:var(--faint);font-weight:500;text-transform:none;letter-spacing:0'>${tks.filter(t=>!t.completed).length} left</span></h3><div class='task-list'>${tks.length?tks.map(t=>taskRowHTML(t)).join(''):`<div class='empty-state' style='padding:20px'>${I.empty}<p>No tasks for this day</p></div>`}</div><button class='btn btn-ghost btn-sm' style='margin-top:12px;width:100%;justify-content:center' id='dayAddTask'>+ Add task</button>`;wrap.appendChild(left);wrap.appendChild(right);setTimeout(()=>{const ae=$('#dayAddEvent');if(ae)ae.onclick=()=>eventModal(null,key);const at=$('#dayAddTask');if(at)at.onclick=()=>taskModal(null,key)},0);return wrap}
  function taskRowHTML(t){const l=listOf(t.listId),p=PRIOS[t.priority]||PRIOS.low;return `<div class='task-row${t.completed?' done':''}' data-edit='${t.id}'><button class='checkbox ${t.completed?'checked':''}' data-toggle='${t.id}' aria-label='Toggle'>${t.completed?I.check:''}</button><div class='task-body'><div class='task-title'>${esc(t.title)}</div><div class='task-meta'><span class='tag'><span class='swatch' style='background:${l.color}'></span>${esc(l.name)}</span>${t.time?`<span>${esc(t.time)}</span>`:''}<span class='prio ${t.priority}'>${p.label}</span>${t.notes?`<span style='color:var(--faint)'>· ${esc(t.notes.slice(0,40))}</span>`:''}</div></div></div>`}
  function buildList(){const wrap=document.createElement('div');wrap.className='list-view';let tasks=state.tasks.slice();if(state.filter==='today')tasks=tasks.filter(t=>t.date===ymd(TODAY));else if(state.filter==='upcoming')tasks=tasks.filter(t=>t.date>ymd(TODAY));else if(state.filter==='overdue')tasks=tasks.filter(t=>t.date<ymd(TODAY));else if(state.filter==='completed')tasks=tasks.filter(t=>t.completed);else if(state.lists.some(l=>l.id===state.filter))tasks=tasks.filter(t=>t.listId===state.filter);if(state.search.trim())tasks=tasks.filter(matchesSearch);tasks.sort((a,b)=>a.date.localeCompare(b.date)||(a.time||'99').localeCompare(b.time||'99'));let last='';let group=null;if(!tasks.length){const es=document.createElement('div');es.className='empty-state';es.innerHTML=`${I.empty}<h3>Nothing here yet</h3><p>${state.search?'Try a different search.':'Add a task to get started.'}</p>`;wrap.appendChild(es);return wrap}tasks.forEach(t=>{if(t.date!==last){last=t.date;group=document.createElement('div');group.className='group';const dt=parseYmd(t.date);const label=t.date===ymd(TODAY)?'Today':(t.date===ymd(addDays(TODAY,1))?'Tomorrow':(t.date===ymd(addDays(TODAY,-1))?'Yesterday':fmtShort(dt)));const h=document.createElement('div');h.className='group-title';const cnt=tasks.filter(x=>x.date===t.date).length;h.innerHTML=`${esc(label)} <span class='cnt'>${cnt}</span>`;group.appendChild(h);wrap.appendChild(group)}const row=document.createElement('div');row.className='row'+(t.completed?' done':'');row.dataset.edit=t.id;const l=listOf(t.listId),p=PRIOS[t.priority]||PRIOS.low;row.innerHTML=`<button class='checkbox ${t.completed?'checked':''}' data-toggle='${t.id}'>${t.completed?I.check:''}</button><div class='task-body'><div class='task-title'>${esc(t.title)}</div><div class='task-meta'><span class='tag'><span class='swatch' style='background:${l.color}'></span>${esc(l.name)}</span>${t.time?`<span>${esc(t.time)}</span>`:''}<span class='prio ${t.priority}'>${p.label}</span>${t.notes?`<span style='color:var(--faint)'>· ${esc(t.notes)}</span>`:''}</div></div>`;group.appendChild(row)});return wrap}
  function renderAgenda(){const key=state.selected;const tasks=state.tasks.filter(t=>t.date===key).sort((a,b)=>(a.completed-b.completed)||(a.time||'99').localeCompare(b.time||'99'));const events=eventsForDate(key);const tw=$('#agendaTasks');tw.innerHTML=tasks.length?tasks.map(t=>{const l=listOf(t.listId);return `<div class='task-item${t.completed?' done':''}' data-edit='${t.id}'><div style='display:flex;align-items:center;gap:9px'><button class='checkbox ${t.completed?'checked':''}' data-toggle='${t.id}'>${t.completed?I.check:''}</button><div class='task-body' style='flex:1;min-width:0'><div class='task-title'>${esc(t.title)}</div><div class='task-meta'><span class='tag'><span class='swatch' style='background:${l.color}'></span>${esc(l.name)}</span>${t.time?`<span>${esc(t.time)}</span>`:''}</div></div></div></div>`}).join(''):`<div class='agenda-empty'>${I.empty}<div>No tasks for this day</div></div>`;const ew=$('#agendaEvents');ew.innerHTML=events.length?events.map(e=>{const l=listOf(e.listId);return `<div class='event-item' style='--c:${l.color}' data-eedit='${e.id}'><div class='event-time'>${esc(e.start)}${e.end?' – '+esc(e.end):''}</div><div class='event-title'>${esc(e.title)}</div><div class='event-meta'>${esc(l.name)}${e.notes?' · '+esc(e.notes):''}</div></div>`}).join(''):`<div class='agenda-empty'>${I.empty}<div>No events for this day</div></div>`}
  function openModal(html){$('#modal').innerHTML=html;$('#overlay').classList.add('open');setTimeout(()=>{const f=$('#modal input,#modal textarea');if(f)f.focus()},60)}
  function closeModal(){$('#overlay').classList.remove('open')}
  function taskModal(id,date){const t=id?state.tasks.find(x=>x.id===id):null;const d=t?t.date:(date||state.selected);const lists=state.lists.map(l=>`<option value='${l.id}' ${t&&t.listId===l.id?'selected':''}>${esc(l.name)}</option>`).join('');const colors=state.lists.map(l=>`<button class='color-pick${t&&t.listId===l.id?' sel':''}' data-color='${l.id}' style='background:${l.color}' title='${esc(l.name)}'></button>`).join('');openModal(`<div class='modal-head'><h2>${t?'Edit task':'New task'}</h2><button class='close-btn' data-close>${I.close}</button></div><form id='taskForm'><div class='modal-body'><div class='field'><label for='tTitle'>Title</label><input id='tTitle' required placeholder='What needs to be done?' value='${esc(t?t.title:'')}' /></div><div class='field-row'><div class='field'><label for='tDate'>Date</label><input id='tDate' type='date' value='${d}' /></div><div class='field'><label for='tTime'>Time (optional)</label><input id='tTime' type='time' value='${esc(t?t.time:'')}' /></div></div><div class='field'><label>List</label><select id='tList'>${lists}</select><div class='color-picks' style='margin-top:8px'>${colors}</div></div><div class='field'><label>Priority</label><div class='prio-picks' id='tPrio'>${Object.entries(PRIOS).map(([k,v])=>`<button type='button' class='prio-pick${(t?t.priority:'medium')===k?' sel':''}' data-prio='${k}'>${v.label}</button>`).join('')}</div></div><div class='field'><label for='tNotes'>Notes</label><textarea id='tNotes' placeholder='Add a little more detail…'>${esc(t?t.notes:'')}</textarea></div></div><div class='modal-foot'>${t?`<button type='button' class='btn btn-danger' data-delete-task='${t.id}'>Delete</button>`:''}<button type='button' class='btn btn-ghost' data-close>Cancel</button><button type='submit' class='btn btn-primary'>${t?'Save changes':'Add task'}</button></div></form>`);let prio=t?t.priority:'medium';$$('#tPrio .prio-pick').forEach(b=>b.onclick=()=>{prio=b.dataset.prio;$$('#tPrio .prio-pick').forEach(x=>x.classList.toggle('sel',x===b))});$$('.color-pick').forEach(b=>b.onclick=()=>{$('#tList').value=b.dataset.color;$$('.color-pick').forEach(x=>x.classList.toggle('sel',x===b))});$('#tList').onchange=e=>{$$('.color-pick').forEach(x=>x.classList.toggle('sel',x.dataset.color===e.target.value))};$('#taskForm').onsubmit=e=>{e.preventDefault();const obj={title:$('#tTitle').value.trim(),date:$('#tDate').value||d,time:$('#tTime').value,listId:$('#tList').value,priority:prio,notes:$('#tNotes').value.trim()};if(!obj.title)return;if(t)Object.assign(t,obj);else state.tasks.push({id:uid(),completed:false,createdAt:Date.now(),...obj});state.selected=obj.date;state.month=obj.date.slice(0,7)+'-01';save();closeModal();render();toast(t?'Task updated':'Task added')}}
  function eventModal(id,date){const e=id?state.events.find(x=>x.id===id):null;const d=e?e.date:(date||state.selected);const lists=state.lists.map(l=>`<option value='${l.id}' ${e&&e.listId===l.id?'selected':''}>${esc(l.name)}</option>`).join('');const colors=state.lists.map(l=>`<button class='color-pick${e&&e.listId===l.id?' sel':''}' data-color='${l.id}' style='background:${l.color}' title='${esc(l.name)}'></button>`).join('');openModal(`<div class='modal-head'><h2>${e?'Edit event':'New event'}</h2><button class='close-btn' data-close>${I.close}</button></div><form id='eventForm'><div class='modal-body'><div class='field'><label for='eTitle'>Event name</label><input id='eTitle' required placeholder='What is happening?' value='${esc(e?e.title:'')}' /></div><div class='field'><label for='eDate'>Date</label><input id='eDate' type='date' value='${d}' /></div><div class='field-row'><div class='field'><label for='eStart'>Starts</label><input id='eStart' type='time' value='${esc(e?e.start:'09:00')}' /></div><div class='field'><label for='eEnd'>Ends</label><input id='eEnd' type='time' value='${esc(e?e.end:'10:00')}' /></div></div><div class='field'><label>List</label><select id='eList'>${lists}</select><div class='color-picks' style='margin-top:8px'>${colors}</div></div><div class='field'><label for='eNotes'>Notes</label><textarea id='eNotes' placeholder='Optional details…'>${esc(e?e.notes:'')}</textarea></div></div><div class='modal-foot'>${e?`<button type='button' class='btn btn-danger' data-delete-event='${e.id}'>Delete</button>`:''}<button type='button' class='btn btn-ghost' data-close>Cancel</button><button type='submit' class='btn btn-primary'>${e?'Save changes':'Add event'}</button></div></form>`);$$('.color-pick').forEach(b=>b.onclick=()=>{$('#eList').value=b.dataset.color;$$('.color-pick').forEach(x=>x.classList.toggle('sel',x===b))});$('#eList').onchange=e2=>{$$('.color-pick').forEach(x=>x.classList.toggle('sel',x.dataset.color===e2.target.value))};$('#eventForm').onsubmit=ev=>{ev.preventDefault();const obj={title:$('#eTitle').value.trim(),date:$('#eDate').value||d,start:$('#eStart').value||'09:00',end:$('#eEnd').value,listId:$('#eList').value,notes:$('#eNotes').value.trim()};if(!obj.title)return;if(e)Object.assign(e,obj);else state.events.push({id:uid(),...obj});state.selected=obj.date;state.month=obj.date.slice(0,7)+'-01';save();closeModal();render();toast(e?'Event updated':'Event added')}}
  function listModal(){openModal(`<div class='modal-head'><h2>New list</h2><button class='close-btn' data-close>${I.close}</button></div><form id='listForm'><div class='modal-body'><div class='field'><label for='lName'>List name</label><input id='lName' required placeholder='e.g. Travel' /></div><div class='field'><label>Color</label><div class='color-picks' id='lColors'>${PALETTE.map((c,i)=>`<button type='button' class='color-pick${i===0?' sel':''}' data-color='${c}' style='background:${c}'></button>`).join('')}</div></div></div><div class='modal-foot'><button type='button' class='btn btn-ghost' data-close>Cancel</button><button type='submit' class='btn btn-primary'>Create list</button></div></form>`);let color=PALETTE[0];$$('#lColors .color-pick').forEach(b=>b.onclick=()=>{color=b.dataset.color;$$('#lColors .color-pick').forEach(x=>x.classList.toggle('sel',x===b))});$('#listForm').onsubmit=e=>{e.preventDefault();const n=$('#lName').value.trim();if(!n)return;state.lists.push({id:uid(),name:n,color});save();closeModal();render();toast('List created')}}
  function toast(msg){const el=document.createElement('div');el.className='toast';el.innerHTML=`${I.check}<span>${esc(msg)}</span>`;$('#toastHost').appendChild(el);setTimeout(()=>{el.style.opacity='0';el.style.transform='translateY(10px)';el.style.transition='all .3s ease';setTimeout(()=>el.remove(),320)},2200)}
  function toggleTask(id){const t=state.tasks.find(x=>x.id===id);if(!t)return;t.completed=!t.completed;save();render();if(t.completed)toast('Task completed')}
  $('#newTaskBtn').onclick=()=>taskModal(null,state.selected);
  const afd=$('#addTaskForDay');if(afd)afd.onclick=()=>taskModal(null,state.selected);
  const afd2=$('#addTaskForDay2');if(afd2)afd2.onclick=()=>taskModal(null,state.selected);
  $('#addEventForDay').onclick=()=>eventModal(null,state.selected);
  $('#addListBtn').onclick=listModal;
  $('#themeBtn').onclick=()=>{state.theme=state.theme==='dark'?'light':'dark';save();renderTheme()};
  $('#todayBtn').onclick=()=>{state.selected=ymd(TODAY);state.month=ymd(TODAY).slice(0,7)+'-01';state.view='month';state.filter='all';save();render()};
  $('#miniPrev').onclick=()=>shiftMonth(-1);$('#miniNext').onclick=()=>shiftMonth(1);
  $$('#viewSegment button').forEach(b=>b.onclick=()=>{state.view=b.dataset.view;if(state.view==='month')state.filter='all';save();render()});
  $$('.nav-item[data-filter]').forEach(b=>b.onclick=()=>{state.filter=b.dataset.filter;state.view='list';state.search='';$('#searchInput').value='';save();render();closeDrawers()});
  $('#listsNav').onclick=e=>{const b=e.target.closest('[data-list]');if(b){state.filter=b.dataset.list;state.view='list';state.search='';$('#searchInput').value='';save();render();closeDrawers()}};
  $('#searchInput').oninput=e=>{state.search=e.target.value;if(state.search.trim()){state.view='list';state.filter='search'}else if(state.filter==='search'){state.filter='all'}save();render()};
  $('#miniGrid').onclick=e=>{const b=e.target.closest('[data-date]');if(b){state.selected=b.dataset.date;state.month=b.dataset.date.slice(0,7)+'-01';state.view='month';state.filter='all';save();render();closeDrawers()}};
  $('#mainContent').addEventListener('click',e=>{const t=e.target.closest('[data-toggle]');if(t){toggleTask(t.dataset.toggle);return}const ed=e.target.closest('[data-edit]');if(ed){taskModal(ed.dataset.edit);return}const add=e.target.closest('[data-add]');if(add){e.stopPropagation();taskModal(null,add.dataset.add);return}const ee=e.target.closest('[data-eedit]');if(ee){eventModal(ee.dataset.eedit);return}const cell=e.target.closest('.cell[data-date]');if(cell){state.selected=cell.dataset.date;save();renderAgenda();renderMini();$$('.cell').forEach(c=>c.classList.toggle('sel',c.dataset.date===state.selected));renderStats()}});
  $('#mainContent').addEventListener('dblclick',e=>{const cell=e.target.closest('.cell[data-date]');if(cell)taskModal(null,cell.dataset.date)});
  $('#agendaTasks').addEventListener('click',e=>{const t=e.target.closest('[data-toggle]');if(t){toggleTask(t.dataset.toggle);return}const ed=e.target.closest('[data-edit]');if(ed)taskModal(ed.dataset.edit)});
  $('#agendaEvents').addEventListener('click',e=>{const ee=e.target.closest('[data-eedit]');if(ee)eventModal(ee.dataset.eedit)});
  $('#overlay').addEventListener('click',e=>{if(e.target===$('#overlay')||e.target.closest('[data-close]')){closeModal();return}const dt=e.target.closest('[data-delete-task]');if(dt){state.tasks=state.tasks.filter(x=>x.id!==dt.dataset.deleteTask);save();closeModal();render();toast('Task deleted');return}const de=e.target.closest('[data-delete-event]');if(de){state.events=state.events.filter(x=>x.id!==de.dataset.deleteEvent);save();closeModal();render();toast('Event deleted');return}});
  $('#quickAddBtn').onclick=()=>{const v=$('#quickInput').value.trim();if(!v)return;state.tasks.push({id:uid(),title:v,date:state.selected,time:'',priority:'medium',listId:state.lists[0]?.id,notes:'',completed:false,createdAt:Date.now()});$('#quickInput').value='';save();render();toast('Task added')};
  $('#quickInput').addEventListener('keydown',e=>{if(e.key==='Enter')$('#quickAddBtn').click()});
  $('#exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='flowday-backup.json';a.click();URL.revokeObjectURL(url);toast('Exported')};
  $('#importBtn').onclick=()=>$('#importFile').click();
  $('#importFile').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const s=JSON.parse(r.result);if(s&&s.tasks&&s.lists){state=s;save();render();toast('Imported')}else toast('Invalid file')}catch(err){toast('Import failed')}};r.readAsText(f);e.target.value=''});
  const scrim=$('#scrim');
  function closeDrawers(){$('#leftCol').classList.remove('open');$('#rightCol').classList.remove('open');scrim.classList.remove('show')}
  $('#menuBtn').onclick=()=>{$('#leftCol').classList.add('open');scrim.classList.add('show')};
  $('#agendaToggle').onclick=()=>{$('#rightCol').classList.add('open');scrim.classList.add('show')};
  scrim.onclick=closeDrawers;
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#overlay').classList.contains('open'))closeModal();else closeDrawers();return}const typing=/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||'');if(typing)return;if(e.key==='n'||e.key==='N'){e.preventDefault();taskModal(null,state.selected)}else if(e.key==='/'){e.preventDefault();$('#searchInput').focus()}else if(e.key==='t'||e.key==='T'){$('#todayBtn').click()}else if(e.key==='d'||e.key==='D'){$('#themeBtn').click()}else if(e.key==='m'||e.key==='M'){state.view='month';save();render()}else if(e.key==='w'||e.key==='W'){state.view='week';save();render()}else if(e.key==='a'||e.key==='A'){state.view='list';save();render()}});
  render();
})();
</script>
