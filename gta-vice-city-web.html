<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GTA: Vice City — Web Edition</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0b0b1a;font-family:Arial,Helvetica,sans-serif}
  #game{display:block;width:100vw;height:100vh}
  #hud{position:fixed;inset:0;pointer-events:none;color:#fff;text-shadow:0 2px 4px #000}
  #topleft{position:absolute;top:12px;left:14px}
  #money{color:#7CFC00;font-size:24px;font-weight:bold}
  #healthbar{width:220px;height:14px;background:#333;border:2px solid #000;margin-top:6px;border-radius:4px;overflow:hidden}
  #health{height:100%;width:100%;background:linear-gradient(90deg,#ff3b3b,#ff9c3b);transition:width .15s}
  #stars{font-size:24px;letter-spacing:5px;color:#ffd700;margin-top:4px;height:28px}
  #mission{position:absolute;top:12px;right:14px;max-width:330px;text-align:right;font-size:15px;
    background:rgba(0,0,0,.5);padding:8px 12px;border-radius:8px;border:1px solid #ff2d95}
  #hint{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);font-size:14px;
    background:rgba(0,0,0,.55);padding:6px 16px;border-radius:20px;white-space:nowrap}
  #minimap{position:absolute;bottom:14px;right:14px;border:3px solid #000;border-radius:50%;background:#12122a}
  #title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 25%,#ff2d95 0%,#7b2ff7 45%,#0b0b1a 100%);text-align:center}
  #title h1{font-size:clamp(40px,9vw,84px);margin:0;color:#fff;font-style:italic;letter-spacing:3px;
    text-shadow:4px 4px 0 #ff2d95,8px 8px 0 #000}
  #title p{color:#ffe6f3;font-size:18px;margin-top:12px;max-width:520px;line-height:1.5}
  #start{margin-top:28px;padding:16px 44px;font-size:20px;font-weight:bold;color:#0b0b1a;
    background:#ffd700;border:0;border-radius:8px;cursor:pointer}
  #start:hover{background:#fff}
  .hidden{display:none!important}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div id="topleft">
    <div id="money">$0</div>
    <div id="healthbar"><div id="health"></div></div>
    <div id="stars"></div>
  </div>
  <div id="mission">Find a car and press <b>E</b> to steal it</div>
  <div id="hint">WASD / Arrows — move &amp; drive · E — enter/exit car · SPACE — handbrake</div>
  <canvas id="minimap" width="170" height="170"></canvas>
</div>
<div id="title">
  <h1>VICE CITY</h1>
  <p>Steal cars, run missions, outrun the cops in a neon open world.
     WASD to move, E to jack a ride, mind the wanted level.</p>
  <button id="start">PRESS TO PLAY</button>
</div>
<script>
'use strict';
/* ---------- core setup ---------- */
const cv=document.getElementById('game'),ctx=cv.getContext('2d');
const mm=document.getElementById('minimap'),mc=mm.getContext('2d');
let W=innerWidth,H=innerHeight;
const resize=()=>{W=cv.width=innerWidth;H=cv.height=innerHeight;};
addEventListener('resize',resize);

const TILE=64,MAP=48,WORLD=MAP*TILE;           // 3072x3072 world
const isRoad=(x,y)=>{                          // road grid: 2-wide lanes every 6 tiles
  if(x<0||y<0||x>=WORLD||y>=WORLD)return false;
  const ix=x/TILE|0,iy=y/TILE|0;
  return ix%6<2||iy%6<2;
};
const solidPx=(x,y)=>!isRoad(x,y);             // everything off-road is a building
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const pal=['#ff8fa3','#ffd6a5','#9bf6ff','#bdb2ff','#caffbf','#ffc6ff','#f1fa8c','#80ffdb'];
const bcol=(ix,iy)=>pal[(ix*7+iy*13)%pal.length];

/* ---------- input ---------- */
const keys={};
addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
  if(e.code==='KeyE')interact();
});
addEventListener('keyup',e=>keys[e.code]=false);
const up=()=>keys.KeyW||keys.ArrowUp, dn=()=>keys.KeyS||keys.ArrowDown;
const lf=()=>keys.KeyA||keys.ArrowLeft, rt=()=>keys.KeyD||keys.ArrowRight;

/* ---------- state ---------- */
const player={x:TILE*4+32,y:TILE*4+32,a:0,hp:100,money:0,wanted:0,car:null,inCar:false,crimeT:0};
const cars=[],peds=[],parts=[];
let cam={x:0,y:0},trauma=0,hitstop=0,deadT=0,t=0,started=false;

function spawnRoadPos(){                       // random spot on the road network
  for(let i=0;i<200;i++){
    const ix=Math.random()*MAP|0,iy=Math.random()*MAP|0;
    if(!isRoad(ix*TILE+32,iy*TILE+32))continue;
    const horiz=iy%6<2,vert=ix%6<2;
    return{x:ix*TILE+32,y:iy*TILE+32,
      a:horiz&&!vert?(Math.random()<.5?0:Math.PI):(vert&&!horiz?(Math.random()<.5?Math.PI/2:-Math.PI/2):Math.random()*Math.PI*2)};
  }
  return{x:TILE+32,y:TILE+32,a:0};
}
function makeCar(type,color){
  const p=spawnRoadPos();
  return{x:p.x,y:p.y,a:p.a,v:0,type,color,hp:100,lastTile:'',siren:0};
}
function makePed(){
  const p=spawnRoadPos();
  return{x:p.x+ (Math.random()*40-20),y:p.y+(Math.random()*40-20),a:Math.random()*6.28,
    state:'walk',seed:Math.random()*999,dead:0,panic:0,
    skin:['#f2c9a0','#c68642','#8d5524','#ffe0bd'][Math.random()*4|0],
    shirt:['#ff2d95','#00c2ff','#ffd700','#7CFC00','#fff'][Math.random()*5|0]};
}
function reset(){
  cars.length=0;peds.length=0;parts.length=0;
  Object.assign(player,{x:TILE*4+32,y:TILE*4+32,a:0,hp:100,money:0,wanted:0,car:null,inCar:false,crimeT:0});
  for(let i=0;i<70;i++)cars.push(makeCar('traffic',['#ff5f6d','#ffc371','#5ef1f5','#c471ed','#f64f59','#12c2e9'][i%6]));
  for(let i=0;i<18;i++)cars.push(makeCar('parked',['#2d3436','#dfe6e9','#636e72','#e17055'][i%4]));
  cars.push(makeCar('parked','#00cec9'));      // player's starter ride nearby
  cars[cars.length-1].x=TILE*4+120;cars[cars.length-1].y=TILE*4+32;cars[cars.length-1].a=0;
  for(let i=0;i<65;i++)peds.push(makePed());
  mission=0;placeMarker();trauma=0;hitstop=0;deadT=0;
}

/* ---------- particles (game feel) ---------- */
function burst(x,y,n,color,spd){
  for(let i=0;i<n;i++){
    const a=Math.random()*6.28,s=Math.random()*spd;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,color,r:2+Math.random()*4});
  }
}
function updParts(f){
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];p.x+=p.vx*f;p.y+=p.vy*f;p.vx*=.92;p.vy*=.92;p.life-=.03*f;
    if(p.life<=0)parts.splice(i,1);
  }
}

/* ---------- missions ---------- */
const MISSIONS=[
  {txt:'Steal a car — walk up to any vehicle and press <b>E</b>',check:()=>player.inCar},
  {txt:'Collect the package at the <b style="color:#ff2d95">pink marker</b>',check:()=>reached(),reward:500},
  {txt:'Deliver the package to the <b style="color:#ffd700">yellow marker</b>',check:()=>reached(),reward:1200},
  {txt:'Earn <b>$3000</b> — jack cars, dodge the law',check:()=>player.money>=3000,reward:800},
  {txt:'Lose your <b>wanted level</b> — break line of sight!',check:()=>player.wanted===0,reward:1500},
  {txt:'Cause a little chaos: reach <b>3 stars</b>',check:()=>player.wanted>=3,reward:2000},
  {txt:'Survive the heat and get back to the <b>safehouse marker</b>',check:()=>reached(),reward:5000}
];
let mission=0,marker={x:0,y:0};
function reached(){return dist(player,marker)<46;}
function placeMarker(){
  const p=spawnRoadPos();marker.x=p.x;marker.y=p.y;
}
function updMission(){
  const m=MISSIONS[mission];if(!m)return;
  if(m.check()){
    if(m.reward){player.money+=m.reward;burst(marker.x,marker.y,26,'#ffd700',5);}
    mission=(mission+1)%MISSIONS.length;placeMarker();
  }
}

/* ---------- entering / exiting cars ---------- */
function interact(){
  if(!started||deadT>0)return;
  if(player.inCar){                            // exit
    const c=player.car;
    player.x=c.x-Math.sin(c.a)*54;player.y=c.y+Math.cos(c.a)*54;
    player.a=c.a;player.inCar=false;player.car=null;
    if(solidPx(player.x,player.y)){player.x=c.x;player.y=c.y;} // don't clip walls
  }else{                                       // enter nearest car
    let best=null,bd=78;
    for(const c of cars){const d=dist(player,c);if(d<bd){bd=d;best=c;}}
    if(best){player.car=best;player.inCar=true;best.type='player';}
  }
}
function crime(n){player.wanted=clamp(player.wanted+n,0,5);player.crimeT=0;}

/* ---------- collision helpers ---------- */
function rectSolid(x,y,a,l,w){
  const cs=Math.cos(a),sn=Math.sin(a);
  const pts=[[l/2,w/2],[l/2,-w/2],[-l/2,w/2],[-l/2,-w/2]];
  for(const[ox,oy]of pts)if(solidPx(x+ox*cs-oy*sn,y+ox*sn+oy*cs))return true;
  return false;
}

/* ---------- update: player car ---------- */
function driveCar(c,f){
  const th=(up()?1:0)-(dn()?1:0),st=(rt()?1:0)-(lf()?1:0);
  const hand=keys.Space;
  c.v+=th*0.19*f;
  c.v*=Math.pow(hand?0.94:0.985,f);
  c.v=clamp(c.v,-4.5,9.5);
  const grip=clamp(Math.abs(c.v)/3,0,1);
  c.a+=st*0.05*f*grip*Math.sign(c.v||1)*(hand?1.6:1);
  const nx=c.x+Math.cos(c.a)*c.v*f,ny=c.y+Math.sin(c.a)*c.v*f;
  if(rectSolid(nx,ny,c.a,64,34)){              // crash into building
    if(Math.abs(c.v)>3){trauma=Math.min(1,trauma+Math.abs(c.v)/9);hitstop=70;
      burst(nx,ny,14,'#ffd700',4);}
    c.v*=-0.3;
  }else{c.x=nx;c.y=ny;}
  if(hand&&Math.abs(c.v)>4)for(let i=0;i<2;i++)   // tire smoke
    parts.push({x:c.x-Math.cos(c.a)*20,y:c.y-Math.sin(c.a)*20,
      vx:(Math.random()-.5),vy:(Math.random()-.5),life:1,color:'#cbd5e1',r:6});
  // run over pedestrians
  if(Math.abs(c.v)>2.6)for(const p of peds){
    if(p.dead)continue;
    if(dist(c,p)<32){
      p.dead=1;p.state='dead';burst(p.x,p.y,20,'#e63946',5);
      crime(1);hitstop=50;trauma=Math.min(1,trauma+.4);
      player.money+=50;
    }
  }
}

/* ---------- update: AI cars ---------- */
function aiCar(c,f){
  if(c.type==='police'){                       // chase the player
    const want=Math.atan2(player.y-c.y,player.x-c.x);
    let d=((want-c.a+Math.PI*3)%(Math.PI*2))-Math.PI;
    c.a+=clamp(d,-0.05*f,0.05*f);
    c.v+=0.14*f;c.v=Math.min(c.v,7.5);
    c.siren+=f;
    if(dist(c,player)<44&&player.inCar){       // ram the player
      player.car.v*=0.85;trauma=Math.min(1,trauma+.02);
      if(Math.abs(player.car.v)<2&&Math.random()<.02*f)damagePlayer(4);
    }else if(dist(c,player)<40&&!player.inCar)damagePlayer(0.7*f);
  }else{                                        // cruise the streets
    c.v+=(2.1-c.v)*0.02*f;
    const tile=(c.x/TILE|0)+'_'+(c.y/TILE|0);
    if(tile!==c.lastTile){                      // pick a turn at intersections
      c.lastTile=tile;
      if(Math.random()<0.32){
        const turn=c.a+(Math.random()<.5?Math.PI/2:-Math.PI/2);
        if(!rectSolid(c.x+Math.cos(turn)*70,c.y+Math.sin(turn)*70,turn,60,30))c.a=turn;
      }
    }
  }
  const nx=c.x+Math.cos(c.a)*c.v*f,ny=c.y+Math.sin(c.a)*c.v*f;
  if(rectSolid(nx,ny,c.a,60,30)||!isRoad(nx,ny)){ // stay on the road
    c.a+=Math.PI/2;c.v*=0.4;
    if(rectSolid(c.x,c.y,c.a,60,30))c.a+=Math.PI;
  }else{c.x=nx;c.y=ny;}
  // bumper-to-bumper
  for(const o of cars){
    if(o===c)continue;const d=dist(c,o);
    if(d<52&&d>0.01){
      const push=(52-d)/2,nx2=(c.x-o.x)/d*push,ny2=(c.y-o.y)/d*push;
      c.x+=nx2;c.y+=ny2;
      if(c.type==='player'||o.type==='player'){trauma=Math.min(1,trauma+.15);c.v*=.5;}
    }
  }
}
function damagePlayer(n){
  player.hp-=n;
  if(player.hp<=0&&deadT<=0){deadT=140;player.hp=0;}
}

/* ---------- update: pedestrians (FSM) ---------- */
function updPed(p,f){
  if(p.dead){p.dead+=f;if(p.dead>400)peds.splice(peds.indexOf(p),1),peds.push(makePed());return;}
  const threat=player.inCar&&Math.abs(player.car.v)>3?player.car:
               (player.wanted>0&&!player.inCar?player:null);
  if(threat&&dist(p,threat)<150)p.state='flee',p.panic=120;
  if(p.panic>0){p.panic-=f;if(p.panic<=0)p.state='walk';}
  const sp=(p.state==='flee'?2.6:0.85)*f;
  if(p.state==='walk')p.a+=Math.sin((t+p.seed)*0.0012)*0.03*f;
  const nx=p.x+Math.cos(p.a)*sp,ny=p.y+Math.sin(p.a)*sp;
  if(solidPx(nx,ny))p.a+=Math.PI/2*(Math.random()<.5?1:-1);
  else{p.x=nx;p.y=ny;}
}

/* ---------- main update ---------- */
function update(f){
  t+=16*f;
  if(deadT>0){                                  // WASTED
    deadT-=f;
    if(deadT<=0){
      player.hp=100;player.wanted=0;player.inCar=false;player.car=null;
      player.x=TILE*4+32;player.y=TILE*4+32;player.money=Math.max(0,player.money-500);
    }
    return;
  }
  if(player.inCar)driveCar(player.car,f);
  else{
    const sp=(keys.ShiftLeft?3.2:2.0)*f;
    let dx=(rt()?1:0)-(lf()?1:0),dy=(dn()?1:0)-(up()?1:0);
    if(dx||dy){
      const l=Math.hypot(dx,dy);dx/=l;dy/=l;
      player.a=Math.atan2(dy,dx);
      const nx=player.x+dx*sp,ny=player.y+dy*sp;
      if(!solidPx(nx,player.y))player.x=nx;
      if(!solidPx(player.x,ny))player.y=ny;
    }
    player.car=null;
  }
  for(const c of cars)if(c.type!=='player')aiCar(c,f);
  if(player.inCar){player.x=player.car.x;player.y=player.car.y;}
  for(const p of peds)updPed(p,f);
  updParts(f);
  // wanted decay when you lay low
  if(player.wanted>0){
    player.crimeT+=16*f;
    const heat=policeNearby();
    if(!heat&&player.crimeT>6000){player.wanted--;player.crimeT=0;}
  }
  updMission();
  // camera + screen shake
  const tx=player.x-W/2,ty=player.y-H/2;
  cam.x+=(tx-cam.x)*0.12*f;cam.y+=(ty-cam.y)*0.12*f;
  trauma=Math.max(0,trauma-0.02*f);
  updateHUD();
}
function policeNearby(){
  for(const c of cars)if(c.type==='police'&&dist(c,player)<900)return true;
  return false;
}
function syncPolice(){
  const want=player.wanted,have=cars.filter(c=>c.type==='police').length;
  if(have<want){const c=makeCar('police','#0984e3');
    const a=Math.random()*6.28;c.x=player.x+Math.cos(a)*700;c.y=player.y+Math.sin(a)*700;c.a=a;cars.push(c);}
  if(have>want)for(let i=cars.length-1;i>=0;i--)if(cars[i].type==='police'){cars.splice(i,1);break;}
}

/* ---------- rendering ---------- */
function draw(){
  const sh=trauma*trauma*22;                    // trauma-based screen shake
  const ox=(Math.random()-.5)*sh,oy=(Math.random()-.5)*sh;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle='#071a4a';ctx.fillRect(0,0,W,H);  // ocean surround
  ctx.save();
  ctx.translate(-cam.x+ox,-cam.y+oy);
  const x0=Math.max(0,(cam.x)/TILE|0),y0=Math.max(0,(cam.y)/TILE|0);
  const x1=Math.min(MAP,((cam.x+W)/TILE|0)+1),y1=Math.min(MAP,((cam.y+H)/TILE|0)+1);
  for(let iy=y0;iy<y1;iy++)for(let ix=x0;ix<x1;ix++){
    const x=ix*TILE,y=iy*TILE;
    if(isRoad(x+32,y+32)){                      // asphalt + dashes
      ctx.fillStyle='#2b2b33';ctx.fillRect(x,y,TILE,TILE);
      ctx.fillStyle='#f5d76e';
      if(iy%6<2&&ix%6>=2){if((ix+iy)%2===0)ctx.fillRect(x+28,y+24,4,16);}
      if(ix%6<2&&iy%6>=2){if((ix+iy)%2===0)ctx.fillRect(x+24,y+28,16,4);}
      if(ix%6<2&&iy%6<2)ctx.fillStyle='#3a3a45',ctx.fillRect(x,y,TILE,TILE); // intersection
    }else{                                       // buildings
      ctx.fillStyle='#3d3d4d';ctx.fillRect(x,y,TILE,TILE);
      ctx.fillStyle=bcol(ix,iy);ctx.fillRect(x+5,y+5,TILE-10,TILE-10);
      ctx.fillStyle='rgba(0,0,0,.25)';
      for(let wy=0;wy<2;wy++)for(let wx=0;wx<2;wx++)ctx.fillRect(x+14+wx*22,y+14+wy*22,12,12);
    }
  }
  // mission marker (pulsing)
  if(MISSIONS[mission]){
    const pulse=1+Math.sin(t*0.006)*0.25;
    const col=mission===2?'#ffd700':'#ff2d95';
    ctx.beginPath();ctx.arc(marker.x,marker.y,30*pulse,0,6.28);
    ctx.fillStyle=col;ctx.globalAlpha=.35;ctx.fill();ctx.globalAlpha=1;
    ctx.beginPath();ctx.arc(marker.x,marker.y,16,0,6.28);
    ctx.strokeStyle=col;ctx.lineWidth=4;ctx.stroke();
  }
  // particles
  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  // pedestrians
  for(const p of peds){
    if(p.dead){ctx.fillStyle='#7a0f1a';ctx.beginPath();ctx.ellipse(p.x,p.y,14,9,p.a,0,6.28);ctx.fill();continue;}
    ctx.fillStyle=p.shirt;ctx.beginPath();ctx.arc(p.x,p.y,9,0,6.28);ctx.fill();
    ctx.fillStyle=p.skin;ctx.beginPath();ctx.arc(p.x+Math.cos(p.a)*5,p.y+Math.sin(p.a)*5,5,0,6.28);ctx.fill();
  }
  // cars
  for(const c of cars)drawCar(c);
  // player on foot
  if(!player.inCar&&deadT<=0){
    ctx.fillStyle='#ff2d95';ctx.beginPath();ctx.arc(player.x,player.y,11,0,6.28);ctx.fill();
    ctx.strokeStyle='#fff';ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(player.x,player.y);
    ctx.lineTo(player.x+Math.cos(player.a)*16,player.y+Math.sin(player.a)*16);ctx.stroke();
  }
  ctx.restore();
  drawMinimap();
  if(deadT>0){                                   // WASTED banner
    ctx.fillStyle='rgba(120,0,20,.55)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#ff3b3b';ctx.font='italic bold 90px Arial';ctx.textAlign='center';
    ctx.fillText('WASTED',W/2,H/2);ctx.textAlign='left';
  }
}
function drawCar(c){
  ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.a);
  const isP=c.type==='player',isCop=c.type==='police';
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(-32,-14,64,28);      // shadow
  ctx.fillStyle=isCop?(Math.sin(c.siren*0.2)>0?'#e63946':'#0984e3'):c.color;
  ctx.fillRect(-32,-16,64,32);
  ctx.fillStyle='rgba(20,30,50,.85)';ctx.fillRect(-6,-13,20,26);     // windshield
  ctx.fillStyle='#fff9c4';ctx.fillRect(28,-13,5,8);ctx.fillRect(28,5,5,8); // headlights
  ctx.fillStyle='#000';ctx.fillRect(-32,-16,6,32);
  if(isP||isCop){ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.strokeRect(-32,-16,64,32);}
  ctx.restore();
}
function drawMinimap(){
  const s=170/WORLD;
  mc.fillStyle='#12122a';mc.fillRect(0,0,170,170);
  mc.strokeStyle='#555a72';mc.lineWidth=3;
  for(let i=0;i<MAP;i+=6){
    mc.beginPath();mc.moveTo((i*TILE)*s,0);mc.lineTo((i*TILE)*s,170);
    mc.moveTo(0,(i*TILE)*s);mc.lineTo(170,(i*TILE)*s);mc.stroke();
    mc.beginPath();mc.moveTo(((i+1)*TILE)*s,0);mc.lineTo(((i+1)*TILE)*s,170);
    mc.moveTo(0,((i+1)*TILE)*s);mc.lineTo(170,((i+1)*TILE)*s);mc.stroke();
  }
  if(MISSIONS[mission]){mc.fillStyle='#ff2d95';mc.beginPath();
    mc.arc(marker.x*s,marker.y*s,5,0,6.28);mc.fill();}
  mc.fillStyle='#0984e3';
  for(const c of cars)if(c.type==='police'){mc.beginPath();mc.arc(c.x*s,c.y*s,3.5,0,6.28);mc.fill();}
  mc.fillStyle='#fff';mc.beginPath();mc.arc(player.x*s,player.y*s,4.5,0,6.28);mc.fill();
  mc.strokeStyle='#000';mc.lineWidth=2;mc.strokeRect(0,0,170,170);
}
function updateHUD(){
  document.getElementById('money').textContent='$'+player.money;
  document.getElementById('health').style.width=clamp(player.hp,0,100)+'%';
  document.getElementById('stars').textContent='★'.repeat(player.wanted)+'☆'.repeat(5-player.wanted);
  const m=MISSIONS[mission];
  document.getElementById('mission').innerHTML=m?m.txt:'Vice City is yours.';
}

/* ---------- loop ---------- */
let last=0;
function loop(ts){
  requestAnimationFrame(loop);
  const dt=Math.min(34,last?ts-last:16.7)||16.7;last=ts;
  if(hitstop>0)hitstop-=dt;                      // hit-stop freeze on big impacts
  else{syncPolice();update(dt/16.7);}
  draw();
}
document.getElementById('start').onclick=()=>{
  document.getElementById('title').classList.add('hidden');
  started=true;reset();updateHUD();requestAnimationFrame(loop);
};
</script>
